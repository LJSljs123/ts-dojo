  }

  function recentExperiments(n) {
    return TSJ.appLabStorage.list().slice(0, n || 5);
  }

  /** SVG 进度环（0~100%）。 */
  function ringSvg(pct, label, sub) {
    var r = 34;
    var circ = 2 * Math.PI * r;
    var off = circ * (1 - Math.max(0, Math.min(100, pct)) / 100);
    return '<svg class="wk-ring" viewBox="0 0 84 84" role="img" aria-label="' + esc(label + ' ' + sub) + '">' +
      '<circle class="wk-ring-bg" cx="42" cy="42" r="' + r + '"></circle>' +
      '<circle class="wk-ring-fg" cx="42" cy="42" r="' + r + '" stroke-dasharray="' + circ.toFixed(1) +
      '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
      '<text x="42" y="40" class="wk-ring-num">' + esc(label) + '</text>' +
      '<text x="42" y="56" class="wk-ring-sub">' + esc(sub) + '</text></svg>';
  }

  /** 「学习进度」卡：进度环 + 分难度条 + 关键数字（数据全部来自本机 state）。 */
  function overviewCard(state) {
    var total = TSJ.problems.length;
    var passed = 0;
    var attempts = 0;
    var byDiff = {};
    var i;
    for (i = 0; i < core.DIFFS.length; i++) byDiff[core.DIFFS[i]] = { done: 0, total: 0 };
    for (i = 0; i < TSJ.problems.length; i++) {
      var p = TSJ.problems[i];
      var rec = state.progress[p.id];
      if (byDiff[p.difficulty]) byDiff[p.difficulty].total++;
      if (rec && rec.passed) {
        passed++;
        attempts += rec.attempts || 0;
        if (byDiff[p.difficulty]) byDiff[p.difficulty].done++;
      }
    }
    var pct = total ? Math.round((passed / total) * 100) : 0;
    var bars = core.DIFFS.map(function (d) {
      var b = byDiff[d];
      var w = b.total ? Math.round((b.done / b.total) * 100) : 0;
      return '<div class="wk-dbar"><span class="wk-dbar-name">' + esc(d) + '</span>' +
        '<span class="wk-dbar-track"><span class="wk-dbar-fill" style="width:' + w + '%"></span></span>' +
        '<span class="wk-dbar-n">' + b.done + '/' + b.total + '</span></div>';
    }).join('');
    var courseDone = doneCount(readProgress());
    return '<div class="ds-card"><h2 class="ds-card-title">学习进度</h2><p class="ds-card-sub">数据只保存在当前浏览器。</p>' +
      '<div class="wk-overview">' + ringSvg(pct, passed + '/' + total, '已通过') +
      '<div class="wk-overview-main">' + bars +
      '<div class="wk-mini-stats"><span>课程 ' + courseDone + ' / ' + TSJ.courses.length + '</span>' +
      '<span>提交 ' + attempts + ' 次</span><span>等级分 ' + (state.totalScore || 0) + '</span></div>' +
      '</div></div></div>';
  }

  /** 成就徽章卡：已解锁高亮，未解锁灰置（悬停看解锁条件）。 */
  function achievementsCard() {
    if (!TSJ.appAchievements) return '';
    var st = TSJ.appAchievements.status();
    var n = TSJ.appAchievements.count();
    var chips = st.map(function (a) {
      return '<span class="wk-ach' + (a.at ? ' wk-ach-on' : '') + '" title="' +
        esc(a.name + '：' + a.desc + (a.at ? '（已解锁）' : '（未解锁）')) + '">' +
        a.icon + ' ' + esc(a.name) + '</span>';
    }).join('');
    return '<div class="ds-card"><h2 class="ds-card-title">成就 <span class="ds-badge">' + n + ' / ' + st.length + '</span></h2>' +
      '<div class="wk-ach-row">' + chips + '</div></div>';
  }

  function render(scope) {
    var state = store.state;
    var lesson = nextLesson();
    var subs = recentSubmissions(5);
    var labs = recentExperiments(5);

    var html = [
      '<div class="wk-hero">',
      '  <div class="wk-hero-main">',
      '    <div class="wk-kicker">TSOJ v3 · 研究工作台</div>',
      '    <h1>看数据、选方法、回测、诊断、复盘</h1>',
      '    <p>先用基线与评估建立可靠判断，再进入高阶方法。所有实验都固定数据版本、切分协议与指标；本地进度可导出，换机器不丢记录。</p>',
      '    <div class="wk-cta-row">',
      '      <a class="ds-btn ds-btn-primary" href="#/lab">进入可视化实验室</a>',
      lesson ? '<a class="ds-btn" href="#/learn/' + encodeURIComponent(lesson.id) + '">继续学习：' + esc(lesson.title) + '</a>' : '<a class="ds-btn" href="#/learn">查看课程地图</a>',
      '      <a class="ds-btn" href="#/methods">浏览方法库</a>',
      '      <a class="ds-btn" href="#/glossary">新手术语表</a>',
      '    </div>',
      '  </div>',
      '  <div class="wk-side-stack">',
      overviewCard(state),
      achievementsCard(),
      '    <div class="ds-card"><h2 class="ds-card-title">快速入口</h2><div class="wk-list">',
      '      <a class="wk-list-item" href="#/problems"><span class="wk-list-main"><b>题库</b><span>' + TSJ.problems.length + ' 道可判题练习</span></span><span class="ds-badge">去练习</span></a>',
      '      <a class="wk-list-item" href="#/learn/m0"><span class="wk-list-main"><b>零基础第一课</b><span>25 分钟：从看懂一条曲线到写出第一个 predict</span></span><span class="ds-badge">去入门</span></a>',
      '      <a class="wk-list-item" href="#/learn"><span class="wk-list-main"><b>课程</b><span>9 个模块与先修路径</span></span><span class="ds-badge">去学习</span></a>',
      '      <a class="wk-list-item" href="#/glossary"><span class="wk-list-main"><b>术语表</b><span>题面与课程里的行话速查</span></span><span class="ds-badge">去查阅</span></a>',
      '      <a class="wk-list-item" href="#/studio"><span class="wk-list-main"><b>模型工坊</b><span>自己搓一个模型，跑完验证/最终两阶段实验</span></span><span class="ds-badge">去搓模型</span></a>',
      '      <a class="wk-list-item" href="#/submissions"><span class="wk-list-main"><b>提交记录</b><span>代码快照与逐测试点复盘</span></span><span class="ds-badge">去复盘</span></a>',
      '    </div></div>',
      '  </div>',
      '</div>',

      '<div class="wk-grid-2">',
      '  <div class="ds-card"><h2 class="ds-card-title">最近提交</h2><p class="ds-card-sub">点开可看当时的代码与逐测试点。</p>',
      subs.length ? '<div class="wk-list">' + subs.map(function (s) {
        return '<a class="wk-list-item" href="#/submission/' + encodeURIComponent(s.id) + '"><span class="wk-list-main"><b>' + esc(s.title) + '</b><span>' + fmtTime(s.at) + ' · ' + esc(s.verdict) + '</span></span><span class="ds-badge">' + s.score + ' 分</span></a>';
      }).join('') + '</div>' : '<div class="ds-empty"><strong>还没有提交</strong><span>从第 1 题或模板开始，先建立基线直觉。</span><a class="ds-btn" href="#/problem/p1-naive">打开第 1 题</a></div>',
      '  </div>',
      '  <div class="ds-card"><h2 class="ds-card-title">最近实验</h2><p class="ds-card-sub">实验室配置与结果保存在本机，可复现。</p>',
      labs.length ? '<div class="lab-history">' + labs.map(function (r) {
        var m = r.metrics && r.metrics.mean || {};

        return '<div class="lab-history-item"><span>' + esc(r.config.datasetId) + ' · ' + esc(r.config.method) + '</span><span>' + (first ? (first.toUpperCase() + ' ' + m[first].toFixed(2)) : '—') + '</span></div>';
      }).join('') + '</div>' : '<div class="ds-empty"><strong>还没有实验</strong><span>选一个数据集和方法，先跑一次受控回测。</span><a class="ds-btn" href="#/lab">打开实验室</a></div>',
      '  </div>',
      '</div>'
    ].join('\n');

    document.getElementById('view').innerHTML = html;
    TSJ.appA11y.setTitle('工作台 · TSOJ');
  }

  TSJ.appDashboard = { render: render };

<script>
/**
 * assets/js/app/learn.js —— 课程地图与模块页
 *
 * 课程内容全部来自 content/*，本模块只负责渲染、进度与出口链接。
 * 演示分三级：sandbox 跳实验室、concept 显示流程说明，不冒充运行。

(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var content = TSJ.content;
  var esc = core.esc;
  var KEY = core.STORE.courseProgress;

  function readProgress() {
    return core.readJSON(KEY, {}, function (v) {
      return v && typeof v === 'object' && !Array.isArray(v);
    });
  }

  function writeProgress(p) { core.writeJSON(KEY, p); }

  function progressOf(p, id) { return !!(p && p[id] && p[id].done); }

  function doneCount(p) {
    var n = 0;
    for (var i = 0; i < TSJ.courses.length; i++) if (progressOf(p, TSJ.courses[i].id)) n++;
    return n;
  }

  function moduleCard(c, p) {
    var done = progressOf(p, c.id);
    var prereq = (c.prereq || []).map(function (id) {
      var pc = content.course(id);
      return pc ? pc.title : id;
    });
    return [
      '<article class="course-module">',
      '  <div class="course-num">' + c.index + '</div>',
      '  <div>',
      '    <h3><a href="#/learn/' + encodeURIComponent(c.id) + '">' + esc(c.title) + '</a></h3>',
      '    <p>' + esc(c.summary) + '</p>',
      '    <div class="course-tags">',
      '      <span class="ds-badge">' + esc(c.level) + '</span>',
      '      <span class="ds-badge">约 ' + c.minutes + ' 分钟</span>',
      prereq.length ? '<span class="ds-badge">先修：' + esc(prereq.join('、')) + '</span>' : '<span class="ds-badge">无先修</span>',
      done ? '<span class="ds-badge ds-badge-ok">已完成</span>' : '<span class="ds-badge">未完成</span>',
      '    </div>',
      '  </div>',
      '</article>'
    ].join('\n');
  }

  function renderMap(scope) {
    var p = readProgress();
    var host = document.getElementById('view');
    var html = [
      '<div class="wk-hero"><div class="wk-hero-main">',
      '  <div class="wk-kicker">课程地图</div>',
      '  <h1>时序预测完整学习路径</h1>',
      '  <p>9 个模块从零基础第一课开始，覆盖数据基础、经典统计、机器学习、深度学习、概率预测、基础模型、评测与业务实践。先修关系明确，每个模块都有演示、练习与可核查来源。</p>',
      '  <div class="wk-cta-row">',
      '    <a class="ds-btn ds-btn-primary" href="#/learn/m0">从零基础第一课开始</a>',
    '    <a class="ds-btn" href="#/learn/m1">直接进数据基础</a>',
      '    <a class="ds-btn" href="#/lab">进入可视化实验室</a>',
      '  </div>',
      '</div>',
      '<div class="wk-side-stack">',
      '  <div class="ds-card"><h2 class="ds-card-title">学习进度</h2><p class="ds-card-sub">完成度只保存在本机。</p>',
      '  <div class="wk-metric-grid"><div class="wk-metric"><span>已完成模块</span><b>' + doneCount(p) + ' / ' + TSJ.courses.length + '</b><small>点击模块内「标记完成」更新</small></div></div>',
      '</div></div></div>',
      '<div class="course-map">'
    ];
    var sorted = TSJ.courses.slice().sort(function (a, b) { return a.index - b.index; });
    for (var i = 0; i < sorted.length; i++) html.push(moduleCard(sorted[i], p));
    html.push('</div>');
    host.innerHTML = html.join('\n');
    TSJ.appA11y.setTitle('课程地图');
  }

  function demoPanel(c) {
    if (!c.demo) return '';
    if (c.demo.kind === 'sandbox') {
      var preset = c.demo.id ? '?demo=' + encodeURIComponent(c.demo.id) : '';
      return [
        '<div class="course-panel"><h3>交互演示</h3>',
        '<p>该演示在实验室中用内置方法实时计算，不执行你的代码，也不使用测试真值调参。</p>',
        '<p><a class="ds-btn ds-btn-primary" href="#/lab' + preset + '">' + esc(c.demo.label || '打开演示') + '</a></p>',
        '</div>'
      ].join('\n');
    }
    return [
      '<div class="course-panel"><h3>引导演示（概念级）</h3>',
      '<p>' + esc(c.demo.label || '') + '</p>',
      '<ol><li>输入序列 → 缩放 / 分 patch / token 化</li><li>预训练权重前向推理</li><li>输出分位数 / 区间</li><li>用基线与校准检查评估，不轻信零样本分数</li></ol>',
      '<p class="md-note"><span>⚠</span><span>概念级：浏览器不下载权重、不训练基础模型；此处只说明流程与边界。</span></p>',
      '</div>'
    ].join('\n');
  }

  function exercisePanel(c) {
    var problems = (c.exercise && c.exercise.problemIds || []).map(function (id) {
      var p = TSJ.findProblem(id);
      return p ? '<li><a href="#/problem/' + encodeURIComponent(id) + '">' + esc(p.title) + '</a></li>' : '';
    }).join('');
    return [
      '<div class="course-panel"><h3>练习与产出</h3>',
      '<p>' + esc((c.exercise && c.exercise.output) || '') + '</p>',
      problems ? '<ul>' + problems + '</ul>' : '<p>本模块以文字产出为主，不绑定具体判题题。</p>',
      '</div>'
    ].join('\n');
  }

  function renderModule(id, scope) {
    var c = content.course(id);
    var host = document.getElementById('view');
    if (!c) {
      host.innerHTML = '<div class="ds-empty"><strong>模块不存在</strong><span>这个课程 ID 没有对应内容。</span><a class="ds-btn" href="#/learn">返回课程地图</a></div>';
      TSJ.appA11y.setTitle('模块不存在');
      return;
    }
    var p = readProgress();
    var done = progressOf(p, c.id);
    var next = content.nextCourse(c.id);
    var prev = content.prevCourse(c.id);
    var html = [
      '<div class="crumb"><a href="#/learn">课程地图</a> / <span>' + esc(c.title) + '</span></div>',
      '<article class="course-article">',
      '  <h1>' + esc(c.index + '. ' + c.title) + '</h1>',
      '  <p class="ds-card-sub">' + esc(c.summary) + '</p>',
      '  <div class="course-tags"><span class="ds-badge">' + esc(c.level) + '</span><span class="ds-badge">约 ' + c.minutes + ' 分钟</span>' +
      (done ? '<span class="ds-badge ds-badge-ok">已完成</span>' : '<span class="ds-badge">未完成</span>') + '</div>',
      content.renderCourseBody(c),
      demoPanel(c),
      exercisePanel(c),
      '<div class="course-panel"><h3>反例与常见错误</h3><ul>' +
      (c.counterexamples || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>',
      '<div class="course-panel"><h3>参考来源</h3>' + content.referenceListHtml(c.referenceIds) + '</div>',
      '<div class="course-panel"><h3>完成度</h3><p>标记完成只写入本机，不参与排行榜。</p>',
      '  <button class="ds-btn ' + (done ? '' : 'ds-btn-primary') + '" id="btnCourseDone" data-done="' + (done ? '1' : '0') + '">' + (done ? '取消完成标记' : '标记本模块完成') + '</button>',
      '</div>',
      '<div class="wk-cta-row">',
      prev ? '<a class="ds-btn" href="#/learn/' + encodeURIComponent(prev.id) + '">上一课：' + esc(prev.title) + '</a>' : '',
      next ? '<a class="ds-btn ds-btn-primary" href="#/learn/' + encodeURIComponent(next.id) + '">下一课：' + esc(next.title) + '</a>' : '<a class="ds-btn ds-btn-primary" href="#/lab">进入实验室</a>',
      '</div>',
      '</article>'
    ].join('\n');
    host.innerHTML = html;

    var btn = document.getElementById('btnCourseDone');
    if (btn) {
      btn.addEventListener('click', function () {
        var prog = readProgress();
        var isDone = btn.getAttribute('data-done') === '1';
        if (isDone) delete prog[c.id];
        else prog[c.id] = { done: true, at: Date.now() };
        writeProgress(prog);
        TSJ.appA11y.toast(isDone ? '已取消完成标记' : '已标记完成：' + c.title, 'ok');
        renderModule(c.id, scope);
      });
    }
    TSJ.appA11y.setTitle(c.title + ' · 课程');
  }

  TSJ.appLearn = { renderMap: renderMap, renderModule: renderModule, readProgress: readProgress, doneCount: doneCount };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/method-detail.js —— 方法详情页 #/methods/:id
 *
 * 卡片字段仍来自 methods.js；本页只追加详情层与出口，不复制方法卡内容。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var content = TSJ.content;
  var esc = core.esc;

  var RUN_LABEL = {
    sandbox: { text: '可沙箱运行', cls: 'ds-badge-ok' },
    precomputed: { text: '预计算演示', cls: 'ds-badge-accent' },
    concept: { text: '概念级不可沙箱运行', cls: 'ds-badge-warn' }
  };

  function practiceButton(m) {
    if (!m.practice) return '<span class="ds-badge">暂无对应题目</span>';
    var p = TSJ.findProblem(m.practice);
    if (!p) return '<span class="ds-badge ds-badge-err">题目不存在：' + esc(m.practice) + '</span>';
    return '<a class="ds-btn ds-btn-primary" href="#/problem/' + encodeURIComponent(m.practice) + '">去练这道题</a>';
  }

  /** v3.1：方法已在实验室白名单内时给一个直达出口（不预设参数，避免“看起来像一键最优”）。 */
  function labButton(m) {
    if (!TSJ.labConfig || !TSJ.labConfig.METHODS[m.id]) {
      return '<span class="ds-badge">实验室未收录该方法</span>';
    }
    return '<a class="ds-btn" href="#/lab">去实验室对比该方法</a>';
  }

  function render(id, scope) {
    var m = TSJ.methodsById(id);
    var host = document.getElementById('view');
    if (!m) {
      if (global.location && global.location.replace) global.location.replace('#/methods');
      host.innerHTML = '<div class="ds-empty"><strong>方法不存在</strong><span>已返回方法库。</span><a class="ds-btn" href="#/methods">返回方法库</a></div>';
      TSJ.appA11y.setTitle('方法不存在');
      return;
    }
    var d = content.methodDetail(id) || {};
    var run = RUN_LABEL[d.runLevel] || RUN_LABEL.concept;
    var problems = TSJ.problems.filter(function (p) { return p.tags && p.tags.indexOf(m.name) >= 0; }).slice(0, 6);

    var html = [
      '<div class="crumb"><a href="#/methods">方法库</a> / <span>' + esc(m.name) + '</span></div>',
      '<div class="method-layout"><div>',
      '  <h1>' + esc(m.name) + '</h1>',
      '  <p class="ds-card-sub">' + esc(m.title) + ' · ' + esc(m.venue) + '</p>',
      '  <div class="course-tags"><span class="ds-badge ' + run.cls + '">' + run.text + '</span>' +
      m.tags.map(function (t) { return '<span class="ds-badge">' + esc(t) + '</span>'; }).join('') + '</div>',

      '  <div class="method-section"><h2>核心思想</h2><p>' + esc(m.idea) + '</p></div>',
      '  <div class="method-section"><h2>直觉解释</h2><p>' + esc(d.intuition || '') + '</p></div>',
      '  <div class="method-section"><h2>关键式子</h2><div class="md-formula"><div>' + esc(m.formula) + '</div></div></div>',
      '  <div class="method-section"><h2>什么时候用</h2><p>' + esc(m.when) + '</p></div>',
      '  <div class="method-section"><h2>假设与复杂度</h2><ul>' +
      (d.assumptions || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      (d.complexity ? '<li>复杂度：' + esc(d.complexity) + '</li>' : '') + '</ul></div>',
      '  <div class="method-section"><h2>局限与反例</h2><p>' + esc(m.limit) + '</p><ul>' +
      (d.limitations || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      '</ul><p><b>反例：</b>' + esc(d.counterexample || '') + '</p></div>',
      '  <div class="method-section"><h2>数值小例</h2><p>' + esc(d.workedExample || '') + '</p></div>',
      '  <div class="method-section"><h2>相关题目</h2>' +
      (problems.length ? '<ul>' + problems.map(function (p) {
        return '<li><a href="#/problem/' + encodeURIComponent(p.id) + '">' + esc(p.title) + '</a></li>';
      }).join('') + '</ul>' : '<p>暂无按标签匹配的题目。</p>') + '</div>',
      '  <div class="method-section"><h2>参考来源</h2>' + content.referenceListHtml(d.referenceIds || []) + '</div>',
      '</div>',
      '<aside class="method-aside">',
      '  <div class="ds-card"><h2 class="ds-card-title">出口</h2><div class="method-facts">',
      '    <div class="method-fact"><span>对应题目</span><b>' + (m.practice ? esc(m.practice) : '无') + '</b></div>',
      '    <div class="method-fact"><span>运行级别</span><b>' + run.text + '</b></div>',
      '    <div class="method-fact"><span>方法层次</span><b>' + esc(m.tier) + '</b></div>',
      '  </div>' + practiceButton(m),
      '  ' + labButton(m),
      '  <p><a class="ds-btn" href="#/methods">返回方法库</a></p></div>',
      '  <div class="ds-card"><h2 class="ds-card-title">方法卡字段</h2><div class="method-facts">',
      '    <div class="method-fact"><span>发表处</span><b>' + esc(m.venue) + '</b></div>',
      '    <div class="method-fact"><span>作者</span><b>' + esc(m.authors || '—') + '</b></div>',
      '    <div class="method-fact"><span>年份</span><b>' + esc(m.year || '—') + '</b></div>',
      '  </div></div>',
      '</aside></div>'
    ].join('\n');
    host.innerHTML = html;
    if (TSJ.appAchievements) TSJ.appAchievements.onMethodView(id);
    TSJ.appA11y.setTitle(m.name + ' · 方法详情');
  }

  TSJ.appMethodDetail = { render: render };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/lab.js —— 可视化实验室 #/lab
 *
 * 受控实验：白名单方法、有限参数、确定性回测、诊断图表与最近记录。
 * 用户不能提交代码；测试真值不参与校准或调参。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var esc = core.esc;
  var doc = global.document;
  var panels = TSJ.appLabPanels;
  var KINDS = panels.KINDS;   // 诊断图类型注册在 panels（外壳渲染需要），这里只引用

  function $(id) { return doc.getElementById(id); }

  function currentConfigFromUI() {
    var raw = {
      datasetId: $('labDataset').value,
      method: $('labMethod').value,
      params: {},
      split: {
        mode: $('labMode').value,
        horizon: Number($('labHorizon').value),
        windows: Number($('labWindows').value),
        originStep: Number($('labOriginStep').value)
      },
      metrics: [].map.call(doc.querySelectorAll('.lab-metric:checked'), function (c) {
        return c.getAttribute('value');
      }).filter(function (v) { return !!v; }),
      baseline: $('labBaseline').value,
      interval: { enabled: $('labInterval').checked, levels: [80, 95] }
    };
    var meta = TSJ.labConfig.METHODS[raw.method] || { params: {} };
    Object.keys(meta.params).forEach(function (key) {
      var el = $('param-' + key);
      if (el) raw.params[key] = Number(el.value);
    });
    return raw;
  }


  function render(scope, initialRaw) {
    // 初始配置：默认值，或调用方传入（载入历史记录时）。
    // 注意不能在这里无条件用 defaults —— 否则「载入配置 / 恢复记录」会被默认值覆盖。
    var initial = TSJ.labConfig.normalize(initialRaw || TSJ.labConfig.defaults());
    var ctx = {
      config: initial.config,
      result: null,
      originIndex: 0,
      kind: 'forecast',
      chart: null,
      token: 0,
      busy: false,
      activeSession: null
    };

    function cleanup() {
      ctx.token++;
      ctx.busy = false;
      // 作废在途实验：runner 在每个 origin 开始前检查 session.token，失配即取消，
      // 避免路由切走后旧实验继续占满主线程、再向已拆掉的 DOM 写结果。
      if (ctx.activeSession) ctx.activeSession.token = -1;
      ctx.activeSession = null;
      if (ctx.chart && ctx.chart.destroy) ctx.chart.destroy();
      ctx.chart = null;
    }
    if (scope && typeof scope.own === 'function') scope.own({ destroy: cleanup });

    function paintChart() {
      var wrap = $('labChartWrap');
      var canvas = $('labCanvas');
      var summary = $('labChartSummary');
      if (!wrap || !canvas || !ctx.result) return;
      if (ctx.chart && ctx.chart.destroy) ctx.chart.destroy();
      var origin = ctx.result.origins[ctx.originIndex] || ctx.result.origins[0];
      var model;
      var kind = ctx.kind;
      if (kind === 'forecast') model = panels.originModel(origin);
      else if (kind === 'residual') {
        model = { residuals: origin.actual.map(function (a, i) { return a - origin.prediction[i]; }) };
      } else if (kind === 'acf' || kind === 'pacf') {
        var residuals = origin.actual.map(function (a, i) { return a - origin.prediction[i]; });
        var fn = kind === 'acf' ? TSJ.chartStats.acf : TSJ.chartStats.pacf;
        var lags = 20;
        model = {
          name: kind.toUpperCase(),
          values: fn(residuals, lags),
          lags: Array.from({ length: lags + 1 }, function (_, i) { return i; }),
          conf: new Array(lags + 1).fill(1.96 / Math.sqrt(Math.max(2, residuals.length)))
        };
      } else {
        var season = (TSJ.datasets.find(function (d) { return d.id === ctx.result.config.datasetId; }) || {}).season || 1;
        var parts = TSJ.chartStats.decomposeAdditive(origin.history, season);
        model = parts ? { series: origin.history, parts: parts } : { series: [] };
      }
      ctx.chart = TSJ.charts.create(canvas, {
        kind: kind,
        scope: scope,
        height: 300,
        unit: (TSJ.datasets.find(function (d) { return d.id === ctx.result.config.datasetId; }) || {}).unit || '',
        ariaLabel: KINDS.filter(function (k) { return k.id === kind; })[0].label,
        onInspect: function () {}
      });
      ctx.chart.update(model);
      summary.textContent = ctx.chart.summary() || '';
    }

    function paintResults() {
      var box = $('labResults');
      if (!box) return;   // 路由已切走：结果面板不存在，静默放弃（结果仍已存入 labStorage）
      if (!ctx.result) {
        box.innerHTML = '<div class="ds-empty"><strong>还没有运行</strong><span>选好配置后点「运行实验」。</span></div>';
        return;
      }
      // 外壳（工具条 / 图表区 / 指标区 / 实时滑杆区）由 panels 生成；
      // 之后 origin/kind 切换与实时调节都走 repaintResult 轻量重绘，不重建滑杆。
      box.innerHTML = panels.resultShell(ctx.result, { kind: ctx.kind, originIndex: ctx.originIndex });
      paintChart();
      bindResultButtons();
      TSJ.appLabLive.bind({ onChange: liveRerun });
    }

    /**
     * 轻量重绘：只更新图表、覆盖说明与指标表（origin/kind 切换、实时调节共用）。
     * 不重建工具条与滑杆，保持拖动状态。
     */
    function repaintResult() {
      var r = ctx.result;
      if (!r) return;
      var o = r.origins[ctx.originIndex] || r.origins[0];
      var cov = $('labCoverage');
      if (cov) {
        cov.innerHTML = (o && o.coverage && o.coverage.length)
          ? '经验覆盖：' + o.coverage.map(function (c) {
              return c.level + '% → ' + (isFinite(c.rate) ? (c.rate * 100).toFixed(0) + '%' : '—') + '（n=' + c.n + '）';
            }).join(' · ')
          : '';
      }
      var mz = $('labMetricsZone');
      if (mz) mz.innerHTML = panels.metricTable(r);
      paintChart();
    }

    /** 同步工具条按钮的激活态（origin / kind）。 */
    function syncToolbarActive() {
      [].forEach.call(doc.querySelectorAll('[data-origin]'), function (b) {
        b.classList[Number(b.getAttribute('data-origin')) === ctx.originIndex ? 'add' : 'remove']('ds-btn-primary');
      });
      [].forEach.call(doc.querySelectorAll('[data-kind]'), function (b) {
        b.classList[b.getAttribute('data-kind') === ctx.kind ? 'add' : 'remove']('lab-seg-on');
      });
    }

    /** 实时重算回调（滑杆拖动，防抖后到达）：不写记录、不动正式配置指纹。 */
    function liveRerun() {
      if (ctx.busy || !ctx.result) return;
      var raw = currentConfigFromUI();
      raw.params = TSJ.appLabLive.currentParams();
      var norm = TSJ.labConfig.normalize(raw);
      if (!norm.ok) return;
      TSJ.labRunner.run(norm.config, { token: ctx.token }).then(function (res) {
        if (res.canceled || !res.ok) return;
        ctx.result = res;
        ctx.originIndex = 0;
        repaintResult();
        var el = $('labStatus');
        if (el) el.textContent = '实时预览（未保存）· ' + res.origins.length + ' 个测试点';
      });
    }

    function bindResultButtons() {
      [].forEach.call(doc.querySelectorAll('[data-origin]'), function (b) {
        b.addEventListener('click', function () {
          ctx.originIndex = Number(b.getAttribute('data-origin'));
          syncToolbarActive();
          repaintResult();
        });
      });
      [].forEach.call(doc.querySelectorAll('[data-kind]'), function (b) {
        b.addEventListener('click', function () {
          ctx.kind = b.getAttribute('data-kind');
          syncToolbarActive();
          repaintResult();
        });
      });
    }

    function setStatus(text, busy) {
      var el = $('labStatus');
      if (el) el.textContent = text;
      var run = $('labRun');
      if (run) run.disabled = !!busy;
      ctx.busy = !!busy;
    }

    function run() {
      if (ctx.busy) return;
      var raw = currentConfigFromUI();
      var norm = TSJ.labConfig.normalize(raw);
      if (!norm.ok) {
        TSJ.appA11y.toast('配置无效：' + norm.errors[0], 'err');
        return;
      }
      ctx.config = norm.config;
      cleanup();
      setStatus('正在运行…', true);
      var session = {
        token: ctx.token,
        onOrigin: function (o, i, total) { setStatus('正在运行… ' + i + '/' + total, true); }
      };
      ctx.activeSession = session;
      TSJ.labRunner.run(ctx.config, session).then(function (res) {
        if (res.canceled) return;
        if (!res.ok) {
          setStatus('运行失败', false);
          TSJ.appA11y.toast((res.errors && res.errors[0]) || '运行失败', 'err');
          return;
        }
        ctx.result = res;
        ctx.originIndex = 0;
        setStatus('完成 · ' + res.origins.length + ' 个测试点', false);
        TSJ.appLabStorage.save(res);
        paintResults();
        var host = $('labHistory');
        if (host) host.innerHTML = panels.historyPanel();
      }).catch(function (err) {
        setStatus('运行异常', false);
        TSJ.appA11y.toast((err && err.message) || String(err), 'err');
      });
    }

    /** 切分模式下窗口数 / 起点步长的可用性（holdout 用不到这两个输入）。 */
    function syncSplitInputs() {
      var mode = $('labMode');
      var win = $('labWindows');
      var step = $('labOriginStep');
      var rolling = !!(mode && mode.value === 'rolling');
      if (win) win.disabled = !rolling;
      if (step) step.disabled = !rolling;
    }

    function bind() {
      $('labRun').addEventListener('click', run);
      $('labReset').addEventListener('click', function () {
        render(scope);
        TSJ.appA11y.toast('已恢复默认配置', 'ok');
      });
      /*
       * 方法切换：只局部重绘参数块，不整页重建。
       * 旧实现 render(scope) 会用默认配置重建整个表单 —— 用户刚选的方法立刻
       * 弹回 holt-winters，数据集 / 指标 / 区间 / 结果全被重置（11/12 个方法在
       * UI 上不可达）。运行时 run() 会从 UI 现读全部字段，这里只需同步参数块。
       */
      $('labMethod').addEventListener('change', function () {
        var raw = currentConfigFromUI();
        var norm = TSJ.labConfig.normalize(raw);
        ctx.config = norm.config;
        var box = $('labParams');
        if (box) box.innerHTML = panels.paramsHtml(norm.config.method);
        TSJ.appLabLive.reset();   // 旧方法的滑杆对新方法无意义：清空，待下次运行重建
      });
      $('labMode').addEventListener('change', function () {
        syncSplitInputs();
      });
      syncSplitInputs();
      var file = $('labImport');
      if (file) {
        file.addEventListener('change', function () {
          var f = file.files && file.files[0];
          if (!f) return;
          var reader = new global.FileReader();
          reader.onload = function () {
            var res = TSJ.appLabStorage.importJSON(String(reader.result || ''));
            if (!res.ok) { TSJ.appA11y.toast('导入失败：' + res.error, 'err'); return; }
            TSJ.appA11y.toast('已导入实验记录', 'ok');
            var host = $('labHistory');
            if (host) host.innerHTML = panels.historyPanel();
          };
          reader.readAsText(f);
        });
      }
      var exportBtn = $('labExport');
      if (exportBtn) {
        exportBtn.addEventListener('click', function () {
          if (!ctx.result) { TSJ.appA11y.toast('还没有可导出的结果', 'err'); return; }
          var text = TSJ.appLabStorage.exportJSON(ctx.result);
          var blob = new global.Blob([text], { type: 'application/json' });
          var a = doc.createElement('a');
          a.href = global.URL.createObjectURL(blob);
          a.download = 'tsoj-lab-' + ctx.result.configHash + '.json';
          a.click();
          global.URL.revokeObjectURL(a.href);
        });
      }
      [].forEach.call(doc.querySelectorAll('[data-load]'), function (b) {
        b.addEventListener('click', function () {
          var hash = b.getAttribute('data-load');
          var rec = TSJ.appLabStorage.list().filter(function (r) { return r.configHash === hash; })[0];
          if (!rec) return;
          // 用记录的配置重建页面（旧实现 render 后再写旧闭包的 ctx，是死代码）
          render(scope, rec.config);
          TSJ.appA11y.toast('已载入配置，点「运行实验」复现', 'ok');
        });
      });
    }

    var host = doc.getElementById('view');
    host.innerHTML = [
      '<div class="wk-hero wk-hero-slim"><div class="wk-hero-main">',
      '  <div class="wk-kicker">可视化实验室</div>',
      '  <h1>受控回测与诊断</h1>',
      '  <p>选数据、选白名单方法、调有限参数，立即得到确定性结果与诊断图。候选与基线共享同一切分；测试真值不参与校准。</p>',
      '</div></div>',
      '<div class="lab-layout">',
      panels.configPanel(ctx),
      '<div class="lab-results">',
      '  <div class="ds-card"><h2 class="ds-card-title">运行状态</h2><div class="lab-status"><span id="labStatus">空闲</span>' +
      '    <button class="ds-btn ds-btn-sm" id="labExport">导出当前结果</button>' +
      '    <label class="ds-btn ds-btn-sm"><input type="file" id="labImport" accept="application/json" style="display:none">导入实验</label></div></div>',
      '  <div id="labResults"><div class="ds-empty"><strong>还没有运行</strong><span>选好配置后点「运行实验」。</span></div></div>',
      '  <div class="ds-card"><h2 class="ds-card-title">最近实验</h2><div id="labHistory">' + panels.historyPanel() + '</div></div>',
      '</div>',
      '</div>'
    ].join('\n');

    bind();
    TSJ.appA11y.setTitle('可视化实验室 · TSOJ');
  }

  TSJ.appLab = { render: render };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/library.js —— 方法库（知识库）页面：#/methods
 * 加载顺序：… app/pages → app/library → app/boards → app.js　挂载点：window.TSJ.appLibrary
 * 数据来自 assets/js/methods.js（内容层，只读）：本文件只做「筛选 → 卡片」的映射，不改写任何文案。
 * 约定：数量一律现算（不写死）；搜索 / 层 / 只看能练的 三者取交集；formula 按纯文本渲染
 * （内含 * + Σ，不能当 Markdown 解析）；可见文案一律过 esc()；展开态用 aria-expanded，
 * 标题可 Tab 聚焦 + Enter/Space 切换。
 */
(function (global) {
  'use strict';
  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore, $ = core.$, $$ = core.$$, esc = core.esc;
  var TIER_MARK = { deep: 'DL', foundation: 'FM', eval: 'EVAL' };   // 标题旁小标：深度学习 / 基础模型 / 评估方法论
  var MAX_TAGS = 3;                               // 收起态最多显示的标签数，超出折叠为 +N
  var view = { query: '', tier: 'all', onlyPractice: false, open: {} };   // 每次进入重建为默认态

  /* ---------- 1. 现算的计数 ---------- */
  function allMethods() { return TSJ.methods || []; }
  function allTiers() { return TSJ.methodTiers || []; }

  /** 某层的卡片数；'all' 返回总数。 */
  function countOf(tierId) {
    if (tierId === 'all') return allMethods().length;
    return allMethods().filter(function (m) { return m.tier === tierId; }).length;
  }

  /** 有对应题目的方法数（「只看能练的」的计数）。 */
  function practiceCount() {
    return allMethods().filter(function (m) { return !!m.practice; }).length;
  }

  /** 层 id → 中文名（未知 id 原样返回）。 */
  function tierName(id) {
    var tiers = allTiers();
    for (var i = 0; i < tiers.length; i++) if (tiers[i].id === id) return tiers[i].name;
    return id;
  }

  /* ---------- 2. 筛选（三者取交集） ---------- */
  /** 层 + 开关 + 搜索词取交集；搜索覆盖 name / title / venue / tags / idea，大小写不敏感。 */
  function matches(m) {
    if (view.tier !== 'all' && m.tier !== view.tier) return false;
    if (view.onlyPractice && !m.practice) return false;
    var q = String(view.query || '').trim().toLowerCase();
    if (!q) return true;
    var tags = (m.tags && m.tags.length) ? m.tags.join(' ') : '';
    return [m.name, m.title, m.venue, tags, m.idea].join(' \n ').toLowerCase().indexOf(q) >= 0;
  }

  /** 一键清除所有筛选条件，回到默认态（29 张卡片）。 */
  function clearFilters() {
    view.query = '';
    view.tier = 'all';
    view.onlyPractice = false;
    var input = $('#methodSearch'), box = $('#onlyPractice');
    if (input) input.value = '';
    if (box) box.checked = false;
    paintChips();
    paintList();
  }

  /** 同步「清除筛选」按钮的可见性（有筛选才出现）。 */
  function syncClearBtn() {
    var btn = $('#btnMethodClear');
    if (!btn) return;
    var on = String(view.query || '').trim() !== '' || view.tier !== 'all' || view.onlyPractice;
    if (on) btn.removeAttribute('hidden');
    else btn.setAttribute('hidden', '');
  }

  /* ---------- 3. 卡片 ---------- */
  /** 「检索原文」：不硬编码论文 URL（会失效），统一用 Bing 搜标题，新窗口打开。 */
  function srcHtml(m) {
    var url = 'https://www.bing.com/search?q=' + encodeURIComponent(String(m.title || ''));
    return '<a class="btn btn-ghost mc-src" href="' + esc(url) + '"' +
      ' target="_blank" rel="noopener noreferrer">检索原文</a>';
  }

  /** 底部操作区：有题 → 去练；无题但可跑 → 暂无对应题目；沙箱跑不了 → 明说。 */
  function actionHtml(m) {
    if (m.practice) {
      return '<a class="btn btn-primary mc-practice" href="#/problem/' + esc(m.practice) +
        '">去练这道题</a>\n      ' + srcHtml(m);
    }
    var note = (m.runnable === false) ? '沙箱跑不了，仅供选型参考' : '暂无对应题目';
    return '<span class="mc-note">' + note + '</span>\n      ' + srcHtml(m);
  }

  /** 展开区：左「核心思想 + 关键式子」，右「适用 + 局限」，窄屏由 CSS 堆叠。 */
  function bodyHtml(m) {
    var out = ['    <div class="mc-grid">', '      <div class="mc-col">',
      '        <div class="mc-block"><div class="mc-label">核心思想</div><p class="mc-text">' + esc(m.idea) + '</p></div>'];
    if (m.formula) {
      out.push('        <div class="mc-block"><div class="mc-label">关键式子</div>' +
        '<pre class="mc-formula">' + esc(m.formula) + '</pre></div>');
    }
    out.push('      </div>', '      <div class="mc-col">',
      '        <div class="mc-block"><div class="mc-label">适用</div><p class="mc-text">' + esc(m.when) + '</p></div>',
      '        <div class="mc-block"><div class="mc-label">局限</div><p class="mc-text">' + esc(m.limit) + '</p></div>',
      '      </div>', '    </div>', '    <div class="mc-actions">', '      ' + actionHtml(m), '    </div>');
    return out.join('\n');
  }

  /** 单张卡片（默认收起；展开内容按需生成，避免一次渲染 29 份长文本）。 */
  function cardHtml(m) {
    var open = view.open[m.id] === true;
    var tags = m.tags || [];
    var mark = TIER_MARK[m.tier];
    var head = ['  <div class="mc-head">',
      '    <div class="mc-title" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') +
        '" aria-controls="mc-body-' + esc(m.id) + '">' + esc(m.name) + '</div>',
      '    <span class="mc-badge">' + esc(m.venue) + '</span>',
      '    <span class="mc-tier">' + esc(tierName(m.tier)) + '</span>'];
    if (mark) head.push('    <span class="mc-mark">' + esc(mark) + '</span>');
    for (var t = 0; t < tags.length && t < MAX_TAGS; t++) {
      head.push('    <span class="tag">' + esc(tags[t]) + '</span>');
    }
    if (tags.length > MAX_TAGS) head.push('    <span class="mc-more">+' + (tags.length - MAX_TAGS) + '</span>');
    head.push('  </div>');
    return '<article class="mcard' + (open ? ' mcard-open' : '') + '" data-mid="' + esc(m.id) +
      '" data-tier="' + esc(m.tier) + '">\n' + head.join('\n') +
      '\n  <div class="mc-body" id="mc-body-' + esc(m.id) + '"' + (open ? '' : ' hidden') + '>' +
      (open ? bodyHtml(m) : '') + '</div>\n</article>';
  }

  /* ---------- 4. 渲染与绑定 ---------- */
  /** 层筛选 chips（数量现算）。 */
  function chipsHtml() {
    var tiers = allTiers();
    var out = ['  <button type="button" class="chip chip-on" data-tier="all">全部(' + countOf('all') + ')</button>'];
    for (var i = 0; i < tiers.length; i++) {
      out.push('  <button type="button" class="chip" data-tier="' + esc(tiers[i].id) + '">' +
        esc(tiers[i].name) + '(' + countOf(tiers[i].id) + ')</button>');
    }
    return out.join('\n');
  }

  /** 同步 chip 选中态（不重绘列表）。 */
  function paintChips() {
    var root = $('#view');
    if (!root) return;
    var chips = $$('.chip[data-tier]', root);
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList[chips[i].getAttribute('data-tier') === view.tier ? 'add' : 'remove']('chip-on');
    }
  }

  /** 重绘卡片列表区（空态带「清除筛选」）。 */
  function paintList() {
    var host = $('#methodList');
    if (!host) return;
    var list = allMethods();
    var out = [], shown = 0;
    for (var i = 0; i < list.length; i++) {
      if (!matches(list[i])) continue;
      shown++;
      out.push(cardHtml(list[i]));
    }
    if (shown === 0) {
      out.push('<div class="empty"><span class="empty-icon">◌</span>没有匹配的方法。<br>' +
        '<button type="button" class="btn" data-clear="1">清除筛选</button></div>');
    }
    host.innerHTML = '<div class="mcards">\n' + out.join('\n') + '\n</div>';
    bindCards(host);
    var clears = $$('[data-clear]', host);
    for (var c = 0; c < clears.length; c++) clears[c].addEventListener('click', clearFilters);
    syncClearBtn();
  }

  /** 展开 / 收起一张卡片（首次展开才生成内容）。 */
  function toggleCard(titleEl) {
    var card = titleEl.closest ? titleEl.closest('.mcard') : null;
    if (!card) return;
    var id = card.getAttribute('data-mid');
    var body = card.querySelector('.mc-body');
    var m = TSJ.methodsById ? TSJ.methodsById(id) : null;
    if (!m || !body) return;
    if (card.classList.contains('mcard-open')) {
      card.classList.remove('mcard-open');
      titleEl.setAttribute('aria-expanded', 'false');
      body.setAttribute('hidden', '');
      view.open[id] = false;
      return;
    }
    if (!body.innerHTML) body.innerHTML = bodyHtml(m);
    card.classList.add('mcard-open');
    titleEl.setAttribute('aria-expanded', 'true');
    body.removeAttribute('hidden');
    view.open[id] = true;
  }

  /** 绑定卡片的点击 / Enter / Space 展开。 */
  function bindCards(host) {
    var titles = $$('.mc-title', host);
    for (var i = 0; i < titles.length; i++) {
      titles[i].addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          toggleCard(this);
        }
      });
    }
    /*
     * 点击热区：整行（.mc-head）都可展开，而不是只有标题文字。
     * 出处徽标和标签占了半行，用户自然会点它们——只绑标题会让「点了没反应」。
     * 行内若将来出现按钮 / 链接，必须放行，否则会连展带跳。
     */
    var heads = $$('.mc-head', host);
    for (var k = 0; k < heads.length; k++) {
      heads[k].addEventListener('click', function (ev) {
        if (ev.target && ev.target.closest && ev.target.closest('a,button,input,select,textarea')) return;
        var title = this.querySelector('.mc-title');
        if (title) toggleCard(title);
      });
    }
  }

  /** 绑定页面外壳（搜索框 / 层 chips / 只看能练的 / 清除筛选）。 */
  function bindShell(root) {
    var input = $('#methodSearch', root);
    if (input) {
      input.addEventListener('input', core.debounce(function () {
        view.query = input.value;
        paintList();
      }, 120));
    }
    var chips = $$('.chip[data-tier]', root);
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        view.tier = this.getAttribute('data-tier');
        paintChips();
        paintList();
      });
    }
    var box = $('#onlyPractice', root);
    if (box) {
      box.addEventListener('change', function () {
        view.onlyPractice = box.checked === true;
        paintList();
      });
    }
    var btnClear = $('#btnMethodClear', root);
    if (btnClear) btnClear.addEventListener('click', clearFilters);
  }

  /** 渲染方法库页面（路由入口，每次进入都回到默认态）。 */
  function renderMethods() {
    var root = $('#view');
    if (!root) return;
    view = { query: '', tier: 'all', onlyPractice: false, open: {} };
    root.innerHTML = ['<div class="page">', '<div class="page-head">', '<h1>方法库</h1>',
      '<p class="sub">' + allMethods().length + ' 个方法 · ' + allTiers().length +
        ' 个层次 · ' + practiceCount() + ' 个可练</p>', '</div>', '<div class="toolbar-row">',
      '  <input type="search" class="search-input" id="methodSearch" value=""' +
        ' placeholder="搜索方法名 / 论文标题 / 标签 / 出处" aria-label="搜索方法">',
      '  <button type="button" class="btn btn-clear" id="btnMethodClear" hidden>清除筛选</button>',
      '</div>', '<div class="filters" role="group" aria-label="按层次筛选">', chipsHtml(), '</div>',
      '<div class="switch-row"><label class="switch-label" for="onlyPractice">' +
        '<input type="checkbox" class="switch-input" id="onlyPractice">' +
        '<span>只看能练的（' + practiceCount() + '）</span></label></div>',
      '<div id="methodList"></div>', '</div>'].join('\n');
    bindShell(root);
    paintList();
  }

  TSJ.appLibrary = {
    renderMethods: renderMethods,
    countOf: countOf,
    practiceCount: practiceCount,
    matches: matches
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/glossary.js —— 新手术语表页面：#/glossary
 * 加载顺序：… app/library → app/glossary → app/boards → app.js　挂载点：window.TSJ.appGlossary
 * 数据来自 assets/js/content/glossary.js（内容层，只读）：本文件只做「搜索 + 分类 → 卡片」的映射。
 * 约定与 library.js 一致：数量现算、分类与搜索取交集、可见文案一律过 esc()、
 * 空态带「清除筛选」；术语卡默认全部展开（短文本，无需折叠）。
 */
(function (global) {
  'use strict';
  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore, $ = core.$, $$ = core.$$, esc = core.esc;
  var view = { query: '', cat: 'all' };   // 每次进入重建为默认态

  function allTerms() { return TSJ.glossary || []; }
  function allCats() { return TSJ.glossaryCategories || []; }

  /** 某分类的术语数；'all' 返回总数。 */
  function countOf(catId) {
    if (catId === 'all') return allTerms().length;
    return allTerms().filter(function (t) { return t.cat === catId; }).length;
  }

  /** 分类 id → 中文名。 */
  function catName(id) {
    var cats = allCats();
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i].name;
    return id;
  }

  /** 分类 + 搜索取交集；搜索覆盖 term / en / def，大小写不敏感。 */
  function matches(t) {
    if (view.cat !== 'all' && t.cat !== view.cat) return false;
    var q = String(view.query || '').trim().toLowerCase();
    if (!q) return true;
    return [t.term, t.en, t.def].join(' \n ').toLowerCase().indexOf(q) >= 0;
  }

  /* ---------- 卡片 ---------- */
  /** 术语卡内的站内跳转（课程 / 方法 / 题目三选一，id 已由内容层保证存在）。 */
  function linkHtml(t) {
    if (!t.links) return '';
    if (t.links.course) {
      return '<a class="btn btn-ghost g-link" href="#/learn/' + esc(t.links.course) + '">去看课程模块</a>';
    }
    if (t.links.method) {
      return '<a class="btn btn-ghost g-link" href="#/methods/' + esc(t.links.method) + '">去看方法卡</a>';
    }
    if (t.links.problem) {
      return '<a class="btn btn-ghost g-link" href="#/problem/' + esc(t.links.problem) + '">去做这道题</a>';
    }
    return '';
  }

  /** 相关术语（可点击锚点：点击等于把该词填进搜索框）。 */
  function seeHtml(t) {
    if (!t.see || !t.see.length) return '';
    var names = [];
    for (var i = 0; i < t.see.length; i++) {
      var other = termById(t.see[i]);
      if (other) names.push('<button type="button" class="chip chip-sm" data-seeterm="' + esc(other.id) + '">' +
        esc(other.term) + '</button>');
    }
    if (!names.length) return '';
    return '<div class="g-see"><span class="g-see-label">相关</span>' + names.join('') + '</div>';
  }

  function termById(id) {
    var list = allTerms();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function cardHtml(t) {
    return '<article class="gcard" data-gid="' + esc(t.id) + '" data-cat="' + esc(t.cat) + '">' +
      '<div class="g-head"><span class="g-term">' + esc(t.term) + '</span>' +
      '<span class="g-en">' + esc(t.en) + '</span>' +
      '<span class="g-cat">' + esc(catName(t.cat)) + '</span></div>' +
      '<p class="g-def">' + esc(t.def) + '</p>' +
      seeHtml(t) + linkHtml(t) +
      '</article>';
  }

  /* ---------- 渲染与绑定 ---------- */
  function chipsHtml() {
    var cats = allCats();
    var out = ['  <button type="button" class="chip chip-on" data-cat="all">全部(' + countOf('all') + ')</button>'];
    for (var i = 0; i < cats.length; i++) {
      out.push('  <button type="button" class="chip" data-cat="' + esc(cats[i].id) + '">' +
        esc(cats[i].name) + '(' + countOf(cats[i].id) + ')</button>');
    }
    return out.join('\n');
  }

  function paintChips() {
    var root = $('#view');
    if (!root) return;
    var chips = $$('.chip[data-cat]', root);
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList[chips[i].getAttribute('data-cat') === view.cat ? 'add' : 'remove']('chip-on');
    }
  }

  function clearFilters() {
    view.query = '';
    view.cat = 'all';
    var input = $('#glossarySearch');
    if (input) input.value = '';
    paintChips();
    paintList();
  }

  function syncClearBtn() {
    var btn = $('#btnGlossaryClear');
    if (!btn) return;
    var on = String(view.query || '').trim() !== '' || view.cat !== 'all';
    if (on) btn.removeAttribute('hidden');
    else btn.setAttribute('hidden', '');
  }

  /** 重绘术语列表（空态带「清除筛选」）。 */
  function paintList() {
    var host = $('#glossaryList');
    if (!host) return;
    var list = allTerms();
    var out = [], shown = 0;
    for (var i = 0; i < list.length; i++) {
      if (!matches(list[i])) continue;
      shown++;
      out.push(cardHtml(list[i]));
    }
    if (shown === 0) {
      out.push('<div class="empty"><span class="empty-icon">◌</span>没有匹配的术语。<br>' +
        '<button type="button" class="btn" data-clear="1">清除筛选</button></div>');
    }
    host.innerHTML = '<div class="gcards">\n' + out.join('\n') + '\n</div>';
    var clears = $$('[data-clear]', host);
    for (var c = 0; c < clears.length; c++) clears[c].addEventListener('click', clearFilters);
    var sees = $$('[data-seeterm]', host);
    for (var s = 0; s < sees.length; s++) {
      sees[s].addEventListener('click', function () {
        var other = termById(this.getAttribute('data-seeterm'));
        var input = $('#glossarySearch');
        if (!other || !input) return;
        input.value = other.term;
        view.query = other.term;
        paintList();
        syncClearBtn();
      });
    }
    syncClearBtn();
  }

  function bindShell(root) {
    var input = $('#glossarySearch', root);
    if (input) {
      input.addEventListener('input', core.debounce(function () {
        view.query = input.value;
        paintList();
      }, 120));
    }
    var chips = $$('.chip[data-cat]', root);
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        view.cat = this.getAttribute('data-cat');
        paintChips();
        paintList();
      });
    }
    var btnClear = $('#btnGlossaryClear', root);
    if (btnClear) btnClear.addEventListener('click', clearFilters);
  }

  /** 渲染术语表页面（路由入口，每次进入都回到默认态）。 */
  function renderGlossary() {
    var root = $('#view');
    if (!root) return;
    view = { query: '', cat: 'all' };
    if (TSJ.appAchievements) TSJ.appAchievements.onGlossaryLook();   // 词典编纂者：每次进入算一次
    root.innerHTML = ['<div class="page">', '<div class="page-head">', '<h1>术语表</h1>',
      '<p class="sub">' + allTerms().length + ' 个术语 · ' + allCats().length +
        ' 个分类 · 题面与课程里的行话都在这查</p>', '</div>',
      '<div class="toolbar-row">',
      '  <input type="search" class="search-input" id="glossarySearch" value=""' +
        ' placeholder="搜中文 / 英文 / 解释里的关键词" aria-label="搜术语">',
      '  <button type="button" class="btn btn-clear" id="btnGlossaryClear" hidden>清除筛选</button>',
      '</div>', '<div class="filters" role="group" aria-label="按分类筛选">', chipsHtml(), '</div>',
      '<div id="glossaryList"></div>', '</div>'].join('\n');
    bindShell(root);
    paintList();
  }

  TSJ.appGlossary = {
    renderGlossary: renderGlossary,
    countOf: countOf,
    matches: matches
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/boards.js —— 两个只读看板：排行榜 / 学习路径
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → boards → app.js
 * 挂载点：window.TSJ.appBoards
 *
 * 这两页没有任何写操作，纯粹是「state → HTML」的映射，因此和「有导入/清空动作」的 pages.js 分开，
 * 各自都能守住可维护性上限。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var DIFF_CLASS = core.DIFF_CLASS;

  /* ---------- 1. 排行榜 ---------- */
  /** 渲染排行榜（参考解法 vs 你）。 */
  function renderRanking() {
    var refScores = store.computeRefScores();
    var myTotal = store.totalScore();
    var myPassed = 0;
    var refTotal = 0;
    var refPassed = 0;
    var i;

    for (i = 0; i < problems.length; i++) {
      var rec = store.state.progress[problems[i].id];
      if (rec && rec.passed === true) myPassed++;
      var rs = toScore(refScores[problems[i].id]);
      refTotal += rs;
      if (rs >= problems[i].passScore) refPassed++;
    }

    var rows = [
      { name: '参考解法（各题参考实现）', you: false, total: refTotal, passed: refPassed, note: '每题由参考实现自动评分' },
      { name: '你', you: true, total: myTotal, passed: myPassed, note: '本地成绩' }
    ];
    rows.sort(function (a, b) { return b.total - a.total; });

    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>排行榜</h1>' +
      '<p class="sub">本地榜单 · 虚拟对手「参考解法」的每题分数由该题参考实现实时计算（各题参考实现不同，并非单一模型）</p></div>');

    html.push('<div class="table-wrap"><table class="ptable"><thead><tr>\n<th style="width:60px">排名</th><th>选手</th>' +
      '<th class="num" style="width:100px">总分</th>\n<th class="num" style="width:100px">通过题数</th>' +
      '<th style="width:200px">说明</th>\n</tr></thead><tbody>');

    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var gClass = r === 0 ? ' g1' : (r === 1 ? ' g2' : ' g3');
      html.push('<tr class="' + (row.you ? 'rank-me' : '') + '">' +
        '<td><span class="rank-badge' + gClass + '">' + (r + 1) + '</span></td>' +
        '<td class="' + (row.you ? 'rank-you' : '') + '">' + esc(row.name) + '</td>' +
        '<td class="num">' + esc(row.total) + '</td>' +
        '<td class="num">' + esc(row.passed) + ' / ' + problems.length + '</td>' +
        '<td style="color:var(--muted);font-size:12px">' + esc(row.note) + '</td>\n</tr>');
    }
    html.push('</tbody></table></div>');

    // 每题对比
    html.push('<h2 class="section-title">逐题最佳分对比</h2>\n<div class="ref-grid">');
    for (var j = 0; j < problems.length; j++) {
      var p = problems[j];
      var mine = toScore(store.state.progress[p.id] && store.state.progress[p.id].best);
      var ref = toScore(refScores[p.id]);
      html.push('<div class="ref-row">\n  <span class="rf-idx">#' + p.index + '</span>' +
        '  <a class="rf-name" href="#/problem/' + esc(p.id) + '" title="' + esc(p.title) + '">' +
        esc(p.title) + '</a>');
      html.push('  <span class="rf-track" title="青色=你，紫色=参考解">' +
        '<span class="rf-you" style="width:' + Math.max(0, Math.min(100, mine)) + '%"></span>' +
        '<span class="rf-ref" style="width:' + Math.max(0, Math.min(100, ref)) + '%"></span></span>');
      html.push('  <span class="rf-score">' + esc(mine) + ' / ' + esc(ref) + '</span>\n</div>');
    }
    html.push('</div>');

    html.push('<p class="sub" style="margin-top:14px;font-size:12px">' +
      '青条 = 你的最高分，紫条 = 参考解法得分（0~100）。' +
      '总分 = 各题最高分之和，满分 ' + (problems.length * 100) + '。</p>');
    html.push('</div>');

    $('#view').innerHTML = html.join('\n');
  }

  /* ---------- 2. 学习路径 ---------- */
  /** 渲染学习路径时间线。 */
  function renderPath() {
    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>学习路径</h1>' +
      '<p class="sub">从零参数基线到滚动回测：每一步都在补上一块新的建模能力</p></div>\n<div class="timeline">');

    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      var rec = store.state.progress[p.id] || {};
      var done = rec.passed === true;
      var best = toScore(rec.best);

      html.push('<div class="tl-item">' +
        '  <div class="tl-dot' + (done ? ' done' : '') + '">' + (done ? '✓' : p.index) + '</div>' +
        '  <div class="tl-card' + (done ? ' done' : '') + '">' +
        '    <div class="tl-top">' +
        '<span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span>' +
        '<a href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a>');
      for (var t = 0; t < p.tags.length; t++) {
        html.push('      <span class="tag">' + esc(p.tags[t]) + '</span>');
      }
      html.push('    </div>\n    <div class="tl-desc">' + esc(store.pathSummary(p)) + '</div>');
      html.push('    <div class="tl-note">' + (done
        ? '已通过 · 最高分 ' + esc(best) + ' · 题解已解锁'
        : (best > 0 ? '最高分 ' + esc(best) + ' · 尚未达到通过线 ' + esc(p.passScore) : '未开始')) + '</div>');
      html.push('  </div>\n</div>');
    }

    html.push('</div>\n</div>');
    $('#view').innerHTML = html.join('\n');
  }

  TSJ.appBoards = {
    renderRanking: renderRanking,
    renderPath: renderPath
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/cmdk.js —— 全局命令面板（Ctrl/Cmd + K，v3.5）
 * 加载顺序：… app/boards → app/cmdk → app.js　挂载点：window.TSJ.appCmdk
 *
 * 一个输入框直达全站：题目 / 方法 / 课程 / 术语 + 快捷动作（随机一题、切主题）。
 * 复用 a11y.openModal 的焦点陷阱与 ESC 关闭；无依赖、无构建，数据全部来自内存索引。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var esc = core.esc;
  var a11y = TSJ.appA11y;

  var MAX_RESULTS = 12;
  var items = [];        // 当前展示的条目 { icon, label, sub, hash?, act? }
  var active = 0;

  /** 面板当前是否打开（以 a11y 的弹层状态 + 面板特征节点判断）。 */
  function isOpen() {
    return !!(a11y.modalOpen() && global.document.getElementById('cmdkInput'));
  }

  /* ---------- 索引构建 ---------- */
  /** 收集全部可跳转条目（内存即索引，量级 ~180，无需防抖）。 */
  function buildIndex() {
    var out = [];
    out.push({ icon: '🎲', label: '随机一题（优先未通过）', act: 'random' });
    out.push({ icon: '🌗', label: '切换深浅主题', act: 'theme' });
    out.push({ icon: '🧪', label: '打开可视化实验室', hash: '#/lab' });
    out.push({ icon: '🛠️', label: '打开模型工坊（自己搓模型跑实验）', hash: '#/studio' });
    var i;
    for (i = 0; i < (TSJ.problems || []).length; i++) {
      var p = TSJ.problems[i];
      out.push({ icon: '📝', label: '#' + p.index + ' ' + p.title, sub: '题库 · ' + p.difficulty,
        hay: (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase(), hash: '#/problem/' + p.id });
    }
    for (i = 0; i < (TSJ.methods || []).length; i++) {
      var m = TSJ.methods[i];
      out.push({ icon: '📚', label: m.name, sub: '方法库 · ' + (m.venue || ''),
        hay: (m.name + ' ' + (m.title || '')).toLowerCase(), hash: '#/methods/' + m.id });
    }
    for (i = 0; i < (TSJ.courses || []).length; i++) {
      var c = TSJ.courses[i];
      out.push({ icon: '🎓', label: c.index + '. ' + c.title, sub: '课程 · 约 ' + c.minutes + ' 分钟',
        hay: (c.title + ' ' + c.summary).toLowerCase(), hash: '#/learn/' + c.id });
    }
    for (i = 0; i < (TSJ.glossary || []).length; i++) {
      var t = TSJ.glossary[i];
      out.push({ icon: '📖', label: t.term, sub: '术语 · ' + (t.en || ''),
        hay: (t.term + ' ' + t.en + ' ' + t.def).toLowerCase(), hash: '#/glossary' });
    }
    return out;
  }

  /** 过滤：无关键词给动作 + 未通过的题；有关键词按「前缀命中 > 包含」排序。 */
  function filter(q) {
    var all = buildIndex();
    var query = String(q || '').trim().toLowerCase();
    var i;
    if (!query) {
      var quick = all.slice(0, 2);
      for (i = 0; i < (TSJ.problems || []).length && quick.length < 8; i++) {
        var rec = TSJ.appStore.state.progress[TSJ.problems[i].id];
        if (!rec || rec.passed !== true) {
          var p = TSJ.problems[i];
          quick.push({ icon: '📝', label: '#' + p.index + ' ' + p.title, sub: '题库 · 未通过', hash: '#/problem/' + p.id });
        }
      }
      return quick;
    }
    var scored = [];
    for (i = 2; i < all.length; i++) {           // 跳过两个动作项（有关键词时只搜目标）
      var it = all[i];
      var hay = it.hay || (it.label + ' ' + (it.sub || '')).toLowerCase();
      var at = hay.indexOf(query);
      if (at < 0) continue;
      scored.push({ it: it, score: at === 0 ? 0 : (it.label.toLowerCase().indexOf(query) === 0 ? 1 : 2) });
    }
    scored.sort(function (a, b) { return a.score - b.score; });
    return scored.slice(0, MAX_RESULTS).map(function (s) { return s.it; });
  }

  /* ---------- 渲染 ---------- */
  function listHtml() {
    if (!items.length) {
      return '<div class="cmdk-empty">没有匹配的条目 —— 试试题号、方法名或「随机」。</div>';
    }
    return items.map(function (it, i) {
      return '<button type="button" class="cmdk-item' + (i === active ? ' cmdk-active' : '') +
        '" data-idx="' + i + '"><span class="cmdk-icon">' + it.icon + '</span>' +
        '<span class="cmdk-main"><span class="cmdk-label">' + esc(it.label) + '</span>' +
        (it.sub ? '<span class="cmdk-sub">' + esc(it.sub) + '</span>' : '') + '</span>' +
        '<span class="cmdk-go">↵</span></button>';
    }).join('');
  }

  function paint(root, q) {
    items = filter(q);
    active = 0;
    var host = core.$('#cmdkResults', root);
    if (host) host.innerHTML = listHtml();
  }

  /** 执行选中项：导航或动作，然后收面板。 */
  function runItem(root, idx) {
    var it = items[idx];
    if (!it) return;
    a11y.closeModal();
    if (it.act === 'theme') { TSJ.appTheme.toggle(); return; }
    if (it.act === 'random') { TSJ.appViews.goRandom(); return; }
    if (it.hash) global.location.hash = it.hash;
  }

  /* ---------- 打开 / 绑定 ---------- */
  function openPalette() {
    var root = a11y.modalOpen() ? global.document.getElementById('overlay') : null;
    var input = root ? core.$('#cmdkInput', root) : null;
    if (input) { paint(root, input.value); return; }   // 已打开：聚焦回输入框即可
    a11y.openModal({
      label: '命令面板',
      html: '<div class="cmdk">' +
        '<input id="cmdkInput" class="cmdk-input" type="text" autocomplete="off" spellcheck="false"' +
        ' placeholder="跳转到题目 / 方法 / 课程 / 术语，或输入命令…" aria-label="搜索或跳转">' +
        '<div id="cmdkResults" class="cmdk-results" role="listbox" aria-label="结果"></div>' +
        '<div class="cmdk-foot"><span>↑↓ 选择</span><span>↵ 跳转</span><span>ESC 关闭</span></div></div>'
    });
    root = a11y.modalOpen() ? global.document.getElementById('overlay') : null;
    input = core.$('#cmdkInput', root);
    if (!input) return;
    paint(root, '');

    input.addEventListener('input', function () { paint(root, input.value); });
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        if (!items.length) return;
        active = ev.key === 'ArrowDown'
          ? (active + 1) % items.length
          : (active - 1 + items.length) % items.length;
        var host = core.$('#cmdkResults', root);
        var btns = core.$$('.cmdk-item', host);
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList[Number(btns[i].getAttribute('data-idx')) === active ? 'add' : 'remove']('cmdk-active');
        }
        if (btns[active]) btns[active].scrollIntoView({ block: 'nearest' });
        return;
      }
      if (ev.key === 'Enter') {
        ev.preventDefault();
        runItem(root, active);
      }
    });
    var host = core.$('#cmdkResults', root);
    if (host) {
      host.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('.cmdk-item') : null;
        if (btn) runItem(root, Number(btn.getAttribute('data-idx')));
      });
    }
  }

  /** 安装全局快捷键（应用启动时调用一次；监听随页面生存，无需解绑）。Ctrl/Cmd+K 切换开关。 */
  function install() {
    global.document.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) {
        ev.preventDefault();
        if (isOpen()) a11y.closeModal();
        else openPalette();
      }
    });
  }

  TSJ.appCmdk = { install: install, openPalette: openPalette, filter: filter };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app.js —— 应用外壳：路由、判题会话、启动装配
 *
 * 加载顺序（经典 script）：core → store → storage → ui → a11y → views → pages → app.js。
 * 本文件必须是**最后一个**脚本，且末尾同步调用 init()：靠「脚本位于 body 末尾」保证 DOM 已就绪，
 * 不监听任何页面加载事件。
 *
 * 路由表：
 *   #/problems            题库（搜索 / 标签 / 难度）
 *   #/methods             方法库（47 条方法卡片，按 5 个层次检索）
 *   #/method/:id          方法详情（直觉 / 公式 / 假设 / 反例 / 引用）
 *   #/glossary            术语表（新手术语速查）
 *   #/learn[/:id]         课程地图与模块页（9 模块）
 *   #/lab                 可视化实验室（受控回测）
 *   #/studio              模型工坊（自己搓模型跑完整实验）
 *   #/problem/:id         题目页（题面 + 编辑器）
 *   #/submission/<id>     提交详情（代码快照 + 逐测试点）
 *   #/submissions         提交记录（含导出 / 导入 / 清空）
 *   #/ranking             排行榜
 *   #/path                学习路径
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore, store = TSJ.appStore, storage = TSJ.appStorage;
  var ui = TSJ.appUi, a11y = TSJ.appA11y, views = TSJ.appViews, judge = TSJ.judge;
  var problem = TSJ.appProblem, pages = TSJ.appPages, library = TSJ.appLibrary;
  var boards = TSJ.appBoards, glossary = TSJ.appGlossary, theme = TSJ.appTheme;
  var lifecycle = TSJ.appLifecycle, dashboard = TSJ.appDashboard;
  var learn = TSJ.appLearn;
  var methodDetail = TSJ.appMethodDetail;
  var lab = TSJ.appLab;
  var studio = TSJ.appStudio;

  var $ = core.$;
  var esc = core.esc;
  var STORE = core.STORE;
  var state = store.state;

  /** 提交记录 id 的会话内序号（不引入随机数：数据集与判题都要求可复现） */
  var subSeq = 0;

  /* ---------- 1. 路由 ---------- */
  /** 解析 hash 并渲染对应视图。 */
  function route() {
    var hash = global.location.hash || '#/';
    var path = hash.replace(/^#\/?/, '');
    var parts = path.split('/').filter(function (s) { return s.length > 0; });
    var view = parts[0] || 'dashboard';

    // 路由级生命周期：新 Scope 建立前先销毁旧页面的监听 / 图表 / 定时器
    var scope = lifecycle.createScope('route');
    if (state.routeScope && typeof state.routeScope.destroy === 'function') state.routeScope.destroy();
    state.routeScope = scope;

    // 切换路由前销毁旧编辑器与旧图表 hover 句柄（否则 pointermove 监听会累积）
    if (state.editor && typeof state.editor.destroy === 'function') state.editor.destroy();
    state.editor = null;
    if (state.chartHover && typeof state.chartHover.destroy === 'function') state.chartHover.destroy();
    state.chartHover = null;
    state.activeProblem = null;
    state.lastResult = null;

    // 作废旧判题会话：令牌自增让在途回调全部失配（整段丢弃），并立刻 terminate 旧 Worker。
    // 注意：这里**不**重置任何「忙」布尔量 —— 忙闲由 token 判定，重置布尔量正是旧竞态的根源。
    state.judgeToken++;
    if (state.session && typeof state.session.abort === 'function') state.session.abort();
    state.session = null;
    state.busyToken = -1;

    // 路由切换时如果有弹层打开，先关掉（避免弹层浮在新页面上）
    if (a11y.modalOpen()) a11y.closeModal();
    document.body.classList.remove('dragging');   // 分栏拖拽中途切路由：DOM 已换、pointerup 不再触发，摘掉防光标困住

    if (view === 'problem' && parts[1]) {
      var p = TSJ.findProblem(decodeURIComponent(parts[1]));
      store.setActiveNav('problems');
      problem.renderProblem(parts[1], scope);
      a11y.setTitle(p ? p.title : '题目不存在');
    } else if (view === 'submission' && parts[1]) {
      store.setActiveNav('submissions');
      pages.renderSubmissionDetail(decodeURIComponent(parts[1]));
      a11y.setTitle('提交详情');
    } else if (view === 'submissions') {
      store.setActiveNav('submissions');
      pages.renderSubmissions();
      a11y.setTitle('提交记录');
    } else if (view === 'ranking' || view === 'path') {
      store.setActiveNav(view);
      if (view === 'ranking') { boards.renderRanking(); a11y.setTitle('排行榜'); }
      else { boards.renderPath(); a11y.setTitle('学习路径'); }
    } else if (view === 'methods' && parts[1]) {
      store.setActiveNav('methods');
      methodDetail.render(decodeURIComponent(parts[1]), scope);
    } else if (view === 'methods') {
      store.setActiveNav('methods');
      library.renderMethods();
      a11y.setTitle('方法库');
    } else if (view === 'glossary') {
      store.setActiveNav('glossary');
      glossary.renderGlossary();
      a11y.setTitle('术语表');
    } else if (view === 'learn' && parts[1]) {
      store.setActiveNav('learn');
      learn.renderModule(decodeURIComponent(parts[1]), scope);
    } else if (view === 'learn') {
      store.setActiveNav('learn');
      learn.renderMap(scope);
    } else if (view === 'lab') {
      store.setActiveNav('lab');
      lab.render(scope);
    } else if (view === 'studio') {
      store.setActiveNav('studio');
      studio.render(scope);
    } else if (view === 'dashboard') {
      store.setActiveNav('dashboard');
      dashboard.render(scope);
    } else {
      store.setActiveNav('problems');
      views.renderProblemList();
      a11y.setTitle('题库');
    }

    store.updateScoreChip();
    global.scrollTo(0, 0);
    a11y.focusView();
  }

  /* ---------- 2. 判题 ---------- */
  /** 判断某个判题会话是否已经过期（被新提交或路由切换作废）。 */
  function isStale(token, p) {
    return token !== state.judgeToken || state.activeProblem !== p;
  }

  /** 触发判题。 */
  function runJudge(p, ds, isSubmit) {
    if (!state.editor) return;
    // 同一会话内已有判题在跑 → 忽略重复点击；会话被切走后 busyToken 自动失配，新页面可立即判题
    if (state.busyToken === state.judgeToken) return;

    var code = state.editor.getValue();
    state.drafts[p.id] = code;
    store.saveDrafts();
    if (typeof state.editor.clearError === 'function') state.editor.clearError();

    var token = ++state.judgeToken;
    state.busyToken = token;
    var session = {};
    state.session = session;
    ui.setBusy(true, token);

    judge.evaluate({ problem: p, dataset: ds, code: code, session: session }).then(function (res) {
      // 首行校验会话：不匹配就整段丢弃（不碰 DOM、不写存储），旧结果绝不会落到新页面
      if (isStale(token, p)) return;
      state.busyToken = -1;
      state.session = null;
      ui.setBusy(false, token);
      state.lastResult = res;

      if (isSubmit) persistResult(p, res, code);
      ui.renderResult(res, p);
      ui.paintPrediction(res, p, ds);

      // RE：把错误行标注到编辑器上（同时更新 aria-describedby 指向的说明文本）
      if (res.verdict === 'RE' && res.cases && res.cases.length > 0) {
        var line = null;
        for (var i = 0; i < res.cases.length; i++) {
          if (res.cases[i].line) { line = res.cases[i].line; break; }
        }
        if (line && state.editor) state.editor.markError(line);
      }
    }).catch(function (err) {
      if (isStale(token, p)) return;
      state.busyToken = -1;
      state.session = null;
      ui.setBusy(false, token);
      ui.renderResult({
        verdict: 'RE',
        passed: false,
        score: 0,
        passScore: p.passScore,
        metricLabel: judge.metricLabels[p.metric] || p.metric,
        cases: [],
        message: '判题器异常：' + ((err && err.message) || String(err))
      }, p);
    });
  }

  /**
   * 把判题结果写入存储（进度 + 带代码快照与逐测试点的提交记录）。
   * @param {Object} p 题目
   * @param {Object} res 判题结果
   * @param {string} code 本次提交的代码
   */
  function persistResult(p, res, code) {
    var now = Date.now();
    var rec = state.progress[p.id] || { best: 0, passed: false, attempts: 0 };
    rec.attempts = (rec.attempts || 0) + 1;
    rec.best = Math.max(rec.best || 0, res.score);
    rec.passed = !!rec.passed || !!res.passed;
    rec.lastVerdict = res.verdict;
    rec.lastAt = now;
    state.progress[p.id] = rec;
    store.saveProgress();

    // 逐测试点快照：只留 6 个字段，防止把整份报告（含 allBaselines / predictions）写进存储
    var cases = [];
    var src = res.cases || [];
    for (var i = 0; i < src.length && i < core.MAX_CASES; i++) {
      cases.push({
        index: core.toCount(src[i].index),
        verdict: src[i].verdict,
        score: core.toScore(src[i].score),
        yourMetric: core.toMetric(src[i].yourMetric),
        bestBaseline: core.toMetric(src[i].bestBaseline),
        baselineName: core.toText(src[i].baselineName)
      });
    }

    subSeq++;
    state.submissions.unshift({
      id: now + '-' + core.fnv1a(code + '|' + now + '|' + subSeq).slice(0, 8),
      at: now,
      problemId: p.id,
      title: p.title,
      score: res.score,
      verdict: res.verdict,
      passed: !!res.passed,
      metric: res.metricLabel,
      code: core.truncateCode(code),
      cases: cases,
      degraded: res.degraded === true
    });
    store.saveSubmissions();
    store.updateScoreChip();
    if (TSJ.appAchievements) TSJ.appAchievements.onJudgeResult(p, res, state.progress);  // 成就检查（首AC/连胜/满分）
    // 题头的「历史最高 / 尚未提交」必须跟着落盘结果一起刷新，否则要手动刷新页面才更新
    if (TSJ.appProblem && typeof TSJ.appProblem.refreshBestBadge === 'function') {
      TSJ.appProblem.refreshBestBadge(p);
    }

    // 通过后解锁题解按钮（查询限定在 #view 内，避免摸到别的页面的按钮）
    var view = $('#view');
    var btnSolution = view ? $('#btnSolution', view) : null;
    if (btnSolution && rec.passed) {
      btnSolution.disabled = false;
      btnSolution.removeAttribute('title');
    }
  }

  /* ---------- 3. 启动 ---------- */
  /** 绑定主题切换与移动端抽屉（只绑一次，挂在应用级 Scope 上）。 */
  function bindShell() {
    var rootScope = lifecycle.createScope('app');
    state.appScope = rootScope;

    theme.init();
    TSJ.appCmdk.install();   // Ctrl/Cmd+K 命令面板（自持监听，随页面生存）
    var btn = $('#btnTheme');
    function paintTheme() {
      if (!btn) return;
      var mode = theme.get();
      btn.textContent = mode === 'system' ? '主题：跟随系统' : (mode === 'dark' ? '主题：深色' : '主题：浅色');
      btn.setAttribute('aria-pressed', theme.resolved() === 'light' ? 'true' : 'false');
    }
    paintTheme();
    theme.onChange(paintTheme);
    rootScope.own(theme.watchSystem());

    if (btn) {
      rootScope.listen(btn, 'click', function () {
        theme.toggle();
        paintTheme();
      });
    }

    var menu = $('#btnMenu');
    var drawer = $('#drawerNav');
    function closeDrawer() {
      if (!drawer || !menu) return;
      drawer.classList.remove('open');
      menu.setAttribute('aria-expanded', 'false');
    }
    if (menu && drawer) {
      rootScope.listen(menu, 'click', function () {
        var open = drawer.classList.toggle('open');
        menu.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      rootScope.listen(drawer, 'click', function (ev) {
        if (ev.target && ev.target.tagName === 'A') closeDrawer();
      });
      rootScope.listen(doc(), 'keydown', function (ev) {
        if (ev.key === 'Escape') closeDrawer();
      });
    }

    global.addEventListener('hashchange', route);
  }

  function doc() { return global.document; }

  /** 应用初始化。 */
  function init() {
    // 读出的数据一律视为不可信：先过类型守卫（不合法则丢弃并静默重写），再逐字段归一化
    store.loadState();

    // 注入判题入口与刷新入口：views / pages 不反向引用 app.js，避免循环依赖
    views.bindRunner(runJudge);
    pages.bindRefresh(route);

    // 写盘失败（配额不足 / 隐私模式）→ 明确提示并降级为内存态
    core.onWriteError(function (quota) {
      state.storageOk = false;
      a11y.toast(quota ? '本地存储已满，进度未保存' : '本地存储不可用，进度仅在本次会话内有效', 'err');
    });

    // 跨标签页同步：别的页面改了 tsoj:* → 重新装载并重渲染当前视图（避免后写覆盖先写）
    store.onExternalChange(function () { route(); });
    storage.bindStorageSync();

    bindShell();

    if (!global.location.hash) global.location.hash = '#/';
    route();
    store.updateScoreChip();

    if (core.readJSON(STORE.onboarded, false, function (v) { return typeof v === 'boolean'; }) !== true) {
      problem.showOnboarding();
    }
  }

  TSJ.app = {
    route: route,
    runJudge: runJudge,
    persistResult: persistResult,
    init: init
  };

  init();
})(typeof window !== 'undefined' ? window : this);

</script>
</body>
</html>
