<script>
/**
 * problems.js —— 题库定义
 *
 * 每题结构：
 *   { id, index, title, difficulty, tags, points, passScore, dataset, mode,
 *     horizon, originStep, windows, metric, baselines, threshold,
 *     statement, inputSpec, outputSpec, hints, solution, starter, passRate }
 *
 * 学习路径（由易到难）：
 *   P1 朴素预测 → P2 移动平均 → P3 季节朴素 → P4 SES → P5 Holt
 *   → P6 Holt-Winters → P7 直接多步 → P8 突变鲁棒 → P9 滚动回测挑战
 *
 * 参考解（solution）以真实函数书写，再用 toString() 转成字符串，
 * 这样参考解本身会被 node --check 与自测脚本覆盖，不会出现「字符串里的语法错误」。
 *
 * 挂载点：window.TSJ.problems
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});

  /* ================================================================== *
   * 0. 参考解函数（全部自包含，不引用外部变量）
   * ================================================================== */

  /**
   * P1 朴素法：最后一个观测值重复 horizon 次。
   */
  function solNaive(history, horizon, ctx) {
    var last = history[history.length - 1];
    var out = [];
    for (var i = 0; i < horizon; i++) out.push(last);
    return out;
  }

  /**
   * P1 参考解：朴素法 + 漂移修正（random walk with drift）。
   *
   * 纯朴素法在趋势序列上会系统性低估，误差比恰好 = 1.0（打平基线只能拿 57 分）。
   * 补一个「每步漂移」就能过线：用「最近一个周期的均值」与「上一个周期的均值」之差
   * 估出每步平均抬升量，再按 h 线性外推。
   */
  function solNaiveDrift(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var last = history[n - 1];

    // 每步漂移 = (最近一个周期均值 - 上一个周期均值) / m
    var drift = 0;
    if (n >= 2 * m) {
      var cur = 0;
      var prev = 0;
      for (var i = 0; i < m; i++) {
        cur += history[n - m + i];
        prev += history[n - 2 * m + i];
      }
      drift = (cur - prev) / (m * m);
    }

    var out = [];
    for (var h = 1; h <= horizon; h++) out.push(last + drift * h);
    return out;
  }

  /**
   * P2 相位移动平均：
   * 移动平均的窗口必须与周期对齐 —— 对每个「相位」（同一小时 / 同一月份）分别做跨周期平均，
   * 这样既消掉噪声，又保留完整的季节形状；最后用「本周期均值 - 上周期均值」补回漂移。
   */
  function solMovingAverage(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var blocks = Math.min(Math.floor(n / m), 14);
    var j;

    if (blocks < 1) {
      // 历史不足一个周期：退化为朴素法（自包含）
      var fb = [];
      var lastVal = history[n - 1];
      for (j = 0; j < horizon; j++) fb.push(lastVal);
      return fb;
    }

    // 1) 按相位做移动平均（窗口 = 最近 blocks 个周期的同相位样本）
    var prof = [];
    for (j = 0; j < m; j++) prof.push(0);
    var base = n - blocks * m;
    for (var d = 0; d < blocks; d++) {
      for (j = 0; j < m; j++) prof[j] += history[base + d * m + j];
    }
    for (j = 0; j < m; j++) prof[j] /= blocks;

    // 2) 漂移：最近一个周期均值 与 上一个周期均值 之差，换算成每步漂移
    var drift = 0;
    if (n >= 2 * m) {
      var cur = 0;
      var prev = 0;
      for (j = 0; j < m; j++) {
        cur += history[n - m + j];
        prev += history[n - 2 * m + j];
      }
      drift = (cur - prev) / (m * m);
    }

    var out = [];
    for (var h = 0; h < horizon; h++) {
      out.push(prof[(n + h) % m] + drift * (h + 1));
    }
    return out;
  }

  /**
   * P3 季节朴素法：直接重复上一个完整季节。
   */
  function solSeasonalNaive(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var out = [];
    for (var h = 0; h < horizon; h++) {
      var idx = n - m + (h % m);
      if (idx < 0) idx = n - 1;
      out.push(history[idx]);
    }
    return out;
  }

  /**
   * P4 简单指数平滑（SES）：只维护水平项，按 alpha 做指数加权。
   */
  function solSes(history, horizon, ctx) {
    var alpha = 0.28;
    var n = history.length;              // n：历史一共有几个数（数组的 .length 属性）
    var level = history[0];              // level：当前「水平」估计，先用第 1 个值当起点
    // for 循环从第 2 个数走到最后一个（下标 1 到 n-1）
    for (var i = 1; i < n; i++) {
      // 核心一步（加权平均）：新水平 = α×新观测 + (1−α)×旧水平
      // α 大 → 更相信最新观测（记性短）；α 小 → 更相信历史（记性长）
      level = alpha * history[i] + (1 - alpha) * level;
    }
    var out = [];                        // 装预测值的空数组
    // SES 假设没有趋势/季节：未来每一步都等于最终水平，循环 horizon 次填满
    for (var h = 0; h < horizon; h++) out.push(level);
    return out;                          // 返回数组的长度必须等于 horizon
  }

  /**
   * P5 Holt 线性趋势：同时维护水平项与趋势项，按趋势外推。
   */
  function solHolt(history, horizon, ctx) {
    var alpha = 0.42;
    var beta = 0.10;
    var n = history.length;              // 历史长度
    var level = history[0];              // 水平（现在多高）：从第 1 个值起步
    // 趋势（每步走多远）初始化为前两值之差；三目运算符：条件 ? 真值 : 假值
    // 只有一个点时没有差可算，取 0
    var trend = n > 1 ? history[1] - history[0] : 0;

    // 逐期更新两条状态：每来一个新观测，循环体执行一遍
    for (var i = 1; i < n; i++) {
      var prevLevel = level;             // 先存旧水平：下一行会覆盖它，趋势更新还要用
      // 水平更新（加权平均）：新水平 = α×新观测 + (1−α)×(按趋势外推的旧水平)
      // 与 SES 的差别：旧状态先加一个 trend 提前量，而不是原地不动
      level = alpha * history[i] + (1 - alpha) * (level + trend);
      // 趋势更新（也是加权平均）：新趋势 = β×(刚发生的水平变化) + (1−β)×旧趋势
      // β 小 → 趋势变化慢、抗噪声；β 大 → 追踪快但容易被噪声带偏
      trend = beta * (level - prevLevel) + (1 - beta) * trend;
    }

    var out = [];                        // 从当前水平出发，每步抬一个 trend（线性外推）
    for (var h = 1; h <= horizon; h++) out.push(level + trend * h);
    return out;
  }

  /**
   * P6 Holt-Winters 加性：水平 + 趋势 + 季节三件套。
   */
  function solHoltWinters(history, horizon, ctx) {
    var m = ctx.season > 1 ? ctx.season : 12;
    var n = history.length;
    if (n < 2 * m) {
      // 历史不足两个周期：退化为朴素法（必须自包含，不能引用外部函数）
      var fb = [];
      var lastVal = history[history.length - 1];
      for (var f = 0; f < horizon; f++) fb.push(lastVal);
      return fb;
    }

    var alpha = 0.32;
    var beta = 0.06;
    var gamma = 0.28;

    // ---- 初始化：用头两个周期把三条状态估出来 ----
    var i;
    var s1 = 0;                          // s1/s2：第 1、第 2 个周期的累加器
    var s2 = 0;
    for (i = 0; i < m; i++) {
      s1 += history[i];                  // 第 1 个周期的 m 个数之和
      s2 += history[m + i];              // 第 2 个周期（下标整体右移 m）
    }
    s1 /= m;                             // 复合赋值：s1 = s1 / m → 周期均值
    s2 /= m;

    var level = s1;                      // 初始水平 = 第 1 个周期均值
    var trend = (s2 - s1) / m;           // 初始趋势 = 两周期均值之差 ÷ 周期长（每步抬升）
    var season = [];                     // 季节项：每个相位一个数（观测减掉水平后的余量）
    for (i = 0; i < m; i++) season.push(history[i] - s1);

    // ---- 逐期更新三条状态 ----
    // t % m 是取余：当前时刻落在周期内的第几个相位（0..m-1 循环）
    for (var t = 1; t < n; t++) {
      var si = season[t % m];            // 取出当前相位的旧季节项
      var prevLevel = level;             // 存旧水平（趋势更新要用）
      // 水平更新：先把季节项从观测里扣掉（去季节），再与「趋势外推的旧水平」加权平均
      level = alpha * (history[t] - si) + (1 - alpha) * (level + trend);
      // 趋势更新：与 Holt 完全相同
      trend = beta * (level - prevLevel) + (1 - beta) * trend;
      // 季节更新：只更新当前相位 = γ×(观测 − 新水平) + (1−γ)×旧季节项
      season[t % m] = gamma * (history[t] - level) + (1 - gamma) * si;
    }

    // ---- 外推：水平 + h 步趋势 + 未来相位的季节项 ----
    var out = [];
    for (var h = 1; h <= horizon; h++) {
      // (n + h - 1) % m：第 h 步未来时刻对应的相位；三条状态在同一时刻相加
      out.push(level + h * trend + season[(n + h - 1) % m]);
    }
    return out;
  }

  /**
   * P7 直接多步预测：
   * 用最小二乘一次性估计「全局线性趋势」，再按相位求残差均值得到「季节剖面」，
   * 最后对每个 h 独立外推。全程不把预测值塞回历史，因此没有递归误差累积。
   */
  function solDirect(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var i;

    // 1) 全局最小二乘直线
    var sx = 0;
    var sy = 0;
    var sxx = 0;
    var sxy = 0;
    for (i = 0; i < n; i++) {
      sx += i;
      sy += history[i];
      sxx += i * i;
      sxy += i * history[i];
    }
    var denom = n * sxx - sx * sx;
    var slope = Math.abs(denom) < 1e-12 ? 0 : (n * sxy - sx * sy) / denom;
    var intercept = (sy - slope * sx) / n;

    // 2) 相位残差剖面
    var resid = [];
    var cnt = [];
    for (i = 0; i < m; i++) {
      resid.push(0);
      cnt.push(0);
    }
    for (i = 0; i < n; i++) {
      var j = i % m;
      resid[j] += history[i] - (intercept + slope * i);
      cnt[j]++;
    }
    for (i = 0; i < m; i++) resid[i] = cnt[i] > 0 ? resid[i] / cnt[i] : 0;

    // 3) 一次性外推
    var out = [];
    for (var h = 0; h < horizon; h++) {
      out.push(intercept + slope * (n + h) + resid[(n + h) % m]);
    }
    return out;
  }

  /**
   * P8 鲁棒水平 + 鲁棒季节剖面：
   * 用中位数（抗异常点）估计每个相位的水平，再用前后两段均值之差估计漂移并限幅，
   * 避免「刚发生突变时外推过猛」。
   */
  function solRobustLevel(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 7;

    /** 中位数 */
    function median(arr) {
      var a = arr.slice().sort(function (x, y) { return x - y; });
      var mid = a.length >> 1;
      if (a.length === 0) return 0;
      if (a.length % 2 === 1) return a[mid];
      return (a[mid - 1] + a[mid]) / 2;
    }

    var cycles = Math.min(6, Math.floor(n / m));
    var j;
    if (cycles < 1) {
      // 历史不足一个周期：退化为朴素法（自包含）
      var fb = [];
      var lastVal = history[n - 1];
      for (j = 0; j < horizon; j++) fb.push(lastVal);
      return fb;
    }

    // 1) 每个相位取最近 cycles 个周期样本的中位数
    var prof = [];
    for (j = 0; j < m; j++) {
      var bucket = [];
      for (var c = 0; c < cycles; c++) {
        var t = n - cycles * m + c * m + j;
        if (t >= 0 && t < n) bucket.push(history[t]);
      }
      prof.push(bucket.length > 0 ? median(bucket) : 0);
    }

    // 2) 中心化，得到季节偏移
    var center = median(prof);
    for (j = 0; j < m; j++) prof[j] -= center;

    // 3) 漂移：最近 cycles 个周期 与 更早 cycles 个周期 的均值差
    var drift = 0;
    if (n >= 2 * cycles * m) {
      var span = cycles * m;
      var a = 0;
      var b = 0;
      for (var q = 0; q < span; q++) {
        a += history[n - span + q];
        b += history[n - 2 * span + q];
      }
      drift = (a - b) / (span * span);
    }

    // 4) 限幅：单步漂移不超过当前水平的 2%
    var cap = Math.abs(center) * 0.02;
    if (drift > cap) drift = cap;
    if (drift < -cap) drift = -cap;

    var out = [];
    for (var h = 0; h < horizon; h++) {
      out.push(center + drift * (h + 1) + prof[(n + h) % m]);
    }
    return out;
  }

  /**
   * P9 滚动回测下的稳健 Holt-Winters（加性）：
   * 与 P6 的唯一区别是**初始化方式**——用最小二乘拟合前两个周期来估计初始水平与趋势，
   * 而不是用「首值差 / 两段均值差」。在滚动回测里，训练集长度会变化，
   * 稳健的初始化能让每个窗口都稳定，不靠某一段的运气。
   */
  function solRollingHW(history, horizon, ctx) {
    var m = ctx.season > 1 ? ctx.season : 12;
    var n = history.length;
    var j;

    if (n < 2 * m) {
      // 历史不足两个周期：退化为朴素法（自包含）
      var fb = [];
      var lastVal = history[n - 1];
      for (j = 0; j < horizon; j++) fb.push(lastVal);
      return fb;
    }

    var alpha = 0.20;
    var beta = 0.05;
    var gamma = 0.35;

    // 1) 用前两个周期做最小二乘，得到更稳的初始水平与趋势
    var K = 2 * m;
    var sx = 0;
    var sy = 0;
    var sxx = 0;
    var sxy = 0;
    for (j = 0; j < K; j++) {
      sx += j;
      sy += history[j];
      sxx += j * j;
      sxy += j * history[j];
    }
    var denom = K * sxx - sx * sx;
    var slope = Math.abs(denom) < 1e-12 ? 0 : (K * sxy - sx * sy) / denom;
    var intercept = (sy - slope * sx) / K;

    var level = intercept + slope * (K - 1);
    var trend = slope;
    var season = [];
    for (j = 0; j < m; j++) season.push(history[j] - (intercept + slope * j));

    // 2) 递推更新
    for (var t = K; t < n; t++) {
      var si = season[t % m];
      var prevLevel = level;
      level = alpha * (history[t] - si) + (1 - alpha) * (level + trend);
      trend = beta * (level - prevLevel) + (1 - beta) * trend;
      season[t % m] = gamma * (history[t] - level) + (1 - gamma) * si;
    }

    // 3) 外推
    var out = [];
    for (var h = 1; h <= horizon; h++) {
      out.push(level + h * trend + season[(n + h - 1) % m]);
    }
    return out;
  }

  /* ================================================================== *
   * 0.5 高阶题参考解（P10–P15）
   *
   * 这六道题对应方法库里「经典统计」与「竞赛级方法」两层的可练条目：
   *   P10 Theta 方法        —— Assimakopoulos & Nikolopoulos, IJF 2000（M3 冠军）
   *   P11 AR(p) Yule-Walker —— Box & Jenkins 传统，闭式解
   *   P12 Croston 法        —— Syntetos & Boylan, IJF 2005（间歇需求）
   *   P13 周期图 + 谐波回归  —— 经典谱分析，频域方法的思想源头
   *   P14 组合预测          —— Bates & Granger 1969，M4 的核心结论
   *   P15 DLinear 分解线性  —— Zeng et al., AAAI 2023
   * ================================================================== */

  /**
   * P10 Theta 方法：θ=0 线（线性回归）与 θ=2 线（SES）各占一半，再加回季节。
   * 两个极简模型拼起来打赢任何单一基线 —— 这正是 M3 冠军的做法。
   */
  function solTheta(history, horizon, ctx) {
    var n = history.length;
    var m = (ctx && ctx.season > 1) ? ctx.season : 1;
    var i;

    // 1) 先用全局 OLS 去掉趋势，再按相位求残差均值，得到加性季节项（归一后和为 0）
    var sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (i = 0; i < n; i++) { sx += i; sy += history[i]; sxx += i * i; sxy += i * history[i]; }
    var den = n * sxx - sx * sx;
    var slope = Math.abs(den) < 1e-12 ? 0 : (n * sxy - sx * sy) / den;
    var icept = (sy - slope * sx) / n;

    var s = null;
    if (m > 1) {
      var sum = [], cnt = [];
      for (i = 0; i < m; i++) { sum.push(0); cnt.push(0); }
      for (i = 0; i < n; i++) { var p = i % m; sum[p] += history[i] - (icept + slope * i); cnt[p]++; }
      s = [];
      var mean = 0;
      for (i = 0; i < m; i++) { s.push(cnt[i] > 0 ? sum[i] / cnt[i] : 0); mean += s[i]; }
      mean /= m;
      for (i = 0; i < m; i++) s[i] -= mean;
    }

    // 2) 去季节序列
    var d = [];
    for (i = 0; i < n; i++) d.push(history[i] - (s ? s[i % m] : 0));

    // 3) θ=0 线：对去季节序列再做一次 OLS 直线（长期趋势）
    var ax = 0, ay = 0, axx = 0, axy = 0;
    for (i = 0; i < n; i++) { ax += i; ay += d[i]; axx += i * i; axy += i * d[i]; }
    var den2 = n * axx - ax * ax;
    var b0 = Math.abs(den2) < 1e-12 ? 0 : (n * axy - ax * ay) / den2;
    var a0 = (ay - b0 * ax) / n;

    // 4) θ=2 线：SES（α=0.2），取末端水平（短期）
    var alpha = 0.2;
    var level = d[0];
    for (i = 1; i < n; i++) level = alpha * d[i] + (1 - alpha) * level;

    // 5) 0.5 / 0.5 组合，再加回季节
    var out = [];
    for (var h = 0; h < horizon; h++) {
      var t = n + h;
      var v = 0.5 * (a0 + b0 * t) + 0.5 * level;
      if (s) v += s[t % m];
      out.push(v);
    }
    return out;
  }

  /**
   * P11 AR(p)：Yule-Walker 方程 + Levinson-Durbin 递推，闭式解、无需迭代优化。
   */
  function solArYW(history, horizon, ctx) {
    var n = history.length;
    var p = Math.min(10, Math.max(1, Math.floor(n / 4)));
    var i, k;                            // 循环变量先声明、两处复用

    // ---- 1) 去均值：AR 假设序列围绕某个水平波动，先把水平减掉 ----
    var mu = 0;                          // mu：均值（先累加、再除以 n）
    for (i = 0; i < n; i++) mu += history[i];
    mu /= n;
    var x = [];                          // 中心化序列：每项 = 原值 − 均值（偏离平均多少）
    for (i = 0; i < n; i++) x.push(history[i] - mu);

    // ---- 2) 自协方差 γ(0..p)：隔 k 步的两个值「同涨同跌」的程度 ----
    // γ(0) 是方差（自己乘自己）；γ(k) ÷ γ(0) 就是自相关系数（ACF）
    var g = [];
    for (k = 0; k <= p; k++) {
      var acc = 0;                       // 累加器：Σ x[i]·x[i+k]（对应相乘再求和，即点积）
      for (i = 0; i + k < n; i++) acc += x[i] * x[i + k];
      g.push(acc / n);
    }
    // 常数序列：没有可提取的自相关结构，直接给均值
    if (!(g[0] > 1e-12)) {
      var flat = [];
      for (i = 0; i < horizon; i++) flat.push(mu);
      return flat;
    }

    // ---- 3) Levinson-Durbin 递推解 Γ_p·φ = γ_p ----
    // 目标：解出 p 个未知数 φ（自回归系数）。方程组的矩阵沿对角线取值相同（Toeplitz），
    // 普通高斯消元是 O(p³)；这里从 AR(1) 逐阶升到 AR(p)，只要 O(p²)。
    var prev = null, err = g[0], phi = null;
    for (k = 0; k < p; k++) {            // 第 k 轮 = 求解 AR(k+1)
      var cur = new Array(p + 1).fill(0); // new Array(len).fill(0)：造一个全 0 数组
      if (k === 0) {
        // AR(1) 有直接解：φ1 = γ(1)/γ(0)
        cur[1] = g[1] / g[0];
        err = g[0] * (1 - cur[1] * cur[1]);   // err：当前阶的一步预测误差方差
      } else {
        // 分子 = γ(k+1) − 旧系数与 γ 的「倒序点积」：还没被解释掉的新息
        var num = g[k + 1];
        for (i = 1; i <= k; i++) num -= prev[i] * g[k + 1 - i];
        var refl = num / err;            // 反射系数：这一阶新加的第 k+1 步依赖有多强
        cur[k + 1] = refl;
        // 旧系数整体修正：减去反射系数 × 旧系数的镜像（倒序重放）
        for (i = 1; i <= k; i++) cur[i] = prev[i] - refl * prev[k + 1 - i];
        err = err * (1 - refl * refl);   // 误差方差按 (1 − refl²) 收缩
      }
      if (!(err > 1e-12)) { cur = new Array(p + 1).fill(0); err = 1e-12; }  // 防数值崩坏
      prev = cur;                        // 本轮结果成为下一轮的「旧系数」
      phi = cur;
    }

    // ---- 4) 多步递推预测：ŷ(t) = φ1·x(t−1) + … + φp·x(t−p) ----
    // 走过一步之后就没有真值了，把预测值补进 ext 再继续往后算（递归式多步）
    var ext = x.slice();                 // slice()：复制一份，不动原数组
    for (var h = 1; h <= horizon; h++) {
      var v = 0;
      for (i = 1; i <= p; i++) v += phi[i] * ext[ext.length - i];  // 取末尾 p 个值做点积
      ext.push(v);                       // 预测值入列，成为下一轮的「历史」
    }
    var out = [];
    for (var j = 0; j < horizon; j++) out.push(mu + ext[n + j]);    // 记得把均值加回去
    return out;
  }

  /**
   * P12 TSB（Teunter-Syntetos-Babai, IJPE 2011）：
   * 不估「间隔」而直接估「本月有需求」的概率 q，预测 q · z。
   * 对需求频率的变化比 Croston / SBA 更敏感。
   */
  function solTsb(history, horizon, ctx) {
    var n = history.length;
    var alpha = 0.05;   // 非零需求量 z 的平滑系数
    var beta = 0.1;     // 需求发生概率 q 的平滑系数
    var prob = 1;       // 平滑后的「本月有需求」概率
    var z = null;       // 平滑后的「非零需求量」

    for (var i = 0; i < n; i++) {
      var v = history[i];
      var occurred = v > 0 ? 1 : 0;
      prob = beta * occurred + (1 - beta) * prob;
      if (!occurred) continue;
      if (z === null) { z = v; }
      else { z += alpha * (v - z); }
    }
    // 全程零需求：没什么可预测的
    if (z === null || !(prob > 0)) {
      var zeros = [];
      for (var j = 0; j < horizon; j++) zeros.push(0);
      return zeros;
    }
    var rate = prob * z;
    var out = [];
    for (var k = 0; k < horizon; k++) out.push(rate);
    return out;
  }

  /**
   * P13 周期图 + 谐波回归：先用功率谱估周期，再最小二乘外推。
   */
  function solHarmonic(history, horizon, ctx) {
    var n = history.length;
    var i, j;

    // 1) 周期图：先去掉线性趋势，再在整数周期上求功率
    var sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (i = 0; i < n; i++) { sx += i; sy += history[i]; sxx += i * i; sxy += i * history[i]; }
    var den = n * sxx - sx * sx;
    var b = Math.abs(den) < 1e-12 ? 0 : (n * sxy - sx * sy) / den;
    var a = (sy - b * sx) / n;

    var d = [];
    for (i = 0; i < n; i++) d.push(history[i] - (a + b * i));

    var best = [];
    for (var P = 4; P <= Math.floor(n / 2); P++) {
      var re = 0, im = 0;
      for (i = 0; i < n; i++) {
        var w = 2 * Math.PI * i / P;
        re += d[i] * Math.cos(w);
        im += d[i] * Math.sin(w);
      }
      best.push({ P: P, power: (re * re + im * im) / n });
    }
    best.sort(function (u, v) { return v.power - u.power; });
    // 取 top-3，并去掉彼此成倍数关系的（同一个物理周期的谐波）
    var periods = [];
    for (i = 0; i < best.length && periods.length < 3; i++) {
      var cand = best[i].P;
      var dup = false;
      for (j = 0; j < periods.length; j++) {
        if (cand % periods[j] === 0 || periods[j] % cand === 0) { dup = true; break; }
      }
      if (!dup && best[i].power > 1e-9) periods.push(cand);
    }
    if (periods.length === 0) periods.push(12);

    // 2) 设计矩阵：[截距, 时间, 每个周期的 cos / sin]，直接对原序列做最小二乘
    var ncol = 2 + 2 * periods.length;
    var A = [];
    for (i = 0; i < n; i++) {
      var row = [1, i];
      for (j = 0; j < periods.length; j++) {
        var w2 = 2 * Math.PI * i / periods[j];
        row.push(Math.cos(w2));
        row.push(Math.sin(w2));
      }
      A.push(row);
    }
    var coef = lstsq(A, history, ncol);

    // 3) 外推
    var out = [];
    for (var h = 0; h < horizon; h++) {
      var t = n + h;
      var v = coef[0] + coef[1] * t;
      for (j = 0; j < periods.length; j++) {
        var w3 = 2 * Math.PI * t / periods[j];
        v += coef[2 + 2 * j] * Math.cos(w3) + coef[3 + 2 * j] * Math.sin(w3);
      }
      out.push(v);
    }
    return out;

    /** 正规方程 + 列主元高斯消元（带极小 ridge 防止奇异）。 */
    function lstsq(M, y, nc) {
      var ata = [], aty = [];
      for (var c1 = 0; c1 < nc; c1++) { ata.push(new Array(nc).fill(0)); aty.push(0); }
      for (var r = 0; r < M.length; r++) {
        for (var c2 = 0; c2 < nc; c2++) {
          aty[c2] += M[r][c2] * y[r];
          for (var c3 = 0; c3 < nc; c3++) ata[c2][c3] += M[r][c2] * M[r][c3];
        }
      }
      for (var c4 = 0; c4 < nc; c4++) ata[c4][c4] += 1e-8;
      for (var col = 0; col < nc; col++) {
        var piv = col;
        for (var rr = col + 1; rr < nc; rr++) {
          if (Math.abs(ata[rr][col]) > Math.abs(ata[piv][col])) piv = rr;
        }
        if (piv !== col) {
          var tmp = ata[piv]; ata[piv] = ata[col]; ata[col] = tmp;
          var t2 = aty[piv]; aty[piv] = aty[col]; aty[col] = t2;
        }
        var dd = ata[col][col];
        if (Math.abs(dd) < 1e-12) continue;
        for (var r2 = col + 1; r2 < nc; r2++) {
          var f = ata[r2][col] / dd;
          if (f === 0) continue;
          for (var cc = col; cc < nc; cc++) ata[r2][cc] -= f * ata[col][cc];
          aty[r2] -= f * aty[col];
        }
      }
      var xs = new Array(nc).fill(0);
      for (var r3 = nc - 1; r3 >= 0; r3--) {
        var s2 = aty[r3];
        for (var cc2 = r3 + 1; cc2 < nc; cc2++) s2 -= ata[r3][cc2] * xs[cc2];
        xs[r3] = Math.abs(ata[r3][r3]) < 1e-12 ? 0 : s2 / ata[r3][r3];
      }
      return xs;
    }
  }

  /**
   * P14 组合预测：五个候选（Holt-Winters / Holt / SES / 季节朴素 / 漂移朴素）取中位数。
   * 中位数比加权平均更稳 —— 这是 M4 之后被反复验证的结论。
   */
  function solCombination(history, horizon, ctx) {
    var m = (ctx && ctx.season > 1) ? ctx.season : 1;

    function ses(hist, alpha, h) {
      var l = hist[0];
      for (var i = 1; i < hist.length; i++) l = alpha * hist[i] + (1 - alpha) * l;
      var o = []; for (var j = 0; j < h; j++) o.push(l); return o;
    }
    function holt(hist, alpha, beta, h) {
      var l = hist[0], tr = hist.length > 1 ? hist[1] - hist[0] : 0;
      for (var i = 1; i < hist.length; i++) {
        var prev = l;
        l = alpha * hist[i] + (1 - alpha) * (l + tr);
        tr = beta * (l - prev) + (1 - beta) * tr;
      }
      var o = []; for (var j = 0; j < h; j++) o.push(l + (j + 1) * tr); return o;
    }
    function seasNaive(hist, h) {
      var T = hist.length - 1, o = [];
      for (var j = 0; j < h; j++) {
        var hh = j + 1;
        var lag = m * Math.ceil(hh / m);
        var idx = T + hh - lag;
        o.push(idx >= 0 ? hist[idx] : hist[0]);
      }
      return o;
    }
    function driftNaive(hist, h) {
      var last = hist[hist.length - 1];
      var sl = hist.length > 1 ? (hist[hist.length - 1] - hist[0]) / (hist.length - 1) : 0;
      var o = []; for (var j = 0; j < h; j++) o.push(last + (j + 1) * sl); return o;
    }
    function hwAdditive(hist, h, alpha, beta, gamma) {
      var len = hist.length;
      if (m <= 1 || len < 2 * m) return null;
      var l = 0, tr = 0, s = [];
      for (var i = 0; i < m; i++) { s.push(hist[i]); l += hist[i]; }
      l /= m;
      tr = (hist[m] - hist[0]) / m;
      for (var t = 1; t < len; t++) {
        var ph = t % m, prev = l;
        l = alpha * (hist[t] - s[ph]) + (1 - alpha) * (l + tr);
        tr = beta * (l - prev) + (1 - beta) * tr;
        s[ph] = gamma * (hist[t] - l) + (1 - gamma) * s[ph];
      }
      var o = [];
      for (var j = 0; j < h; j++) o.push(l + (j + 1) * tr + s[(len + j) % m]);
      return o;
    }

    var members = [];
    var hw = hwAdditive(history, horizon, 0.3, 0.05, 0.3);
    if (hw) members.push(hw);
    members.push(holt(history, 0.3, 0.1, horizon));
    members.push(ses(history, 0.3, horizon));
    members.push(seasNaive(history, horizon));
    members.push(driftNaive(history, horizon));

    var out = [];
    for (var h = 0; h < horizon; h++) {
      var col = [];
      for (var c = 0; c < members.length; c++) col.push(members[c][h]);
      col.sort(function (u, v) { return u - v; });
      var mid = col.length >> 1;
      out.push(col.length % 2 ? col[mid] : (col[mid - 1] + col[mid]) / 2);
    }
    return out;
  }

  /**
   * P16 分位数备货带：季节朴素（典型日曲线）+ 残差经验 95 分位上沿。
   * 点预测冠军（季节朴素）只是残差的中位数；容量规划需要分布的上沿。
   */
  function solQuantileBand(history, horizon, ctx) {
    var m = ctx.season > 1 ? ctx.season : 24;
    var TAU = 0.95;
    var WIN = 360;
    var n = history.length;
    var res = [];
    for (var i = m; i < n; i++) res.push(history[i] - history[i - m]);   // 一步季节朴素残差
    var src = res.length > WIN ? res.slice(res.length - WIN) : res;
    var a = src.slice().sort(function (x, y) { return x - y; });
    var pos = TAU * (a.length - 1);
    var lo = Math.floor(pos);
    var hi = Math.ceil(pos);
    var q = lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (pos - lo);   // 线性插值经验分位数
    var out = [];
    for (var h = 0; h < horizon; h++) out.push(history[n - m + h] + q);  // 典型日曲线 + 安全余量
    return out;
  }

  /**
   * P17 促销协变量：先估促销倍数，再「清洗历史 + 修正未来」。
   * 两步缺一不可：
   *   - 不清洗历史 → lag-7 基线会取到历史促销日，未来对应相位被整体抬高；
   *   - 不修正未来 → 两个促销日被当成普通日子，各低估约 60%。
   */
  function solPromoCovariate(history, horizon, ctx) {
    var m = ctx.season > 1 ? ctx.season : 7;
    var n = history.length;
    var days = ctx.promoDays || [];
    // 1) 促销倍数：历史促销日 / 同 weekday 的前一周，取中位数抗噪
    var ratios = [];
    for (var i = 0; i < days.length; i++) {
      var d = days[i];
      if (d >= m && d < n && history[d - m] > 0) ratios.push(history[d] / history[d - m]);
    }
    var mult = 1;
    if (ratios.length) {
      ratios.sort(function (a, b) { return a - b; });
      mult = ratios[Math.floor(ratios.length / 2)];
    }
    // 2) 清洗历史：把促销日还原成「非促销水平」，避免污染季节基线
    var clean = history.slice();
    for (i = 0; i < days.length; i++) {
      if (days[i] < n) clean[days[i]] = history[days[i]] / mult;
    }
    // 3) 季节朴素（周期 m，多步取模）
    var out = [];
    for (var h = 0; h < horizon; h++) out.push(clean[n - m + (h % m)]);
    // 4) 修正未来：落在 horizon 内的促销日乘回倍数
    for (i = 0; i < days.length; i++) {
      var f = days[i] - n;
      if (f >= 0 && f < horizon) out[f] *= mult;
    }
    return out;
  }

  /**
   * P15 DLinear：趋势 / 季节分解，两条分支各做一次线性映射。
   * 论文里那两层是训练出来的，这里用最小二乘在历史窗口上拟合等价映射。
   */
  function solDLinear(history, horizon, ctx) {
    var n = history.length;
    var m = (ctx && ctx.season > 1) ? ctx.season : 1;
    var L = Math.min(2 * m, n);
    var i, j;

    /** 列主元高斯消元解 A x = b。 */
    function gauss(A, rhs) {
      var nc = rhs.length;
      var M = [], v = [];
      for (i = 0; i < nc; i++) { M.push(A[i].slice()); v.push(rhs[i]); }
      for (var col = 0; col < nc; col++) {
        var piv = col;
        for (var r = col + 1; r < nc; r++) {
          if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
        }
        if (piv !== col) {
          var t1 = M[piv]; M[piv] = M[col]; M[col] = t1;
          var t2 = v[piv]; v[piv] = v[col]; v[col] = t2;
        }
        var dd = M[col][col];
        if (Math.abs(dd) < 1e-14) continue;
        for (var r2 = col + 1; r2 < nc; r2++) {
          var f = M[r2][col] / dd;
          if (f === 0) continue;
          for (var c = col; c < nc; c++) M[r2][c] -= f * M[col][c];
          v[r2] -= f * v[col];
        }
      }
      var xs = new Array(nc).fill(0);
      for (var r3 = nc - 1; r3 >= 0; r3--) {
        var s = v[r3];
        for (var c2 = r3 + 1; c2 < nc; c2++) s -= M[r3][c2] * xs[c2];
        xs[r3] = Math.abs(M[r3][r3]) < 1e-14 ? 0 : s / M[r3][r3];
      }
      return xs;
    }

    /**
     * 拟合「长度为 Lv 的窗口 → 未来 hz 步」的线性映射（ridge 正则的最小二乘）。
     * @returns {Array|null} W[k] 是第 k 步的权重向量；样本不足时返回 null
     */
    function fitMap(seq, Lv, hz) {
      var rows = seq.length - Lv - hz + 1;
      if (rows < Lv + 2) return null;
      var A = [], B = [];
      for (i = 0; i < Lv; i++) { A.push(new Array(Lv).fill(0)); B.push(new Array(hz).fill(0)); }
      for (var r = 0; r < rows; r++) {
        var x = seq.slice(r, r + Lv);
        var y = seq.slice(r + Lv, r + Lv + hz);
        for (var p1 = 0; p1 < Lv; p1++) {
          for (var p2 = 0; p2 < Lv; p2++) A[p1][p2] += x[p1] * x[p2];
          for (var c = 0; c < hz; c++) B[p1][c] += x[p1] * y[c];
        }
      }
      for (var q = 0; q < Lv; q++) A[q][q] += 1e-6;
      var W = [];
      for (var k = 0; k < hz; k++) {
        var col = [];
        for (var q2 = 0; q2 < Lv; q2++) col.push(B[q2][k]);
        W.push(gauss(A, col));
      }
      return W;
    }

    // 1) 趋势 = 居中移动平均（窗口 2m+1，边界用可用点）
    var ww = 2 * m + 1;
    var trend = [];
    for (i = 0; i < n; i++) {
      var lo = Math.max(0, i - m), hi = Math.min(n - 1, i + m);
      var s = 0;
      for (j = lo; j <= hi; j++) s += history[j];
      trend.push(s / (hi - lo + 1));
    }
    // 2) 季节 = 残差
    var seas = [];
    for (i = 0; i < n; i++) seas.push(history[i] - trend[i]);

    var Wt = fitMap(trend, L, horizon);
    var Ws = fitMap(seas, L, horizon);
    if (!Wt || !Ws) {
      // 样本不足以拟合映射：退化为「重复最后一个观测值」，至少不会崩
      var fb = [];
      for (var h = 0; h < horizon; h++) fb.push(history[n - 1]);
      return fb;
    }

    var lastT = trend.slice(n - L);
    var lastS = seas.slice(n - L);
    var out = [];
    for (var h2 = 0; h2 < horizon; h2++) {
      var vt = 0, vs = 0;
      for (var q3 = 0; q3 < L; q3++) { vt += Wt[h2][q3] * lastT[q3]; vs += Ws[h2][q3] * lastS[q3]; }
      out.push(vt + vs);
    }
    return out;
  }

  /**
   * 把参考解函数转成用户可见的代码字符串（函数名统一改成 predict）。
   * @param {Function} fn 参考解函数
   * @returns {string}
   */
  function toPredictSource(fn) {
    return String(fn).replace(/^function\s+[A-Za-z0-9_$]+/, 'function predict');
  }

  /* ================================================================== *
   * 1. 题面公共片段
   * ================================================================== */

  var SIGNATURE_MD = [
    '```js',
    'function predict(history, horizon, ctx) {',

  ].join('\n');

  var problems = [

    {

      if (/^```/.test(line)) {
        if (inCode) {
          html.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
          codeBuf = [];
          inCode = false;
        } else {
          flushPara(); flushList();
          inCode = true;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }

      if (!line.trim()) { flushPara(); flushList(); continue; }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        flushPara(); flushList();
        var level = h[1].length + 1; // 页面里已有 H1，正文从 H2 起
        html.push('<h' + level + '>' + inline(h[2], ctx) + '</h' + level + '>');
        continue;
      }

      if (/^&gt;|^>/.test(line)) {
        flushPara(); flushList();
        html.push('<blockquote>' + inline(line.replace(/^>\s?/, ''), ctx) + '</blockquote>');
        continue;
      }

      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ul) {
        flushPara();
        if (listType !== 'ul') { flushList(); html.push('<ul>'); listType = 'ul'; }
        html.push('<li>' + inline(ul[1], ctx) + '</li>');
        continue;
      }

      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        flushPara();
        if (listType !== 'ol') { flushList(); html.push('<ol>'); listType = 'ol'; }
        html.push('<li>' + inline(ol[1], ctx) + '</li>');
        continue;
      }

      para.push(line);
    }

    if (inCode) html.push('<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>');
    flushPara(); flushList();
    return html.join('\n');
  }

  function renderCourseBody(c) {
    var html = renderMarkdown(c.body, { formulas: formulaIndexFor(c) });
    // 公式统一在正文后集中展示，避免课程作者忘记写 [[formula:id]] 占位符
    if (c.formulas && c.formulas.length) {
      html += '<div class="course-panel"><h3>关键公式与数值小例</h3>' +
        c.formulas.map(formulaHtml).join('') + '</div>';
    }
    return html;
  }

  function referenceListHtml(ids) {
    var refs = referencesFor(ids);
    if (!refs.length) return '<div class="ds-empty"><strong>暂无引用</strong><span>该内容未声明外部来源。</span></div>';
    var items = refs.map(function (r) {
      return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' +
        esc(r.title) + '</a> · ' + esc(r.authors) + ' · ' + esc(r.year) + ' · ' + esc(r.venue) +
        ' · 核查于 ' + esc(r.checkedAt) + '</li>';
    });
    return '<ul class="course-refs">' + items.join('') + '</ul>';
  }

  /* ---------- 完整性校验 ---------- */
  function validate() {
    var errors = [];

    if (courses.length !== 9) errors.push('课程模块应为 9 个（m0 零基础第一课 + m1-m8），实际 ' + courses.length);

    var ids = {};
    courses.forEach(function (c) {
      if (!c.id) errors.push('存在没有 id 的课程');
      if (ids[c.id]) errors.push('课程 id 重复：' + c.id);
      ids[c.id] = true;
      if (!c.title) errors.push(c.id + ' 缺少 title');
      if (!c.summary || c.summary.length < 10) errors.push(c.id + ' summary 过短');
      if (!c.body || c.body.length < 300) errors.push(c.id + ' 正文过短，不足以构成一个模块');
      if (!Array.isArray(c.topics) || c.topics.length < 3) errors.push(c.id + ' 核心主题少于 3 个');
      (c.formulas || []).forEach(function (f) {
        if (!f.id || !f.text || !f.variables || !f.example) {
          errors.push(c.id + ' 公式字段不完整：' + (f && f.id));
        }
      });
      if (!c.demo || !c.demo.id) errors.push(c.id + ' 缺少演示');
      if (!c.exercise || !c.exercise.output) errors.push(c.id + ' 缺少练习产出');
      (c.exercise && c.exercise.problemIds || []).forEach(function (pid) {
        if (!TSJ.findProblem || !TSJ.findProblem(pid)) errors.push(c.id + ' 练习引用了不存在的题目：' + pid);
      });
      (c.referenceIds || []).forEach(function (rid) {
        if (!refIndex[rid]) errors.push(c.id + ' 引用了不存在的来源：' + rid);
      });
      // 正文里的 [[term:]]（含 [[term:id|别名]] 写法）必须指向真实术语（防手滑拼错 id）
      String(c.body || '').replace(/\[\[term:([a-z0-9-]+)(?:\|[^\]]*)?\]\]/gi, function (_, id) {
        if (!termIndexOf(id)) errors.push(c.id + ' 引用了不存在的术语：' + id);
        return _;
      });
      (c.prereq || []).forEach(function (p) {
        if (!courseIndex[p]) errors.push(c.id + ' 先修不存在：' + p);
      });
    });

    // 先修无环
    courses.forEach(function (c) { visit(c.id, [], errors); });
    function visit(id, stack, errs) {
      if (stack.indexOf(id) >= 0) { errs.push('课程先修存在环：' + stack.concat(id).join(' -> ')); return; }
      var c = courseIndex[id];
      if (!c) return;
      (c.prereq || []).forEach(function (p) { visit(p, stack.concat(id), errs); });
    }

    // 方法详情必须覆盖所有方法卡，且引用/级别合法
    var methodIds = methods.map(function (m) { return m.id; });
    methodIds.forEach(function (id) {
      var d = methodDetails[id];
      if (!d) { errors.push('方法缺少详情：' + id); return; }
      if (!VALID_RUN_LEVEL[d.runLevel]) errors.push(id + ' runLevel 非法：' + d.runLevel);
      if (!d.intuition || d.intuition.length < 10) errors.push(id + ' 直觉描述过短');
      if (!Array.isArray(d.assumptions) || !d.assumptions.length) errors.push(id + ' 缺少假设');
      if (!Array.isArray(d.limitations) || !d.limitations.length) errors.push(id + ' 缺少局限');
      if (!d.workedExample) errors.push(id + ' 缺少数值小例');
      if (!d.counterexample) errors.push(id + ' 缺少反例');
      (d.referenceIds || []).forEach(function (rid) {
        if (!refIndex[rid]) errors.push(id + ' 引用了不存在的来源：' + rid);
      });
      var m = methodIndex[id];
      if (m && m.runnable === false && d.runLevel === 'sandbox') {
        errors.push(id + ' 方法卡标注不可运行，详情却标为 sandbox');
      }
    });

    Object.keys(methodDetails).forEach(function (id) {
      if (!methodIndex[id]) errors.push('方法详情指向不存在的方法卡：' + id);
    });

    // 引用表自身
    var seen = {};
    references.forEach(function (r) {
      if (!r.id || seen[r.id]) errors.push('引用 id 缺失或重复：' + r.id);
      seen[r.id] = true;
      if (!/^https:\/\//.test(r.url || '')) errors.push(r.id + ' URL 必须为 https');
      if (!r.checkedAt) errors.push(r.id + ' 缺少核查日期');
    });

    return errors;
  }

  TSJ.content = {
    esc: esc,
    courses: courses,
    course: course,
    nextCourse: nextCourse,
    prevCourse: prevCourse,
    methodDetail: methodDetail,
    referencesFor: referencesFor,
    renderMarkdown: renderMarkdown,
    renderCourseBody: renderCourseBody,
    referenceListHtml: referenceListHtml,
    validate: validate
  };
})(typeof window !== 'undefined' ? window : this);

</script>

<script>

 * judge.js —— 判题引擎
 *
 * 结构：
 *   metrics   评估指标（mse / rmse / mae / mape / smape / pinball）
 *   baselines 统计基线（naive / seasonal_naive / mean / linear_trend / moving_average）
 *   scoring   由「误差比」映射到 0~100 分（分段线性、单调、平滑）
 *   sandbox   Web Worker（Blob URL）沙箱执行用户代码，单次 1500ms / 整题 8000ms
 *   evaluate  异步判题（浏览器走 Worker；**无 Worker 环境一律拒绝执行**，不降级到主线程）
 *   evaluateSync 同步判题（只用于可信代码，例如参考解、排行榜计算）
 *
 * 挂载点：window.TSJ.judge = { evaluate, evaluateSync, metrics, baselines, runSandbox, ... }
 * 纯逻辑部分不依赖浏览器 API，可被 Node 直接 require 做单元测试。
 */

  'use strict';

  /** 数值保护阈值 */
  var EPS = 1e-12;
  /** 沙箱时限（毫秒） */
  var LIMITS = { perJob: 1500, total: 8000 };

  /* ================================================================== *
   * 0. 小工具
   * ================================================================== */

  /**
   * 把数值夹在区间内。
   * @param {number} v 值
   * @param {number} lo 下界
   * @param {number} hi 上界
   * @returns {number}
   */
  function clamp(v, lo, hi) {
    if (!isFinite(v)) return lo;
    if (v < lo) return lo;
    if (v > hi) return hi;
    return v;
  }

  /**
   * 取数组均值（空数组返回 NaN）。
   * @param {number[]} arr
   * @returns {number}
   */
  function meanOf(arr) {
    if (!arr || arr.length === 0) return NaN;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  /* ================================================================== *
   * 1. 指标
   * ================================================================== */

  /**
   * 各指标函数签名统一为 fn(actual, predicted) => number（越小越好）。
   * 长度不一致时按较短长度截断计算；空数组返回 NaN。
   */
  var metrics = {
    /** 均方误差 */
    mse: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) {
        var d = actual[i] - predicted[i];
        s += d * d;
      }
      return s / n;
    },

    /** 均方根误差 */
    rmse: function (actual, predicted) {
      var m = metrics.mse(actual, predicted);
      return isFinite(m) ? Math.sqrt(m) : NaN;
    },

    /** 平均绝对误差 */
    mae: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) s += Math.abs(actual[i] - predicted[i]);
      return s / n;
    },

    /**
     * 平均绝对百分比误差（%）。
     * 对 0 值保护：|actual| < EPS（1e-12）的样本**跳过**，且不计入分母；
     * 若全部样本都被跳过则返回 0（而不是 NaN）。
     */
    mape: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0, cnt = 0;
      for (var i = 0; i < n; i++) {
        var a = actual[i];
        if (Math.abs(a) < EPS) continue;
        s += Math.abs((a - predicted[i]) / a);
        cnt++;
      }
      if (cnt === 0) return 0;
      return (s / cnt) * 100;
    },

    /**
     * 对称平均绝对百分比误差（%）。
     * 分母 |a| + |p| < EPS（1e-12）的样本**跳过**：贡献 0 误差，
     * 但**仍计入 n**（即按「该点误差为 0」处理），与 mape 的「跳过且不计入分母」口径不同。
     */
    smape: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) {
        var a = actual[i];
        var p = predicted[i];
        var denom = Math.abs(a) + Math.abs(p);
        if (denom < EPS) continue;
        s += (2 * Math.abs(a - p)) / denom;
      }
      return (s / n) * 100;
    },

    /**
     * Pinball 损失（τ=0.95 分位数备货，P16 专用）。
     * predicted 数组在这里的语义是「每一步的 95 分位备货水平」而非点预测：
     * 实际 ≥ 预测（缺货）罚 τ=0.95 倍缺口；实际 < 预测（过量）只罚 0.05 倍冗余。
     * τ 固化在指标里（指标签名 fn(actual, predicted) 无第三参），题面同步声明 95 分位。
     */
    pinball: function (actual, predicted) {
      var TAU = 0.95;
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) {
        var d = actual[i] - predicted[i];
        s += d >= 0 ? TAU * d : (TAU - 1) * d;
      }
      return s / n;
    }
  };

  /** 指标中文名，UI 展示用 */
  var metricLabels = {
    mse: 'MSE',
    rmse: 'RMSE',
    mae: 'MAE',
    mape: 'MAPE(%)',
    smape: 'sMAPE(%)',
    pinball: 'Pinball(τ=0.95)'
  };

  /* ================================================================== *
   * 2. 统计基线
   * ================================================================== */

  /**
   * 各基线签名统一为 fn(history, horizon, ctx) => number[horizon]。
   * ctx = { freq, season, datasetId, index }
   */
  var baselines = {
    /** 朴素法：把最后一个观测值重复 horizon 次 */
    naive: function (history, horizon) {
      var last = history[history.length - 1];
      var out = new Array(horizon);
      for (var i = 0; i < horizon; i++) out[i] = last;
      return out;
    },

    /** 季节朴素法：重复上一个完整季节 */
    seasonal_naive: function (history, horizon, ctx) {
      var n = history.length;
      var m = (ctx && ctx.season > 1) ? ctx.season : 12;
      var out = new Array(horizon);
      if (m >= n) {
        // 历史长度不足一个季节，退化为朴素法
        return baselines.naive(history, horizon);
      }
      for (var h = 0; h < horizon; h++) {
        var idx = n - m + (h % m);
        out[h] = history[clamp(idx, 0, n - 1)];
      }
      return out;
    },

    /** 历史均值 */
    mean: function (history, horizon) {
      var avg = meanOf(history);
      var out = new Array(horizon);
      for (var i = 0; i < horizon; i++) out[i] = avg;
      return out;
    },

    /** 全局最小二乘直线外推 */
    linear_trend: function (history, horizon) {
      var n = history.length;
      var out = new Array(horizon);
      if (n < 2) return baselines.naive(history, horizon);
      var sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (var i = 0; i < n; i++) {
        sx += i;
        sy += history[i];
        sxx += i * i;
        sxy += i * history[i];
      }
      var denom = n * sxx - sx * sx;
      var slope = Math.abs(denom) < EPS ? 0 : (n * sxy - sx * sy) / denom;
      var intercept = (sy - slope * sx) / n;
      for (var h = 1; h <= horizon; h++) out[h - 1] = intercept + slope * (n - 1 + h);
      return out;
    },

    /** 移动平均（窗口 = 季节长度，退化为 6） */
    moving_average: function (history, horizon, ctx) {
      var n = history.length;
      var want = (ctx && ctx.season > 1) ? ctx.season : 6;
      var k = Math.max(2, Math.min(want, n));
      var sum = 0;
      for (var i = n - k; i < n; i++) sum += history[i];
      var avg = sum / k;
      var out = new Array(horizon);
      for (var h = 0; h < horizon; h++) out[h] = avg;
      return out;
    }
  };

  /** 基线中文名，UI 展示用 */
  var baselineLabels = {
    naive: '朴素法 naive',
    seasonal_naive: '季节朴素 seasonal_naive',
    mean: '历史均值 mean',
    linear_trend: '线性趋势 linear_trend',
    moving_average: '移动平均 moving_average'
  };

  /* ================================================================== *
   * 3. 评分公式
   * ================================================================== */

  /**
   * 由误差比映射得分。ratio = 你的误差 / 最优基线误差（越小越好）。
   *
   * 分段线性，严格单调不增：
   *   ① ratio <= 0.50             → 100 分（比最优基线好一倍，直接满分）
   *   ② 0.50 < ratio <= threshold → 从 100 线性降到 passScore（ratio = threshold 时恰好 = passScore）
   *   ③ threshold < ratio < 2.00  → 从 passScore 线性降到 0
   *   ④ ratio >= 2.00             → 0 分
   *
   * 分支优先级（重要）：① → ④ → ② → ③。
   * 「ratio >= 2 → 0 分」必须在「ratio <= threshold」之前判定，否则 threshold > 2 时
   * 会先命中 ② 而拿到 60 分以上，违反 ④。为此 threshold 被夹在 [0.51, 2]：
   *  - 下界 0.51 保证 ② 区间非退化；
   *  - 上界 2 与 ④ 自洽（threshold >= 2 时 ratio = threshold 由 ④ 判 0 分，④ 优先）。
   *
   * @param {number} ratio 误差比
   * @param {number} threshold 通过阈值（必须打败最优基线的倍数，越小越严）
   * @param {number} passScore 通过分数线
   * @returns {number} 0..100 的整数分
   */
  function scoreForRatio(ratio, threshold, passScore) {
    if (!isFinite(ratio)) return 0;
    var r = ratio < 0 ? 0 : ratio;
    var pass = clamp(Number(passScore) || 60, 1, 100);
    var FULL = 0.5;
    var ZERO = 2.0;
    var thr = clamp(Number(threshold) || 1, 0.51, ZERO);

    if (r <= FULL) return 100;
    if (r >= ZERO) return 0;            // ④ 必须先判，否则 thr > 2 时会被 ② 抢先

    if (r <= thr) {
      var t1 = (r - FULL) / (thr - FULL);
      return clamp(Math.round(100 - t1 * (100 - pass)), pass, 100);
    }

    var t2 = (r - thr) / (ZERO - thr);
    return clamp(Math.round(pass * (1 - t2)), 0, pass);
  }

  /* ================================================================== *
   * 4. 测试点构造（holdout / rolling）
   * ================================================================== */

  /**
   * 构造测试点。
   *  - holdout：训练集 = 前 len-horizon 点，测试集 = 最后 horizon 点（1 个测试点）
   *  - rolling：从 len-horizon-(windows-1)*originStep 开始，滑动 windows 个 origin，
   *             每个 origin 只用该点之前的数据训练，预测之后 horizon 步。
   *
   * @param {number[]} values 完整序列
   * @param {Object} opts { mode, horizon, originStep, windows, season, freq, datasetId }
   * @returns {Array<{history:number[], actual:number[], ctx:Object, index:number}>}
   */
  function buildTestPoints(values, opts) {
    var horizon = opts.horizon;
    var points = [];

    /**
     * 生成单个测试点。
     * @param {number} trainEnd 训练集截止下标（不含）
     * @param {number} index 测试点序号
     */
    function makePoint(trainEnd, index) {
      var ctx = {
        freq: opts.freq || 'M',
        season: opts.season || 1,
        datasetId: opts.datasetId || '',
        index: index
      };
      return {
        history: values.slice(0, trainEnd),
        actual: values.slice(trainEnd, trainEnd + horizon),
        ctx: ctx,
        index: index
      };
    }

    if (opts.mode === 'rolling') {
      var windows = Math.max(1, opts.windows || 1);
      var step = Math.max(1, opts.originStep || horizon);
      var start = values.length - horizon - (windows - 1) * step;
      for (var w = 0; w < windows; w++) {
        var trainEnd = start + w * step;
        if (trainEnd < 4) continue;              // 训练集过短则跳过
        points.push(makePoint(trainEnd, w));
      }
      if (points.length === 0) points.push(makePoint(values.length - horizon, 0));
      return points;
    }

    points.push(makePoint(values.length - horizon, 0));
    return points;
  }

  /* ================================================================== *
   * 5. 单测试点评分
   * ================================================================== */

  /**
   * 对单个测试点评分。
   * @param {Object} point 测试点
   * @param {Object} run 执行结果 { status:'ok'|'error'|'timeout', value, error, line }
   * @param {Object} opts 判题参数
   * @returns {Object} 测试点结果
   */
  function scoreCase(point, run, opts) {
    var metricFn = metrics[opts.metric] || metrics.mse;

    if (!run || run.status !== 'ok') {
      var isTimeout = run && run.status === 'timeout';
      return {
        index: point.index,
        verdict: isTimeout ? 'TLE' : 'RE',
        score: 0,
        yourMetric: NaN,
        bestBaseline: NaN,
        baselineName: '',
        allBaselines: {},
        error: (run && run.error) || '执行失败',
        line: (run && run.line) || null,
        actual: point.actual,
        predictions: null
      };
    }

    var pred = run.value;
    var yourMetric = metricFn(point.actual, pred);

    // 各基线
    var all = {};
    var bestName = '';
    var bestVal = Infinity;
    for (var i = 0; i < opts.baselines.length; i++) {
      var name = opts.baselines[i];
      var fn = baselines[name];
      if (typeof fn !== 'function') continue;
      var bv = metricFn(point.actual, fn(point.history, opts.horizon, point.ctx));
      all[name] = bv;
      if (isFinite(bv) && bv < bestVal) {
        bestVal = bv;
        bestName = name;
      }
    }

    if (!isFinite(yourMetric)) {
      return {
        index: point.index,
        verdict: 'RE',
        score: 0,
        yourMetric: NaN,
        bestBaseline: bestVal,
        baselineName: bestName,
        allBaselines: all,
        error: '你的预测无法计算指标（可能含非法值）',
        line: null,
        actual: point.actual,
        predictions: pred
      };
    }

    // 误差比：最优基线为 0（完美）时做特殊处理
    var ratio;
    if (!isFinite(bestVal)) {
      ratio = 1;
    } else if (bestVal < EPS) {
      ratio = yourMetric < EPS ? 0 : Infinity;
    } else {
      ratio = yourMetric / bestVal;
    }

    var score = scoreForRatio(ratio, opts.threshold, opts.passScore);

    return {
      index: point.index,
      verdict: score >= opts.passScore ? 'AC' : 'WA',
      score: score,
      yourMetric: yourMetric,
      bestBaseline: bestVal,
      baselineName: bestName,
      allBaselines: all,
      ratio: ratio,
      error: null,
      line: null,
      actual: point.actual,
      predictions: pred
    };
  }

  /* ================================================================== *
   * 6. 用户代码执行：同线程（可信代码 / 无 Worker 降级）
   * ================================================================== */

  /**
   * 从错误堆栈里取出「引擎报告的原始行号」。
   * @param {Error} err 错误对象
   * @returns {number|null}
   */
  function rawLineOf(err) {
    var stack = String((err && err.stack) || '');
    var m = /<anonymous>:(\d+):(\d+)/.exec(stack);
    if (m) return parseInt(m[1], 10);
    m = /:(\d+):(\d+)/.exec(stack);
    if (m) {
      var line = parseInt(m[1], 10);
      if (line > 0) return line;
    }
    return null;
  }

  /**
   * 探测「函数体第 1 行」在堆栈里被报告成第几行。
   * 不同引擎对 new Function 生成代码的包裹方式不同（V8 是 3 行头部，SpiderMonkey 是 1 行），
   * 因此用一段已知在第 1 行抛错的探针代码实测，得到偏移量。
   * @returns {number} 偏移量（用户行号 = 原始行号 - 偏移）
   */
  var LINE_OFFSET = (function detectOffset() {
    try {
      /* eslint-disable no-new-func */
      var probe = new Function('', 'throw new Error("probe");');
      probe();
    } catch (e) {
      var reported = rawLineOf(e);
      if (reported && reported > 1) return reported - 1;
    }
    return 0;
  })();

  /**
   * 把引擎行号映射回用户代码行号。
   * @param {Error} err 错误对象
   * @returns {number|null} 用户代码行号（1 基）
   */
  function parseLine(err) {
    var raw = rawLineOf(err);
    if (raw === null) return null;
    var line = raw - LINE_OFFSET;
    return line > 0 ? line : null;
  }

  /**
   * 校验 predict 的返回值。
   * @param {*} out 用户返回值
   * @param {number} horizon 期望长度
   * @returns {{value?: number[], error?: string}}
   */
  function validateOutput(out, horizon) {
    if (out === null || out === undefined) {
      return { error: 'predict 返回了 ' + String(out) + '，应返回长度为 ' + horizon + ' 的数组' };
    }
    var len = out.length;
    if (typeof len !== 'number' || len !== horizon) {
      return { error: '返回数组长度必须为 ' + horizon + '，实际为 ' + String(len) };
    }
    var arr = new Array(horizon);
    for (var i = 0; i < horizon; i++) {
      var v = out[i];
      if (typeof v !== 'number' || !isFinite(v)) {
        return { error: '第 ' + (i + 1) + ' 个预测值不是有限数值（NaN / Infinity / 非数字）' };
      }
      arr[i] = v;
    }
    return { value: arr };
  }

  /**
   * 把用户代码编译成可调用函数。
   * @param {string} code 用户代码
   * @returns {{fn?: Function, error?: string, line?: number|null}}
   */
  function compile(code) {
    try {
      /* eslint-disable no-new-func */
      var fn = new Function(
        'history',
        'horizon',
        'ctx',
        String(code) + '\n;return predict(history, horizon, ctx);'
      );
      return { fn: fn };
    } catch (err) {
      // 语法错误时堆栈指向 worker 自身，无法映射到用户行号，故 line 置空
      return {
        error: '语法错误：' + ((err && err.message) || String(err)),
        line: null
      };
    }
  }

  /**
   * 同线程执行全部测试点（不使用 Worker）。
   * 仅用于：① 可信代码（参考解 / 排行榜）；② 环境禁用 Worker 时的降级。
   * @param {string} code 用户代码
   * @param {Array} jobs [{history, horizon, ctx}]
   * @returns {{results: Array, timedOut: boolean, degraded?: boolean}}
   */
  function runInProcess(code, jobs) {
    var compiled = compile(code);
    var results = [];

    if (compiled.error) {
      for (var k = 0; k < jobs.length; k++) {
        results.push({ status: 'error', error: compiled.error, line: compiled.line });
      }
      return { results: results, timedOut: false };
    }

    for (var i = 0; i < jobs.length; i++) {
      var job = jobs[i];
      try {
        var out = compiled.fn(job.history.slice(), job.horizon, job.ctx);
        var checked = validateOutput(out, job.horizon);
        if (checked.error) {
          results.push({ status: 'error', error: checked.error, line: null });
        } else {
          results.push({ status: 'ok', value: checked.value });
        }
      } catch (err) {
        results.push({
          status: 'error',
          error: (err && err.message) || String(err),
          line: parseLine(err)
        });
      }
    }
    return { results: results, timedOut: false };
  }

  /* ================================================================== *
   * 7. Web Worker 沙箱
   * ================================================================== */

  /**
   * Worker 源码。必须用 Blob URL 创建，因为 file:// 下无法加载独立 worker 文件。
   *
   * 沙箱策略（三层，缺一不可）：
   *   1. **能力遮蔽**：fetch / XMLHttpRequest / importScripts / WebSocket / Worker /
   *      postMessage / self / globalThis / window / document / localStorage / location ...
   *      在「全局对象 + 整条原型链」上被改写成「读取即抛错」的访问器，
   *      且 configurable:false / writable:false —— `delete` 与重新赋值都不再能恢复；
   *   2. **代码执行面收窄**：全局 Function / eval 换成抛错桩，Function.prototype.constructor
   *      同样封死（否则 `(function(){}).constructor` 就能拿回真正的 Function）；
   *      setTimeout / setInterval 只接受函数参数，字符串形式直接拒绝；
   *   3. **冻结**：globalThis 与整条原型链 Object.freeze，杜绝事后往原型上挂钩子。
   *
   * 另外 index.html 的 CSP（connect-src 'none' / script-src 不含 http）在网络层再兜一层：
   * 即便 JS 层出现未知逃逸，请求也发不出去。
   *
   * 用户代码通过 new Function 执行，函数体首行即用户代码第 1 行，便于行号映射；
   * 返回值的长度与有限性在 worker 内校验，错误信息回传主线程。
   *
   * 注意：这里只做「隔离执行环境」，**不是**安全边界（同一台机器上的恶意代码仍可能通过
   * 侧信道推断信息）。README 里有明确口径。
   */
  var WORKER_SOURCE = [
    '(function () {',
    '  "use strict";',
    '  var __global = self;',
    '  var __post = __global.postMessage.bind(__global);',
    '  var __Function = Function;',
    '  var __Error = Error;',
    '  var __String = String;',
    '  var __isFinite = isFinite;',
    '  var __now = Date.now;',
    '  var __define = Object.defineProperty;',
    '  var __getProto = Object.getPrototypeOf;',
    '  var __freeze = Object.freeze;',
    '  var __hasOwn = Object.prototype.hasOwnProperty;',
    '  var __realTimeout = (typeof setTimeout === "function") ? setTimeout : null;',
    '  var __realInterval = (typeof setInterval === "function") ? setInterval : null;',
    '  function __rawLineOf(err) {',
    '    var stack = __String((err && err.stack) || "");',
    '    var m = /<anonymous>:(\\d+):(\\d+)/.exec(stack);',
    '    if (m) return parseInt(m[1], 10);',
    '    m = /:(\\d+):(\\d+)/.exec(stack);',
    '    return m ? parseInt(m[1], 10) : null;',
    '  }',
    '  // 探测「函数体第 1 行」在堆栈中的偏移（不同引擎不同）——必须在封 Function 之前完成',
    '  var __lineOffset = (function () {',
    '    try {',
    '      var p = new __Function("", "throw new Error(\\"probe\\");");',
    '      p();',
    '    } catch (e) {',
    '      var r = __rawLineOf(e);',
    '      if (r && r > 1) return r - 1;',
    '    }',
    '    return 0;',
    '  })();',
    '  /* ---------- 第 1 层：能力遮蔽（全局 + 原型链） ---------- */',
    '  var __DENY = [',
    '    "fetch", "XMLHttpRequest", "importScripts", "WebSocket", "EventSource",',
    '    "Worker", "SharedWorker", "postMessage", "close", "self", "globalThis",',
    '    "window", "document", "localStorage", "sessionStorage", "indexedDB",',
    '    "navigator", "location", "history", "alert", "open", "parent", "top", "frames",',
    '    "caches", "BroadcastChannel", "WebTransport", "RTCPeerConnection"',
    '  ];',
    '  function __denyGetter(name) {',
    '    return function () { throw new __Error("沙箱限制：禁止访问 " + name); };',
    '  }',
    '  var __targets = [__global];',
    '  (function () {',
    '    var proto = __getProto(__global);',
    '    var guard = 0;',
    '    while (proto && guard < 12) {',
    '      __targets.push(proto);',
    '      proto = __getProto(proto);',
    '      guard++;',
    '    }',
    '  })();',
    '  function __sealName(target, name, force) {',
    '    var own = false;',
    '    try { own = __hasOwn.call(target, name); } catch (e) { own = false; }',
    '    if (!own && !force) return;',
    '    try {',
    '      __define(target, name, {',
    '        configurable: false,',
    '        enumerable: false,',
    '        get: __denyGetter(name),',
    '        set: __denyGetter(name)',
    '      });',
    '    } catch (e) {',
    '      try { target[name] = undefined; } catch (e2) {}',
    '    }',
    '  }',
    '  for (var __t = 0; __t < __targets.length; __t++) {',
    '    for (var __d = 0; __d < __DENY.length; __d++) {',
    '      __sealName(__targets[__t], __DENY[__d], __t === 0);',
    '    }',
    '  }',
    '  /* ---------- 第 2 层：代码执行面（Function / eval / 字符串定时器） ---------- */',
    '  function __lockValue(target, name, value) {',
    '    try {',
    '      __define(target, name, {',
    '        configurable: false,',
    '        writable: false,',
    '        enumerable: false,',
    '        value: value',
    '      });',
    '    } catch (e) {',
    '      try { target[name] = value; } catch (e2) {}',
    '    }',
    '  }',
    '  function __blockedCtor() { throw new __Error("沙箱限制：禁止使用 Function 构造器"); }',
    '  function __blockedEval() { throw new __Error("沙箱限制：禁止使用 eval"); }',
    '  __lockValue(__global, "Function", __blockedCtor);',
    '  __lockValue(__global, "eval", __blockedEval);',
    '  try {',
    '    __define(__Function.prototype, "constructor", {',
    '      configurable: false,',
    '      writable: false,',
    '      enumerable: false,',
    '      value: __blockedCtor',
    '    });',
    '  } catch (e) {}',
    '  function __timerGuard(name, real) {',
    '    return function (fn, ms) {',
    '      if (typeof fn === "string") {',
    '        throw new __Error("沙箱限制：禁止以字符串形式调用 " + name);',
    '      }',
    '      if (!real) throw new __Error("沙箱限制：当前环境不支持 " + name);',
    '      var args = [fn, ms];',
    '      for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);',
    '      return real.apply(__global, args);',
    '    };',
    '  }',
    '  __lockValue(__global, "setTimeout", __timerGuard("setTimeout", __realTimeout));',
    '  __lockValue(__global, "setInterval", __timerGuard("setInterval", __realInterval));',
    '  /* ---------- 执行与回传 ---------- */',
    '  function __lineOf(err) {',
    '    var raw = __rawLineOf(err);',
    '    if (raw === null) return null;',
    '    var l = raw - __lineOffset;',
    '    return l > 0 ? l : null;',
    '  }',
    '  function __validate(out, horizon) {',
    '    if (out === null || out === undefined) {',
    '      return { error: "predict 返回了 " + __String(out) + "，应返回长度为 " + horizon + " 的数组" };',
    '    }',
    '    var len = out.length;',
    '    if (typeof len !== "number" || len !== horizon) {',
    '      return { error: "返回数组长度必须为 " + horizon + "，实际为 " + __String(len) };',
    '    }',
    '    var arr = new Array(horizon);',
    '    for (var i = 0; i < horizon; i++) {',
    '      var v = out[i];',
    '      if (typeof v !== "number" || !__isFinite(v)) {',
    '        return { error: "第 " + (i + 1) + " 个预测值不是有限数值（NaN / Infinity / 非数字）" };',
    '      }',
    '      arr[i] = v;',
    '    }',
    '    return { value: arr };',
    '  }',
    '  __global.onmessage = function (ev) {',
    '    var job = ev.data || {};',
    '    var t0 = __now();',
    '    var fn;',
    '    try {',
    '      fn = new __Function("history", "horizon", "ctx",',
    '        __String(job.code) + "\\n;return predict(history, horizon, ctx);");',
    '    } catch (syntaxErr) {',
    '      __post({',
    '        id: job.id,',
    '        status: "error",',
    '        error: "语法错误：" + ((syntaxErr && syntaxErr.message) ? syntaxErr.message : __String(syntaxErr)),',
    '        line: null',
    '      });',
    '      return;',
    '    }',
    '    try {',
    '      var out = fn(job.history, job.horizon, job.ctx);',
    '      var checked = __validate(out, job.horizon);',
    '      if (checked.error) {',
    '        __post({ id: job.id, status: "error", error: checked.error, line: null });',
    '      } else {',
    '        __post({ id: job.id, status: "ok", value: checked.value, ms: __now() - t0 });',
    '      }',
    '    } catch (err) {',
    '      __post({',
    '        id: job.id,',
    '        status: "error",',
    '        error: (err && err.message) ? err.message : __String(err),',
    '        line: __lineOf(err)',
    '      });',
    '    }',
    '  };',
    '  /* ---------- 第 3 层：冻结全局与整条原型链（必须放在 onmessage 之后） ---------- */',
    '  for (var __f = 0; __f < __targets.length; __f++) {',
    '    try { __freeze(__targets[__f]); } catch (e) {}',
    '  }',
    '})();'
  ].join('\n');

  /**
   * 当前环境能否使用 Web Worker 沙箱。
   * UI 用它决定是否允许提交（不能沙箱 = 禁止提交，避免死循环锁死界面）。
   * @returns {boolean}
   */
  function canUseSandbox() {
    try {
      return (typeof Worker !== 'undefined') &&
        (typeof Blob !== 'undefined') &&
        (typeof URL !== 'undefined') &&
        typeof URL.createObjectURL === 'function';
    } catch (e) {
      return false;
    }
  }

  /** 无沙箱时的拒绝理由（UI 直接展示给用户） */
  var SANDBOX_REFUSED_REASON =
    '当前环境无法创建 Web Worker 沙箱（可能被浏览器安全策略、隐私设置或内核版本限制）。' +
    '为避免死循环卡死页面，已拒绝在页面主线程执行你的代码：请改用最新版 Chrome / Edge 打开，' +
    '或通过 http(s) 方式访问本页面。';

  /**
   * 在 Worker 沙箱中顺序执行全部测试点。
   * 单次执行超时 perJob → 终止 worker 并判 TLE；整题超时 total → 同样判 TLE。
   *
   * 环境不支持 Worker 时**拒绝执行**（返回 refused），不再静默降级到主线程 ——
   * 降级会让 `while(true){}` 直接锁死 UI，且没有任何超时保护。
   *
   * @param {string} code 用户代码
   * @param {Array} jobs [{history, horizon, ctx}]
   * @param {Object} [limits] { perJob, total }
   * @param {Object} [session] 可选会话句柄；会被挂上 abort()，供调用方（路由切换）取消
   * @returns {Promise<{results: Array, timedOut: boolean, refused?: boolean, aborted?: boolean, reason?: string}>}
   */
  function runSandbox(code, jobs, limits, session) {
    var lim = limits || LIMITS;

    return new Promise(function (resolve) {
      var results = [];
      var index = 0;
      var worker = null;
      var url = null;
      var jobTimer = null;
      var totalTimer = null;
      var finished = false;

      /** 释放资源 */
      function cleanup() {
        if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
        if (totalTimer) { clearTimeout(totalTimer); totalTimer = null; }
        if (worker) {
          try { worker.terminate(); } catch (e) { /* ignore */ }
          worker = null;
        }
        if (url) {
          try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
          url = null;
        }
        if (session && typeof session === 'object') {
          session.abort = null;
        }
      }

      /**
       * 结束判题，把未执行的用例标记为超时。
       * @param {boolean} timedOut 是否因超时结束
       */
      function finish(timedOut) {
        if (finished) return;
        finished = true;
        for (var i = results.length; i < jobs.length; i++) {
          results.push({
            status: 'timeout',
            error: timedOut
              ? '执行超时（单次 ' + lim.perJob + 'ms / 整题 ' + lim.total + 'ms）'
              : '未执行',
            line: null
          });
        }
        cleanup();
        resolve({ results: results, timedOut: !!timedOut });
      }

      /**
       * 放弃当前会话：立即 terminate 旧 Worker，不留后台计算。
       * 结果由调用方按 token 丢弃。
       */
      function abort() {
        if (finished) return;
        finished = true;
        cleanup();
        resolve({ results: results, timedOut: false, aborted: true });
      }

      if (session && typeof session === 'object') session.abort = abort;

      /** 派发下一个测试点 */
      function next() {
        if (index >= jobs.length) { finish(false); return; }
        var job = jobs[index];
        try {
          worker.postMessage({
            id: index,
            code: code,
            // 每个测试点传独立副本：用户代码即便就地修改 history，也污染不到下一个测试点
            history: job.history.slice(),
            horizon: job.horizon,
            ctx: job.ctx
          });
        } catch (e) {
          results.push({ status: 'error', error: '无法向沙箱投递任务：' + ((e && e.message) || e), line: null });
          index++;
          next();
          return;
        }
        jobTimer = setTimeout(function () { finish(true); }, lim.perJob);
      }

      // 环境不支持 Worker：拒绝执行（不再静默降级到主线程）
      if (!canUseSandbox()) {
        cleanup();
        resolve({ results: [], timedOut: false, refused: true, reason: SANDBOX_REFUSED_REASON });
        return;
      }

      try {
        url = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'application/javascript' }));
        worker = new Worker(url);
      } catch (e) {
        cleanup();
        resolve({
          results: [],
          timedOut: false,
          refused: true,
          reason: SANDBOX_REFUSED_REASON + '（创建 Worker 失败：' + ((e && e.message) || e) + '）'
        });
        return;
      }

      worker.onmessage = function (ev) {
        var msg = ev.data || {};
        if (finished || msg.id !== index) return;
        if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
        if (msg.status === 'ok') {
          results.push({ status: 'ok', value: msg.value, ms: msg.ms });
        } else {
          results.push({ status: 'error', error: msg.error, line: msg.line });
        }
        index++;
        next();
      };

      worker.onerror = function (ev) {
        if (finished) return;
        // 关键：先清掉在飞测试点的超时定时器，否则 next() 会用新定时器覆盖 jobTimer，
        // 旧定时器成为孤儿并在到期后把「还在正常跑的后续测试点」整题误判为 TLE。
        if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
        if (ev && typeof ev.preventDefault === 'function') {
          try { ev.preventDefault(); } catch (e) { /* 忽略：部分引擎不支持 */ }
        }
        var text = (ev && ev.message) ? ev.message : '沙箱内部错误';
        results.push({ status: 'error', error: text, line: null });
        index++;
        if (index >= jobs.length) { finish(false); }
        else { next(); }
      };

      totalTimer = setTimeout(function () { finish(true); }, lim.total);
      next();
    });
  }

  /* ================================================================== *
   * 8. 判题主流程
   * ================================================================== */

  /**
   * 滚动回测窗口覆盖度前置校验。
   *
   * 背景：`buildTestPoints` 在 `len < horizon + windows*originStep` 时会把装不下的窗口
   * **静默丢弃**（`trainEnd < 4` 分支），于是「4 个窗口的题」可能只剩 1 个测试点，
   * 而题面仍然写着 4 个窗口 —— 判题口径与题面不一致，属于数据/配置缺陷。
   *
   * `buildTestPoints` 的语义被 60+ 条用例锁死，一行都不能改；因此把校验放在它**之前**：
   * 判题入口先算一次「窗口是否装得下」，装不下就直接给出显式错误报告，绝不静默缩水。
   *
   * @param {Object} problem 题目
   * @param {Object} dataset 数据集
   * @returns {string|null} 错误说明；null 表示通过
   */
  function coverageError(problem, dataset) {
    if (!problem || (problem.mode || 'holdout') !== 'rolling') return null;
    var horizon = Number(problem.horizon) || 0;
    var windows = Math.max(1, Number(problem.windows) || 1);
    var step = Math.max(1, Number(problem.originStep) || horizon || 1);
    var len = (dataset && dataset.values) ? dataset.values.length : 0;
    var required = horizon + windows * step;
    if (len < required) {
      return '滚动回测窗口不足：' + windows + ' 个窗口（步长 ' + step + '、预测 ' + horizon +
        ' 步）至少需要 ' + required + ' 个数据点，当前数据集「' + ((dataset && dataset.id) || '?') +
        '」只有 ' + len + ' 个。已停止判题，避免把缩水后的测试点当作成绩。';
    }
    return null;
  }

  /**
   * 构造一个「不进入评分流程」的报告骨架（数据不足 / 沙箱不可用 / 会话取消）。
   * 结构与 buildReport 的返回值保持一致，便于 UI 统一渲染。
   *
   * @param {Object} params { problem }
   * @param {string} message 说明
   * @param {Object} flags 额外标记（dataError / refused / aborted）
   * @returns {Object} 判题报告
   */
  function guardReport(params, message, flags) {
    var problem = params.problem || {};
    var metric = problem.metric || 'mse';
    var report = {
      problemId: problem.id,
      verdict: 'RE',
      passed: false,
      score: 0,
      passScore: Number(problem.passScore) || 60,
      metric: metric,
      metricLabel: metricLabels[metric] || String(metric).toUpperCase(),
      cases: [],
      message: message,
      degraded: false,
      at: Date.now()
    };
    if (flags) {
      for (var k in flags) {
        if (Object.prototype.hasOwnProperty.call(flags, k)) report[k] = flags[k];
      }
    }
    return report;
  }

  /**
   * 汇总执行结果，产出最终判题报告。
   * @param {Object} params { problem, dataset, code }
   * @param {Object} run { results, timedOut, degraded }
   * @returns {Object} 判题报告
   */
  function buildReport(params, run) {
    var problem = params.problem;
    var dataset = params.dataset;

    var opts = {
      mode: problem.mode || 'holdout',
      horizon: problem.horizon,
      originStep: problem.originStep,
      windows: problem.windows,
      metric: problem.metric || 'mse',
      baselines: (problem.baselines && problem.baselines.length) ? problem.baselines : ['naive'],
      threshold: problem.threshold,
      passScore: problem.passScore || 60,
      season: problem.season || dataset.season,
      freq: dataset.freq,
      datasetId: dataset.id
    };

    var points = buildTestPoints(dataset.values, opts);
    var cases = [];
    var sum = 0;
    var hasRe = false;
    var hasTle = false;

    for (var i = 0; i < points.length; i++) {
      var c = scoreCase(points[i], run.results[i], opts);
      if (c.verdict === 'RE') hasRe = true;
      if (c.verdict === 'TLE') hasTle = true;
      sum += c.score;
      cases.push(c);
    }

    var score = Math.round(sum / Math.max(1, cases.length));
    var allAC = cases.every(function (c) { return c.verdict === 'AC'; });
    var verdict;
    var message = '';

    if (hasTle || run.timedOut) {
      verdict = 'TLE';
      score = 0;
      message = '执行超时，请检查是否有死循环或过大的计算量。';
    } else if (hasRe) {
      verdict = 'RE';
      var firstErr = null;
      for (var j = 0; j < cases.length; j++) {
        if (cases[j].verdict === 'RE') { firstErr = cases[j]; break; }
      }
      message = firstErr ? firstErr.error : '运行时错误';
    } else if (allAC && score >= opts.passScore) {
      verdict = 'AC';
      message = '全部测试点达标，通过！';
    } else {
      verdict = 'WA';
      message = '存在未达标的测试点，误差仍然偏大。';
    }

    return {
      problemId: problem.id,
      verdict: verdict,
      passed: verdict === 'AC',
      score: score,
      passScore: opts.passScore,
      metric: opts.metric,
      metricLabel: metricLabels[opts.metric] || String(opts.metric).toUpperCase(),
      cases: cases,
      message: message,
      degraded: !!run.degraded,
      at: Date.now()
    };
  }

  /**
   * 把 problem + dataset + code 转成沙箱任务列表。
   * @param {Object} problem 题目
   * @param {Object} dataset 数据集
   * @param {string} code 用户代码
   * @returns {Array}
   */
  function buildJobs(problem, dataset, code) {
    var opts = {
      mode: problem.mode || 'holdout',
      horizon: problem.horizon,
      originStep: problem.originStep,
      windows: problem.windows,
      season: problem.season || dataset.season,
      freq: dataset.freq,
      datasetId: dataset.id
    };
    var points = buildTestPoints(dataset.values, opts);
    // 题目可声明只读的额外上下文（如已知促销日历）。切分逻辑（buildTestPoints）保持纯净：
    // split.test.js 用 deepEqual 钉死了 ctx 的四个基础字段，扩展只能发生在这里。
    var extra = typeof problem.ctxExtra === 'function' ? problem.ctxExtra : null;
    return points.map(function (p) {
      var ctx = p.ctx;
      if (extra) {
        var add = extra(p, dataset, problem);
        if (add && typeof add === 'object') {
          ctx = {};
          for (var k in p.ctx) if (Object.prototype.hasOwnProperty.call(p.ctx, k)) ctx[k] = p.ctx[k];
          for (var k2 in add) if (Object.prototype.hasOwnProperty.call(add, k2)) ctx[k2] = add[k2];
        }
      }
      return { code: code, history: p.history, horizon: opts.horizon, ctx: ctx };
    });
  }

  /**
   * 异步判题（浏览器：Worker 沙箱）。
   *
   * 三条前置/旁路分支（都不进入评分流程）：
   *   - 数据/配置缺陷（滚动窗口装不下）→ dataError 报告；
   *   - 环境无沙箱 → refused 报告（**拒绝执行**，不降级到主线程）；
   *   - 会话被调用方取消（路由切换）→ aborted 报告（结果由调用方丢弃）。
   *
   * @param {Object} params { problem, dataset, code, limits?, session? }
   * @returns {Promise<Object>} 判题报告
   */
  function evaluate(params) {
    var bad = coverageError(params.problem, params.dataset);
    if (bad) return Promise.resolve(guardReport(params, bad, { dataError: true }));

    var jobs;
    try {
      jobs = buildJobs(params.problem, params.dataset, params.code);
    } catch (e) {
      return Promise.reject(e);
    }
    return runSandbox(params.code, jobs, params.limits, params.session).then(function (run) {
      if (run && run.aborted) {
        return guardReport(params, '判题已取消（页面已切换）。', { aborted: true });
      }
      if (run && run.refused) {
        return guardReport(params, run.reason || SANDBOX_REFUSED_REASON, { refused: true });
      }
      return buildReport(params, run);
    });
  }

  /**
   * 同步判题（同线程执行）。仅用于可信代码：参考解、排行榜虚拟选手。
   * @param {Object} params { problem, dataset, code }
   * @returns {Object} 判题报告
   */
  function evaluateSync(params) {
    var bad = coverageError(params.problem, params.dataset);
    if (bad) return guardReport(params, bad, { dataError: true });
    var jobs = buildJobs(params.problem, params.dataset, params.code);
    var run = runInProcess(params.code, jobs);
    run.degraded = true;
    return buildReport(params, run);
  }

  /* ================================================================== *
   * 9. 导出
   * ================================================================== */

  var judge = {
    metrics: metrics,
    metricLabels: metricLabels,
    baselines: baselines,
    baselineLabels: baselineLabels,
    scoreForRatio: scoreForRatio,
    buildTestPoints: buildTestPoints,
    buildJobs: buildJobs,
    runSandbox: runSandbox,
    runInProcess: runInProcess,
    evaluate: evaluate,
    evaluateSync: evaluateSync,
    canUseSandbox: canUseSandbox,
    coverageError: coverageError,
    parseLine: parseLine,
    LIMITS: LIMITS,
    SANDBOX_REFUSED_REASON: SANDBOX_REFUSED_REASON,
    WORKER_SOURCE: WORKER_SOURCE
  };

  TSJ.judge = judge;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = judge;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/**
 * editor.js —— 自研轻量代码编辑器
 *
 * 实现方式：透明文字的 <textarea> 覆盖在 <pre><code> 高亮层之上，

    tooltip: function (model, index) {
      var rows = (model.series || []).map(function (s) {

      return '对比 ' + ((model.labels || []).length) + ' 组 × ' + ((model.series || []).length) + ' 个指标';

<script>
/**
 * assets/js/charts/diagnostics.js —— 诊断图与统计量
 *
 * 这里同时提供纯函数（ACF/PACF/加性分解），实验室与课程演示共用同一实现，
 * 避免“图表算一套、实验算一套”导致数值漂移。

(function (global) {

  function finite(v) { return typeof v === 'number' && isFinite(v); }

    var s = 0, n = 0;

  /**
   * 自相关函数（默认有偏估计，样本少时需在文案中说明）。
   */
  function acf(series, lags) {
    var x = series.filter(finite);
    var n = x.length;

    for (var k = 0; k <= maxLag; k++) {
      var num = 0;
      for (var j = k; j < n; j++) num += (x[j] - m) * (x[j - k] - m);

  /** 解对称正定线性方程组（Cholesky）。失败返回 null。 */

    var n = b.length;

    for (var i = 0; i < n; i++) L.push(new Array(n).fill(0));
    for (var col = 0; col < n; col++) {
      for (var row = 0; row <= col; row++) {
        var sum = A[col][row];
        for (var k = 0; k < row; k++) sum -= L[col][k] * L[row][k];
        if (col === row) {
          if (sum <= 1e-12) return null;
          L[col][row] = Math.sqrt(sum);
        } else {
          L[col][row] = sum / L[row][row];

    var y = [];
    for (var i2 = 0; i2 < n; i2++) {
      var s = b[i2];
      for (var k2 = 0; k2 < i2; k2++) s -= L[i2][k2] * y[k2];
      y.push(s / L[i2][i2]);

    var x = new Array(n).fill(0);
    for (var i3 = n - 1; i3 >= 0; i3--) {
      var s2 = y[i3];
      for (var k3 = i3 + 1; k3 < n; k3++) s2 -= L[k3][i3] * x[k3];

  function decomposeAdditive(series, m) {

        ctx.restore();

    'seasonal-naive': { label: '季节朴素', params: {}, minHistory: 3 },
    mean: { label: '历史均值', params: {}, minHistory: 1 },

    ses: { label: '简单指数平滑', params: { alpha: { min: 0.02, max: 0.6, step: 0.01, def: 0.28 } }, minHistory: 2 },
    holt: {
      label: 'Holt 线性趋势',
      params: {
        alpha: { min: 0.02, max: 0.8, step: 0.01, def: 0.42 },
        beta: { min: 0.01, max: 0.5, step: 0.01, def: 0.1 }

        gamma: { min: 0.02, max: 0.6, step: 0.01, def: 0.28 }

    dlinear: { label: 'DLinear', params: {}, minHistory: 8 },

      interval: {

 * assets/js/lab/adapters.js —— 白名单方法的唯一适配层

      { from: 'var beta = 0.1;', param: 'beta' }

 * assets/js/lab/stats.js —— 实验室纯函数：指标、训练残差、经验分位区间
 *
 * 区间只使用“预测起点之前”的训练残差；测试真值绝不参与校准。
