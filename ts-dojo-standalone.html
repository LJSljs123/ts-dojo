  /** 更新顶部等级分胶囊。 */
  function updateScoreChip() {
    var total = totalScore();
    var lvEl = core.$('#lvText');
    var ptsEl = core.$('#ptsText');
    if (lvEl) lvEl.textContent = 'Lv.' + levelOf(total);
    if (ptsEl) ptsEl.textContent = total + ' 分';
  }

  /** 高亮当前导航项。 */
  function setActiveNav(name) {
    var links = document.querySelectorAll('#nav a');
    for (var i = 0; i < links.length; i++) {
      var isOn = links[i].getAttribute('data-nav') === name;
      if (isOn) links[i].classList.add('on');
      else links[i].classList.remove('on');
    }
  }

  /** 计算「参考解法」虚拟选手的每题得分（同步执行可信代码，结果确定且带缓存）。 */
  function computeRefScores() {
    if (state.refScores) return state.refScores;
    var map = {};
    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      var ds = TSJ.findDataset(p.dataset);
      if (!ds) { map[p.id] = 0; continue; }
      try {
        map[p.id] = TSJ.judge.evaluateSync({ problem: p, dataset: ds, code: p.solution }).score;
      } catch (e) {
        map[p.id] = 0;
      }
    }
    state.refScores = map;
    return map;
  }

  /** 为学习路径生成一句话知识点摘要。 */
  function pathSummary(p) {
    var ds = TSJ.findDataset(p.dataset);
    var dsName = ds ? ds.name : p.dataset;
    return '数据集 ' + dsName + ' · ' + (core.MODE_LABEL[p.mode] || p.mode) +
      ' · 预测 ' + p.horizon + ' 步 · 需要打败最优基线（阈值 ' + p.threshold + '）';
  }

  /* ---------- 写盘策略 ---------- */

  /**
   * 合并两份进度表（本地写盘用）：同一题取更优记录，不重复累加 attempts。
   * @param {Object} disk 盘上的进度
   * @param {Object} mem 内存里的进度
   * @returns {Object}
   */
  function mergeProgressForWrite(disk, mem) {
    var out = {};
    var id;
    for (id in disk) {
      if (Object.prototype.hasOwnProperty.call(disk, id)) out[id] = disk[id];
    }
    for (id in mem) {
      if (!Object.prototype.hasOwnProperty.call(mem, id)) continue;
      var a = out[id];
      var b = mem[id];
      if (!a) { out[id] = b; continue; }
      out[id] = {
        best: Math.max(core.toScore(a.best), core.toScore(b.best)),
        passed: a.passed === true || b.passed === true,
        attempts: Math.max(core.toCount(a.attempts), core.toCount(b.attempts)),
        lastVerdict: core.toTime(b.lastAt) >= core.toTime(a.lastAt) ? b.lastVerdict : a.lastVerdict,
        lastAt: Math.max(core.toTime(a.lastAt), core.toTime(b.lastAt))
      };
    }
    return out;
  }

  /**
   * 合并两份进度表（导入用）：best = max(旧,新)、attempts = 旧+新、passed = 或。
   * @param {Object} oldP 现有进度
   * @param {Object} newP 导入的进度
   * @returns {Object}
   */
  function mergeProgressForImport(oldP, newP) {
    var out = {};
    var id;
    for (id in oldP) {
      if (Object.prototype.hasOwnProperty.call(oldP, id)) out[id] = oldP[id];
    }
    for (id in newP) {
      if (!Object.prototype.hasOwnProperty.call(newP, id)) continue;
      var a = out[id];
      var b = newP[id];
      if (!a) { out[id] = b; continue; }
      var newer = core.toTime(b.lastAt) >= core.toTime(a.lastAt) ? b : a;
      out[id] = {
        best: Math.max(core.toScore(a.best), core.toScore(b.best)),
        passed: a.passed === true || b.passed === true,
        attempts: core.toCount(a.attempts) + core.toCount(b.attempts),
        lastVerdict: newer.lastVerdict,
        lastAt: Math.max(core.toTime(a.lastAt), core.toTime(b.lastAt))
      };
    }
    return out;
  }

  /**
   * 合并提交记录：按 id 去重（新的覆盖旧的），按时间倒序，截断到 120 条。
   * @param {Array} oldList 现有记录
   * @param {Array} newList 新记录
   * @returns {Array}
   */
  function mergeSubmissions(oldList, newList) {
    var seen = {};
    var out = [];
    var i;
    var src = (newList || []).concat(oldList || []);
    for (i = 0; i < src.length; i++) {
      var s = src[i];
      if (!s || !s.id || seen[s.id]) continue;
      seen[s.id] = true;
      out.push(s);
    }
    out.sort(function (x, y) { return y.at - x.at; });
    if (out.length > core.MAX_SUBMISSIONS) out.length = core.MAX_SUBMISSIONS;
    return out;
  }

  /** 写进度：先读盘合并，再写回（避免覆盖其它标签页刚写入的记录）。 */
  function saveProgress() {
    var disk = schema.normalizeProgress(core.readJSON(core.STORE.progress, {}, core.isPlainObject));
    state.progress = mergeProgressForWrite(disk, state.progress);
    var ok = core.writeJSON(core.STORE.progress, state.progress);
    state.storageOk = ok;
    return ok;
  }

  /** 写草稿：草稿是「本机最新意图」，直接整表写回。 */
  function saveDrafts() {
    var ok = core.writeJSON(core.STORE.drafts, state.drafts);
    state.storageOk = ok;
    return ok;
  }

  /** 写提交记录：先读盘合并去重，再写回。 */
  function saveSubmissions() {
    var disk = schema.normalizeSubmissions(core.readJSON(core.STORE.submissions, [], core.isArrayValue));
    state.submissions = mergeSubmissions(disk, state.submissions);
    var ok = core.writeJSON(core.STORE.submissions, state.submissions);
    state.storageOk = ok;
    return ok;
  }

  /** 保存编辑器字号。 */
  function saveEdFont(size) {
    state.edFont = (size === 12 || size === 13 || size === 14) ? size : 13;
    return core.writeJSON(core.STORE.edFont, state.edFont);
  }

  /**
   * 外部（其它标签页）改写存储后重新装载。
   * @returns {boolean} 是否真的读到了变化
   */
  function reloadFromStorage() {
    var before = '';
    var after = '';
    try {
      before = JSON.stringify([state.progress, state.drafts, state.submissions]);
    } catch (e) {
      before = '';
    }
    state.progress = core.readNormalized(
      core.STORE.progress, {}, core.isPlainObject, schema.normalizeProgress);
    state.drafts = core.readNormalized(
      core.STORE.drafts, {}, core.isPlainObject, schema.normalizeDrafts);
    state.submissions = core.readNormalized(
      core.STORE.submissions, [], core.isArrayValue, schema.normalizeSubmissions);
    try {
      after = JSON.stringify([state.progress, state.drafts, state.submissions]);
    } catch (e) {
      after = '';
    }
    return before !== after;
  }

  /** 清空内存态（清空进度后调用；storage 侧由 app/storage.js 负责删除键）。 */
  function resetState() {
    state.progress = {};
    state.drafts = {};
    state.submissions = [];
    state.filter = '全部';
    state.query = '';
    state.tag = null;
    state.lastResult = null;
    state.refScores = null;
  }

  /** 触发外部变更回调（storage 事件用）。 */
  function notifyExternal(kind) {
    if (externalHandler) externalHandler(kind);
  }

  TSJ.appStore = {
    state: state,
    onExternalChange: onExternalChange,
    loadState: loadState,
    totalScore: totalScore,
    levelOf: levelOf,
    problemStats: problemStats,
    updateScoreChip: updateScoreChip,
    setActiveNav: setActiveNav,
    computeRefScores: computeRefScores,
    pathSummary: pathSummary,
    mergeProgressForWrite: mergeProgressForWrite,
    mergeProgressForImport: mergeProgressForImport,
    mergeSubmissions: mergeSubmissions,
    saveProgress: saveProgress,
    saveDrafts: saveDrafts,
    saveSubmissions: saveSubmissions,
    saveEdFont: saveEdFont,
    reloadFromStorage: reloadFromStorage,
    resetState: resetState,
    notifyExternal: notifyExternal
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/storage.js —— 进度导出 / 导入 / 清空（T05）
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js
 * 挂载点：window.TSJ.appStorage
 *
 * 导出文件结构：
 *   { schema: 1, app: 'tsoj', exportedAt: <ms>, data: { progress, drafts, submissions }, hash }
 *   hash = FNV-1a(JSON.stringify(data))，用于识别「文件被手工改过」。
 *
 * 导入校验顺序（任一失败都给出具体原因，且**不动现有数据**）：
 *   JSON 合法 → app === 'tsoj' → schema ≤ 当前版本 → hash 匹配 → 字段白名单归一化。
 *
 * 清空只删 `tsoj:` 前缀的键，绝不 localStorage.clear()（同源下可能有别的页面数据）。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var schema = TSJ.appSchema;
  var store = TSJ.appStore;

  var MAX_FILE_BYTES = 4 * 1024 * 1024;   // 4MB：超过直接拒绝，避免把主线程读死

  /**
   * 生成导出包（纯函数，便于测试）。
   * @returns {Object} { schema, app, exportedAt, data, hash }
   */
  function buildBundle() {
    var data = {
      progress: store.state.progress,
      drafts: store.state.drafts,
      submissions: store.state.submissions
    };
    return {
      schema: core.CURRENT_SCHEMA,
      app: 'tsoj',
      exportedAt: Date.now(),
      data: data,
      hash: core.fnv1a(JSON.stringify(data))
    };
  }

  /** 导出文件名：tsoj-progress-YYYYMMDD.json */
  function exportFileName(ts) {
    return 'tsoj-progress-' + core.fmtDateStamp(ts) + '.json';
  }

  /**
   * 触发浏览器下载（Blob + a.download）。
   * @returns {string} 实际写入文件的内容（测试可直接比对）
   */
  function exportProgress() {
    var text = JSON.stringify(buildBundle(), null, 2);
    try {
      var blob = new global.Blob([text], { type: 'application/json' });
      var url = global.URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = exportFileName(Date.now());
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      global.setTimeout(function () {
        try { global.URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 0);
    } catch (e) {
      return text;   // 下载不可用（极少见）时至少把内容交给调用方
    }
    return text;
  }

  /**
   * 校验并解析导入文本。
   * @param {string} text 文件内容
   * @returns {{ok: boolean, reason: string, data: ?Object, schema: number, counts: ?Object}}
   */
  function parseBundle(text) {
    var fail = function (reason) {
      return { ok: false, reason: reason, data: null, schema: -1, counts: null };
    };

    if (typeof text !== 'string' || text.length === 0) return fail('文件是空的，没有可导入的内容。');
    if (text.length > MAX_FILE_BYTES) return fail('文件超过 4MB，不像是本程序导出的进度文件。');

    var obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      return fail('文件不是合法的 JSON，无法解析。');
    }
    if (!core.isPlainObject(obj)) return fail('文件内容不是一个对象，无法解析。');

    if (obj.app !== 'tsoj') {
      return fail('这不是 TSOJ 的进度文件（缺少 app: "tsoj" 标记）。');
    }

    var ver = Number(obj.schema);
    if (!isFinite(ver) || ver < 0) {
      return fail('文件缺少合法的 schema 版本号。');
    }
    if (ver > core.CURRENT_SCHEMA) {
      return fail('文件版本过新（schema ' + ver + '），当前程序只支持到 schema ' +
        core.CURRENT_SCHEMA + '。请升级后再导入。');
    }

    if (!core.isPlainObject(obj.data)) return fail('文件缺少 data 字段，内容不完整。');

    var expect = core.fnv1a(JSON.stringify(obj.data));
    if (typeof obj.hash !== 'string' || obj.hash !== expect) {
      return fail('校验失败：内容与校验码不一致（文件可能被修改过）。');
    }

    // 字段白名单归一化：只接受 progress / drafts / submissions 三个键
    var data = {
      progress: schema.normalizeProgress(obj.data.progress),
      drafts: schema.normalizeDrafts(obj.data.drafts),
      submissions: schema.normalizeSubmissions(obj.data.submissions)
    };
    var counts = {
      progress: Object.keys(data.progress).length,
      drafts: Object.keys(data.drafts).length,
      submissions: data.submissions.length
    };
    return { ok: true, reason: '', data: data, schema: ver, counts: counts };
  }

  /**
   * 把解析后的数据合并进当前状态并落盘。
   * @param {Object} data { progress, drafts, submissions }
   * @returns {{progress: number, drafts: number, submissions: number}} 合并后的条目数
   */
  function applyImport(data) {
    var st = store.state;
    st.progress = store.mergeProgressForImport(st.progress, data.progress || {});
    // 草稿：导入值优先（用户是在「恢复备份」，备份里的代码即他的最新意图），未覆盖的题保留本机草稿
    var id;
    for (id in data.drafts) {
      if (Object.prototype.hasOwnProperty.call(data.drafts, id)) st.drafts[id] = data.drafts[id];
    }
    st.submissions = store.mergeSubmissions(st.submissions, data.submissions || []);
    store.saveProgress();
    store.saveDrafts();
    store.saveSubmissions();
    return {
      progress: Object.keys(st.progress).length,
      drafts: Object.keys(st.drafts).length,
      submissions: st.submissions.length
    };
  }

  /**
   * 读取用户选择的文件并导入。
   * @param {File} file 文件对象
   * @param {Function} done function(result) —— result: {ok, reason, counts}
   */
  function importFile(file, done) {
    var cb = typeof done === 'function' ? done : function () {};
    if (!file) { cb({ ok: false, reason: '没有选择文件。', counts: null }); return; }
    if (typeof global.FileReader !== 'function') {
      cb({ ok: false, reason: '当前浏览器不支持读取本地文件。', counts: null });
      return;
    }
    var reader = new global.FileReader();
    reader.onerror = function () {
      cb({ ok: false, reason: '读取文件失败，请重试。', counts: null });
    };
    reader.onload = function () {
      var parsed;
      try {
        parsed = parseBundle(String(reader.result || ''));
      } catch (e) {
        cb({ ok: false, reason: '解析文件时出错：' + ((e && e.message) || String(e)), counts: null });
        return;
      }
      if (!parsed.ok) { cb({ ok: false, reason: parsed.reason, counts: null }); return; }
      var counts = applyImport(parsed.data);
      cb({ ok: true, reason: '', counts: counts, schema: parsed.schema });
    };
    reader.readAsText(file, 'utf-8');
  }

  /**
   * 清空所有 tsoj:* 键（不动其它同源数据）。
   * @returns {string[]} 被删除的键
   */
  function clearAll() {
    var keys = [];
    try {
      var n = global.localStorage.length;
      for (var i = 0; i < n; i++) {
        var k = global.localStorage.key(i);
        if (k && k.indexOf(core.STORAGE_PREFIX) === 0) keys.push(k);
      }
      for (var j = 0; j < keys.length; j++) global.localStorage.removeItem(keys[j]);
    } catch (e) {
      return keys;
    }
    store.resetState();
    return keys;
  }

  /**
   * 监听跨标签页的 storage 事件：同步 state 并通知 app 重渲染当前视图。
   * 只有我们自己的键变化才处理（其它页面的键与我们无关）。
   * @returns {Function} 解绑函数
   */
  function bindStorageSync() {
    if (typeof global.addEventListener !== 'function') return function () {};
    /** 处理 storage 事件。 */
    function onStorage(ev) {
      if (!ev) return;
      var key = ev.key;
      // key === null 表示 storage.clear()（别的页面整体清空）
      if (key !== null && String(key).indexOf(core.STORAGE_PREFIX) !== 0) return;
      var changed = store.reloadFromStorage();
      store.notifyExternal(key === null ? 'clear' : String(key).slice(core.STORAGE_PREFIX.length));
      if (changed && TSJ.appStore.updateScoreChip) TSJ.appStore.updateScoreChip();
    }
    global.addEventListener('storage', onStorage);
    return function () { global.removeEventListener('storage', onStorage); };
  }

  TSJ.appStorage = {
    buildBundle: buildBundle,
    exportFileName: exportFileName,
    exportProgress: exportProgress,
    parseBundle: parseBundle,
    applyImport: applyImport,
    importFile: importFile,
    clearAll: clearAll,
    bindStorageSync: bindStorageSync
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/ui.js —— 通用渲染件：Markdown、结果面板、逐测试点、预测曲线、判题按钮态、分栏拖拽
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js；挂载点 TSJ.appUi。
 * 约定：所有 DOM 查询限定在 `#view` 作用域内（`$('#x', view)`）—— 旧实现用全局
 * `$('#btnSolution')` / `$('#resultPanel')`，路由切换后会摸到新页面的节点。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var judge = TSJ.judge;

  var $ = core.$;
  var esc = core.esc;
  var fmtNum = core.fmtNum;

  /* ---------- 1. 极简 Markdown ---------- */
  /** 行内元素：`code` / **bold** / *italic*。 */
  function mdInline(s) {
    var t = esc(s);
    t = t.replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return t;
  }

  /** 极简 Markdown 渲染：标题、无序/有序列表、代码块、引用、分隔线、段落。 */
  function md(src) {
    var lines = String(src == null ? '' : src).replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var listTag = null;
    var i = 0;

    /** 关闭当前列表。 */
    function closeList() { if (listTag) { out.push('</' + listTag + '>'); listTag = null; } }

    /** 判断一行是否开启新块。 */
    function isBlockStart(line) {
      return /^\s*$/.test(line) ||
        /^```/.test(line) ||
        /^#{1,4}\s+/.test(line) ||
        /^---+\s*$/.test(line) ||
        /^\s*[-*]\s+/.test(line) ||
        /^\s*\d+\.\s+/.test(line) ||
        /^>\s?/.test(line);
    }

    while (i < lines.length) {
      var line = lines[i];

      // 代码块
      if (/^```/.test(line)) {
        closeList();
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // 跳过结束围栏
        out.push('<pre class="md-code"><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      if (/^\s*$/.test(line)) { closeList(); i++; continue; }   // 空行

      // 标题
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        closeList();
        var lv = h[1].length;
        out.push('<h' + lv + ' class="md-h">' + mdInline(h[2]) + '</h' + lv + '>');
        i++; continue;
      }

      if (/^---+\s*$/.test(line)) { closeList(); out.push('<hr class="md-hr">'); i++; continue; }   // 分隔线

      // 引用
      var q = /^>\s?(.*)$/.exec(line);
      if (q) {
        closeList();
        var qbuf = [q[1]];
        i++;
        while (i < lines.length && /^>\s?/.test(lines[i])) { qbuf.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<div class="md-quote">' + mdInline(qbuf.join(' ')) + '</div>');
        continue;
      }

      // 列表
      var ul = /^\s*[-*]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (ul || ol) {
        var want = ul ? 'ul' : 'ol';
        if (listTag !== want) { closeList(); out.push('<' + want + ' class="md-list">'); listTag = want; }
        out.push('<li>' + mdInline((ul || ol)[1]) + '</li>');
        i++;
        continue;
      }

      // 段落：合并连续非块起始行
      closeList();
      var pbuf = [line];
      i++;
      while (i < lines.length && !isBlockStart(lines[i])) { pbuf.push(lines[i]); i++; }
      out.push('<p class="md-p">' + mdInline(pbuf.join(' ')) + '</p>');
    }

    closeList();
    return out.join('\n');
  }

  /* ---------- 2. 判题按钮态 ---------- */
  /** 当前环境是否允许提交（无沙箱时禁止提交，避免死循环锁死界面）。 */
  function canSubmit() {
    return typeof judge.canUseSandbox === 'function' ? judge.canUseSandbox() : true;
  }

  /** 切换「判题中」按钮态。 只在令牌仍然有效时执行 —— 否则会把新页面的按钮改成「判题中…」或提前解禁。 */
  function setBusy(busy, token) {
    if (token !== undefined && token !== store.state.judgeToken) return;
    var view = $('#view');
    if (!view) return;
    var sandboxOk = canSubmit();
    var btnRun = $('#btnRun', view);
    var btnSubmit = $('#btnSubmit', view);
    if (btnRun) btnRun.disabled = busy || !sandboxOk;
    if (btnSubmit) {
      btnSubmit.disabled = busy || !sandboxOk;
      btnSubmit.textContent = busy ? '判题中…' : '提交判题';
      if (!sandboxOk) btnSubmit.title = judge.SANDBOX_REFUSED_REASON || '当前环境无法创建判题沙箱';
    }
  }

  /* ---------- 3. 逐测试点列表（结果面板与提交详情共用） ---------- */
  /** verdict → 迷你标签 class */
  function verdictMiniClass(v) {
    return v === 'AC' ? 'vm-ac' : v === 'RE' ? 'vm-re' : v === 'TLE' ? 'vm-tle' : 'vm-wa';
  }

  /**
   * 渲染逐测试点列表。
   * @param {Array} cases 测试点数组（judge 的 res.cases 或落盘的 cases 快照）
   * @param {boolean} withOrigin 是否显示「（origin #N）」
   * @returns {string} HTML
   */
  function renderCaseList(cases, withOrigin) {
    var list = core.isArrayValue(cases) ? cases : [];
    if (list.length === 0) return '';
    var html = ['<div class="cases">'];
    for (var i = 0; i < list.length; i++) {
      var cs = list[i] || {};
      var vm = verdictMiniClass(cs.verdict);
      html.push('<div class="case">\n  <span class="verdict-mini ' + vm + '">' + esc(cs.verdict) + '</span>');
      html.push('  <span class="case-idx">测试点 ' + (i + 1) +
        (withOrigin && list.length > 1 ? '（origin #' + esc(core.toCount(cs.index) + 1) + '）' : '') + '</span>');
      html.push('  <span class="case-metric">你 ' + fmtNum(cs.yourMetric) +
        ' / 基线 ' + fmtNum(cs.bestBaseline) + '</span>');
      html.push('  <span class="case-score">' + esc(core.toScore(cs.score)) + '</span>');
      if (cs.error) html.push('  <span class="case-err">' + esc(cs.error) + '</span>');
      html.push('</div>');
    }
    html.push('</div>');
    return html.join('\n');
  }

  /* ---------- 4. 结果面板 ---------- */
  /** 渲染「前置守卫」提示（数据不足 / 沙箱不可用 / 已取消）。 这类报告不进入评分流程，因此不显示任何分数与逐测试点。 */
  function renderGuardNotice(res) {
    var view = $('#view');
    var host = view ? $('#resultPanel', view) : null;
    if (!host) return;
    host.innerHTML = '<div class="notice">' + esc((res && res.message) || '判题未能开始。') + '</div>';
  }

  /** 渲染判题结果面板。 */
  function renderResult(res, p) {
    var view = $('#view');
    var host = view ? $('#resultPanel', view) : null;
    if (!host) return;

    // 数据/配置缺陷、沙箱不可用、会话取消：只给提示，不给分数（避免出现「0 分」的误导）
    if (res && (res.dataError || res.refused || res.aborted)) {
      renderGuardNotice(res);
      return;
    }

    if (!res) {
      host.innerHTML = '<div class="result-empty">' +
        '写一个 <code>predict(history, horizon, ctx)</code> 函数，<br>' +
        '点「提交判题」或按 <code>Ctrl/⌘ + Enter</code> 开始评测。<br>' +
        '<span style="color:#4d5a68">通过线 ' + p.passScore + ' 分 · 需全部测试点达标</span>' +
        '</div>';
      return;
    }

    var html = [];

    // ---- 头部：环形分 + verdict ----
    var verdictClass = 'verdict-wa';
    var verdictText = '未通过 WA';
    if (res.verdict === 'AC') { verdictClass = 'verdict-ac'; verdictText = '通过 AC'; }
    else if (res.verdict === 'RE') { verdictClass = 'verdict-re'; verdictText = '运行时错误 RE'; }
    else if (res.verdict === 'TLE') { verdictClass = 'verdict-tle'; verdictText = '超时 TLE'; }

    var ringClass = res.score >= p.passScore ? '' : (res.score >= 40 ? ' warn' : ' bad');
    var circumference = 2 * Math.PI * 30;
    var offset = circumference * (1 - Math.max(0, Math.min(100, res.score)) / 100);

    html.push('<div class="result-head">\n  <div class="ring-wrap">\n    <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">');
    html.push('      <circle class="ring-bg" cx="36" cy="36" r="30"></circle>');
    html.push('      <circle class="ring-fg' + ringClass + '" cx="36" cy="36" r="30" ' +
      'stroke-dasharray="' + circumference.toFixed(2) + '" ' +
      'stroke-dashoffset="' + offset.toFixed(2) + '"></circle>');
    html.push('    </svg>\n    <div class="ring-label"><b>' + esc(res.score) + '</b><span>SCORE</span></div>');
    html.push('  </div>\n  <div class="result-summary">\n    <div class="verdict ' + verdictClass + '">' + verdictText + '</div>');
    html.push('    <div class="result-sub">' + esc(res.metricLabel || '') + ' · ' +
      (res.cases.length > 1 ? res.cases.length + ' 个测试点取平均' : '单测试点') + '</div>');
    html.push('    <div class="result-sub dim">通过线 ' + p.passScore + ' 分 · 阈值 ' +
      p.threshold + ' × 最优基线</div>');
    html.push('  </div>\n</div>');

    // ---- 错误信息 ----
    if (res.verdict === 'RE' || res.verdict === 'TLE') {
      var firstCase = null;
      for (var i = 0; i < res.cases.length; i++) {
        if (res.cases[i].verdict === 'RE' || res.cases[i].verdict === 'TLE') { firstCase = res.cases[i]; break; }
      }
      var errText = (firstCase && firstCase.error) || res.message || '未知错误';
      var lineText = (firstCase && firstCase.line) ? ('第 ' + firstCase.line + ' 行') : '行号未知';
      html.push('<div class="err-box">' + esc(errText) +
        '<div class="err-meta">位置：' + esc(lineText) + '</div></div>');
    } else if (res.verdict === 'WA' && res.message) {
      html.push('<div class="result-sub" style="margin-bottom:10px">' + esc(res.message) + '</div>');
    }

    // ---- 逐测试点 ----
    if (res.cases.length > 0) html.push(renderCaseList(res.cases, true));

    // ---- 指标对比条（以最后一个测试点为例）----
    if (res.cases.length > 0 && isFinite(res.cases[res.cases.length - 1].yourMetric)) {
      var last = res.cases[res.cases.length - 1];
      var names = [];
      var values = {};
      var k;
      for (k in last.allBaselines) {
        if (Object.prototype.hasOwnProperty.call(last.allBaselines, k)) {
          names.push(k);
          values[k] = last.allBaselines[k];
        }
      }
      values.__mine = last.yourMetric;

      var maxVal = 0;
      for (k in values) {
        if (Object.prototype.hasOwnProperty.call(values, k) && isFinite(values[k]) && values[k] > maxVal) {
          maxVal = values[k];
        }
      }
      if (maxVal <= 0) maxVal = 1;

      html.push('<div class="bars">');
      html.push('  <div class="bars-title">指标对比 · ' + esc(res.metricLabel || '') +
        '（越短越好，黄色为最优基线）</div>');
      html.push('  <div class="bar-row">\n    <span class="bar-label mine">你的预测</span>');
      html.push('    <span class="bar-track"><span class="bar-fill mine" style="width:' +
        Math.min(100, (values.__mine / maxVal) * 100).toFixed(1) + '%"></span></span>');
      html.push('    <span class="bar-val">' + fmtNum(values.__mine) + '</span>\n  </div>');

      for (var n = 0; n < names.length; n++) {
        var nm = names[n];
        var isBest = nm === last.baselineName;
        html.push('  <div class="bar-row">\n    <span class="bar-label">' + esc(judge.baselineLabels[nm] || nm) + '</span>');
        html.push('    <span class="bar-track"><span class="bar-fill' + (isBest ? ' best' : '') +
          '" style="width:' + Math.min(100, (values[nm] / maxVal) * 100).toFixed(1) + '%"></span></span>');
        html.push('    <span class="bar-val">' + fmtNum(values[nm]) + '</span>\n  </div>');
      }
      html.push('</div>');
    }

    host.innerHTML = html.join('\n');
  }

  /** 把最后一个测试点的预测画到预览图上（hover 绑定由 views 负责，paint 后几何信息自动更新）。 */
  function paintPrediction(res, p, ds) {
    if (!res || !res.cases || res.cases.length === 0) return;
    var last = res.cases[res.cases.length - 1];
    if (!last || !last.predictions) return;
    var view = $('#view');
    var canvas = view ? $('#seriesChart', view) : null;
    if (!canvas) return;
    TSJ.drawSeries(canvas, {
      values: ds.values,
      testStart: ds.values.length - p.horizon,
      predictions: last.predictions,
      height: 190
    });
  }

  /* ---------- 5. 左右分栏拖拽 ---------- */
  /** 绑定左右分栏拖拽。 */
  function bindSplitter(view) {
    var layout = $('#problemLayout', view);
    var splitter = $('#splitter', view);
    if (!layout || !splitter) return;

    var dragging = false;

    splitter.addEventListener('pointerdown', function (ev) {
      dragging = true;
      try { splitter.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      document.body.classList.add('dragging');
      ev.preventDefault();
    });

    splitter.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      var rect = layout.getBoundingClientRect();
      if (rect.width <= 0) return;
      var pct = ((ev.clientX - rect.left) / rect.width) * 100;
      pct = Math.max(28, Math.min(68, pct));
      layout.style.setProperty('--split', pct.toFixed(2) + '%');
    });

    /** 结束拖拽。 */
    function stopDrag() {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('dragging');
      if (typeof TSJ.redrawCharts === 'function') TSJ.redrawCharts();
    }

    splitter.addEventListener('pointerup', stopDrag);
    splitter.addEventListener('pointercancel', stopDrag);
    splitter.addEventListener('lostpointercapture', stopDrag);
  }

  TSJ.appUi = {
    mdInline: mdInline,
    md: md,
    canSubmit: canSubmit,
    setBusy: setBusy,
    verdictMiniClass: verdictMiniClass,
    renderCaseList: renderCaseList,
    renderGuardNotice: renderGuardNotice,
    renderResult: renderResult,
    paintPrediction: paintPrediction,
    bindSplitter: bindSplitter
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/a11y.js —— 可访问性基础件（T11）：弹层焦点管理、提示播报、页面标题
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js
 * 挂载点：window.TSJ.appA11y
 *
 * 约定：
 *   1. 所有弹层都复用 index.html 里的 `#overlay`（role="dialog" aria-modal="true"），
 *      打开时把 `#view` 与 `.topbar` 设为 inert，关闭时恢复；
 *   2. Tab 只在弹层内循环（焦点陷阱），ESC 关闭，关闭后焦点回到 `#view`；
 *   3. 轻提示走 `#toast`（role="status"），不做打断式弹窗。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;

  /** 可聚焦选择器（Tab 循环用） */
  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
    'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  var overlay = null;
  var background = [];
  var isOpen = false;
  var onKeyDownBound = null;
  var closeCallback = null;
  var toastTimer = 0;

  /** 取弹层容器。 */
  function getOverlay() {
    if (!overlay) overlay = document.getElementById('overlay');
    return overlay;
  }

  /** 收集容器内当前可聚焦元素（过滤不可见的）。 */
  function focusables(root) {
    var list = core.$$(FOCUSABLE, root);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.getClientRects().length > 0 || el === document.activeElement) out.push(el);
    }
    return out;
  }

  /**
   * 把弹层以外的内容设为 inert（不支持 inert 的内核退化为 aria-hidden）。
   * @param {boolean} on 是否启用
   */
  function setBackgroundInert(on) {
    if (!background.length) {
      var view = document.getElementById('view');
      var topbar = document.querySelector('.topbar');
      if (view) background.push(view);
      if (topbar) background.push(topbar);
    }
    for (var i = 0; i < background.length; i++) {
      var el = background[i];
      if (on) {
        try { el.inert = true; } catch (e) { /* 老内核 */ }
        el.setAttribute('inert', '');
        el.setAttribute('aria-hidden', 'true');
      } else {
        try { el.inert = false; } catch (e) { /* 老内核 */ }
        el.removeAttribute('inert');
        el.removeAttribute('aria-hidden');
      }
    }
  }

  /**
   * 焦点陷阱：Tab / Shift+Tab 在弹层内首尾循环。
   * @param {KeyboardEvent} ev 键盘事件
   */
  function trapTab(ev) {
    var ov = getOverlay();
    if (!ov) return;
    var list = focusables(ov);
    if (list.length === 0) { ev.preventDefault(); return; }
    var first = list[0];
    var last = list[list.length - 1];
    var active = document.activeElement;
    if (ev.shiftKey) {
      if (active === first || !ov.contains(active)) {
        ev.preventDefault();
        last.focus();
      }
    } else if (active === last || !ov.contains(active)) {
      ev.preventDefault();
      first.focus();
    }
  }

  /** 关闭弹层并把焦点交还 #view。 */
  function closeModal() {
    var ov = getOverlay();
    if (!ov || !isOpen) return;
    isOpen = false;
    ov.classList.add('hidden');
    ov.innerHTML = '';
    ov.removeAttribute('aria-label');
    if (onKeyDownBound) {
      document.removeEventListener('keydown', onKeyDownBound, true);
      onKeyDownBound = null;
    }
    setBackgroundInert(false);
    var view = document.getElementById('view');
    if (view) {
      if (!view.hasAttribute('tabindex')) view.setAttribute('tabindex', '-1');
      try { view.focus(); } catch (e) { /* ignore */ }
    }
    var cb = closeCallback;
    closeCallback = null;
    if (typeof cb === 'function') cb();
  }

  /**
   * 打开弹层。
   * @param {Object} opts { html, label, onClose, initialFocus }
   * @returns {Object} { close }
   */
  function openModal(opts) {
    var ov = getOverlay();
    var options = opts || {};
    if (!ov) return { close: function () {} };

    // 若已有弹层，先收掉（保证同时只有一个 dialog）
    if (isOpen) closeModal();

    ov.innerHTML = String(options.html == null ? '' : options.html);
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    if (options.label) ov.setAttribute('aria-label', String(options.label));
    ov.classList.remove('hidden');
    isOpen = true;
    closeCallback = typeof options.onClose === 'function' ? options.onClose : null;
    setBackgroundInert(true);

    /** 全局键盘处理：ESC 关闭 + Tab 陷阱。 */
    onKeyDownBound = function (ev) {
      if (ev.key === 'Escape' || ev.key === 'Esc') {
        ev.preventDefault();
        closeModal();
        return;
      }
      if (ev.key === 'Tab') trapTab(ev);
    };
    document.addEventListener('keydown', onKeyDownBound, true);

    var target = null;
    if (options.initialFocus) target = core.$(options.initialFocus, ov);
    if (!target) {
      var list = focusables(ov);
      target = list.length ? list[0] : null;
    }
    if (target) {
      try { target.focus(); } catch (e) { /* ignore */ }
    } else {
      try { ov.focus(); } catch (e) { /* ignore */ }
    }
    return { close: closeModal, root: ov };
  }

  /** 当前是否有弹层打开。 */
  function modalOpen() {
    return isOpen;
  }

  /**
   * 轻提示（role="status"，2.6s 后自动消失）。
   * @param {string} msg 文案
   * @param {string} [kind] 'ok' | 'warn' | 'err'
   */
  function toast(msg, kind) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = String(msg == null ? '' : msg);
    el.className = 'toast toast-show' + (kind ? ' toast-' + kind : '');
    if (toastTimer) global.clearTimeout(toastTimer);
    toastTimer = global.setTimeout(function () {
      toastTimer = 0;
      el.className = 'toast';
    }, 2600);
  }

  /**
   * 更新页面标题。
   * @param {string} name 当前视图名（题目名 / 题库 / 提交记录 …）
   */
  function setTitle(name) {
    var suffix = '时序竞技场 TSOJ';
    document.title = name ? (name + ' · ' + suffix) : suffix;
  }

  /** 让 #view 获得焦点（路由切换后调用，读屏用户能感知内容已更新）。 */
  function focusView() {
    var view = document.getElementById('view');
    if (!view) return;
    if (!view.hasAttribute('tabindex')) view.setAttribute('tabindex', '-1');
    try { view.focus(); } catch (e) { /* ignore */ }
  }

  TSJ.appA11y = {
    openModal: openModal,
    closeModal: closeModal,
    modalOpen: modalOpen,
    toast: toast,
    setTitle: setTitle,
    focusView: focusView,
    setBackgroundInert: setBackgroundInert
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/views.js —— 题库页（搜索 / 标签 / 难度 / 随机一题）与判题入口注入
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js。
 * 依赖方向单向：views 可用 core / store / storage / ui / a11y，但**不能**直接引用 app.js 的
 * route / runJudge —— 判题回调由 app.js 启动时用 bindRunner() 注入，因此不存在反向依赖与循环依赖。
 * 题目页在 app/problem.js（那里要用到这里的 invokeRunner）。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var STORE = core.STORE;
  var DIFF_CLASS = core.DIFF_CLASS;

  /** 由 app.js 注入的判题入口：function(problem, dataset, isSubmit) */
  var runner = null;

  /** 注入判题入口（app.js 启动时调用一次）。 */
  function bindRunner(fn) {
    runner = typeof fn === 'function' ? fn : null;
  }

  /** 触发判题（未注入时静默忽略，保证 views 可独立渲染）。 */
  function invokeRunner(p, ds, isSubmit) {
    if (runner) runner(p, ds, isSubmit);
  }

  /* ---------- 1. 筛选条件 ---------- */
  /** 汇总所有题目标签（去重，保持首次出现顺序）。 */
  function allTags() {
    var seen = {};
    var out = [];
    for (var i = 0; i < problems.length; i++) {
      for (var t = 0; t < problems[i].tags.length; t++) {
        var tag = problems[i].tags[t];
        if (!seen[tag]) { seen[tag] = true; out.push(tag); }
      }
    }
    return out;
  }

  /** 难度 + 标签 + 搜索词三者取交集。 */
  function matches(p) {
    var st = store.state;
    var q = String(st.query || '').trim().toLowerCase();
    if (q) {
      var hay = (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    if (st.tag && p.tags.indexOf(st.tag) < 0) return false;
    if (st.filter !== '全部' && p.difficulty !== st.filter) return false;
    return true;
  }

  /* ---------- 2. 题库页 ---------- */
  /** 渲染题库页（外壳只渲染一次，筛选变化只重绘列表区）。 */
  function renderProblemList() {
    var view = $('#view');
    var st = store.state;
    var html = [];
    html.push('<div class="page">\n<div class="page-head">\n<h1>题库</h1>');
    html.push('<p class="sub">共 ' + problems.length + ' 题 · 写一个 predict 函数，打败统计基线即可得分，通过后解锁题解</p>\n</div>');

    html.push('<div class="toolbar-row">');
    html.push('  <input type="search" class="search-input" id="searchInput" placeholder="搜索题号 / 标题 / 标签"' +
      ' aria-label="搜索题目" value="' + esc(st.query) + '">');
    html.push('  <button type="button" class="btn btn-random" id="btnRandom" title="优先从还没通过的题目里抽一题">随机一题</button>');
    html.push('  <button type="button" class="btn btn-clear" id="btnClearFilters" hidden>清除筛选</button>');
    html.push('</div>');

    html.push('<div class="filters" role="group" aria-label="按难度筛选">');
    var options = ['全部'].concat(core.DIFFS);
    for (var f = 0; f < options.length; f++) {
      var on = st.filter === options[f] ? ' chip-on' : '';
      html.push('<button type="button" class="chip' + on + '" data-filter="' + esc(options[f]) + '">' +
        esc(options[f]) + '</button>');
    }
    html.push('</div>');

    html.push('<div class="tag-cloud" role="group" aria-label="按标签筛选">');
    var tags = allTags();
    for (var g = 0; g < tags.length; g++) {
      var tagOn = st.tag === tags[g] ? ' on' : '';
      html.push('<button type="button" class="tag-chip' + tagOn + '" data-tag="' + esc(tags[g]) + '">' +
        esc(tags[g]) + '</button>');
    }
    html.push('</div>');

    html.push('<div id="listHost"></div>\n</div>');
    view.innerHTML = html.join('\n');

    bindShell(view);
    paintList();
  }

  /** 绑定题库页外壳交互（搜索框 / 难度 / 标签 / 随机一题）。 */
  function bindShell(view) {
    var input = $('#searchInput', view);
    if (input) {
      var onType = core.debounce(function () {
        store.state.query = input.value;
        paintList();
      }, 120);
      input.addEventListener('input', onType);
    }

    var chips = core.$$('.chip[data-filter]', view);
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        store.state.filter = this.getAttribute('data-filter');
        core.writeJSON(STORE.filter, store.state.filter);
        paintChips();
        paintList();
      });
    }

    var tagChips = core.$$('.tag-chip', view);
    for (var t = 0; t < tagChips.length; t++) {
      tagChips[t].addEventListener('click', function () {
        var tag = this.getAttribute('data-tag');
        store.state.tag = store.state.tag === tag ? null : tag;
        paintChips();
        paintList();
      });
    }

    var btnRandom = $('#btnRandom', view);
    if (btnRandom) btnRandom.addEventListener('click', goRandom);

    var btnClear = $('#btnClearFilters', view);
    if (btnClear) btnClear.addEventListener('click', clearFilters);
  }

  /** 当前是否有任何筛选条件生效（搜索词 / 标签 / 难度）。 */
  function hasActiveFilter() {
    var st = store.state;
    return String(st.query || '').trim() !== '' || st.tag !== null || st.filter !== '全部';
  }

  /** 一键清除所有筛选条件，回到默认态。 */
  function clearFilters() {
    store.state.query = '';
    store.state.tag = null;
    store.state.filter = '全部';
    core.writeJSON(STORE.filter, '全部');
    var input = $('#searchInput');
    if (input) input.value = '';
    paintChips();
    paintList();
  }

  /** 同步「清除筛选」按钮的可见性（有筛选才出现，避免常驻干扰）。 */
  function syncClearBtn() {
    var btn = $('#btnClearFilters');
    if (!btn) return;
    if (hasActiveFilter()) btn.removeAttribute('hidden');
    else btn.setAttribute('hidden', '');
  }

  /** 同步 chip / tag-chip 的选中态（不重绘列表）。 */
  function paintChips() {
    var view = $('#view');
    if (!view) return;
    var chips = core.$$('.chip[data-filter]', view);
    for (var i = 0; i < chips.length; i++) {
      var on = chips[i].getAttribute('data-filter') === store.state.filter;
      chips[i].classList[on ? 'add' : 'remove']('chip-on');
    }
    var tagChips = core.$$('.tag-chip', view);
    for (var t = 0; t < tagChips.length; t++) {
      var tagOn = tagChips[t].getAttribute('data-tag') === store.state.tag;
      tagChips[t].classList[tagOn ? 'add' : 'remove']('on');
    }
  }

  /** 重绘列表区（桌面表格 .prow + 窄屏卡片 .pcard，两份 DOM 由同一循环产出）。 */
  function paintList() {
    var host = $('#listHost');
    if (!host) return;
    var html = [];
    html.push('<div class="table-wrap list-table">\n<table class="ptable"><thead><tr>');
    html.push('<th style="width:64px">编号</th><th>标题</th><th style="width:76px">难度</th>');
    html.push('<th style="width:250px">标签</th><th style="width:62px">状态</th>');
    html.push('<th class="num" style="width:72px">最高分</th><th class="num" style="width:72px">通过率</th>');
    html.push('</tr></thead><tbody>');

    var shown = 0;
    var cards = [];
    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      if (!matches(p)) continue;
      shown++;

      var rec = store.state.progress[p.id] || {};
      var best = toScore(rec.best);
      var stats = store.problemStats(p);
      var tags = '';
      for (var t = 0; t < p.tags.length; t++) tags += '<span class="tag">' + esc(p.tags[t]) + '</span>';
      var status = rec.passed === true
        ? '<span class="status-ok" title="已通过">✓</span>'
        : '<span class="status-no" title="未通过">—</span>';

      html.push('<tr class="prow" tabindex="0" data-id="' + esc(p.id) + '">\n<td class="idx">#' + p.index + '</td>');
      html.push('<td><a class="p-title" href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a></td>');
      html.push('<td><span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span></td>\n<td>' + tags + '</td>');
      html.push('<td>' + status + '</td>');
      html.push('<td class="num">' + (best > 0 ? esc(best) : '—') + '</td>\n<td class="num">' + esc(stats.rate) + '%</td>\n</tr>');

      cards.push('<article class="pcard" tabindex="0" data-id="' + esc(p.id) + '">');
      cards.push('  <div class="pc-head"><span class="pc-idx">#' + p.index + '</span>' +
        '<a class="p-title" href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a></div>');
      cards.push('  <div class="pc-tags">' + tags + '</div>');
      cards.push('  <div class="pc-foot"><span class="badge ' + DIFF_CLASS[p.difficulty] + '">' +
        esc(p.difficulty) + '</span><span class="pc-stat">最高分 ' + (best > 0 ? esc(best) : '—') +
        '</span><span class="pc-stat">通过率 ' + esc(stats.rate) + '%</span><span class="pc-stat">' + status + '</span></div>');
      cards.push('</article>');
    }

    if (shown === 0) {
      html.push('<tr><td colspan="7"><div class="empty">没有符合条件的题目。<br>' +
        '<button type="button" class="btn" data-clear="1">清除筛选</button></div></td></tr>');
    }
    html.push('</tbody></table>\n</div>');

    var cardHtml = ['<div class="pcards">'];
    cardHtml.push(shown === 0
      ? '<div class="empty">没有符合条件的题目。<br><button type="button" class="btn" data-clear="1">清除筛选</button></div>'
      : cards.join('\n'));
    cardHtml.push('</div>');
    html.push(cardHtml.join('\n'));

    host.innerHTML = html.join('\n');
    bindRows(host);

    var inlineClears = core.$$('[data-clear]', host);
    for (var c = 0; c < inlineClears.length; c++) {
      inlineClears[c].addEventListener('click', clearFilters);
    }
    syncClearBtn();
  }

  /** 绑定列表行 / 卡片的点击与键盘操作。 */
  function bindRows(host) {
    var rows = core.$$('.prow, .pcard', host);
    for (var r = 0; r < rows.length; r++) {
      rows[r].addEventListener('click', function (ev) {
        // 标题本身是 <a>，交给浏览器处理
        if (ev.target && ev.target.tagName === 'A') return;
        global.location.hash = '#/problem/' + this.getAttribute('data-id');
      });
      rows[r].addEventListener('keydown', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          global.location.hash = '#/problem/' + this.getAttribute('data-id');
        }
      });
    }
  }

  /** 随机一题：优先从「还没通过」的题目里抽，全部通过后全量随机。 */
  function goRandom() {
    var pool = [];
    var i;
    for (i = 0; i < problems.length; i++) {
      var rec = store.state.progress[problems[i].id];
      if (!rec || rec.passed !== true) pool.push(problems[i]);
    }
    if (pool.length === 0) pool = problems.slice();
    // 用时间戳取模做伪随机：不引入随机数（数据集与判题都要求可复现）
    var pick = pool[Date.now() % pool.length];
    if (pick) global.location.hash = '#/problem/' + pick.id;
  }

  TSJ.appViews = {
    bindRunner: bindRunner,
    invokeRunner: invokeRunner,
    allTags: allTags,
    matches: matches,
    renderProblemList: renderProblemList,
    paintList: paintList,
    goRandom: goRandom
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/problem.js —— 题目页（题面 + 编辑器 + 工具栏）、题解、首次进入引导
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appProblem
 *
 * 判题入口不在这里直接引用 app.js：统一走 views.invokeRunner()（由 app.js 注入），保持单向依赖。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var ui = TSJ.appUi;
  var a11y = TSJ.appA11y;
  var views = TSJ.appViews;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var STORE = core.STORE;
  var DIFF_CLASS = core.DIFF_CLASS;
  var MODE_LABEL = core.MODE_LABEL;
  var md = ui.md;
  var mdInline = ui.mdInline;

  /* ---------- 1. 题目页 ---------- */
  /** 渲染题目详情页（左题面 / 右编辑器）。 */
  function renderProblem(id) {
    var p = TSJ.findProblem(id);
    var view = $('#view');

    if (!p) {
      view.innerHTML = '<div class="page"><div class="empty"><span class="empty-icon">◌</span>' +
        '找不到这道题目。<br><a href="#/problems">返回题库</a></div></div>';
      return;
    }

    var ds = TSJ.findDataset(p.dataset);
    if (!ds) {
      view.innerHTML = '<div class="page"><div class="empty">数据集缺失：' + esc(p.dataset) + '</div></div>';
      return;
    }

    store.state.activeProblem = p;
    var rec = store.state.progress[p.id] || {};
    var draft = store.state.drafts[p.id];
    var code = typeof draft === 'string' ? draft : p.starter;

    view.innerHTML = problemTemplate(p, ds, rec);

    // ---- 数据预览图（画完挂上 hover 交互；句柄存进 state 供路由切换时 destroy）----
    var canvas = $('#seriesChart', view);
    if (canvas) {
      TSJ.drawSeries(canvas, {
        values: ds.values,
        testStart: ds.values.length - p.horizon,
        height: 190
      });
      if (typeof TSJ.attachChartHover === 'function') {
        store.state.chartHover = TSJ.attachChartHover(canvas);
      }
    }

    /** 保存草稿（输入走防抖，Ctrl+S 直接调用）。 */
    function saveDraft() {
      if (!store.state.editor) return false;
      store.state.drafts[p.id] = store.state.editor.getValue();
      return store.saveDrafts();
    }

    // ---- 编辑器 ----
    store.state.editor = TSJ.createEditor($('#editorHost', view), {
      value: code,
      fontSize: store.state.edFont,
      errorHelpId: 'edErrorHelp',
      onChange: core.debounce(function (val) {
        store.state.drafts[p.id] = val;
        store.saveDrafts();
      }, 400),
      onRun: function () { views.invokeRunner(p, ds, false); },
      onSave: function () {
        if (saveDraft()) a11y.toast('草稿已保存', 'ok');
        else a11y.toast('本地存储已满，草稿未保存', 'err');
      }
    });

    // ---- 工具栏 ----
    var btnReset = $('#btnReset', view);
    var btnRun = $('#btnRun', view);
    var btnSubmit = $('#btnSubmit', view);
    var btnSolution = $('#btnSolution', view);
    var btnFont = $('#btnFont', view);

    if (btnFont) {
      var paintFont = function () {
        btnFont.textContent = 'A ' + store.state.edFont;
        btnFont.setAttribute('aria-label', '编辑器字号 ' + store.state.edFont + ' 像素，点击切换');
      };
      paintFont();
      btnFont.addEventListener('click', function () {
        var next = store.state.edFont >= 14 ? 12 : store.state.edFont + 1;
        store.saveEdFont(next);
        if (store.state.editor && typeof store.state.editor.setFontSize === 'function') {
          store.state.editor.setFontSize(next);
        }
        paintFont();
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        if (!store.state.editor) return;
        store.state.editor.setValue(p.starter);
        store.state.drafts[p.id] = p.starter;
        store.saveDrafts();
      });
    }

    var sandboxOk = ui.canSubmit();
    if (btnRun) {
      btnRun.disabled = !sandboxOk;
      btnRun.addEventListener('click', function () { views.invokeRunner(p, ds, false); });
    }
    if (btnSubmit) {
      btnSubmit.disabled = !sandboxOk;
      if (!sandboxOk) btnSubmit.title = TSJ.judge.SANDBOX_REFUSED_REASON || '当前环境无法创建判题沙箱';
      btnSubmit.addEventListener('click', function () { views.invokeRunner(p, ds, true); });
    }
    if (btnSolution) {
      btnSolution.disabled = !rec.passed;
      btnSolution.addEventListener('click', function () { showSolution(p); });
    }

    ui.bindSplitter(view);
    if (sandboxOk) {
      ui.renderResult(null, p);
    } else {
      // 无沙箱 → 禁止提交，并明确告知原因（旧行为是静默降级 + 仍允许提交，死循环会锁死 UI）
      ui.renderGuardNotice({ message: TSJ.judge.SANDBOX_REFUSED_REASON });
    }
  }

  /** 题目页 HTML 模板。 */
  function problemTemplate(p, ds, rec) {
    var tags = '';
    for (var t = 0; t < p.tags.length; t++) tags += '<span class="tag">' + esc(p.tags[t]) + '</span>';

    var modeText = MODE_LABEL[p.mode] || p.mode;
    var modeDetail = p.mode === 'rolling'
      ? modeText + '（' + p.windows + ' 个窗口 / 步长 ' + p.originStep + '）'
      : modeText;

    var meta = [
      '<span class="meta-item">数据集 ' + esc(p.dataset) + '</span>',
      '<span class="meta-item">' + esc(modeDetail) + '</span>',
      '<span class="meta-item">步长 ' + p.horizon + '</span>',
      '<span class="meta-item">指标 ' + esc((TSJ.judge.metricLabels[p.metric] || p.metric)) + '</span>',
      '<span class="meta-item">阈值 ≤ ' + p.threshold + ' × 最优基线</span>',
      '<span class="meta-item">通过线 ' + p.passScore + '</span>'
    ].join('<span class="sep">·</span>');

    var hints = '';
    for (var h = 0; h < p.hints.length; h++) hints += '<li>' + mdInline(p.hints[h]) + '</li>';

    // 本地进度来自 localStorage（file:// 下可被同目录页面写入），因此先归一化再转义
    var bestScore = rec ? toScore(rec.best) : 0;
    var bestBadge = bestScore > 0
      ? '<span class="meta-item" data-best-badge="1" style="color:var(--accent)">历史最高 ' + esc(bestScore) + ' 分</span>'
      : '<span class="meta-item" data-best-badge="1">尚未提交</span>';

    var html = [];
    html.push('<div class="problem-layout" id="problemLayout">');

    /* ---------- 左：题面 ---------- */
    html.push('<section class="pane pane-left">\n  <div class="problem-head">\n    <div class="crumb"><a href="#/problems">题库</a> / #' + p.index + '</div>');
    html.push('    <h1>' + esc(p.title) + '</h1>\n    <div class="meta-row">\n      <span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span>');
    html.push('      ' + tags + '\n      <span class="sep">|</span>' + bestBadge);
    html.push('    </div>\n    <div class="meta-row" style="margin-top:8px">' + meta + '</div>\n  </div>');

    html.push('  <div class="md">' + md(p.statement) + '</div>');

    html.push('  <div class="chart-card">\n    <div class="chart-title"><span>数据预览 · ' + esc(ds.name) + '（' + esc(ds.unit) + '）</span>');
    html.push('      <span>共 ' + ds.values.length + ' 点 · 周期 ' + ds.season + '</span></div>');
    html.push('    <canvas id="seriesChart" class="chart-canvas" height="190"></canvas>\n    <div class="chart-legend">');
    html.push('      <span class="legend-item"><i class="legend-dot" style="border-top-color:#3fb6a8"></i>历史</span>');
    html.push('      <span class="legend-item"><i class="legend-dot" style="border-top-color:#8a97a8"></i>测试集真实值</span>');
    html.push('      <span class="legend-item"><i class="legend-dot dash" style="border-top-color:#a5b4fc"></i>你的预测</span>\n    </div>\n  </div>');

    html.push('  <div class="md" style="margin-top:14px">\n    <h3 class="md-h">输入</h3><p class="md-p">' + mdInline(p.inputSpec) + '</p>');
    html.push('    <h3 class="md-h">输出</h3><p class="md-p">' + mdInline(p.outputSpec) + '</p>\n  </div>');

    html.push('  <details class="hints"><summary>提示（共 ' + p.hints.length + ' 条，点击展开）</summary>');
    html.push('    <div class="hints-body"><ol>' + hints + '</ol></div>\n  </details>');

    html.push('  <div id="solutionHost"></div>\n</section>');

    /* ---------- 分隔条 ---------- */
    html.push('<div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="调整左右分栏宽度" tabindex="-1"></div>');

    /* ---------- 右：编辑器 + 结果 ---------- */
    html.push('<section class="pane pane-right">\n  <div class="editor-toolbar">');
    html.push('    <div class="tb-left"><span class="file-chip">predict.js</span>');
    html.push('      <span class="tb-hint">Ctrl / ⌘ + Enter 运行 · Ctrl / ⌘ + S 存草稿</span></div>\n    <div class="tb-right">');
    html.push('      <button type="button" class="btn btn-ghost ed-font-btn" id="btnFont" title="切换编辑器字号">A 13</button>');
    html.push('      <button type="button" class="btn btn-ghost" id="btnReset">重置模板</button>');
    html.push('      <button type="button" class="btn btn-ghost" id="btnSolution"' + (rec && rec.passed === true ? '' : ' disabled title="通过本题后可查看题解"') + '>查看题解</button>');
    html.push('      <button type="button" class="btn" id="btnRun">运行</button>');
    html.push('      <button type="button" class="btn btn-primary" id="btnSubmit">提交判题</button>\n    </div>');
    html.push('  </div>\n  <div class="editor-host" id="editorHost"></div>');
    html.push('  <p class="ed-help" id="edErrorHelp">代码出错时会在这里说明行号与原因。</p>');
    html.push('  <div class="result-panel" id="resultPanel" aria-live="polite" aria-label="判题结果"></div>\n</section>');

    html.push('</div>');
    return html.join('\n');
  }

  /* ---------- 2. 题解 ---------- */
  /** 在左栏底部展示参考实现。 */
  function showSolution(p) {
    var view = $('#view');
    var host = view ? $('#solutionHost', view) : null;
    if (!host) return;
    if (host.getAttribute('data-open') === '1') {
      host.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var html = [];
    html.push('<div class="solution-box">');
    html.push('  <div class="sb-head"><span>参考实现 · ' + esc(p.title) + '</span><span>' +
      esc(p.difficulty) + '</span></div>');
    html.push('  <pre><code>' + (TSJ.highlightCode ? TSJ.highlightCode(p.solution) : esc(p.solution)) + '</code></pre>\n</div>');
    host.innerHTML = html.join('\n');
    host.setAttribute('data-open', '1');
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- 3. 首次进入引导 ---------- */
  /** 首次进入时的简短引导（弹层：焦点陷阱 + ESC 关闭 + 关闭后焦点回 #view）。 */
  function showOnboarding() {
    var html = [
      '<div class="modal">',
      '  <h2>欢迎来到时序竞技场</h2>',
      '  <div class="modal-flow">',
      '    <span class="flow-step">写 predict 函数</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">提交</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">打败基线得分</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">解锁题解</span>',
      '  </div>',
      '  <p>每道题只要实现一个函数：</p>',
      '  <p><code>predict(history, horizon, ctx) → number[]</code></p>',
      '  <ul>',
      '    <li>得分由「你的误差 ÷ 最优基线误差」决定，误差比越小分越高</li>',
      '    <li>误差比 = 0.5 得满分 100，等于阈值恰好得 60 分，≥ 2 得 0 分</li>',
      '    <li>全部测试点达标才算通过，通过后可查看参考实现</li>',
      '    <li>代码与成绩都存在浏览器本地，随时可以继续</li>',
      '  </ul>',
      '  <div class="modal-actions">',
      '    <button type="button" class="btn btn-primary" id="onbStart">开始做题</button>',
      '  </div>',
      '</div>'
    ].join('\n');

    a11y.openModal({ html: html, label: '欢迎来到时序竞技场', initialFocus: '#onbStart' });
    var btn = $('#onbStart');
    if (btn) {
      btn.addEventListener('click', function () {
        core.writeJSON(STORE.onboarded, true);
        a11y.closeModal();
      });
    }
  }

  /**
   * 刷新题头的「历史最高 / 尚未提交」徽标。
   * 判题落盘后必须调用：否则刚提交完，右上角等级分已经变了，题头却还写着「尚未提交」。
   * @param {Object} p 题目
   */
  function refreshBestBadge(p) {
    var view = $('#view');
    if (!view || !p) return;
    var el = view.querySelector('[data-best-badge]');
    if (!el) return;
    var rec = store.state.progress[p.id];
    var best = rec ? toScore(rec.best) : 0;
    if (best > 0) {
      el.textContent = '历史最高 ' + best + ' 分';
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = '尚未提交';
      el.style.color = '';
    }
  }

  TSJ.appProblem = {
    renderProblem: renderProblem,
    showSolution: showSolution,
    showOnboarding: showOnboarding,
    refreshBestBadge: refreshBestBadge
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/pages.js —— 纯展示型页面：提交记录 / 提交详情 / 排行榜 / 学习路径
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appPages
 *
 * 这些页面没有编辑器、没有判题会话，只是「状态 → HTML」的映射；刷新入口由 app.js 用
 * bindRefresh() 注入，避免反向依赖。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var storage = TSJ.appStorage;
  var ui = TSJ.appUi;
  var a11y = TSJ.appA11y;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var fmtTime = core.fmtTime;
  var DIFF_CLASS = core.DIFF_CLASS;

  /** 由 app.js 注入的「重渲染当前视图」入口 */
  var refresh = null;

  /** 注入刷新入口。 */
  function bindRefresh(fn) {
    refresh = typeof fn === 'function' ? fn : null;
  }

  /** 触发刷新（未注入时静默忽略）。 */
  function doRefresh() {
    if (refresh) refresh();
  }

  /** verdict → 中文标签与 class。 */
  function verdictInfo(v) {
    if (v === 'AC') return { cls: 'verdict-ac', text: 'AC 通过' };
    if (v === 'RE') return { cls: 'verdict-re', text: 'RE 运行错误' };
    if (v === 'TLE') return { cls: 'verdict-tle', text: 'TLE 超时' };
    return { cls: 'verdict-wa', text: 'WA 未通过' };
  }

  /* ---------- 1. 提交记录页 ---------- */
  /** 渲染提交记录列表 + 存储操作条（导出 / 导入 / 清空）。 */
  function renderSubmissions() {
    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>提交记录</h1>');
    html.push('<p class="sub">本地保存最近 120 条记录（含代码快照与逐测试点，可点开复盘）</p></div>');

    html.push('<div class="store-bar" role="group" aria-label="进度管理">');
    html.push('  <button type="button" class="btn" id="btnExport" title="把进度导出成 JSON 文件">导出进度</button>');
    html.push('  <button type="button" class="btn" id="btnImport" title="从 JSON 文件导入并合并进度">导入进度</button>');
    html.push('  <button type="button" class="btn btn-danger" id="btnClear" title="删除本机所有 TSOJ 进度">清空进度</button>');
    html.push('  <input type="file" id="importFile" class="hidden" accept="application/json,.json" aria-hidden="true" tabindex="-1">');
    html.push('</div>');

    if (store.state.submissions.length === 0) {
      html.push('<div class="empty"><span class="empty-icon">◌</span>还没有提交记录。<br>' +
        '<a href="#/problems">去题库挑一道题</a></div>');
    } else {
      html.push('<div class="table-wrap list-table"><table class="ptable"><thead><tr>');
      html.push('<th style="width:150px">时间</th><th>题目</th>\n<th class="num" style="width:80px">分数</th>');
      html.push('<th style="width:120px">结果</th>\n<th style="width:90px">指标</th>\n</tr></thead><tbody>');

      var cards = [];
      for (var i = 0; i < store.state.submissions.length; i++) {
        var s = store.state.submissions[i];
        var info = verdictInfo(s.verdict);
        var sid = esc(s.id);
        html.push('<tr class="srow" tabindex="0" data-sid="' + sid + '">\n<td class="idx">' + esc(fmtTime(s.at)) + '</td>');
        html.push('<td><a class="p-title" href="#/submission/' + sid + '">' + esc(s.title) + '</a></td>');
        html.push('<td class="num">' + esc(toScore(s.score)) + '</td>');
        html.push('<td><span class="' + info.cls + '" style="font-size:12.5px;font-weight:600">' + esc(info.text) + '</span></td>');
        html.push('<td class="num">' + esc(s.metric || '') + '</td>\n</tr>');

        cards.push('<article class="pcard srow-card" tabindex="0" data-sid="' + sid + '">');
        cards.push('  <div class="pc-head"><span class="pc-idx">' + esc(toScore(s.score)) + ' 分</span>' +
          '<a class="p-title" href="#/submission/' + sid + '">' + esc(s.title) + '</a></div>');
        cards.push('  <div class="pc-foot"><span class="' + info.cls + '">' + esc(info.text) + '</span>' +
          '<span class="pc-stat">' + esc(fmtTime(s.at)) + '</span>' +
          '<span class="pc-stat">' + esc(s.metric || '') + '</span></div>');
        cards.push('</article>');
      }

      html.push('</tbody></table></div>');
      html.push('<div class="pcards">' + cards.join('\n') + '</div>');
    }

    html.push('</div>');
    var view = $('#view');
    view.innerHTML = html.join('\n');
    bindStoreBar(view);
    bindSubmissionRows(view);
  }

  /** 绑定导出 / 导入 / 清空。 */
  function bindStoreBar(view) {
    var btnExport = $('#btnExport', view);
    var btnImport = $('#btnImport', view);
    var btnClear = $('#btnClear', view);
    var fileInput = $('#importFile', view);

    if (btnExport) {
      btnExport.addEventListener('click', function () {
        storage.exportProgress();
        a11y.toast('已导出进度文件', 'ok');
      });
    }
    if (btnImport && fileInput) {
      btnImport.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = '';   // 允许重复选同一个文件
        if (!file) return;
        storage.importFile(file, function (result) {
          if (!result.ok) {
            a11y.toast('导入失败：' + result.reason, 'err');
            return;
          }
          a11y.toast('导入成功：进度 ' + result.counts.progress + ' 题 · 草稿 ' +
            result.counts.drafts + ' 份 · 提交 ' + result.counts.submissions + ' 条', 'ok');
          doRefresh();
        });
      });
    }
    if (btnClear) {
      btnClear.addEventListener('click', function () {
        var html = [
          '<div class="modal">',
          '  <h2>清空本机进度？</h2>',
          '  <p>将删除本机所有 TSOJ 数据：各题最高分、提交记录、代码草稿、引导标记。此操作不可撤销。</p>',
          '  <p>建议先「导出进度」留一份备份。</p>',
          '  <div class="modal-actions">',
          '    <button type="button" class="btn" id="clearCancel">取消</button>',
          '    <button type="button" class="btn btn-danger" id="clearConfirm">确认清空</button>',
          '  </div>',
          '</div>'
        ].join('\n');
        a11y.openModal({ html: html, label: '清空本机进度', initialFocus: '#clearCancel' });
        var cancel = $('#clearCancel');
        var confirm = $('#clearConfirm');
        if (cancel) cancel.addEventListener('click', function () { a11y.closeModal(); });
        if (confirm) {
          confirm.addEventListener('click', function () {
            var keys = storage.clearAll();
            a11y.closeModal();
            a11y.toast('已清空 ' + keys.length + ' 项本地数据', 'ok');
            store.updateScoreChip();
            doRefresh();
          });
        }
      });
    }
  }

  /** 绑定提交记录行 / 卡片：点击或 Enter 打开详情。 */
  function bindSubmissionRows(view) {
    var rows = core.$$('.srow', view);
    for (var i = 0; i < rows.length; i++) {
      rows[i].addEventListener('click', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        global.location.hash = '#/submission/' + this.getAttribute('data-sid');
      });
      rows[i].addEventListener('keydown', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          global.location.hash = '#/submission/' + this.getAttribute('data-sid');
        }
      });
    }
  }

  /* ---------- 2. 提交详情页 ---------- */
  /** 按 id 找提交记录。 */
  function findSubmission(id) {
    for (var i = 0; i < store.state.submissions.length; i++) {
      if (store.state.submissions[i].id === id) return store.state.submissions[i];
    }
    return null;
  }

  /**
   * 渲染提交详情：题目 / 时间 / 分数 / verdict / 逐测试点 / 只读代码快照。
   * @param {string} id 提交记录 id
   */
  function renderSubmissionDetail(id) {
    var view = $('#view');
    var s = findSubmission(id);

    if (!s) {
      view.innerHTML = '<div class="page"><div class="empty"><span class="empty-icon">◌</span>' +
        '找不到这条提交记录（可能已被清空或来自其它浏览器）。<br>' +
        '<a href="#/submissions">返回提交记录</a></div></div>';
      return;
    }

    var info = verdictInfo(s.verdict);
    var p = TSJ.findProblem(s.problemId);
    var html = [];

    html.push('<div class="page detail-page">');
    html.push('<div class="crumb"><a href="#/submissions">提交记录</a> / 详情</div>');
    html.push('<div class="page-head"><h1>' + esc(s.title || (p ? p.title : '未知题目')) + '</h1>');
    html.push('<p class="sub">提交于 ' + esc(fmtTime(s.at)) + ' · 记录 ' + esc(s.id) + '</p></div>');

    html.push('<div class="detail-head">');
    html.push('  <div class="detail-score"><b>' + esc(toScore(s.score)) + '</b><span>分</span></div>');
    html.push('  <div class="detail-meta">');
    html.push('    <div class="verdict ' + info.cls + '">' + esc(info.text) + '</div>');
    html.push('    <div class="result-sub">指标 ' + esc(s.metric || '—') +
      ' · 通过线 ' + (p ? esc(p.passScore) : '—') + ' 分</div>');
    if (s.degraded) html.push('    <div class="result-sub dim">该次判题在降级沙箱中执行</div>');
    html.push('  </div>');
    html.push('  <div class="detail-actions">');
    if (p) html.push('    <a class="btn" href="#/problem/' + esc(p.id) + '">回到题目</a>');
    html.push('    <a class="btn btn-ghost" href="#/submissions">返回提交记录</a>');
    html.push('  </div>\n</div>');

    // 逐测试点
    html.push('<h2 class="section-title">逐测试点</h2>');
    if (s.cases.length === 0) {
      html.push('<div class="notice">这条记录没有逐测试点明细（早于 v1 的记录只有总分）。</div>');
    } else {
      html.push(ui.renderCaseList(s.cases, false));
    }

    // 代码快照（只读、已转义、带语法高亮）
    html.push('<h2 class="section-title">提交时的代码</h2>');
    if (!s.code) {
      html.push('<div class="notice">这条记录没有代码快照（早于 v1 的记录只存了成绩）。</div>');
    } else {
      html.push('<pre class="detail-code" tabindex="0" aria-label="提交时的代码"><code>' +
        (TSJ.highlightCode ? TSJ.highlightCode(s.code) : esc(s.code)) + '</code></pre>');
      html.push('<p class="sub dim">代码快照最多保存 20KB，超出部分未保存。</p>');
    }

    html.push('</div>');
    view.innerHTML = html.join('\n');
  }

  TSJ.appPages = {
    bindRefresh: bindRefresh,
    verdictInfo: verdictInfo,
    renderSubmissions: renderSubmissions,
    findSubmission: findSubmission,
    renderSubmissionDetail: renderSubmissionDetail
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/boards.js —— 两个只读看板：排行榜 / 学习路径
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → boards → app.js
 * 挂载点：window.TSJ.appBoards
 *
 * 这两页没有任何写操作，纯粹是「state → HTML」的映射，因此和「有导入/清空动作」的 pages.js 分开，
 * 各自都能守住可维护性上限。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var DIFF_CLASS = core.DIFF_CLASS;

  /* ---------- 1. 排行榜 ---------- */
  /** 渲染排行榜（参考解法 vs 你）。 */
  function renderRanking() {
    var refScores = store.computeRefScores();
    var myTotal = store.totalScore();
    var myPassed = 0;
    var refTotal = 0;
    var refPassed = 0;
    var i;

    for (i = 0; i < problems.length; i++) {
      var rec = store.state.progress[problems[i].id];
      if (rec && rec.passed === true) myPassed++;
      var rs = toScore(refScores[problems[i].id]);
      refTotal += rs;
      if (rs >= problems[i].passScore) refPassed++;
    }

    var rows = [
      { name: '参考解法（Holt-Winters）', you: false, total: refTotal, passed: refPassed, note: '每题由参考实现自动评分' },
      { name: '你', you: true, total: myTotal, passed: myPassed, note: '本地成绩' }
    ];
    rows.sort(function (a, b) { return b.total - a.total; });

    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>排行榜</h1>' +
      '<p class="sub">本地榜单 · 虚拟对手「参考解法（Holt-Winters）」的每题分数由参考实现实时计算</p></div>');

    html.push('<div class="table-wrap"><table class="ptable"><thead><tr>\n<th style="width:60px">排名</th><th>选手</th>' +
      '<th class="num" style="width:100px">总分</th>\n<th class="num" style="width:100px">通过题数</th>' +
      '<th style="width:200px">说明</th>\n</tr></thead><tbody>');

    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var gClass = r === 0 ? ' g1' : (r === 1 ? ' g2' : ' g3');
      html.push('<tr class="' + (row.you ? 'rank-me' : '') + '">' +
        '<td><span class="rank-badge' + gClass + '">' + (r + 1) + '</span></td>' +
        '<td class="' + (row.you ? 'rank-you' : '') + '">' + esc(row.name) + '</td>' +
        '<td class="num">' + esc(row.total) + '</td>' +
        '<td class="num">' + esc(row.passed) + ' / ' + problems.length + '</td>' +
        '<td style="color:var(--muted);font-size:12px">' + esc(row.note) + '</td>\n</tr>');
    }
    html.push('</tbody></table></div>');

    // 每题对比
    html.push('<h2 class="section-title">逐题最佳分对比</h2>\n<div class="ref-grid">');
    for (var j = 0; j < problems.length; j++) {
      var p = problems[j];
      var mine = toScore(store.state.progress[p.id] && store.state.progress[p.id].best);
      var ref = toScore(refScores[p.id]);
      html.push('<div class="ref-row">\n  <span class="rf-idx">#' + p.index + '</span>' +
        '  <a class="rf-name" href="#/problem/' + esc(p.id) + '" title="' + esc(p.title) + '">' +
        esc(p.title) + '</a>');
      html.push('  <span class="rf-track" title="青色=你，紫色=参考解">' +
        '<span class="rf-you" style="width:' + Math.max(0, Math.min(100, mine)) + '%"></span>' +
        '<span class="rf-ref" style="width:' + Math.max(0, Math.min(100, ref)) + '%"></span></span>');
      html.push('  <span class="rf-score">' + esc(mine) + ' / ' + esc(ref) + '</span>\n</div>');
    }
    html.push('</div>');

    html.push('<p class="sub" style="margin-top:14px;font-size:12px">' +
      '青条 = 你的最高分，紫条 = 参考解法得分（0~100）。' +
      '总分 = 各题最高分之和，满分 ' + (problems.length * 100) + '。</p>');
    html.push('</div>');

    $('#view').innerHTML = html.join('\n');
  }

  /* ---------- 2. 学习路径 ---------- */
  /** 渲染学习路径时间线。 */
  function renderPath() {
    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>学习路径</h1>' +
      '<p class="sub">从零参数基线到滚动回测：每一步都在补上一块新的建模能力</p></div>\n<div class="timeline">');

    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      var rec = store.state.progress[p.id] || {};
      var done = rec.passed === true;
      var best = toScore(rec.best);

      html.push('<div class="tl-item">' +
        '  <div class="tl-dot' + (done ? ' done' : '') + '">' + (done ? '✓' : p.index) + '</div>' +
        '  <div class="tl-card' + (done ? ' done' : '') + '">' +
        '    <div class="tl-top">' +
        '<span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span>' +
        '<a href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a>');
      for (var t = 0; t < p.tags.length; t++) {
        html.push('      <span class="tag">' + esc(p.tags[t]) + '</span>');
      }
      html.push('    </div>\n    <div class="tl-desc">' + esc(store.pathSummary(p)) + '</div>');
      html.push('    <div class="tl-note">' + (done
        ? '已通过 · 最高分 ' + esc(best) + ' · 题解已解锁'
        : (best > 0 ? '最高分 ' + esc(best) + ' · 尚未达到通过线 ' + esc(p.passScore) : '未开始')) + '</div>');
      html.push('  </div>\n</div>');
    }

    html.push('</div>\n</div>');
    $('#view').innerHTML = html.join('\n');
  }

  TSJ.appBoards = {
    renderRanking: renderRanking,
    renderPath: renderPath
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app.js —— 应用外壳：路由、判题会话、启动装配
 *
 * 加载顺序（经典 script）：core → store → storage → ui → a11y → views → pages → app.js。
 * 本文件必须是**最后一个**脚本，且末尾同步调用 init()：靠「脚本位于 body 末尾」保证 DOM 已就绪，
 * 不监听任何页面加载事件。
 *
 * 路由表：
 *   #/problems            题库（搜索 / 标签 / 难度）
 *   #/problem/<id>        题目页（题面 + 编辑器）
 *   #/submission/<id>     提交详情（代码快照 + 逐测试点）
 *   #/submissions         提交记录（含导出 / 导入 / 清空）
 *   #/ranking             排行榜
 *   #/path                学习路径
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var storage = TSJ.appStorage;
  var ui = TSJ.appUi;
  var a11y = TSJ.appA11y;
  var views = TSJ.appViews;
  var problem = TSJ.appProblem;
  var pages = TSJ.appPages;
  var boards = TSJ.appBoards;
  var judge = TSJ.judge;

  var $ = core.$;
  var esc = core.esc;
  var STORE = core.STORE;
  var state = store.state;

  /** 提交记录 id 的会话内序号（不引入随机数：数据集与判题都要求可复现） */
  var subSeq = 0;

  /* ---------- 1. 路由 ---------- */
  /** 解析 hash 并渲染对应视图。 */
  function route() {
    var hash = global.location.hash || '#/problems';
    var path = hash.replace(/^#\/?/, '');
    var parts = path.split('/').filter(function (s) { return s.length > 0; });
    var view = parts[0] || 'problems';

    // 切换路由前销毁旧编辑器与旧图表 hover 句柄（否则 pointermove 监听会累积）
    if (state.editor && typeof state.editor.destroy === 'function') state.editor.destroy();
    state.editor = null;
    if (state.chartHover && typeof state.chartHover.destroy === 'function') state.chartHover.destroy();
    state.chartHover = null;
    state.activeProblem = null;
    state.lastResult = null;

    // 作废旧判题会话：令牌自增让在途回调全部失配（整段丢弃），并立刻 terminate 旧 Worker。
    // 注意：这里**不**重置任何「忙」布尔量 —— 忙闲由 token 判定，重置布尔量正是旧竞态的根源。
    state.judgeToken++;
    if (state.session && typeof state.session.abort === 'function') state.session.abort();
    state.session = null;
    state.busyToken = -1;

    // 路由切换时如果有弹层打开，先关掉（避免弹层浮在新页面上）
    if (a11y.modalOpen()) a11y.closeModal();

    if (view === 'problem' && parts[1]) {
      var p = TSJ.findProblem(decodeURIComponent(parts[1]));
      store.setActiveNav('problems');
      problem.renderProblem(parts[1]);
      a11y.setTitle(p ? p.title : '题目不存在');
    } else if (view === 'submission' && parts[1]) {
      store.setActiveNav('submissions');
      pages.renderSubmissionDetail(decodeURIComponent(parts[1]));
      a11y.setTitle('提交详情');
    } else if (view === 'submissions') {
      store.setActiveNav('submissions');
      pages.renderSubmissions();
      a11y.setTitle('提交记录');
    } else if (view === 'ranking') {
      store.setActiveNav('ranking');
      boards.renderRanking();
      a11y.setTitle('排行榜');
    } else if (view === 'path') {
      store.setActiveNav('path');
      boards.renderPath();
      a11y.setTitle('学习路径');
    } else {
      store.setActiveNav('problems');
      views.renderProblemList();
      a11y.setTitle('题库');
    }

    store.updateScoreChip();
    global.scrollTo(0, 0);
    a11y.focusView();
  }

  /* ---------- 2. 判题 ---------- */
  /** 判断某个判题会话是否已经过期（被新提交或路由切换作废）。 */
  function isStale(token, p) {
    return token !== state.judgeToken || state.activeProblem !== p;
  }

  /** 触发判题。 */
  function runJudge(p, ds, isSubmit) {
    if (!state.editor) return;
    // 同一会话内已有判题在跑 → 忽略重复点击；会话被切走后 busyToken 自动失配，新页面可立即判题
    if (state.busyToken === state.judgeToken) return;

    var code = state.editor.getValue();
    state.drafts[p.id] = code;
    store.saveDrafts();
    if (typeof state.editor.clearError === 'function') state.editor.clearError();

    var token = ++state.judgeToken;
    state.busyToken = token;
    var session = {};
    state.session = session;
    ui.setBusy(true, token);

    judge.evaluate({ problem: p, dataset: ds, code: code, session: session }).then(function (res) {
      // 首行校验会话：不匹配就整段丢弃（不碰 DOM、不写存储），旧结果绝不会落到新页面
      if (isStale(token, p)) return;
      state.busyToken = -1;
      state.session = null;
      ui.setBusy(false, token);
      state.lastResult = res;

      if (isSubmit) persistResult(p, res, code);
      ui.renderResult(res, p);
      ui.paintPrediction(res, p, ds);

      // RE：把错误行标注到编辑器上（同时更新 aria-describedby 指向的说明文本）
      if (res.verdict === 'RE' && res.cases && res.cases.length > 0) {
        var line = null;
        for (var i = 0; i < res.cases.length; i++) {
          if (res.cases[i].line) { line = res.cases[i].line; break; }
        }
        if (line && state.editor) state.editor.markError(line);
      }
    }).catch(function (err) {
      if (isStale(token, p)) return;
      state.busyToken = -1;
      state.session = null;
      ui.setBusy(false, token);
      ui.renderResult({
        verdict: 'RE',
        passed: false,
        score: 0,
        passScore: p.passScore,
        metricLabel: judge.metricLabels[p.metric] || p.metric,
        cases: [],
        message: '判题器异常：' + ((err && err.message) || String(err))
      }, p);
    });
  }

  /**
   * 把判题结果写入存储（进度 + 带代码快照与逐测试点的提交记录）。
   * @param {Object} p 题目
   * @param {Object} res 判题结果
   * @param {string} code 本次提交的代码
   */
  function persistResult(p, res, code) {
    var now = Date.now();
    var rec = state.progress[p.id] || { best: 0, passed: false, attempts: 0 };
    rec.attempts = (rec.attempts || 0) + 1;
    rec.best = Math.max(rec.best || 0, res.score);
    rec.passed = !!rec.passed || !!res.passed;
    rec.lastVerdict = res.verdict;
    rec.lastAt = now;
    state.progress[p.id] = rec;
    store.saveProgress();

    // 逐测试点快照：只留 6 个字段，防止把整份报告（含 allBaselines / predictions）写进存储
    var cases = [];
    var src = res.cases || [];
    for (var i = 0; i < src.length && i < core.MAX_CASES; i++) {
      cases.push({
        index: core.toCount(src[i].index),
        verdict: src[i].verdict,
        score: core.toScore(src[i].score),
        yourMetric: core.toMetric(src[i].yourMetric),
        bestBaseline: core.toMetric(src[i].bestBaseline),
        baselineName: core.toText(src[i].baselineName)
      });
    }

    subSeq++;
    state.submissions.unshift({
      id: now + '-' + core.fnv1a(code + '|' + now + '|' + subSeq).slice(0, 8),
      at: now,
      problemId: p.id,
      title: p.title,
      score: res.score,
      verdict: res.verdict,
      passed: !!res.passed,
      metric: res.metricLabel,
      code: core.truncateCode(code),
      cases: cases,
      degraded: res.degraded === true
    });
    store.saveSubmissions();
    store.updateScoreChip();
    // 题头的「历史最高 / 尚未提交」必须跟着落盘结果一起刷新，否则要手动刷新页面才更新
    if (TSJ.appProblem && typeof TSJ.appProblem.refreshBestBadge === 'function') {
      TSJ.appProblem.refreshBestBadge(p);
    }

    // 通过后解锁题解按钮（查询限定在 #view 内，避免摸到别的页面的按钮）
    var view = $('#view');
    var btnSolution = view ? $('#btnSolution', view) : null;
    if (btnSolution && rec.passed) {
      btnSolution.disabled = false;
      btnSolution.removeAttribute('title');
    }
  }

  /* ---------- 3. 启动 ---------- */
  /** 应用初始化。 */
  function init() {
    // 读出的数据一律视为不可信：先过类型守卫（不合法则丢弃并静默重写），再逐字段归一化
    store.loadState();

    // 注入判题入口与刷新入口：views / pages 不反向引用 app.js，避免循环依赖
    views.bindRunner(runJudge);
    pages.bindRefresh(route);

    // 写盘失败（配额不足 / 隐私模式）→ 明确提示并降级为内存态
    core.onWriteError(function (quota) {
      state.storageOk = false;
      a11y.toast(quota ? '本地存储已满，进度未保存' : '本地存储不可用，进度仅在本次会话内有效', 'err');
    });

    // 跨标签页同步：别的页面改了 tsoj:* → 重新装载并重渲染当前视图（避免后写覆盖先写）
    store.onExternalChange(function () { route(); });
    storage.bindStorageSync();

    global.addEventListener('hashchange', route);

    if (!global.location.hash) global.location.hash = '#/problems';
    route();
    store.updateScoreChip();

    if (core.readJSON(STORE.onboarded, false, function (v) { return typeof v === 'boolean'; }) !== true) {
      problem.showOnboarding();
    }
  }

  TSJ.app = {
    route: route,
    runJudge: runJudge,
    persistResult: persistResult,
    init: init
  };

  init();
})(typeof window !== 'undefined' ? window : this);

</script>
</body>
</html>
