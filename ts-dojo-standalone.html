  }

  function metricValue(name, actual, pred) {
    var fn = judge.metrics[name];
    return fn ? fn(actual, pred) : NaN;
  }

  /**
   * 运行实验。
   * @param {Object} rawConfig 配置
   * @param {Object} session { token, onOrigin, onStatus }
   * @returns {Promise<Object>} 结果；被取消时 resolve { canceled:true }
   */
  function run(rawConfig, session) {
    session = session || {};
    var started = (global.performance && global.performance.now) ? global.performance.now() : Date.now();
    var norm = TSJ.labConfig.normalize(rawConfig);
    if (!norm.ok) {
      return Promise.resolve({ ok: false, errors: norm.errors });
    }
    var cfg = norm.config;
    var token = session.token;
    var ds = null;
    for (var i = 0; i < (TSJ.datasets || []).length; i++) {
      if (TSJ.datasets[i].id === cfg.datasetId) ds = TSJ.datasets[i];
    }
    if (!ds) return Promise.resolve({ ok: false, errors: ['数据集不存在：' + cfg.datasetId] });

    var points = judge.buildTestPoints(ds.values, {
      mode: cfg.split.mode,
      horizon: cfg.split.horizon,
      windows: cfg.split.windows,
      originStep: cfg.split.originStep,
      season: ds.season,
      freq: ds.freq,
      datasetId: ds.id
    });
    // 防御：即使配置校验漏过，也不允许在“训练段不足 4 点”的荒谬状态下继续
    if (!points.length || !points[0].history || points[0].history.length < 4) {
      return Promise.resolve({ ok: false, errors: ['数据集太短：无法按当前配置构造任何训练/测试点'] });
    }

    var meta = TSJ.labConfig.METHODS[cfg.method];
    var runJobs = adapters.createRunner(cfg.method, cfg.params);
    var origins = [];
    var aggregate = {};
    var baselineAggregate = {};
    cfg.metrics.forEach(function (m) { aggregate[m] = []; baselineAggregate[m] = []; });

    function step() {
      if (session.token != null && token != null && session.token !== token) {
        return Promise.resolve({ canceled: true });
      }
      if (!origins.length && points.length) return runOrigin(points[0], 0);
      var idx = origins.length;
      if (idx >= points.length) return finish();
      return runOrigin(points[idx], idx);
    }

    function runOrigin(point, idx) {
      var jobs = [];
      var trainIndex = [];
      if (cfg.interval.enabled) {
        var start = Math.max(meta.minHistory, 2);
        for (var t = start; t < point.history.length; t++) {
          // 校准任务必须携带与最终预测相同的 season：多数参考解读取 ctx.season
          // （Holt-Winters/Theta/组合/DLinear），season 不一致会让校准残差
          // 来自另一个参数形态的模型，区间与覆盖率系统性失真。
          jobs.push({ history: point.history.slice(0, t), horizon: 1, ctx: { season: ds.season, datasetId: ds.id, index: t } });
          trainIndex.push(t);
        }
      }
      var finalJob = jobs.length;
      jobs.push({ history: point.history.slice(), horizon: cfg.split.horizon, ctx: point.ctx });

      var run;
      try {
        run = runJobs(jobs);
      } catch (err) {
        return Promise.resolve({ ok: false, errors: ['第 ' + (idx + 1) + ' 个测试点执行失败：' + ((err && err.message) || err)] });
      }
      for (var k = 0; k < run.results.length; k++) {
        if (!run.results[k] || run.results[k].status !== 'ok') {
          return Promise.resolve({ ok: false, errors: ['第 ' + (idx + 1) + ' 个测试点预测失败：' + ((run.results[k] && run.results[k].error) || '未知错误')] });
        }
      }

      var prediction = run.results[finalJob].value;
      var baselinePred = judge.baselines[cfg.baseline](point.history.slice(), cfg.split.horizon, point.ctx);
      var metrics = {};
      var baselineMetrics = {};
      cfg.metrics.forEach(function (m) {
        metrics[m] = metricValue(m, point.actual, prediction);
        baselineMetrics[m] = metricValue(m, point.actual, baselinePred);
        if (finite(metrics[m])) aggregate[m].push(metrics[m]);
        if (finite(baselineMetrics[m])) baselineAggregate[m].push(baselineMetrics[m]);
      });

      var intervals = [];
      var coverage = [];
      if (cfg.interval.enabled) {
        var residuals = [];
        for (var r = 0; r < trainIndex.length; r++) {
          var pv = run.results[r].value[0];
          if (finite(pv)) residuals.push(point.history[trainIndex[r]] - pv);
        }
        residuals.sort(function (a, b) { return a - b; });
        intervals = labStats.empiricalIntervals(residuals, cfg.interval.levels);
        intervals.forEach(function (iv) {
          var band = labStats.applyInterval(prediction, iv);
          coverage.push({
            level: iv.level,
            n: point.actual.length,
            rate: labStats.coverage(point.actual, band.lower, band.upper).rate
          });
          iv.lower = band.lower;
          iv.upper = band.upper;
        });
      }

      origins.push({
        index: idx,
        history: point.history,
        actual: point.actual,
        prediction: prediction,
        baseline: baselinePred,
        metrics: metrics,
        baselineMetrics: baselineMetrics,
        intervals: intervals,
        coverage: coverage
      });

      if (typeof session.onOrigin === 'function') session.onOrigin(origins[origins.length - 1], idx + 1, points.length);
      return yieldControl().then(step);
    }

    function finish() {
      var mean = {};
      var worst = {};
      var baselineMean = {};
      var baselineWorst = {};
      cfg.metrics.forEach(function (m) {
        var arr = aggregate[m];
        var barr = baselineAggregate[m];
        mean[m] = arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : NaN;
        worst[m] = arr.length ? Math.max.apply(null, arr) : NaN;
        baselineMean[m] = barr.length ? barr.reduce(function (a, b) { return a + b; }, 0) / barr.length : NaN;
        baselineWorst[m] = barr.length ? Math.max.apply(null, barr) : NaN;
      });
      var durationMs = ((global.performance && global.performance.now) ? global.performance.now() : Date.now()) - started;
      return {
        ok: true,
        canceled: false,
        schema: 1,
        appVersion: '3.2.0',
        algorithmVersion: 'lab-1',
        datasetVersion: 'datasets-' + ((TSJ.datasets || []).length),
        createdAt: Date.now(),
        config: cfg,
        configHash: hashConfig(cfg),
        origins: origins,
        metrics: { mean: mean, worst: worst, baselineMean: baselineMean, baselineWorst: baselineWorst },
        baseline: cfg.baseline,
        intervalMeta: cfg.interval.enabled
          ? { kind: 'residual-empirical', note: '训练段内部一步残差分位；教学演示，非模型原生概率输出' }
          : null,
        durationMs: Math.round(durationMs)
      };
    }

    return step();
  }

  TSJ.labRunner = { run: run, hashConfig: hashConfig };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/util.js —— 通用工具：转义、DOM 查询、格式化、防抖
 *
 * 加载顺序：util → core → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appUtil（core.js 会再导出一份，保持 core.esc / core.$ 这类调用点不变）
 *
 * 这里只放「与业务无关的纯工具」，不含任何状态、不读写存储。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});

  /**
   * querySelector 简写（建议总传入 root，把查询限制在 #view 内）。
   * @param {string} sel 选择器
   * @param {Element|Document} [root] 根节点
   * @returns {Element|null}
   */
  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  /**
   * querySelectorAll → 真数组（便于 forEach / map）。
   * @param {string} sel 选择器
   * @param {Element|Document} [root] 根节点
   * @returns {Element[]}
   */
  function $$(sel, root) {
    var list = (root || document).querySelectorAll(sel);
    var out = [];
    for (var i = 0; i < list.length; i++) out.push(list[i]);
    return out;
  }

  /**
   * HTML 转义（拼进 innerHTML 的文本一律先过这里）。
   * @param {*} s 任意值
   * @returns {string}
   */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * 数字格式化（用于指标展示）：大数少小数，小数多小数。
   * @param {*} v 值
   * @returns {string}
   */
  function fmtNum(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    var a = Math.abs(v);
    if (a >= 10000) return v.toFixed(0);
    if (a >= 100) return v.toFixed(1);
    if (a >= 1) return v.toFixed(2);
    if (a === 0) return '0';
    return v.toFixed(4);
  }

  /**
   * 时间格式化：YYYY-MM-DD HH:mm。非法时间戳返回占位符。
   * @param {number} ts 毫秒时间戳
   * @returns {string}
   */
  function fmtTime(ts) {
    if (!isFinite(ts) || ts <= 0) return '—';
    var d = new Date(ts);
    /** 补零。 */
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /**
   * 文件名里的日期戳：YYYYMMDD。
   * @param {number} [ts] 毫秒时间戳（缺省用当前时间）
   * @returns {string}
   */
  function fmtDateStamp(ts) {
    var d = new Date(isFinite(ts) && ts > 0 ? ts : Date.now());
    /** 补零。 */
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    return String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  /**
   * 简单防抖（最后一次调用后 wait 毫秒执行）。
   * @param {Function} fn 目标函数
   * @param {number} wait 毫秒
   * @returns {Function}
   */
  function debounce(fn, wait) {
    var timer = 0;
    return function () {
      var args = arguments;
      var self = this;
      if (timer) global.clearTimeout(timer);
      timer = global.setTimeout(function () {
        timer = 0;
        fn.apply(self, args);
      }, wait);
    };
  }

  TSJ.appUtil = {
    $: $,
    $$: $$,
    esc: esc,
    fmtNum: fmtNum,
    fmtTime: fmtTime,
    fmtDateStamp: fmtDateStamp,
    debounce: debounce
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/core.js —— 存储读写、校验哈希、类型守卫与基础归一化
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appCore
 *
 * 设计约定：
 *   1. 本文件不依赖 app 层其它文件，因此永远可以最早加载（util 除外）；
 *   2. localStorage 在 file:// 下属于**共享的不透明源**，读出的内容一律视为不可信输入：
 *      先过类型守卫，再逐字段归一化（归一化函数在 app/schema.js），必要时静默回写；
 *   3. 写失败（配额不足 / 隐私模式）必须能被 UI 感知：writeJSON 返回布尔值并触发 onWriteError。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var util = TSJ.appUtil;

  /** 难度档位（顺序即展示顺序） */
  var DIFFS = ['入门', '普及', '提高', '挑战'];
  /** 难度 → CSS class */
  var DIFF_CLASS = { '入门': 'diff-ru', '普及': 'diff-pu', '提高': 'diff-ti', '挑战': 'diff-ch' };
  /** 判题模式 → 中文名 */
  var MODE_LABEL = { holdout: '留出法', rolling: '滚动回测' };

  /** 当前存储格式版本；导入时 schema 高于此值一律拒绝（低版本按白名单归一化后接受） */
  var CURRENT_SCHEMA = 1;
  /** 单条提交记录里代码快照的截断上限（20KB） */
  var CODE_LIMIT = 20 * 1024;
  /** 提交记录保留条数 */
  var MAX_SUBMISSIONS = 120;
  /** 单条提交记录里逐测试点明细的上限 */
  var MAX_CASES = 32;
  /** 所有存储键的公共前缀：清空进度只删这个前缀的键 */
  var STORAGE_PREFIX = 'tsoj:';

  /**
   * localStorage 键名（统一 tsoj: 前缀；禁止在别处硬编码键名字面量）。
   *   progress      { [problemId]: { best, passed, attempts, lastVerdict, lastAt } }
   *   drafts        { [problemId]: code }
   *   submissions   [ { id, at, problemId, title, score, verdict, passed, metric, code, cases, degraded } ]
   *   onboarded     true / filter 难度筛选值 / schema 版本号 / edFont 编辑器字号
   */
  var STORE = {
    progress: 'tsoj:progress',
    drafts: 'tsoj:drafts',
    submissions: 'tsoj:submissions',
    onboarded: 'tsoj:onboarded',
    filter: 'tsoj:filter',
    schema: 'tsoj:schema',
    edFont: 'tsoj:edFont',
    theme: 'tsoj:theme',
    courseProgress: 'tsoj:courseProgress:v1',
    lab: 'tsoj:lab:v1',
    labDraft: 'tsoj:labDraft:v1',
    studioDraft: 'tsoj:studioDraft:v1',
    studioCsv: 'tsoj:studioCsv:v1',
    achievements: 'tsoj:achievements:v1',
    achMeta: 'tsoj:achMeta:v1',
    studioExp: 'tsoj:studioExperiments:v1'
  };

  /* ---------- 1. 类型守卫 ---------- */
  /** 是否为「纯对象」（非 null / 非数组 / 非函数）。 */
  function isPlainObject(v) {
    return Object.prototype.toString.call(v) === '[object Object]';
  }

  /** 是否为数组（跨 realm 安全，不用 instanceof）。 */
  function isArrayValue(v) {
    return Object.prototype.toString.call(v) === '[object Array]';
  }

  /* ---------- 2. 存储读写 ---------- */
  /** 写失败回调（由 app 层注册，用来弹「本地存储已满」提示）。 */
  var writeErrorHandler = null;
  /** 上次写失败的时间戳，用于给提示节流 */
  var lastWriteErrorAt = 0;

  /**
   * 注册写失败回调。
   * @param {Function} fn function(quotaExceeded:boolean, key:string)
   */
  function onWriteError(fn) {
    writeErrorHandler = typeof fn === 'function' ? fn : null;
  }

  /**
   * 判断异常是否为「配额不足」。
   * @param {*} e 捕获到的异常
   * @returns {boolean}
   */
  function isQuotaError(e) {
    if (!e) return false;
    var name = String(e.name || '');
    return name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
      e.code === 22 || e.code === 1014;
  }

  /**
   * 读取 JSON，异常或类型不符时返回兜底值。
   *
   * 安全约定：读出的内容必须视为「不可信输入」：
   *   1. 非法 JSON → 丢弃并静默重写为兜底值；
   *   2. 类型守卫不通过 → 丢弃并静默重写为兜底值。
   *
   * @param {string} key 键
   * @param {*} fallback 兜底值
   * @param {Function} [guard] 类型守卫，返回 false 表示数据不合法
   * @returns {*}
   */
  function readJSON(key, fallback, guard) {
    var raw;
    try {
      raw = global.localStorage.getItem(key);
    } catch (e) {
      return fallback;   // 隐私模式 / 存储被禁用：直接用默认值
    }
    if (raw === null || raw === undefined) return fallback;

    var val;
    try {
      val = JSON.parse(raw);
    } catch (e) {
      writeJSON(key, fallback);   // 非法 JSON：静默重写，避免下次再踩
      return fallback;
    }

    if (val === null || val === undefined) return fallback;

    if (typeof guard === 'function' && !guard(val)) {
      writeJSON(key, fallback);   // 类型不符（脏数据）：丢弃 + 静默重写
      return fallback;
    }
    return val;
  }

  /**
   * 写入 JSON。失败时返回 false 并通知 app 层（配额不足 → 「进度未保存」）。
   * 不抛异常：存储不可用不应打断判题主流程，内存态继续工作。
   *
   * @param {string} key 键
   * @param {*} value 值
   * @returns {boolean} 是否真的落盘
   */
  function writeJSON(key, value) {
    var text;
    try {
      text = JSON.stringify(value);
    } catch (e) {
      return false;   // 循环引用等：不写，内存态继续
    }
    try {
      global.localStorage.setItem(key, text);
      return true;
    } catch (e) {
      var now = Date.now();
      if (writeErrorHandler && now - lastWriteErrorAt > 1200) {
        lastWriteErrorAt = now;
        writeErrorHandler(isQuotaError(e), key);
      }
      return false;
    }
  }

  /* ---------- 3. 校验哈希（FNV-1a 32 位，用于导入文件的完整性校验） ---------- */
  /**
   * 计算字符串的 FNV-1a 32 位哈希，返回 8 位小写十六进制。
   * @param {string} str 输入
   * @returns {string} 形如 "1a2b3c4d"
   */
  function fnv1a(str) {
    var s = String(str == null ? '' : str);
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    var hex = h.toString(16);
    while (hex.length < 8) hex = '0' + hex;
    return hex;
  }

  /* ---------- 4. 字段归一化（storage → 可信内存值的基础件） ---------- */
  /** 归一化分数：只接受有限数值，夹到 0..100 的整数。 */
  function toScore(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    if (n > 100) return 100;
    return Math.round(n);
  }

  /** 归一化计数：非负整数，非法值回退 0。 */
  function toCount(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    return Math.floor(n);
  }

  /** 归一化时间戳：非法值回退 0。 */
  function toTime(v) {
    var n = Number(v);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  /** 归一化文本：非字符串一律变空串（防止对象 / 数组被拼进 innerHTML）。 */
  function toText(v) {
    return typeof v === 'string' ? v : '';
  }

  /** 归一化指标值：有限数值保留，其余变 null（渲染时显示「—」）。 */
  function toMetric(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }

  /** 截断代码快照：超过 20KB 时硬截断（保证存储不被单条记录撑爆）。 */
  function truncateCode(v) {
    var s = toText(v);
    return s.length > CODE_LIMIT ? s.slice(0, CODE_LIMIT) : s;
  }

  /**
   * 读取 → 归一化 → （必要时）回写。
   *
   * 归一化过程中被丢弃的脏字段、被强转的字段，都会通过一次静默重写「落盘」，
   * 这样下一次启动就不必再处理同一份脏数据，storage 也不会长期停留在半合法状态。
   *
   * @param {string} key 键
   * @param {*} fallback 兜底值
   * @param {Function} guard 类型守卫
   * @param {Function} normalize 归一化函数
   * @returns {*}
   */
  function readNormalized(key, fallback, guard, normalize) {
    var raw = readJSON(key, fallback, guard);
    var normalized = normalize(raw);
    var before = '';
    var after = '';
    try {
      before = JSON.stringify(raw);
      after = JSON.stringify(normalized);
    } catch (e) {
      /* 循环引用等极端情况：不回写，直接用归一化结果 */
      return normalized;
    }
    if (before !== after) writeJSON(key, normalized);
    return normalized;
  }

  TSJ.appCore = {
    DIFFS: DIFFS,
    DIFF_CLASS: DIFF_CLASS,
    MODE_LABEL: MODE_LABEL,
    STORE: STORE,
    STORAGE_PREFIX: STORAGE_PREFIX,
    CURRENT_SCHEMA: CURRENT_SCHEMA,
    CODE_LIMIT: CODE_LIMIT,
    MAX_SUBMISSIONS: MAX_SUBMISSIONS,
    MAX_CASES: MAX_CASES,
    isPlainObject: isPlainObject,
    isArrayValue: isArrayValue,
    readJSON: readJSON,
    writeJSON: writeJSON,
    onWriteError: onWriteError,
    isQuotaError: isQuotaError,
    fnv1a: fnv1a,
    readNormalized: readNormalized,
    toScore: toScore,
    toCount: toCount,
    toTime: toTime,
    toText: toText,
    toMetric: toMetric,
    truncateCode: truncateCode,
    // util 的工具在这里再导出一份：调用点统一写 core.esc / core.$ / core.fmtTime，少一层命名空间记忆
    $: util.$,
    $$: util.$$,
    esc: util.esc,
    fmtNum: util.fmtNum,
    fmtTime: util.fmtTime,
    fmtDateStamp: util.fmtDateStamp,
    debounce: util.debounce
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/schema.js —— 字段归一化：把「不可信的存储值」变成「可信的内存值」
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appSchema
 *
 * 为什么单独一个文件：localStorage 在 file:// 下是共享的不透明源，同目录任意页面都能写入，
 * 所以「读出来 → 逐字段归一化」是应用层最需要被审计的一段逻辑，独立成文件便于审查与回归。

(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;

  /** 允许出现在提交记录里的 verdict 取值 */
  var VERDICTS = ['AC', 'WA', 'RE', 'TLE'];

  /**
   * 归一化 verdict：白名单外一律 WA。
   * @param {*} v 原始值
   * @returns {string}
   */
  function normVerdict(v) {
    var u = core.toText(v).toUpperCase();
    return VERDICTS.indexOf(u) >= 0 ? u : 'WA';
  }

  /**
   * 归一化进度表：只保留「纯对象」记录，并把每个字段强制成安全类型。
   *
   * `passed` 额外做一致性校验：必须同时满足「记录里标记为 true」与「最高分达到该题通过线」。
   * 否则一条被篡改成 `{best: "<img ...>", passed: true}` 的记录会在界面上显示成
   * 「已通过 · 最高分 0」并解锁题解 —— 归一化后 best=0，passed 自然回落为 false。
   *
   * @param {*} raw readJSON 读出的原始值
   * @returns {Object} { [problemId]: { best, passed, attempts, lastVerdict, lastAt } }
   */
  function normalizeProgress(raw) {
    var out = {};
    if (!core.isPlainObject(raw)) return out;
    var ids = Object.keys(raw);
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var rec = raw[id];
      if (!core.isPlainObject(rec)) continue;
      var best = core.toScore(rec.best);
      var passLine = 60;
      var prob = TSJ.findProblem(id);
      if (prob && prob.passScore > 0) passLine = prob.passScore;
      out[id] = {
        best: best,
        passed: rec.passed === true && best >= passLine,
        attempts: core.toCount(rec.attempts),
        lastVerdict: core.toText(rec.lastVerdict),
        lastAt: core.toTime(rec.lastAt)
      };
    }
    return out;
  }

  /**
   * 归一化草稿表：只保留字符串值（代码），其余丢弃。
   * @param {*} raw 原始值
   * @returns {Object} { [problemId]: code }
   */

    if (!core.isPlainObject(raw)) return out;
    var ids = Object.keys(raw);
    for (var i = 0; i < ids.length; i++) {
      var code = raw[ids[i]];
      if (typeof code === 'string') out[ids[i]] = code;
    }
    return out;
  }

  /**
   * 归一化逐测试点明细（提交详情用）。
   * @param {*} raw 原始数组
   * @returns {Array<Object>} [{ index, verdict, score, yourMetric, bestBaseline, baselineName }]
   */
  function normalizeCases(raw) {
    var out = [];
    if (!core.isArrayValue(raw)) return out;
    var n = Math.min(raw.length, core.MAX_CASES);
    for (var i = 0; i < n; i++) {
      var c = raw[i];
      if (!core.isPlainObject(c)) continue;
      out.push({
        index: core.toCount(c.index),
        verdict: normVerdict(c.verdict),
        score: core.toScore(c.score),
        yourMetric: core.toMetric(c.yourMetric),
        bestBaseline: core.toMetric(c.bestBaseline),
        baselineName: core.toText(c.baselineName)
      });
    }
    return out;
  }

  /**
   * 归一化提交记录：必须是数组，逐项校验并强制类型。
   * 缺少 id 的旧记录（T05 之前的格式）按「legacy-时间-题号-序号」补一个稳定 id，保证详情路由可访问。
   *
   * @param {*} raw 原始数组
   * @returns {Array<Object>}
   */
  function normalizeSubmissions(raw) {
    var out = [];
    if (!core.isArrayValue(raw)) return out;
    for (var i = 0; i < raw.length; i++) {
      var s = raw[i];
      if (!core.isPlainObject(s)) continue;
      var at = core.toTime(s.at);
      var pid = core.toText(s.problemId);
      var id = core.toText(s.id);
      if (!id) id = 'legacy-' + at + '-' + (pid || 'unknown') + '-' + i;
      out.push({
        id: id,
        at: at,
        problemId: pid,
        title: core.toText(s.title),
        score: core.toScore(s.score),
        verdict: normVerdict(s.verdict),
        passed: s.passed === true,
        metric: core.toText(s.metric),
        code: core.truncateCode(s.code),
        cases: normalizeCases(s.cases),
        degraded: s.degraded === true
      });
    }
    return out;
  }

  TSJ.appSchema = {
    VERDICTS: VERDICTS,
    normVerdict: normVerdict,
    normalizeProgress: normalizeProgress,
    normalizeDrafts: normalizeDrafts,
    normalizeCases: normalizeCases,
    normalizeSubmissions: normalizeSubmissions

<script>
/**
 * assets/js/app/store.js —— 应用状态、派生数据与写盘策略
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js
 * 挂载点：window.TSJ.appStore
 *
 * 分工：
 *   - `state` 是所有可变状态的**唯一**持有者（含判题会话令牌、图表 hover 句柄、题库筛选条件）；
 *   - 派生量（累计分 / 等级 / 每题统计 / 参考解分数）都是纯函数，输入只来自 state；
 *   - 写盘一律走 save*()：**先读盘、再合并、后写回**，避免两个标签页「后写覆盖先写」；
 *   - 导入 / 导出 / 清空在 app/storage.js，这里只提供合并所需的纯函数。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var schema = TSJ.appSchema;
  var problems = TSJ.problems;

  /**
   * 全局可变状态（不持久化部分）。
   *
   * judgeToken / busyToken 是判题会话隔离的核心：
   *   - 每次提交分配 `token = ++judgeToken`；
   *   - 回调首行比对 `token === judgeToken && activeProblem === p`，不匹配整段丢弃；
   *   - route() 只自增 judgeToken（作废旧会话），**不**重置任何布尔量 ——
   *     旧实现用布尔 `running`，被 route() 重置后守卫失效，导致 A 题结果画到 B 题。
   */
  var state = {
    progress: {},
    drafts: {},
    submissions: [],
    filter: '全部',
    /** 题库搜索词（T09）：默认空串 —— 默认态必须无预置搜索词，否则题库不是 9 行 */
    query: '',
    /** 题库标签筛选（T09）：默认 null 表示「全部标签」 */
    tag: null,
    editor: null,
    activeProblem: null,
    /** 单调递增的判题会话令牌 */
    judgeToken: 0,
    /** 当前会话里在跑的判题令牌；-1 表示空闲（等于 judgeToken 即「有判题在跑」） */
    busyToken: -1,
    /** 当前判题会话句柄（含 abort()），路由切换时用来 terminate 旧 Worker */
    session: null,
    lastResult: null,
    refScores: null,
    /** 当前页图表 hover 句柄（T08）：路由切换必须 destroy()，否则监听会累积 */
    chartHover: null,
    /** 编辑器字号（T10）：12 / 13 / 14 */
    edFont: 13,
    /** 本地存储是否可用（配额不足时为 false，界面降级为内存态） */
    storageOk: true
  };

  /** 外部变更回调（storage 事件触发，由 app 层注册用于重渲染当前视图） */
  var externalHandler = null;

  /**
   * 注册「存储被其它标签页改写」回调。
   * @param {Function} fn function(kind:string)
   */
  function onExternalChange(fn) {
    externalHandler = typeof fn === 'function' ? fn : null;
  }

  /** 从 localStorage 装载状态（读出的数据一律视为不可信：先守卫、再归一化）。 */
  function loadState() {
    state.progress = core.readNormalized(
      core.STORE.progress, {}, core.isPlainObject, schema.normalizeProgress);
    state.drafts = core.readNormalized(
      core.STORE.drafts, {}, core.isPlainObject, schema.normalizeDrafts);
    state.submissions = core.readNormalized(
      core.STORE.submissions, [], core.isArrayValue, schema.normalizeSubmissions);
    var savedFilter = core.readJSON(core.STORE.filter, '全部', function (v) {
      return typeof v === 'string';
    });
    var allowed = ['全部'].concat(core.DIFFS);
    state.filter = allowed.indexOf(savedFilter) >= 0 ? savedFilter : '全部';

    // 存储格式版本：缺失时补写当前版本（旧数据本身已由归一化兼容，无需迁移）
    var savedSchema = core.readJSON(core.STORE.schema, 0, function (v) {
      return typeof v === 'number';
    });
    if (savedSchema !== core.CURRENT_SCHEMA) core.writeJSON(core.STORE.schema, core.CURRENT_SCHEMA);

    var font = core.readJSON(core.STORE.edFont, 13, function (v) {
      return typeof v === 'number';
    });
    state.edFont = (font === 12 || font === 13 || font === 14) ? font : 13;
    // 装载后回写一次归一化结果：保证「界面字号」与「存储值」始终一致（首次运行也会落盘）
    core.writeJSON(core.STORE.edFont, state.edFont);
  }

  /** 累计等级分 = 各题历史最高分之和。 */
  function totalScore() {
    var sum = 0;
    for (var i = 0; i < problems.length; i++) {
      var rec = state.progress[problems[i].id];
      if (rec) sum += core.toScore(rec.best);
    }
    return sum;
  }

  /** 由累计分推等级。 */
  function levelOf(score) {
    return Math.max(1, Math.floor(score / 150) + 1);
  }

  /** 某题的本地统计（无本地记录时用题目自带通过率）。 */
  function problemStats(p) {
    var attempts = 0;
    var passed = 0;
    for (var i = 0; i < state.submissions.length; i++) {
      if (state.submissions[i].problemId === p.id) {
        attempts++;
        if (state.submissions[i].passed) passed++;
      }
    }
    if (attempts === 0) return { attempts: 0, rate: p.passRate || 0 };
    return { attempts: attempts, rate: Math.round((passed / attempts) * 100) };
  }

  /** 更新顶部等级分胶囊。 */
  function updateScoreChip() {
    var total = totalScore();
    var lvEl = core.$('#lvText');
    var ptsEl = core.$('#ptsText');
    if (lvEl) lvEl.textContent = 'Lv.' + levelOf(total);
    if (ptsEl) ptsEl.textContent = total + ' 分';
  }

  /** 高亮当前导航项。 */
  function setActiveNav(name) {
    var links = document.querySelectorAll('#nav a, #drawerNav a');
    for (var i = 0; i < links.length; i++) {
      var isOn = links[i].getAttribute('data-nav') === name;
      links[i].classList.toggle('on', isOn);
      if (isOn) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
  }

  /** 计算「参考解法」虚拟选手的每题得分（同步执行可信代码，结果确定且带缓存）。 */
  function computeRefScores() {
    if (state.refScores) return state.refScores;
    var map = {};
    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      var ds = TSJ.findDataset(p.dataset);
      if (!ds) { map[p.id] = 0; continue; }
      try {
        map[p.id] = TSJ.judge.evaluateSync({ problem: p, dataset: ds, code: p.solution }).score;
      } catch (e) {
        map[p.id] = 0;
      }
    }
    state.refScores = map;
    return map;
  }

  /** 为学习路径生成一句话知识点摘要。 */
  function pathSummary(p) {
    var ds = TSJ.findDataset(p.dataset);
    var dsName = ds ? ds.name : p.dataset;
    return '数据集 ' + dsName + ' · ' + (core.MODE_LABEL[p.mode] || p.mode) +
      ' · 预测 ' + p.horizon + ' 步 · 需要打败最优基线（阈值 ' + p.threshold + '）';
  }

  /* ---------- 写盘策略 ---------- */

  /**
   * 合并两份进度表（本地写盘用）：同一题取更优记录，不重复累加 attempts。
   * @param {Object} disk 盘上的进度
   * @param {Object} mem 内存里的进度
   * @returns {Object}
   */
  function mergeProgressForWrite(disk, mem) {
    var out = {};
    var id;
    for (id in disk) {
      if (Object.prototype.hasOwnProperty.call(disk, id)) out[id] = disk[id];
    }
    for (id in mem) {
      if (!Object.prototype.hasOwnProperty.call(mem, id)) continue;
      var a = out[id];
      var b = mem[id];
      if (!a) { out[id] = b; continue; }
      out[id] = {
        best: Math.max(core.toScore(a.best), core.toScore(b.best)),
        passed: a.passed === true || b.passed === true,
        attempts: Math.max(core.toCount(a.attempts), core.toCount(b.attempts)),
        lastVerdict: core.toTime(b.lastAt) >= core.toTime(a.lastAt) ? b.lastVerdict : a.lastVerdict,
        lastAt: Math.max(core.toTime(a.lastAt), core.toTime(b.lastAt))
      };
    }
    return out;
  }

  /**
   * 合并两份进度表（导入用）：best = max(旧,新)、attempts = 旧+新、passed = 或。
   * @param {Object} oldP 现有进度
   * @param {Object} newP 导入的进度
   * @returns {Object}
   */
  function mergeProgressForImport(oldP, newP) {
    var out = {};
    var id;
    for (id in oldP) {
      if (Object.prototype.hasOwnProperty.call(oldP, id)) out[id] = oldP[id];
    }
    for (id in newP) {
      if (!Object.prototype.hasOwnProperty.call(newP, id)) continue;
      var a = out[id];
      var b = newP[id];
      if (!a) { out[id] = b; continue; }
      var newer = core.toTime(b.lastAt) >= core.toTime(a.lastAt) ? b : a;
      out[id] = {
        best: Math.max(core.toScore(a.best), core.toScore(b.best)),
        passed: a.passed === true || b.passed === true,
        attempts: core.toCount(a.attempts) + core.toCount(b.attempts),
        lastVerdict: newer.lastVerdict,
        lastAt: Math.max(core.toTime(a.lastAt), core.toTime(b.lastAt))
      };
    }
    return out;
  }

  /**
   * 合并提交记录：按 id 去重（新的覆盖旧的），按时间倒序，截断到 120 条。
   * @param {Array} oldList 现有记录
   * @param {Array} newList 新记录
   * @returns {Array}
   */
  function mergeSubmissions(oldList, newList) {
    var seen = {};
    var out = [];
    var i;
    var src = (newList || []).concat(oldList || []);
    for (i = 0; i < src.length; i++) {
      var s = src[i];
      if (!s || !s.id || seen[s.id]) continue;
      seen[s.id] = true;
      out.push(s);
    }
    out.sort(function (x, y) { return y.at - x.at; });
    if (out.length > core.MAX_SUBMISSIONS) out.length = core.MAX_SUBMISSIONS;
    return out;
  }

  /** 写进度：先读盘合并，再写回（避免覆盖其它标签页刚写入的记录）。 */
  function saveProgress() {
    var disk = schema.normalizeProgress(core.readJSON(core.STORE.progress, {}, core.isPlainObject));
    state.progress = mergeProgressForWrite(disk, state.progress);
    var ok = core.writeJSON(core.STORE.progress, state.progress);
    state.storageOk = ok;
    return ok;
  }

  /** 写草稿：草稿是「本机最新意图」，直接整表写回。 */
  function saveDrafts() {
    var ok = core.writeJSON(core.STORE.drafts, state.drafts);
    state.storageOk = ok;
    return ok;
  }

  /** 写提交记录：先读盘合并去重，再写回。 */
  function saveSubmissions() {
    var disk = schema.normalizeSubmissions(core.readJSON(core.STORE.submissions, [], core.isArrayValue));
    state.submissions = mergeSubmissions(disk, state.submissions);
    var ok = core.writeJSON(core.STORE.submissions, state.submissions);
    state.storageOk = ok;
    return ok;
  }

  /** 保存编辑器字号。 */
  function saveEdFont(size) {
    state.edFont = (size === 12 || size === 13 || size === 14) ? size : 13;
    return core.writeJSON(core.STORE.edFont, state.edFont);
  }

  /**
   * 外部（其它标签页）改写存储后重新装载。
   * @returns {boolean} 是否真的读到了变化
   */
  function reloadFromStorage() {
    var before = '';
    var after = '';
    try {
      before = JSON.stringify([state.progress, state.drafts, state.submissions]);
    } catch (e) {
      before = '';
    }
    state.progress = core.readNormalized(
      core.STORE.progress, {}, core.isPlainObject, schema.normalizeProgress);
    state.drafts = core.readNormalized(
      core.STORE.drafts, {}, core.isPlainObject, schema.normalizeDrafts);
    state.submissions = core.readNormalized(
      core.STORE.submissions, [], core.isArrayValue, schema.normalizeSubmissions);
    try {
      after = JSON.stringify([state.progress, state.drafts, state.submissions]);
    } catch (e) {
      after = '';
    }
    return before !== after;
  }

  /** 清空内存态（清空进度后调用；storage 侧由 app/storage.js 负责删除键）。 */
  function resetState() {
    state.progress = {};
    state.drafts = {};
    state.submissions = [];
    state.filter = '全部';
    state.query = '';
    state.tag = null;
    state.lastResult = null;
    state.refScores = null;
  }

  /** 触发外部变更回调（storage 事件用）。 */
  function notifyExternal(kind) {
    if (externalHandler) externalHandler(kind);
  }

  TSJ.appStore = {
    state: state,
    onExternalChange: onExternalChange,
    loadState: loadState,
    totalScore: totalScore,
    levelOf: levelOf,
    problemStats: problemStats,
    updateScoreChip: updateScoreChip,
    setActiveNav: setActiveNav,
    computeRefScores: computeRefScores,
    pathSummary: pathSummary,
    mergeProgressForWrite: mergeProgressForWrite,
    mergeProgressForImport: mergeProgressForImport,
    mergeSubmissions: mergeSubmissions,
    saveProgress: saveProgress,
    saveDrafts: saveDrafts,
    saveSubmissions: saveSubmissions,
    saveEdFont: saveEdFont,
    reloadFromStorage: reloadFromStorage,
    resetState: resetState,
    notifyExternal: notifyExternal
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/storage.js —— 进度导出 / 导入 / 清空（T05）
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js
 * 挂载点：window.TSJ.appStorage
 *
 * 导出文件结构：
 *   { schema: 1, app: 'tsoj', exportedAt: <ms>, data: { progress, drafts, submissions }, hash }
 *   hash = FNV-1a(JSON.stringify(data))，用于识别「文件被手工改过」。
 *
 * 导入校验顺序（任一失败都给出具体原因，且**不动现有数据**）：
 *   JSON 合法 → app === 'tsoj' → schema ≤ 当前版本 → hash 匹配 → 字段白名单归一化。
 *
 * 清空只删 `tsoj:` 前缀的键，绝不 localStorage.clear()（同源下可能有别的页面数据）。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var schema = TSJ.appSchema;
  var store = TSJ.appStore;

  var MAX_FILE_BYTES = 4 * 1024 * 1024;   // 4MB：超过直接拒绝，避免把主线程读死

  /**
   * 生成导出包（纯函数，便于测试）。
   * @returns {Object} { schema, app, exportedAt, data, hash }
   */
  function buildBundle() {
    var data = {
      progress: store.state.progress,
      drafts: store.state.drafts,
      submissions: store.state.submissions
    };
    return {
      schema: core.CURRENT_SCHEMA,
      app: 'tsoj',
      exportedAt: Date.now(),
      data: data,
      hash: core.fnv1a(JSON.stringify(data))
    };
  }

  /** 导出文件名：tsoj-progress-YYYYMMDD.json */
  function exportFileName(ts) {
    return 'tsoj-progress-' + core.fmtDateStamp(ts) + '.json';
  }

  /**
   * 触发浏览器下载（Blob + a.download）。
   * @returns {string} 实际写入文件的内容（测试可直接比对）
   */
  function exportProgress() {
    var text = JSON.stringify(buildBundle(), null, 2);
    try {
      var blob = new global.Blob([text], { type: 'application/json' });
      var url = global.URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = exportFileName(Date.now());
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      global.setTimeout(function () {
        try { global.URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 0);
    } catch (e) {
      return text;   // 下载不可用（极少见）时至少把内容交给调用方
    }
    return text;
  }

  /**
   * 校验并解析导入文本。
   * @param {string} text 文件内容
   * @returns {{ok: boolean, reason: string, data: ?Object, schema: number, counts: ?Object}}
   */
  function parseBundle(text) {
    var fail = function (reason) {
      return { ok: false, reason: reason, data: null, schema: -1, counts: null };
    };

    if (typeof text !== 'string' || text.length === 0) return fail('文件是空的，没有可导入的内容。');
    if (text.length > MAX_FILE_BYTES) return fail('文件超过 4MB，不像是本程序导出的进度文件。');

    var obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      return fail('文件不是合法的 JSON，无法解析。');
    }
    if (!core.isPlainObject(obj)) return fail('文件内容不是一个对象，无法解析。');

    if (obj.app !== 'tsoj') {
      return fail('这不是 TSOJ 的进度文件（缺少 app: "tsoj" 标记）。');
    }

    var ver = Number(obj.schema);
    if (!isFinite(ver) || ver < 0) {
      return fail('文件缺少合法的 schema 版本号。');
    }
    if (ver > core.CURRENT_SCHEMA) {
      return fail('文件版本过新（schema ' + ver + '），当前程序只支持到 schema ' +
        core.CURRENT_SCHEMA + '。请升级后再导入。');
    }

    if (!core.isPlainObject(obj.data)) return fail('文件缺少 data 字段，内容不完整。');

    var expect = core.fnv1a(JSON.stringify(obj.data));
    if (typeof obj.hash !== 'string' || obj.hash !== expect) {
      return fail('校验失败：内容与校验码不一致（文件可能被修改过）。');
    }

    // 字段白名单归一化：只接受 progress / drafts / submissions 三个键
    var data = {
      progress: schema.normalizeProgress(obj.data.progress),
      drafts: schema.normalizeDrafts(obj.data.drafts),
      submissions: schema.normalizeSubmissions(obj.data.submissions)
    };
    var counts = {
      progress: Object.keys(data.progress).length,
      drafts: Object.keys(data.drafts).length,
      submissions: data.submissions.length
    };
    return { ok: true, reason: '', data: data, schema: ver, counts: counts };
  }

  /**
   * 把解析后的数据合并进当前状态并落盘。
   * @param {Object} data { progress, drafts, submissions }
   * @returns {{progress: number, drafts: number, submissions: number}} 合并后的条目数
   */
  function applyImport(data) {
    var st = store.state;
    st.progress = store.mergeProgressForImport(st.progress, data.progress || {});
    // 草稿：导入值优先（用户是在「恢复备份」，备份里的代码即他的最新意图），未覆盖的题保留本机草稿
    var id;
    for (id in data.drafts) {
      if (Object.prototype.hasOwnProperty.call(data.drafts, id)) st.drafts[id] = data.drafts[id];
    }
    st.submissions = store.mergeSubmissions(st.submissions, data.submissions || []);
    store.saveProgress();
    store.saveDrafts();
    store.saveSubmissions();
    return {
      progress: Object.keys(st.progress).length,
      drafts: Object.keys(st.drafts).length,
      submissions: st.submissions.length
    };
  }

  /**
   * 读取用户选择的文件并导入。
   * @param {File} file 文件对象
   * @param {Function} done function(result) —— result: {ok, reason, counts}
   */
  function importFile(file, done) {
    var cb = typeof done === 'function' ? done : function () {};
    if (!file) { cb({ ok: false, reason: '没有选择文件。', counts: null }); return; }
    if (typeof global.FileReader !== 'function') {
      cb({ ok: false, reason: '当前浏览器不支持读取本地文件。', counts: null });
      return;
    }
    var reader = new global.FileReader();
    reader.onerror = function () {
      cb({ ok: false, reason: '读取文件失败，请重试。', counts: null });
    };
    reader.onload = function () {
      var parsed;
      try {
        parsed = parseBundle(String(reader.result || ''));
      } catch (e) {
        cb({ ok: false, reason: '解析文件时出错：' + ((e && e.message) || String(e)), counts: null });
        return;
      }
      if (!parsed.ok) { cb({ ok: false, reason: parsed.reason, counts: null }); return; }
      var counts = applyImport(parsed.data);
      cb({ ok: true, reason: '', counts: counts, schema: parsed.schema });
    };
    reader.readAsText(file, 'utf-8');
  }

  /**
   * 清空所有 tsoj:* 键（不动其它同源数据）。
   * @returns {string[]} 被删除的键
   */
  function clearAll() {
    var keys = [];
    try {
      var n = global.localStorage.length;
      for (var i = 0; i < n; i++) {
        var k = global.localStorage.key(i);
        if (k && k.indexOf(core.STORAGE_PREFIX) === 0) keys.push(k);
      }
      for (var j = 0; j < keys.length; j++) global.localStorage.removeItem(keys[j]);
    } catch (e) {
      return keys;
    }
    store.resetState();
    return keys;
  }

  /**
   * 监听跨标签页的 storage 事件：同步 state 并通知 app 重渲染当前视图。
   * 只有我们自己的键变化才处理（其它页面的键与我们无关）。
   * @returns {Function} 解绑函数
   */
  function bindStorageSync() {
    if (typeof global.addEventListener !== 'function') return function () {};
    /** 处理 storage 事件。 */
    function onStorage(ev) {
      if (!ev) return;
      var key = ev.key;
      // key === null 表示 storage.clear()（别的页面整体清空）
      if (key !== null && String(key).indexOf(core.STORAGE_PREFIX) !== 0) return;
      var changed = store.reloadFromStorage();
      store.notifyExternal(key === null ? 'clear' : String(key).slice(core.STORAGE_PREFIX.length));
      if (changed && TSJ.appStore.updateScoreChip) TSJ.appStore.updateScoreChip();
    }
    global.addEventListener('storage', onStorage);
    return function () { global.removeEventListener('storage', onStorage); };
  }

  TSJ.appStorage = {
    buildBundle: buildBundle,
    exportFileName: exportFileName,
    exportProgress: exportProgress,
    parseBundle: parseBundle,
    applyImport: applyImport,
    importFile: importFile,
    clearAll: clearAll,
    bindStorageSync: bindStorageSync
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/lifecycle.js —— 路由级生命周期（Scope）
 *
 * 目标：把「事件监听 / 定时器 / ResizeObserver / 子销毁器」统一登记到当前路由的
 * Scope 上，路由切换时一次性销毁。这样图表 hover、实验室轮询、抽屉监听都不会
 * 跨页面累积，也不用再靠“猜测某个全局变量还在不在”来防泄漏。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});

  /**
   * 创建一个可统一销毁的作用域。
   * @returns {Object} Scope
   */
  function createScope(name) {
    var disposers = [];
    var children = [];
    var destroyed = false;

    function listen(target, type, handler, options) {
      if (!target || !target.addEventListener) return function () {};
      target.addEventListener(type, handler, options);
      var off = function () {
        target.removeEventListener(type, handler, options);
      };
      disposers.push(off);
      return off;
    }

    function timeout(fn, ms) {
      var id = global.setTimeout(function () {
        var i = disposers.indexOf(clear);
        if (i >= 0) disposers.splice(i, 1);
        if (!destroyed) fn();
      }, ms);
      function clear() { global.clearTimeout(id); }
      disposers.push(clear);
      return clear;
    }

    function interval(fn, ms) {
      var id = global.setInterval(function () {
        if (!destroyed) fn();
      }, ms);
      function clear() { global.clearInterval(id); }
      disposers.push(clear);
      return clear;
    }

    function own(child) {
      if (!child) return child;
      if (typeof child === 'function') {
        disposers.push(child);
        return child;
      }
      if (typeof child.destroy === 'function') {
        children.push(child);
        return child;
      }
      return child;
    }

    function destroy() {
      if (destroyed) return;
      destroyed = true;
      for (var i = 0; i < children.length; i++) {
        try { children[i].destroy(); } catch (e) { /* 单个子项失败不应阻断其他销毁 */ }
      }
      children.length = 0;
      for (var j = 0; j < disposers.length; j++) {
        try { disposers[j](); } catch (e2) { /* 同上 */ }
      }
      disposers.length = 0;
    }

    return {
      name: name || 'scope',
      listen: listen,
      timeout: timeout,
      interval: interval,
      own: own,
      destroy: destroy,
      isDestroyed: function () { return destroyed; }
    };
  }

  TSJ.appLifecycle = { createScope: createScope };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/ui.js —— 通用渲染件：Markdown、结果面板、逐测试点、预测曲线、判题按钮态、分栏拖拽
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js；挂载点 TSJ.appUi。
 * 约定：所有 DOM 查询限定在 `#view` 作用域内（`$('#x', view)`）—— 旧实现用全局
 * `$('#btnSolution')` / `$('#resultPanel')`，路由切换后会摸到新页面的节点。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var judge = TSJ.judge;

  var $ = core.$;
  var esc = core.esc;
  var fmtNum = core.fmtNum;

  /* ---------- 1. 极简 Markdown ---------- */
  /** 行内元素：`code` / **bold** / *italic*。 */
  function mdInline(s) {
    var t = esc(s);
    // 术语链接：[[term:id]] / [[term:id|别名]] → 术语表（题面与提示里可点）
    t = t.replace(/\[\[term:([a-z0-9\-]+)(?:\|([^\]\n]+))?\]\]/gi, function (_, id, label) {
      var w = (TSJ.glossary || []).filter(function (x) { return x.id === id; })[0];
      return w ? '<a class="md-term" href="#/glossary" title="术语表：' + esc(w.term) + '">' + esc(label || w.term) + '</a>' : (label || id);
    });
    t = t.replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return t;
  }
  /** 极简 Markdown 渲染：标题、无序/有序列表、代码块、引用、分隔线、段落。 */
  function md(src) {
    var lines = String(src == null ? '' : src).replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var listTag = null;
    var i = 0;

    /** 关闭当前列表。 */
    function closeList() { if (listTag) { out.push('</' + listTag + '>'); listTag = null; } }

    /** 判断一行是否开启新块。 */
    function isBlockStart(line) {
      return /^\s*$/.test(line) ||
        /^```/.test(line) ||
        /^#{1,4}\s+/.test(line) ||
        /^---+\s*$/.test(line) ||
        /^\s*[-*]\s+/.test(line) ||
        /^\s*\d+\.\s+/.test(line) ||
        /^>\s?/.test(line);
    }

    while (i < lines.length) {
      var line = lines[i];

      // 代码块
      if (/^```/.test(line)) {
        closeList();
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // 跳过结束围栏
        out.push('<pre class="md-code"><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      if (/^\s*$/.test(line)) { closeList(); i++; continue; }   // 空行

      // 标题
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) {
        closeList();
        var lv = h[1].length;
        out.push('<h' + lv + ' class="md-h">' + mdInline(h[2]) + '</h' + lv + '>');
        i++; continue;
      }

      if (/^---+\s*$/.test(line)) { closeList(); out.push('<hr class="md-hr">'); i++; continue; }   // 分隔线

      // 引用
      var q = /^>\s?(.*)$/.exec(line);
      if (q) {
        closeList();
        var qbuf = [q[1]];
        i++;
        while (i < lines.length && /^>\s?/.test(lines[i])) { qbuf.push(lines[i].replace(/^>\s?/, '')); i++; }
        out.push('<div class="md-quote">' + mdInline(qbuf.join(' ')) + '</div>');
        continue;
      }

      // 列表
      var ul = /^\s*[-*]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+\.\s+(.*)$/.exec(line);
      if (ul || ol) {
        var want = ul ? 'ul' : 'ol';
        if (listTag !== want) { closeList(); out.push('<' + want + ' class="md-list">'); listTag = want; }
        out.push('<li>' + mdInline((ul || ol)[1]) + '</li>');
        i++;
        continue;
      }

      // 段落：合并连续非块起始行
      closeList();
      var pbuf = [line];
      i++;
      while (i < lines.length && !isBlockStart(lines[i])) { pbuf.push(lines[i]); i++; }
      out.push('<p class="md-p">' + mdInline(pbuf.join(' ')) + '</p>');
    }

    closeList();
    return out.join('\n');
  }

  /* ---------- 2. 判题按钮态 ---------- */
  /** 当前环境是否允许提交（无沙箱时禁止提交，避免死循环锁死界面）。 */
  function canSubmit() {
    return typeof judge.canUseSandbox === 'function' ? judge.canUseSandbox() : true;
  }

  /** 切换「判题中」按钮态。 只在令牌仍然有效时执行 —— 否则会把新页面的按钮改成「判题中…」或提前解禁。 */
  function setBusy(busy, token) {
    if (token !== undefined && token !== store.state.judgeToken) return;
    var view = $('#view');
    if (!view) return;
    var sandboxOk = canSubmit();
    var btnRun = $('#btnRun', view);
    var btnSubmit = $('#btnSubmit', view);
    if (btnRun) btnRun.disabled = busy || !sandboxOk;
    if (btnSubmit) {
      btnSubmit.disabled = busy || !sandboxOk;
      btnSubmit.textContent = busy ? '判题中…' : '提交判题';
      if (!sandboxOk) btnSubmit.title = judge.SANDBOX_REFUSED_REASON || '当前环境无法创建判题沙箱';
    }
  }

  /* ---------- 3. 逐测试点列表（结果面板与提交详情共用） ---------- */
  /** verdict → 迷你标签 class */
  function verdictMiniClass(v) {
    return v === 'AC' ? 'vm-ac' : v === 'RE' ? 'vm-re' : v === 'TLE' ? 'vm-tle' : 'vm-wa';
  }

  /**
   * 渲染逐测试点列表。
   * @param {Array} cases 测试点数组（judge 的 res.cases 或落盘的 cases 快照）
   * @param {boolean} withOrigin 是否显示「（origin #N）」
   * @returns {string} HTML
   */
  function renderCaseList(cases, withOrigin) {
    var list = core.isArrayValue(cases) ? cases : [];
    if (list.length === 0) return '';
    var html = ['<div class="cases">'];
    for (var i = 0; i < list.length; i++) {
      var cs = list[i] || {};
      var vm = verdictMiniClass(cs.verdict);
      html.push('<div class="case">\n  <span class="verdict-mini ' + vm + '">' + esc(cs.verdict) + '</span>' +
        '  <span class="case-idx">测试点 ' + (i + 1) +
        (withOrigin && list.length > 1 ? '（origin #' + esc(core.toCount(cs.index) + 1) + '）' : '') + '</span>' +
        '  <span class="case-metric">你 ' + fmtNum(cs.yourMetric) + ' / 基线 ' + fmtNum(cs.bestBaseline) + '</span>' +
        '  <span class="case-score">' + esc(core.toScore(cs.score)) + '</span>');
      if (cs.error) html.push('  <span class="case-err">' + esc(cs.error) + '</span>');
      html.push('</div>');
    }
    html.push('</div>');
    return html.join('\n');
  }

  /* ---------- 4. 结果面板 ---------- */
  /** 渲染「前置守卫」提示（数据不足 / 沙箱不可用 / 已取消）。 这类报告不进入评分流程，因此不显示任何分数与逐测试点。 */
  function renderGuardNotice(res) {
    var view = $('#view');
    var host = view ? $('#resultPanel', view) : null;
    if (!host) return;
    host.innerHTML = '<div class="notice">' + esc((res && res.message) || '判题未能开始。') + '</div>';
  }

  /** 渲染判题结果面板。 */
  function renderResult(res, p) {
    var view = $('#view');
    var host = view ? $('#resultPanel', view) : null;
    if (!host) return;

    // 数据/配置缺陷、沙箱不可用、会话取消：只给提示，不给分数（避免出现「0 分」的误导）
    if (res && (res.dataError || res.refused || res.aborted)) {
      renderGuardNotice(res);
      return;
    }

    if (!res) {
      host.innerHTML = '<div class="result-empty">' +
        '写一个 <code>predict(history, horizon, ctx)</code> 函数，<br>' +
        '点「提交判题」或按 <code>Ctrl/⌘ + Enter</code> 开始评测。<br>' +
        '<span style="color:#4d5a68">通过线 ' + p.passScore + ' 分 · 需全部测试点达标</span>' +
        '</div>';
      return;
    }

    var html = [];

    // ---- 头部：环形分 + verdict ----
    var VERDICT_VIEW = { AC: ['verdict-ac', '通过 AC'], RE: ['verdict-re', '运行时错误 RE'], TLE: ['verdict-tle', '超时 TLE'] };
    var vv = VERDICT_VIEW[res.verdict] || ['verdict-wa', '未通过 WA'];
    var verdictClass = vv[0];
    var verdictText = vv[1];

    var ringClass = res.score >= p.passScore ? '' : (res.score >= 40 ? ' warn' : ' bad');
    var circumference = 2 * Math.PI * 30;
    var offset = circumference * (1 - Math.max(0, Math.min(100, res.score)) / 100);

    html.push('<div class="result-head">\n  <div class="ring-wrap">\n    <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">');
    html.push('      <circle class="ring-bg" cx="36" cy="36" r="30"></circle>' +
      '<circle class="ring-fg' + ringClass + '" cx="36" cy="36" r="30" ' +
      'stroke-dasharray="' + circumference.toFixed(2) + '" ' +
      'stroke-dashoffset="' + offset.toFixed(2) + '"></circle>');
    html.push('    </svg>\n    <div class="ring-label"><b>' + esc(res.score) + '</b><span>SCORE</span></div>');
    html.push('  </div>\n  <div class="result-summary">\n    <div class="verdict ' + verdictClass + '">' + verdictText + '</div>' +
      '<div class="result-sub">' + esc(res.metricLabel || '') + ' · ' +
      (res.cases.length > 1 ? res.cases.length + ' 个测试点取平均' : '单测试点') + '</div>' +
      '<div class="result-sub dim">通过线 ' + p.passScore + ' 分 · 阈值 ' +
      p.threshold + ' × 最优基线</div>');
    html.push('  </div>\n</div>');

    // ---- 错误信息 ----
    if (res.verdict === 'RE' || res.verdict === 'TLE') {
      var firstCase = null;
      for (var i = 0; i < res.cases.length; i++) {
        if (res.cases[i].verdict === 'RE' || res.cases[i].verdict === 'TLE') { firstCase = res.cases[i]; break; }
      }
      var errText = (firstCase && firstCase.error) || res.message || '未知错误';
      var lineText = (firstCase && firstCase.line) ? ('第 ' + firstCase.line + ' 行') : '行号未知';
      html.push('<div class="err-box">' + esc(errText) +
        '<div class="err-meta">位置：' + esc(lineText) + '</div></div>');
    } else if (res.verdict === 'WA' && res.message) {
      html.push('<div class="result-sub" style="margin-bottom:10px">' + esc(res.message) + '</div>');
    }

    // ---- 逐测试点 ----
    if (res.cases.length > 0) html.push(renderCaseList(res.cases, true));

    // ---- 指标对比条（以最后一个测试点为例）----
    if (res.cases.length > 0 && isFinite(res.cases[res.cases.length - 1].yourMetric)) {
      var last = res.cases[res.cases.length - 1];
      var names = [];
      var values = {};
      var k;
      for (k in last.allBaselines) {
        if (Object.prototype.hasOwnProperty.call(last.allBaselines, k)) {
          names.push(k);
          values[k] = last.allBaselines[k];
        }
      }
      values.__mine = last.yourMetric;
      var maxVal = 0;
      for (k in values) {
        if (Object.prototype.hasOwnProperty.call(values, k) && isFinite(values[k]) && values[k] > maxVal) {
          maxVal = values[k];
        }
      }
      if (maxVal <= 0) maxVal = 1;

      html.push('<div class="bars">');
      html.push('  <div class="bars-title">指标对比 · ' + esc(res.metricLabel || '') +
        '（越短越好，黄色为最优基线）</div>');
      html.push('  <div class="bar-row">\n    <span class="bar-label mine">你的预测</span>');
      html.push('    <span class="bar-track"><span class="bar-fill mine" style="width:' +
        Math.min(100, (values.__mine / maxVal) * 100).toFixed(1) + '%"></span></span>');
      html.push('    <span class="bar-val">' + fmtNum(values.__mine) + '</span>\n  </div>');

      for (var n = 0; n < names.length; n++) {
        var nm = names[n];
        var isBest = nm === last.baselineName;
        html.push('  <div class="bar-row">\n    <span class="bar-label">' + esc(judge.baselineLabels[nm] || nm) + '</span>');
        html.push('    <span class="bar-track"><span class="bar-fill' + (isBest ? ' best' : '') +
          '" style="width:' + Math.min(100, (values[nm] / maxVal) * 100).toFixed(1) + '%"></span></span>');
        html.push('    <span class="bar-val">' + fmtNum(values[nm]) + '</span>\n  </div>');
      }
      html.push('</div>');
    }

    host.innerHTML = html.join('\n');
  }

  /** 把最后一个测试点的预测画到预览图上（hover 绑定由 views 负责，paint 后几何信息自动更新）。 */
  function paintPrediction(res, p, ds) {
    if (!res || !res.cases || res.cases.length === 0) return;
    var last = res.cases[res.cases.length - 1];
    if (!last || !last.predictions) return;
    var view = $('#view');
    var canvas = view ? $('#seriesChart', view) : null;
    if (!canvas) return;
    TSJ.drawSeries(canvas, {
      values: ds.values,
      testStart: ds.values.length - p.horizon,

<script>
/**
 * assets/js/app/a11y.js —— 可访问性基础件（T11）：弹层焦点管理、提示播报、页面标题
 *
 * 加载顺序：core → store → storage → ui → a11y → views → pages → app.js
 * 挂载点：window.TSJ.appA11y
 *
 * 约定：
 *   1. 所有弹层都复用 index.html 里的 `#overlay`（role="dialog" aria-modal="true"），
 *      打开时把 `#view` 与 `.topbar` 设为 inert，关闭时恢复；
 *   2. Tab 只在弹层内循环（焦点陷阱），ESC 关闭，关闭后焦点回到 `#view`；
 *   3. 轻提示走 `#toast`（role="status"），不做打断式弹窗。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;

  /** 可聚焦选择器（Tab 循环用） */
  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
    'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  var overlay = null;
  var background = [];
  var isOpen = false;
  var onKeyDownBound = null;
  var closeCallback = null;
  var toastTimer = 0;

  /** 取弹层容器。 */
  function getOverlay() {

  }

  /** 收集容器内当前可聚焦元素（过滤不可见的）。 */
  function focusables(root) {
    var list = core.$$(FOCUSABLE, root);
    var out = [];
    for (var i = 0; i < list.length; i++) {

    }

   * 把弹层以外的内容设为 inert（不支持 inert 的内核退化为 aria-hidden）。
   * @param {boolean} on 是否启用
   */
  function setBackgroundInert(on) {
    if (!background.length) {
      var view = document.getElementById('view');
      var topbar = document.querySelector('.topbar');
      if (view) background.push(view);
      if (topbar) background.push(topbar);
    }
    for (var i = 0; i < background.length; i++) {
      var el = background[i];
      if (on) {
        try { el.inert = true; } catch (e) { /* 老内核 */ }
        el.setAttribute('inert', '');
        el.setAttribute('aria-hidden', 'true');

        el.removeAttribute('aria-hidden');

   * 焦点陷阱：Tab / Shift+Tab 在弹层内首尾循环。
   * @param {KeyboardEvent} ev 键盘事件
   */

    var ov = getOverlay();
    if (!ov) return;
    var list = focusables(ov);
    if (list.length === 0) { ev.preventDefault(); return; }
    var first = list[0];
    var last = list[list.length - 1];
    var active = document.activeElement;
    if (ev.shiftKey) {
      if (active === first || !ov.contains(active)) {
        ev.preventDefault();
        last.focus();
      }
    } else if (active === last || !ov.contains(active)) {
      ev.preventDefault();
      first.focus();
    }
  }

  function closeModal() {

    ov.classList.add('hidden');
    ov.innerHTML = '';
    ov.removeAttribute('aria-label');

      document.removeEventListener('keydown', onKeyDownBound, true);
      onKeyDownBound = null;

    if (view) {
      if (!view.hasAttribute('tabindex')) view.setAttribute('tabindex', '-1');

   * 打开弹层。

   * @returns {Object} { close }

      target = list.length ? list[0] : null;

      try { target.focus(); } catch (e) { /* ignore */ }
    } else {
      try { ov.focus(); } catch (e) { /* ignore */ }

  /** 当前是否有弹层打开。 */

   * 轻提示（role="status"，2.6s 后自动消失）。
   * @param {string} msg 文案
   * @param {string} [kind] 'ok' | 'warn' | 'err'

  function toast(msg, kind) {

    el.textContent = String(msg == null ? '' : msg);
    el.className = 'toast toast-show' + (kind ? ' toast-' + kind : '');
    if (toastTimer) global.clearTimeout(toastTimer);
    toastTimer = global.setTimeout(function () {
      toastTimer = 0;
      el.className = 'toast';
    }, 2600);
  }

  /**
   * 更新页面标题。
   * @param {string} name 当前视图名（题目名 / 题库 / 提交记录 …）
   */
  function setTitle(name) {
    var suffix = '时序竞技场 TSOJ';
    document.title = name ? (name + ' · ' + suffix) : suffix;
  }

  /** 让 #view 获得焦点（路由切换后调用，读屏用户能感知内容已更新）。 */
  function focusView() {
    var view = document.getElementById('view');
    if (!view) return;
    if (!view.hasAttribute('tabindex')) view.setAttribute('tabindex', '-1');
    try { view.focus(); } catch (e) { /* ignore */ }
  }

  TSJ.appA11y = {
    openModal: openModal,
    closeModal: closeModal,
    modalOpen: modalOpen,
    toast: toast,
    setTitle: setTitle,
    focusView: focusView,
    setBackgroundInert: setBackgroundInert
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/theme.js —— 主题解析（system / light / dark）
 *
 * 只用经典 script 与 localStorage，不引入框架。system 通过 matchMedia 监听，
 * 并在路由 Scope 销毁时解绑；主题写入前做白名单校验，坏值回退为 system。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var doc = global.document;
  var core = TSJ.appCore;

  var VALID = { system: true, light: true, dark: true };
  var listeners = [];
  var media = null;
  var mediaHandler = null;
  var current = 'system';

  function readStored() {
    if (!core || typeof core.readJSON !== 'function') return 'system';
    var v = core.readJSON(core.STORE.theme, 'system', function (x) {
      return typeof x === 'string' && VALID[x] === true;
    });
    return VALID[v] ? v : 'system';
  }

  function systemPrefersLight() {
    return !!(global.matchMedia && global.matchMedia('(prefers-color-scheme: light)').matches);
  }

  function resolve(theme) {
    if (theme === 'light' || theme === 'dark') return theme;
    return systemPrefersLight() ? 'light' : 'dark';
  }

  function apply(theme) {
    current = VALID[theme] ? theme : 'system';
    var resolved = resolve(current);
    if (doc && doc.documentElement) {
      doc.documentElement.setAttribute('data-theme', resolved);
      doc.documentElement.setAttribute('data-theme-mode', current);
    }
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](resolved, current); } catch (e) { /* 观察者异常不影响主题切换 */ }
    }
  }

  function set(theme) {
    if (!VALID[theme]) return current;
    if (core && typeof core.writeJSON === 'function') core.writeJSON(core.STORE.theme, theme);
    apply(theme);
    return current;
  }

  function onChange(fn) {
    if (typeof fn !== 'function') return function () {};
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);

    };
  }

  function watchSystem() {
    if (!global.matchMedia) return function () {};
    media = global.matchMedia('(prefers-color-scheme: light)');
    mediaHandler = function () {
      if (current === 'system') apply('system');
    };
    if (media.addEventListener) media.addEventListener('change', mediaHandler);
    else if (media.addListener) media.addListener(mediaHandler);
    return function () {
      if (!media) return;
      if (media.removeEventListener) media.removeEventListener('change', mediaHandler);
      else if (media.removeListener) media.removeListener(mediaHandler);
      media = null;
      mediaHandler = null;
    };
  }

    apply(readStored());
  }

    init: init,
    get: function () { return current; },
    resolved: function () { return resolve(current); },
    set: set,
    toggle: function () {
      return set(resolve(current) === 'dark' ? 'light' : 'dark');
    },
    onChange: onChange,

})(typeof window !== 'undefined' ? window : this);

<script>
/**
 * assets/js/app/views.js —— 题库页（搜索 / 标签 / 难度 / 随机一题）与判题入口注入
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js。
 * 依赖方向单向：views 可用 core / store / storage / ui / a11y，但**不能**直接引用 app.js 的
 * route / runJudge —— 判题回调由 app.js 启动时用 bindRunner() 注入，因此不存在反向依赖与循环依赖。
 * 题目页在 app/problem.js（那里要用到这里的 invokeRunner）。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var STORE = core.STORE;
  var DIFF_CLASS = core.DIFF_CLASS;

  /** 由 app.js 注入的判题入口：function(problem, dataset, isSubmit) */
  var runner = null;

  /** 注入判题入口（app.js 启动时调用一次）。 */
  function bindRunner(fn) {
    runner = typeof fn === 'function' ? fn : null;
  }

  /** 触发判题（未注入时静默忽略，保证 views 可独立渲染）。 */
  function invokeRunner(p, ds, isSubmit) {
    if (runner) runner(p, ds, isSubmit);
  }

  /* ---------- 1. 筛选条件 ---------- */
  /** 汇总所有题目标签（去重，保持首次出现顺序）。 */
  function allTags() {
    var seen = {};
    var out = [];
    for (var i = 0; i < problems.length; i++) {
      for (var t = 0; t < problems[i].tags.length; t++) {
        var tag = problems[i].tags[t];
        if (!seen[tag]) { seen[tag] = true; out.push(tag); }
      }
    }
    return out;
  }

  /** 难度 + 标签 + 搜索词三者取交集。 */
  function matches(p) {
    var st = store.state;
    var q = String(st.query || '').trim().toLowerCase();
    if (q) {
      var hay = (p.id + ' ' + p.title + ' ' + p.tags.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    if (st.tag && p.tags.indexOf(st.tag) < 0) return false;
    if (st.filter !== '全部' && p.difficulty !== st.filter) return false;
    return true;
  }

  /* ---------- 2. 题库页 ---------- */
  /** 渲染题库页（外壳只渲染一次，筛选变化只重绘列表区）。 */
  function renderProblemList() {
    var view = $('#view');
    var st = store.state;
    var html = [];
    html.push('<div class="page">\n<div class="page-head">\n<h1>题库</h1>');
    html.push('<p class="sub">共 ' + problems.length + ' 题 · 写一个 predict 函数，打败统计基线即可得分，通过后解锁题解</p>\n</div>');

    html.push('<div class="toolbar-row">');
    html.push('  <input type="search" class="search-input" id="searchInput" placeholder="搜索题号 / 标题 / 标签"' +
      ' aria-label="搜索题目" value="' + esc(st.query) + '">');
    html.push('  <button type="button" class="btn btn-random" id="btnRandom" title="优先从还没通过的题目里抽一题">随机一题</button>');
    html.push('  <button type="button" class="btn" id="btnTagToggle" aria-expanded="true" aria-controls="tagCloud">标签筛选</button>');
    html.push('  <button type="button" class="btn btn-clear" id="btnClearFilters" hidden>清除筛选</button>');
    html.push('</div>');

    html.push('<div class="filters" role="group" aria-label="按难度筛选">');
    var options = ['全部'].concat(core.DIFFS);
    for (var f = 0; f < options.length; f++) {
      var on = st.filter === options[f] ? ' chip-on' : '';
      html.push('<button type="button" class="chip' + on + '" data-filter="' + esc(options[f]) + '">' +
        esc(options[f]) + '</button>');
    }
    html.push('</div>');

    html.push('<div class="tag-cloud" id="tagCloud" role="group" aria-label="按标签筛选">');
    var tags = allTags();
    for (var g = 0; g < tags.length; g++) {
      var tagOn = st.tag === tags[g] ? ' on' : '';
      html.push('<button type="button" class="tag-chip' + tagOn + '" data-tag="' + esc(tags[g]) + '">' +
        esc(tags[g]) + '</button>');
    }
    html.push('</div>');

    html.push('<div id="listHost"></div>\n</div>');
    view.innerHTML = html.join('\n');

    bindShell(view);
    paintList();
  }

  /** 绑定题库页外壳交互（搜索框 / 难度 / 标签 / 随机一题）。 */
  function bindShell(view) {
    var input = $('#searchInput', view);
    if (input) {
      var onType = core.debounce(function () {
        store.state.query = input.value;
        paintList();
      }, 120);
      input.addEventListener('input', onType);
    }

    var chips = core.$$('.chip[data-filter]', view);
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function () {
        store.state.filter = this.getAttribute('data-filter');
        core.writeJSON(STORE.filter, store.state.filter);
        paintChips();
        paintList();
      });
    }

    var tagChips = core.$$('.tag-chip', view);
    for (var t = 0; t < tagChips.length; t++) {
      tagChips[t].addEventListener('click', function () {
        var tag = this.getAttribute('data-tag');
        store.state.tag = store.state.tag === tag ? null : tag;
        paintChips();
        paintList();
      });
    }

    var btnRandom = $('#btnRandom', view);
    if (btnRandom) btnRandom.addEventListener('click', goRandom);

    // 标签云在窄屏默认折叠，保证首屏先给「继续做题」入口；桌面默认展开
    var tagCloud = $('#tagCloud', view);
    var tagToggle = $('#btnTagToggle', view);
    if (tagCloud && tagToggle) {
      var narrow = !!(global.matchMedia && global.matchMedia('(max-width: 640px)').matches);
      function setTagCloud(open) {
        tagCloud.hidden = !open;
        tagToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      setTagCloud(!narrow);
      tagToggle.addEventListener('click', function () {

    if (btnClear) btnClear.addEventListener('click', clearFilters);
  }

  /** 当前是否有任何筛选条件生效（搜索词 / 标签 / 难度）。 */
  function hasActiveFilter() {
    var st = store.state;
    return String(st.query || '').trim() !== '' || st.tag !== null || st.filter !== '全部';
  }

  /** 一键清除所有筛选条件，回到默认态。 */
  function clearFilters() {

    store.state.tag = null;
    store.state.filter = '全部';

    paintList();
  }

  /** 同步「清除筛选」按钮的可见性（有筛选才出现，避免常驻干扰）。 */
  function syncClearBtn() {

  /** 同步 chip / tag-chip 的选中态（不重绘列表）。 */

    for (var i = 0; i < chips.length; i++) {

    }
    var tagChips = core.$$('.tag-chip', view);
    for (var t = 0; t < tagChips.length; t++) {
      var tagOn = tagChips[t].getAttribute('data-tag') === store.state.tag;
      tagChips[t].classList[tagOn ? 'add' : 'remove']('on');
    }
  }

  /** 重绘列表区（桌面表格 .prow + 窄屏卡片 .pcard，两份 DOM 由同一循环产出）。 */
  function paintList() {
    var host = $('#listHost');
    if (!host) return;
    var html = [];
    html.push('<div class="table-wrap list-table">\n<table class="ptable"><thead><tr>');
    html.push('<th style="width:64px">编号</th><th>标题</th><th style="width:76px">难度</th>');
    html.push('<th style="width:250px">标签</th><th style="width:62px">状态</th>');
    html.push('<th class="num" style="width:72px">最高分</th><th class="num" style="width:72px">通过率</th>');
    html.push('</tr></thead><tbody>');

    var shown = 0;
    var cards = [];
    for (var i = 0; i < problems.length; i++) {
      var p = problems[i];
      if (!matches(p)) continue;
      shown++;

      var rec = store.state.progress[p.id] || {};
      var best = toScore(rec.best);
      var stats = store.problemStats(p);
      var tags = '';
      for (var t = 0; t < p.tags.length; t++) tags += '<span class="tag">' + esc(p.tags[t]) + '</span>';
      var status = rec.passed === true
        ? '<span class="status-ok" title="已通过">✓</span>'
        : '<span class="status-no" title="未通过">—</span>';

      html.push('<tr class="prow" tabindex="0" data-id="' + esc(p.id) + '">\n<td class="idx">#' + p.index + '</td>');
      html.push('<td><a class="p-title" href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a></td>');
      html.push('<td><span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span></td>\n<td>' + tags + '</td>');
      html.push('<td>' + status + '</td>');
      html.push('<td class="num">' + (best > 0 ? esc(best) : '—') + '</td>\n<td class="num">' + esc(stats.rate) + '%</td>\n</tr>');

      cards.push('<article class="pcard" tabindex="0" data-id="' + esc(p.id) + '">');
      cards.push('  <div class="pc-head"><span class="pc-idx">#' + p.index + '</span>' +
        '<a class="p-title" href="#/problem/' + esc(p.id) + '">' + esc(p.title) + '</a></div>');
      cards.push('  <div class="pc-tags">' + tags + '</div>');
      cards.push('  <div class="pc-foot"><span class="badge ' + DIFF_CLASS[p.difficulty] + '">' +
        esc(p.difficulty) + '</span><span class="pc-stat">最高分 ' + (best > 0 ? esc(best) : '—') +
        '</span><span class="pc-stat">通过率 ' + esc(stats.rate) + '%</span><span class="pc-stat">' + status + '</span></div>');
      cards.push('</article>');
    }

    if (shown === 0) {
      html.push('<tr><td colspan="7"><div class="empty">没有符合条件的题目。<br>' +
        '<button type="button" class="btn" data-clear="1">清除筛选</button></div></td></tr>');
    }
    html.push('</tbody></table>\n</div>');

    var cardHtml = ['<div class="pcards">'];
    cardHtml.push(shown === 0
      ? '<div class="empty">没有符合条件的题目。<br><button type="button" class="btn" data-clear="1">清除筛选</button></div>'
      : cards.join('\n'));
    cardHtml.push('</div>');
    html.push(cardHtml.join('\n'));

    host.innerHTML = html.join('\n');
    bindRows(host);

    var inlineClears = core.$$('[data-clear]', host);
    for (var c = 0; c < inlineClears.length; c++) {
      inlineClears[c].addEventListener('click', clearFilters);
    }
    syncClearBtn();
  }

  /** 绑定列表行 / 卡片的点击与键盘操作。 */
  function bindRows(host) {
    var rows = core.$$('.prow, .pcard', host);
    for (var r = 0; r < rows.length; r++) {
      rows[r].addEventListener('click', function (ev) {
        // 标题本身是 <a>，交给浏览器处理
        if (ev.target && ev.target.tagName === 'A') return;
        global.location.hash = '#/problem/' + this.getAttribute('data-id');
      });
      rows[r].addEventListener('keydown', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          global.location.hash = '#/problem/' + this.getAttribute('data-id');
        }
      });
    }
  }

  /** 随机一题：优先从「还没通过」的题目里抽，全部通过后全量随机。 */
  function goRandom() {
    var pool = [];
    var i;
    for (i = 0; i < problems.length; i++) {
      var rec = store.state.progress[problems[i].id];
      if (!rec || rec.passed !== true) pool.push(problems[i]);
    }
    if (pool.length === 0) pool = problems.slice();
    // 用时间戳取模做伪随机：不引入随机数（数据集与判题都要求可复现）
    var pick = pool[Date.now() % pool.length];
    if (pick) global.location.hash = '#/problem/' + pick.id;
  }

  TSJ.appViews = {
    bindRunner: bindRunner,
    invokeRunner: invokeRunner,
    allTags: allTags,
    matches: matches,
    renderProblemList: renderProblemList,
    paintList: paintList,
    goRandom: goRandom
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/problem.js —— 题目页（题面 + 编辑器 + 工具栏）、题解、首次进入引导
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appProblem
 *
 * 判题入口不在这里直接引用 app.js：统一走 views.invokeRunner()（由 app.js 注入），保持单向依赖。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var ui = TSJ.appUi;
  var a11y = TSJ.appA11y;
  var views = TSJ.appViews;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var STORE = core.STORE;
  var DIFF_CLASS = core.DIFF_CLASS;
  var MODE_LABEL = core.MODE_LABEL;
  var md = ui.md;
  var mdInline = ui.mdInline;

  /* ---------- 1. 题目页 ---------- */
  /** 渲染题目详情页（左题面 / 右编辑器）。 */
  function renderProblem(id) {
    var p = TSJ.findProblem(id);
    var view = $('#view');

    if (!p) {
      view.innerHTML = '<div class="page"><div class="empty"><span class="empty-icon">◌</span>' +
        '找不到这道题目。<br><a href="#/problems">返回题库</a></div></div>';
      return;
    }

    var ds = TSJ.findDataset(p.dataset);
    if (!ds) {
      view.innerHTML = '<div class="page"><div class="empty">数据集缺失：' + esc(p.dataset) + '</div></div>';
      return;
    }

    store.state.activeProblem = p;
    var rec = store.state.progress[p.id] || {};
    var draft = store.state.drafts[p.id];
    var code = typeof draft === 'string' ? draft : p.starter;

    view.innerHTML = problemTemplate(p, ds, rec);

    // ---- 数据预览图（画完挂上 hover 交互；句柄存进 state 供路由切换时 destroy）----
    var canvas = $('#seriesChart', view);
    if (canvas) {
      TSJ.drawSeries(canvas, {
        values: ds.values,
        testStart: ds.values.length - p.horizon,
        height: 190
      });
      if (typeof TSJ.attachChartHover === 'function') {
        store.state.chartHover = TSJ.attachChartHover(canvas);
      }
    }

    /** 保存草稿（输入走防抖，Ctrl+S 直接调用）。 */
    function saveDraft() {
      if (!store.state.editor) return false;
      store.state.drafts[p.id] = store.state.editor.getValue();
      return store.saveDrafts();
    }

    // ---- 编辑器 ----
    store.state.editor = TSJ.createEditor($('#editorHost', view), {
      value: code,
      fontSize: store.state.edFont,
      errorHelpId: 'edErrorHelp',
      onChange: core.debounce(function (val) {
        store.state.drafts[p.id] = val;
        store.saveDrafts();
      }, 400),
      onRun: function () { views.invokeRunner(p, ds, false); },
      onSave: function () {
        if (saveDraft()) a11y.toast('草稿已保存', 'ok');
        else a11y.toast('本地存储已满，草稿未保存', 'err');
      }
    });

    // ---- 工具栏 ----
    var btnReset = $('#btnReset', view);
    var btnRun = $('#btnRun', view);
    var btnSubmit = $('#btnSubmit', view);
    var btnSolution = $('#btnSolution', view);
    var btnFont = $('#btnFont', view);

    if (btnFont) {
      var paintFont = function () {
        btnFont.textContent = 'A ' + store.state.edFont;
        btnFont.setAttribute('aria-label', '编辑器字号 ' + store.state.edFont + ' 像素，点击切换');
      };
      paintFont();
      btnFont.addEventListener('click', function () {
        var next = store.state.edFont >= 14 ? 12 : store.state.edFont + 1;
        store.saveEdFont(next);
        if (store.state.editor && typeof store.state.editor.setFontSize === 'function') {
          store.state.editor.setFontSize(next);
        }
        paintFont();
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', function () {
        if (!store.state.editor) return;
        store.state.editor.setValue(p.starter);
        store.state.drafts[p.id] = p.starter;
        store.saveDrafts();
      });
    }

    var sandboxOk = ui.canSubmit();
    if (btnRun) {
      btnRun.disabled = !sandboxOk;
      btnRun.addEventListener('click', function () { views.invokeRunner(p, ds, false); });
    }
    if (btnSubmit) {
      btnSubmit.disabled = !sandboxOk;
      if (!sandboxOk) btnSubmit.title = TSJ.judge.SANDBOX_REFUSED_REASON || '当前环境无法创建判题沙箱';
      btnSubmit.addEventListener('click', function () { views.invokeRunner(p, ds, true); });
    }
    if (btnSolution) {
      btnSolution.disabled = !rec.passed;
      btnSolution.addEventListener('click', function () { showSolution(p); });
    }

    ui.bindSplitter(view);
    if (sandboxOk) {
      ui.renderResult(null, p);
    } else {
      // 无沙箱 → 禁止提交，并明确告知原因（旧行为是静默降级 + 仍允许提交，死循环会锁死 UI）
      ui.renderGuardNotice({ message: TSJ.judge.SANDBOX_REFUSED_REASON });
    }
  }

  /** 题目页 HTML 模板。 */
  function problemTemplate(p, ds, rec) {
    var tags = '';
    for (var t = 0; t < p.tags.length; t++) tags += '<span class="tag">' + esc(p.tags[t]) + '</span>';

    var modeText = MODE_LABEL[p.mode] || p.mode;
    var modeDetail = p.mode === 'rolling'
      ? modeText + '（' + p.windows + ' 个窗口 / 步长 ' + p.originStep + '）'
      : modeText;

    var meta = [
      '<span class="meta-item">数据集 ' + esc(p.dataset) + '</span>',
      '<span class="meta-item">' + esc(modeDetail) + '</span>',
      '<span class="meta-item">步长 ' + p.horizon + '</span>',
      '<span class="meta-item">指标 ' + esc((TSJ.judge.metricLabels[p.metric] || p.metric)) + '</span>',
      '<span class="meta-item">阈值 ≤ ' + p.threshold + ' × 最优基线</span>',
      '<span class="meta-item">通过线 ' + p.passScore + '</span>'
    ].join('<span class="sep">·</span>');

    var hints = '';
    for (var h = 0; h < p.hints.length; h++) hints += '<li>' + mdInline(p.hints[h]) + '</li>';

    // 本地进度来自 localStorage（file:// 下可被同目录页面写入），因此先归一化再转义
    var bestScore = rec ? toScore(rec.best) : 0;
    var bestBadge = bestScore > 0
      ? '<span class="meta-item" data-best-badge="1" style="color:var(--accent)">历史最高 ' + esc(bestScore) + ' 分</span>'
      : '<span class="meta-item" data-best-badge="1">尚未提交</span>';

    var html = [];
    html.push('<div class="problem-layout" id="problemLayout">');

    /* ---------- 左：题面 ---------- */
    html.push('<section class="pane pane-left">\n  <div class="problem-head">\n    <div class="crumb"><a href="#/problems">题库</a> / #' + p.index + '</div>');
    html.push('    <h1>' + esc(p.title) + '</h1>\n    <div class="meta-row">\n      <span class="badge ' + DIFF_CLASS[p.difficulty] + '">' + esc(p.difficulty) + '</span>');
    html.push('      ' + tags + '\n      <span class="sep">|</span>' + bestBadge);
    html.push('    </div>\n    <div class="meta-row" style="margin-top:8px">' + meta + '</div>\n  </div>');

    html.push('  <div class="md">' + md(p.statement) + '</div>');

    html.push('  <div class="chart-card">\n    <div class="chart-title"><span>数据预览 · ' + esc(ds.name) + '（' + esc(ds.unit) + '）</span>');
    html.push('      <span>共 ' + ds.values.length + ' 点 · 周期 ' + ds.season + '</span></div>');
    html.push('    <canvas id="seriesChart" class="chart-canvas" height="190"></canvas>\n    <div class="chart-legend">');
    html.push('      <span class="legend-item"><i class="legend-dot" style="border-top-color:var(--v3-chart-history)"></i>历史</span>');
    html.push('      <span class="legend-item"><i class="legend-dot" style="border-top-color:var(--v3-chart-actual)"></i>测试集真实值</span>');
    html.push('      <span class="legend-item"><i class="legend-dot dash" style="border-top-color:var(--v3-chart-pred)"></i>你的预测</span>\n    </div>\n  </div>');

    html.push('  <div class="md" style="margin-top:14px">\n    <h3 class="md-h">输入</h3><p class="md-p">' + mdInline(p.inputSpec) + '</p>');
    html.push('    <h3 class="md-h">输出</h3><p class="md-p">' + mdInline(p.outputSpec) + '</p>\n  </div>');

    html.push('  <details class="hints"><summary>提示（共 ' + p.hints.length + ' 条，点击展开）</summary>');
    html.push('    <div class="hints-body"><ol>' + hints + '</ol></div>\n  </details>');

    if (p.guide && p.guide.length) {
      var steps = [];
      for (var s = 0; s < p.guide.length; s++) {
        var st = p.guide[s];
        steps.push('<div class="guide-step">');
        steps.push('  <div class="guide-step-num">' + (s + 1) + '</div>');
        steps.push('  <div class="guide-step-main"><h4>' + esc(st.title) + '</h4>');
        steps.push('    <p>' + mdInline(st.text) + '</p>');
        if (st.code) {
          steps.push('    <pre class="guide-code"><code>' +
            (TSJ.highlightCode ? TSJ.highlightCode(st.code) : esc(st.code)) + '</code></pre>');
        }
        steps.push('  </div>');
        steps.push('</div>');
      }
      html.push('  <details class="guide" open><summary>手把手带做（' + p.guide.length +
        ' 步，零基础照做即可拿第一个 AC）</summary>');
      html.push('    <div class="guide-body">' + steps.join('\n') + '</div>\n  </details>');
    }

    html.push('  <div id="solutionHost"></div>\n</section>');

    /* ---------- 分隔条 ---------- */
    html.push('<div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="调整左右分栏宽度" tabindex="-1"></div>');

    /* ---------- 右：编辑器 + 结果 ---------- */
