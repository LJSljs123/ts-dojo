    html.push('<section class="pane pane-right">\n  <div class="editor-toolbar">');
    html.push('    <div class="tb-left"><span class="file-chip">predict.js</span>');
    html.push('      <span class="tb-hint">Ctrl / ⌘ + Enter 运行 · Ctrl / ⌘ + S 存草稿</span></div>\n    <div class="tb-right">');
    html.push('      <button type="button" class="btn btn-ghost ed-font-btn" id="btnFont" title="切换编辑器字号">A 13</button>');
    html.push('      <button type="button" class="btn btn-ghost" id="btnReset">重置模板</button>');
    html.push('      <button type="button" class="btn btn-ghost" id="btnSolution"' + (rec && rec.passed === true ? '' : ' disabled title="通过本题后可查看题解"') + '>查看题解</button>');
    html.push('      <button type="button" class="btn" id="btnRun">运行</button>');
    html.push('      <button type="button" class="btn btn-primary" id="btnSubmit">提交判题</button>\n    </div>');
    html.push('  </div>\n  <div class="editor-host" id="editorHost"></div>');
    html.push('  <p class="ed-help" id="edErrorHelp">代码出错时会在这里说明行号与原因。</p>');
    html.push('  <div class="result-panel" id="resultPanel" aria-live="polite" aria-label="判题结果"></div>\n</section>');

    html.push('</div>');
    return html.join('\n');
  }

  /* ---------- 2. 题解 ---------- */
  /** 在左栏底部展示参考实现。 */
  function showSolution(p) {
    var view = $('#view');
    var host = view ? $('#solutionHost', view) : null;
    if (!host) return;
    if (host.getAttribute('data-open') === '1') {
      host.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var html = [];
    html.push('<div class="solution-box">');
    html.push('  <div class="sb-head"><span>参考实现 · ' + esc(p.title) + '</span><span>' +
      esc(p.difficulty) + '</span></div>');
    html.push('  <pre><code>' + (TSJ.highlightCode ? TSJ.highlightCode(p.solution) : esc(p.solution)) + '</code></pre>\n</div>');
    host.innerHTML = html.join('\n');
    host.setAttribute('data-open', '1');
    host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- 3. 首次进入引导 ---------- */
  /** 首次进入时的简短引导（弹层：焦点陷阱 + ESC 关闭 + 关闭后焦点回 #view）。 */
  function showOnboarding() {
    var html = [
      '<div class="modal">',
      '  <h2>欢迎来到时序竞技场</h2>',
      '  <div class="modal-flow">',
      '    <span class="flow-step">写 predict 函数</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">提交</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">打败基线得分</span><span class="flow-arrow">→</span>',
      '    <span class="flow-step">解锁题解</span>',
      '  </div>',
      '  <p>每道题只要实现一个函数：</p>',
      '  <p><code>predict(history, horizon, ctx) → number[]</code></p>',
      '  <ul>',
      '    <li>得分由「你的误差 ÷ 最优基线误差」决定，误差比越小分越高</li>',
      '    <li>误差比 = 0.5 得满分 100，等于阈值恰好得 60 分，≥ 2 得 0 分</li>',
      '    <li>全部测试点达标才算通过，通过后可查看参考实现</li>',
      '    <li>代码与成绩都存在浏览器本地，随时可以继续</li>',
      '  </ul>',
      '  <p style="margin:0 0 6px">完全零基础？先用 25 分钟上' +
        '<a href="#/learn/m0" style="color:var(--accent)">「零基础第一课」</a>' +
        '，第 1 题还有手把手带做面板。</p>',
      '  <div class="modal-actions">',
      '    <button type="button" class="btn btn-primary" id="onbStart">开始做题</button>',
      '  </div>',
      '</div>'
    ].join('\n');

    a11y.openModal({ html: html, label: '欢迎来到时序竞技场', initialFocus: '#onbStart' });
    var btn = $('#onbStart');
    if (btn) {
      btn.addEventListener('click', function () {
        core.writeJSON(STORE.onboarded, true);
        a11y.closeModal();
      });
    }
  }

  /**
   * 刷新题头的「历史最高 / 尚未提交」徽标。
   * 判题落盘后必须调用：否则刚提交完，右上角等级分已经变了，题头却还写着「尚未提交」。
   * @param {Object} p 题目
   */
  function refreshBestBadge(p) {
    var view = $('#view');
    if (!view || !p) return;
    var el = view.querySelector('[data-best-badge]');
    if (!el) return;
    var rec = store.state.progress[p.id];
    var best = rec ? toScore(rec.best) : 0;
    if (best > 0) {
      el.textContent = '历史最高 ' + best + ' 分';
      el.style.color = 'var(--accent)';
    } else {
      el.textContent = '尚未提交';
      el.style.color = '';
    }
  }

  TSJ.appProblem = {
    renderProblem: renderProblem,
    showSolution: showSolution,
    showOnboarding: showOnboarding,
    refreshBestBadge: refreshBestBadge
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/pages.js —— 纯展示型页面：提交记录 / 提交详情 / 排行榜 / 学习路径
 *
 * 加载顺序：util → core → schema → store → storage → ui → a11y → views → problem → pages → app.js
 * 挂载点：window.TSJ.appPages
 *
 * 这些页面没有编辑器、没有判题会话，只是「状态 → HTML」的映射；刷新入口由 app.js 用
 * bindRefresh() 注入，避免反向依赖。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var storage = TSJ.appStorage;
  var ui = TSJ.appUi;
  var a11y = TSJ.appA11y;
  var problems = TSJ.problems;

  var $ = core.$;
  var esc = core.esc;
  var toScore = core.toScore;
  var fmtTime = core.fmtTime;
  var DIFF_CLASS = core.DIFF_CLASS;

  /** 由 app.js 注入的「重渲染当前视图」入口 */
  var refresh = null;

  /** 注入刷新入口。 */
  function bindRefresh(fn) {
    refresh = typeof fn === 'function' ? fn : null;
  }

  /** 触发刷新（未注入时静默忽略）。 */
  function doRefresh() {
    if (refresh) refresh();
  }

  /** verdict → 中文标签与 class。 */
  function verdictInfo(v) {
    if (v === 'AC') return { cls: 'verdict-ac', text: 'AC 通过' };
    if (v === 'RE') return { cls: 'verdict-re', text: 'RE 运行错误' };
    if (v === 'TLE') return { cls: 'verdict-tle', text: 'TLE 超时' };
    return { cls: 'verdict-wa', text: 'WA 未通过' };
  }

  /* ---------- 1. 提交记录页 ---------- */
  /** 渲染提交记录列表 + 存储操作条（导出 / 导入 / 清空）。 */
  function renderSubmissions() {
    var html = [];
    html.push('<div class="page">\n<div class="page-head"><h1>提交记录</h1>');
    html.push('<p class="sub">本地保存最近 120 条记录（含代码快照与逐测试点，可点开复盘）</p></div>');

    html.push('<div class="store-bar" role="group" aria-label="进度管理">');
    html.push('  <button type="button" class="btn" id="btnExport" title="把进度导出成 JSON 文件">导出进度</button>');
    html.push('  <button type="button" class="btn" id="btnImport" title="从 JSON 文件导入并合并进度">导入进度</button>');
    html.push('  <button type="button" class="btn btn-danger" id="btnClear" title="删除本机所有 TSOJ 进度">清空进度</button>');
    html.push('  <input type="file" id="importFile" class="hidden" accept="application/json,.json" aria-hidden="true" tabindex="-1">');
    html.push('</div>');

    if (store.state.submissions.length === 0) {
      html.push('<div class="empty"><span class="empty-icon">◌</span>还没有提交记录。<br>' +
        '<a href="#/problems">去题库挑一道题</a></div>');
    } else {
      html.push('<div class="table-wrap list-table"><table class="ptable"><thead><tr>');
      html.push('<th style="width:150px">时间</th><th>题目</th>\n<th class="num" style="width:80px">分数</th>');
      html.push('<th style="width:120px">结果</th>\n<th style="width:90px">指标</th>\n</tr></thead><tbody>');

      var cards = [];
      for (var i = 0; i < store.state.submissions.length; i++) {
        var s = store.state.submissions[i];
        var info = verdictInfo(s.verdict);
        var sid = esc(s.id);
        html.push('<tr class="srow" tabindex="0" data-sid="' + sid + '">\n<td class="idx">' + esc(fmtTime(s.at)) + '</td>');
        html.push('<td><a class="p-title" href="#/submission/' + sid + '">' + esc(s.title) + '</a></td>');
        html.push('<td class="num">' + esc(toScore(s.score)) + '</td>');
        html.push('<td><span class="' + info.cls + '" style="font-size:12.5px;font-weight:600">' + esc(info.text) + '</span></td>');
        html.push('<td class="num">' + esc(s.metric || '') + '</td>\n</tr>');

        cards.push('<article class="pcard srow-card" tabindex="0" data-sid="' + sid + '">');
        cards.push('  <div class="pc-head"><span class="pc-idx">' + esc(toScore(s.score)) + ' 分</span>' +
          '<a class="p-title" href="#/submission/' + sid + '">' + esc(s.title) + '</a></div>');
        cards.push('  <div class="pc-foot"><span class="' + info.cls + '">' + esc(info.text) + '</span>' +
          '<span class="pc-stat">' + esc(fmtTime(s.at)) + '</span>' +
          '<span class="pc-stat">' + esc(s.metric || '') + '</span></div>');
        cards.push('</article>');
      }

      html.push('</tbody></table></div>');
      html.push('<div class="pcards">' + cards.join('\n') + '</div>');
    }

    html.push('</div>');
    var view = $('#view');
    view.innerHTML = html.join('\n');
    bindStoreBar(view);
    bindSubmissionRows(view);
  }

  /** 绑定导出 / 导入 / 清空。 */
  function bindStoreBar(view) {
    var btnExport = $('#btnExport', view);
    var btnImport = $('#btnImport', view);
    var btnClear = $('#btnClear', view);
    var fileInput = $('#importFile', view);

    if (btnExport) {
      btnExport.addEventListener('click', function () {
        storage.exportProgress();
        a11y.toast('已导出进度文件', 'ok');
      });
    }
    if (btnImport && fileInput) {
      btnImport.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = '';   // 允许重复选同一个文件
        if (!file) return;
        storage.importFile(file, function (result) {
          if (!result.ok) {
            a11y.toast('导入失败：' + result.reason, 'err');
            return;
          }
          a11y.toast('导入成功：进度 ' + result.counts.progress + ' 题 · 草稿 ' +
            result.counts.drafts + ' 份 · 提交 ' + result.counts.submissions + ' 条', 'ok');
          doRefresh();
        });
      });
    }
    if (btnClear) {
      btnClear.addEventListener('click', function () {
        var html = [
          '<div class="modal">',
          '  <h2>清空本机进度？</h2>',
          '  <p>将删除本机所有 TSOJ 数据：各题最高分、提交记录、代码草稿、引导标记。此操作不可撤销。</p>',
          '  <p>建议先「导出进度」留一份备份。</p>',
          '  <div class="modal-actions">',
          '    <button type="button" class="btn" id="clearCancel">取消</button>',
          '    <button type="button" class="btn btn-danger" id="clearConfirm">确认清空</button>',
          '  </div>',
          '</div>'
        ].join('\n');
        a11y.openModal({ html: html, label: '清空本机进度', initialFocus: '#clearCancel' });
        var cancel = $('#clearCancel');
        var confirm = $('#clearConfirm');
        if (cancel) cancel.addEventListener('click', function () { a11y.closeModal(); });
        if (confirm) {
          confirm.addEventListener('click', function () {
            var keys = storage.clearAll();
            a11y.closeModal();
            a11y.toast('已清空 ' + keys.length + ' 项本地数据', 'ok');
            store.updateScoreChip();
            doRefresh();
          });
        }
      });
    }
  }

  /** 绑定提交记录行 / 卡片：点击或 Enter 打开详情。 */
  function bindSubmissionRows(view) {
    var rows = core.$$('.srow', view);
    for (var i = 0; i < rows.length; i++) {
      rows[i].addEventListener('click', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        global.location.hash = '#/submission/' + this.getAttribute('data-sid');
      });
      rows[i].addEventListener('keydown', function (ev) {
        if (ev.target && ev.target.tagName === 'A') return;
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          global.location.hash = '#/submission/' + this.getAttribute('data-sid');
        }
      });
    }
  }

  /* ---------- 2. 提交详情页 ---------- */
  /** 按 id 找提交记录。 */
  function findSubmission(id) {
    for (var i = 0; i < store.state.submissions.length; i++) {
      if (store.state.submissions[i].id === id) return store.state.submissions[i];
    }
    return null;
  }

  /**
   * 渲染提交详情：题目 / 时间 / 分数 / verdict / 逐测试点 / 只读代码快照。
   * @param {string} id 提交记录 id
   */
  function renderSubmissionDetail(id) {
    var view = $('#view');
    var s = findSubmission(id);

    if (!s) {
      view.innerHTML = '<div class="page"><div class="empty"><span class="empty-icon">◌</span>' +
        '找不到这条提交记录（可能已被清空或来自其它浏览器）。<br>' +
        '<a href="#/submissions">返回提交记录</a></div></div>';
      return;
    }

    var info = verdictInfo(s.verdict);
    var p = TSJ.findProblem(s.problemId);
    var html = [];

    html.push('<div class="page detail-page">');
    html.push('<div class="crumb"><a href="#/submissions">提交记录</a> / 详情</div>');
    html.push('<div class="page-head"><h1>' + esc(s.title || (p ? p.title : '未知题目')) + '</h1>');
    html.push('<p class="sub">提交于 ' + esc(fmtTime(s.at)) + ' · 记录 ' + esc(s.id) + '</p></div>');

    html.push('<div class="detail-head">');
    html.push('  <div class="detail-score"><b>' + esc(toScore(s.score)) + '</b><span>分</span></div>');
    html.push('  <div class="detail-meta">');
    html.push('    <div class="verdict ' + info.cls + '">' + esc(info.text) + '</div>');
    html.push('    <div class="result-sub">指标 ' + esc(s.metric || '—') +
      ' · 通过线 ' + (p ? esc(p.passScore) : '—') + ' 分</div>');
    if (s.degraded) html.push('    <div class="result-sub dim">该次判题在降级沙箱中执行</div>');
    html.push('  </div>');
    html.push('  <div class="detail-actions">');
    if (p) html.push('    <a class="btn" href="#/problem/' + esc(p.id) + '">回到题目</a>');
    html.push('    <a class="btn btn-ghost" href="#/submissions">返回提交记录</a>');
    html.push('  </div>\n</div>');

    // 逐测试点
    html.push('<h2 class="section-title">逐测试点</h2>');
    if (s.cases.length === 0) {
      html.push('<div class="notice">这条记录没有逐测试点明细（早于 v1 的记录只有总分）。</div>');
    } else {
      html.push(ui.renderCaseList(s.cases, false));
    }

    // 代码快照（只读、已转义、带语法高亮）
    html.push('<h2 class="section-title">提交时的代码</h2>');
    if (!s.code) {
      html.push('<div class="notice">这条记录没有代码快照（早于 v1 的记录只存了成绩）。</div>');
    } else {
      html.push('<pre class="detail-code" tabindex="0" aria-label="提交时的代码"><code>' +
        (TSJ.highlightCode ? TSJ.highlightCode(s.code) : esc(s.code)) + '</code></pre>');
      html.push('<p class="sub dim">代码快照最多保存 20KB，超出部分未保存。</p>');
    }

    html.push('</div>');
    view.innerHTML = html.join('\n');
  }

  TSJ.appPages = {
    bindRefresh: bindRefresh,
    verdictInfo: verdictInfo,
    renderSubmissions: renderSubmissions,
    findSubmission: findSubmission,
    renderSubmissionDetail: renderSubmissionDetail
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/lab-storage.js —— 实验室记录存储（最近 20 组）
 *
 * 导入先完整校验再替换；写入失败不动旧数据；达到上限按时间淘汰。
 * 记录里保存完整配置、版本、逐 origin 预测/真值/指标与基线，保证可复现。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var KEY = core.STORE.lab;
  var MAX = 20;

  function isFiniteNumber(v) { return typeof v === 'number' && isFinite(v); }

  function normalizeRecord(r) {
    if (!r || typeof r !== 'object') return null;
    if (r.schema !== 1) return null;
    if (r.algorithmVersion !== 'lab-1') return null;
    if (!r.config || typeof r.config !== 'object') return null;
    if (!r.configHash || typeof r.configHash !== 'string') return null;
    if (!Array.isArray(r.origins) || !r.origins.length) return null;
    if (!r.metrics || !r.metrics.mean || !r.metrics.worst) return null;
    return {
      schema: 1,
      appVersion: typeof r.appVersion === 'string' ? r.appVersion : '3.0.0',
      algorithmVersion: 'lab-1',
      datasetVersion: typeof r.datasetVersion === 'string' ? r.datasetVersion : '',
      createdAt: isFiniteNumber(r.createdAt) ? r.createdAt : 0,
      config: r.config,
      configHash: r.configHash,
      origins: r.origins,
      metrics: r.metrics,
      baseline: typeof r.baseline === 'string' ? r.baseline : '',
      intervalMeta: r.intervalMeta || null,
      durationMs: isFiniteNumber(r.durationMs) ? r.durationMs : 0
    };
  }

  function list() {
    var raw = core.readJSON(KEY, [], function (v) { return Array.isArray(v); });
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var rec = normalizeRecord(raw[i]);
      if (rec) out.push(rec);
    }
    out.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    return out;
  }

  function save(record) {
    var rec = normalizeRecord(record);
    if (!rec) return { ok: false, error: '记录不合法，未保存' };
    var arr = list().filter(function (x) { return x.configHash !== rec.configHash; });
    arr.unshift(rec);
    while (arr.length > MAX) arr.pop();
    core.writeJSON(KEY, arr);
    return { ok: true, count: arr.length };
  }

  function clear() {
    core.writeJSON(KEY, []);
  }

  function exportJSON(record) {
    var rec = normalizeRecord(record);
    if (!rec) return null;
    return JSON.stringify({
      app: 'tsoj-lab',
      schema: 1,
      exportedAt: Date.now(),
      record: rec
    }, null, 2);
  }

  function importJSON(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) {
      return { ok: false, error: '不是合法 JSON' };
    }
    if (!data || data.app !== 'tsoj-lab') return { ok: false, error: '不是 TSOJ 实验文件' };
    if (data.schema !== 1) return { ok: false, error: 'schema 不支持：' + data.schema };
    var rec = normalizeRecord(data.record);
    if (!rec) return { ok: false, error: '记录字段不完整或算法版本不匹配' };
    var res = save(rec);
    if (!res.ok) return { ok: false, error: res.error };
    return { ok: true, record: rec, count: res.count };
  }

  TSJ.appLabStorage = {
    MAX: MAX,
    list: list,
    save: save,
    clear: clear,
    exportJSON: exportJSON,
    importJSON: importJSON,
    normalizeRecord: normalizeRecord
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/lab-panels.js —— 实验室 UI 面板片段（纯字符串生成）
 *
 * 与 app/lab.js 分离：这里不做事件绑定与图表生命周期，只输出 HTML 片段，
 * 方便控制单文件长度并独立做静态审计。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var esc = core.esc;

  /** 诊断图类型（lab.js 与结果外壳共用同一份注册表）。 */
  var KINDS = [
    { id: 'forecast', label: '预测对比' },
    { id: 'residual', label: '残差' },
    { id: 'acf', label: 'ACF' },
    { id: 'pacf', label: 'PACF' },
    { id: 'decomposition', label: '季节分解' }
  ];

  function paramsHtml(method) {
    var meta = TSJ.labConfig.METHODS[method];
    if (!meta || !Object.keys(meta.params).length) return '<p class="ds-card-sub">该方法无可调参数。</p>';
    var rows = Object.keys(meta.params).map(function (key) {
      var r = meta.params[key];
      return '<label class="ds-field"><span>' + esc(key) + '（' + r.min + '–' + r.max + '）</span>' +
        '<input id="param-' + esc(key) + '" type="number" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '" value="' + r.def + '"></label>';
    });
    return '<div class="lab-config-row">' + rows.join('') + '</div>';
  }

  function metricChecks(selected) {
    return Object.keys(TSJ.labConfig.METRICS).map(function (m) {
      var on = selected.indexOf(m) >= 0;
      return '<label class="ds-badge"><input type="checkbox" class="lab-metric" value="' + m + '"' + (on ? ' checked' : '') + '> ' + esc(TSJ.labConfig.METRICS[m].label) + '</label>';
    }).join('');
  }

  function configPanel(ctx) {
    var cfg = ctx.config;
    return [
      '<div class="ds-card lab-config">',
      '  <h2 class="ds-card-title">实验配置</h2>',
      '  <label class="ds-field"><span>数据集</span><select id="labDataset">',
      TSJ.datasets.map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (d.id === cfg.datasetId ? ' selected' : '') + '>' + esc(d.name) + '（' + d.values.length + ' 点 · ' + esc(d.freq) + '）</option>';
      }).join(''),
      '  </select></label>',
      '  <label class="ds-field"><span>方法（白名单）</span><select id="labMethod">',
      Object.keys(TSJ.labConfig.METHODS).map(function (m) {
        return '<option value="' + esc(m) + '"' + (m === cfg.method ? ' selected' : '') + '>' + esc(TSJ.labConfig.METHODS[m].label) + '</option>';
      }).join(''),
      '  </select></label>',
      '<div id="labParams">' + paramsHtml(cfg.method) + '</div>',
      '  <div class="lab-config-row">',
      '    <label class="ds-field"><span>切分</span><select id="labMode">',
      '      <option value="holdout"' + (cfg.split.mode === 'holdout' ? ' selected' : '') + '>留出法</option>',
      '      <option value="rolling"' + (cfg.split.mode === 'rolling' ? ' selected' : '') + '>滚动回测</option>',
      '    </select></label>',
      '    <label class="ds-field"><span>horizon</span><input id="labHorizon" type="number" min="1" max="48" value="' + cfg.split.horizon + '"></label>',
      '    <label class="ds-field"><span>窗口数</span><input id="labWindows" type="number" min="1" max="12" value="' + cfg.split.windows + '"></label>',
      '    <label class="ds-field"><span>起点步长</span><input id="labOriginStep" type="number" min="1" max="48" value="' + cfg.split.originStep + '"></label>',
      '  </div>',
      '  <div class="ds-field"><span>指标</span><div>' + metricChecks(cfg.metrics) + '</div></div>',
      '  <label class="ds-field"><span>对照基线</span><select id="labBaseline">',
      TSJ.labConfig.BASELINES.map(function (b) {
        return '<option value="' + esc(b) + '"' + (b === cfg.baseline ? ' selected' : '') + '>' + esc(TSJ.judge.baselineLabels[b] || b) + '</option>';
      }).join(''),
      '  </select></label>',
      '  <label class="ds-badge"><input type="checkbox" id="labInterval"' + (cfg.interval.enabled ? ' checked' : '') + '> 残差经验区间（80/95%）</label>',
      '  <div class="lab-actions">',
      '    <button class="ds-btn ds-btn-primary" id="labRun">运行实验</button>',
      '    <button class="ds-btn" id="labReset">恢复默认</button>',
      '  </div>',
      '  <p class="md-note"><span>⚠</span><span>区间由训练段内部一步残差分位构造，是教学演示，不是模型原生概率输出；测试真值不参与校准。</span></p>',
      '</div>'
    ].join('\n');
  }

  /**
   * 结果卡外壳：工具条 + 图表区 + 指标区 + 实时滑杆区。
   * 图表区 / 指标区 / 覆盖说明都带独立 id，lab.js 的轻量重绘只替换这些区域，
   * 不重建工具条与滑杆（保持拖动状态）。滑杆渲染委托给 app/lab-live.js。
   */
  function resultShell(r, state) {
    var originButtons = r.origins.map(function (o, i) {
      return '<button class="ds-btn ds-btn-sm' + (i === state.originIndex ? ' ds-btn-primary' : '') + '" data-origin="' + i + '">#' + (i + 1) + '</button>';
    }).join('');
    var kindButtons = '<div class="lab-seg" role="group" aria-label="诊断图类型">' + KINDS.map(function (k) {
      return '<button type="button" class="lab-seg-btn' + (k.id === state.kind ? ' lab-seg-on' : '') +
        '" data-kind="' + k.id + '">' + k.label + '</button>';
    }).join('') + '</div>';
    var kindLabel = KINDS.filter(function (k) { return k.id === state.kind; })[0].label;
    return [
      '<div class="ds-card"><h2 class="ds-card-title">结果摘要</h2>',
      '<p class="ds-card-sub">配置指纹 ' + esc(r.configHash) + ' · 数据版本 ' + esc(r.datasetVersion) + ' · 算法版本 ' + esc(r.algorithmVersion) + ' · 耗时 ' + r.durationMs + 'ms</p>',
      '<div class="lab-toolbar"><div class="lab-actions" aria-label="测试点">' + originButtons + '</div>' + kindButtons + '</div>',
      '<div id="labChartZone"><div class="chart-v2"><div class="chart-v2-head"><h3>' + esc(kindLabel) + '</h3>',
      '<div class="chart-v2-legend"><span><i style="border-color:var(--v3-chart-history)"></i>历史</span><span><i style="border-color:var(--v3-chart-actual)"></i>真值</span><span><i style="border-color:var(--v3-chart-pred);border-top-style:dashed"></i>预测</span><span><i style="border-color:var(--v3-chart-baseline);border-top-style:dotted"></i>基线</span></div></div>',
      '<div class="chart-v2-canvas-wrap" id="labChartWrap"><canvas id="labCanvas"></canvas></div>',
      '<p class="chart-v2-summary" id="labChartSummary"></p>',
      '<p class="chart-v2-summary" id="labCoverage"></p>',
      '</div></div>',
      '<div class="lab-metrics" id="labMetricsZone"><h3 class="lab-metrics-title">指标对比</h3>',
      metricTable(r),
      '</div>',
      '<div id="labLiveZone">' + (TSJ.appLabLive ? TSJ.appLabLive.render(r.config) : '') + '</div>',
      '</div>'
    ].join('\n');
  }

  function originModel(origin) {
    var n = origin.history.length + origin.actual.length;
    var split = origin.history.length;
    function pad(arr) {
      var out = new Array(n).fill(null);
      for (var i = 0; i < arr.length; i++) out[split + i] = arr[i];
      return out;
    }
    var intervals = (origin.intervals || []).map(function (iv) {
      return { level: iv.level, lower: pad(iv.lower || []), upper: pad(iv.upper || []) };
    });
    return {
      n: n,
      history: origin.history.slice(),
      actual: pad(origin.actual),
      prediction: pad(origin.prediction),
      baseline: pad(origin.baseline),
      intervals: intervals,
      splits: [{ index: split, role: 'test', label: '测试起点' }],
      maxPoints: 1200
    };
  }

  function metricTable(result) {
    var rows = result.config.metrics.map(function (m) {
      function fmt(v) { return typeof v === 'number' && isFinite(v) ? v.toFixed(3) : '—'; }
      // 候选 vs 基线均值：全部指标都是越小越好；优势格着色 + 方向标
      var meanV = result.metrics.mean[m];
      var baseV = result.metrics.baselineMean[m];
      var hasBoth = isFinite(meanV) && isFinite(baseV);
      var win = hasBoth && meanV < baseV;
      var lose = hasBoth && meanV > baseV;
      var meanCell = fmt(meanV) + (win ? ' <span class="cell-good">▼优</span>' : lose ? ' <span class="cell-bad">▲劣</span>' : '');
      return '<tr><td>' + esc(TSJ.labConfig.METRICS[m].label) + '</td>' +
        '<td class="num">' + meanCell + '</td>' +
        '<td class="num">' + fmt(result.metrics.worst[m]) + '</td>' +
        '<td class="num">' + fmt(result.metrics.baselineMean[m]) + '</td>' +
        '<td class="num">' + fmt(result.metrics.baselineWorst[m]) + '</td></tr>';
    }).join('');
    return '<div class="ds-table-wrap"><table class="ds-table ds-table-hover"><thead><tr><th>指标</th><th class="num">均值</th><th class="num">最差窗口</th><th class="num">基线均值</th><th class="num">基线最差</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function historyPanel() {
    var list = TSJ.appLabStorage.list();
    if (!list.length) return '<div class="ds-empty"><strong>还没有实验记录</strong><span>运行成功后会自动保存最近 20 组。</span></div>';
    return '<div class="lab-history">' + list.map(function (r) {
      var m = r.metrics && r.metrics.mean || {};
      var first = Object.keys(m)[0];
      return '<div class="lab-history-item"><span>' + esc(r.config.datasetId) + ' · ' + esc(r.config.method) + ' · ' + (first ? first.toUpperCase() + ' ' + m[first].toFixed(2) : '—') + '</span>' +
        '<span><button data-load="' + esc(r.configHash) + '">载入配置</button></span></div>';
    }).join('') + '</div>';
  }

  TSJ.appLabPanels = {
    KINDS: KINDS,
    paramsHtml: paramsHtml,
    metricChecks: metricChecks,
    configPanel: configPanel,
    resultShell: resultShell,
    originModel: originModel,
    metricTable: metricTable,
    historyPanel: historyPanel
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/lab-live.js —— 实验室「实时调节」滑杆（v3.5）
 * 加载顺序：… app/lab-panels → app/lab-live → app/lab.js　挂载点：window.TSJ.appLabLive
 *
 * 职责边界：本模块只负责滑杆的「渲染 + 取值 + 数值输入框同步」；
 * 重算与落图由 app/lab.js 的回调完成（onChange）。拖动不写存储——
 * 正式记录仍走「运行实验」，但滑杆会同步进配置面板的数字输入框，
 * 保证「拖出来看到的效果 = 点运行后保存的效果」。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var esc = core.esc;

  /**
   * 渲染滑杆区 HTML。
   * @param {Object} cfg 已归一化的实验室配置（取 method 与 params）
   * @returns {string} HTML；方法无可调参数时返回空串（调用方隐藏容器）
   */
  function render(cfg) {
    var meta = TSJ.labConfig.METHODS[cfg.method];
    if (!meta) return '';
    var keys = Object.keys(meta.params);
    if (!keys.length) return '';
    var rows = keys.map(function (key) {
      var rule = meta.params[key];
      var v = cfg.params[key] != null ? cfg.params[key] : rule.def;
      return '<div class="lab-live-param">' +
        '<div class="lab-live-head"><label for="live-' + esc(key) + '">' + esc(key) + '</label>' +
        '<output id="live-' + esc(key) + '-val">' + esc(v) + '</output></div>' +
        '<input type="range" id="live-' + esc(key) + '" data-param="' + esc(key) + '"' +
        ' min="' + rule.min + '" max="' + rule.max + '" step="' + rule.step + '" value="' + esc(v) + '"' +
        ' aria-label="实时调节 ' + esc(key) + '（' + rule.min + ' 到 ' + rule.max + '，步长 ' + rule.step + '）">' +
        '</div>';
    });
    return '<div class="lab-live">' +
      '<div class="lab-live-title"><b>实时调节</b>' +
      '<span>拖动即重算本图（不写入记录）；点「运行实验」按当前滑杆值正式保存</span></div>' +
      '<div class="lab-live-grid">' + rows.join('') + '</div>' +
      '</div>';
  }

  /**
   * 绑定滑杆事件。
   * @param {Object} opts { onChange: function(params) } —— 防抖后的重算回调
   * @returns {Function} unbind（路由销毁时可调用；本次实现随 DOM 一起销毁，无需显式解绑）
   */
  function bind(opts) {
    var zone = global.document.getElementById('labLiveZone');
    if (!zone) return function () {};
    var inputs = core.$$('input[type="range"]', zone);
    if (!inputs.length) return function () {};

    /** 把当前滑杆值同步回配置面板的数字输入框（保证「所见 = 所保存」）。 */
    function syncNumberInputs() {
      inputs.forEach(function (i) {
        var el = global.document.getElementById('param-' + i.getAttribute('data-param'));
        if (el) el.value = i.value;
      });
    }

    var notify = core.debounce(function () {
      if (typeof opts.onChange === 'function') opts.onChange(currentParams());
    }, 90);

    inputs.forEach(function (i) {
      i.addEventListener('input', function () {
        var out = global.document.getElementById(i.id + '-val');
        if (out) out.textContent = i.value;
        syncNumberInputs();
        notify();
      });
    });

    return function () { /* 占位：监听随 #labLiveZone 一起被 innerHTML 重建销毁 */ };
  }

  /** 当前滑杆值（{param: number}）。 */
  function currentParams() {
    var zone = global.document.getElementById('labLiveZone');
    var out = {};
    if (!zone) return out;
    core.$$('input[type="range"]', zone).forEach(function (i) {
      var v = Number(i.value);
      if (isFinite(v)) out[i.getAttribute('data-param')] = v;
    });
    return out;
  }

  /** 清空渲染（方法切换后旧滑杆失效时调用）。 */
  function reset() {
    var zone = global.document.getElementById('labLiveZone');
    if (zone) zone.innerHTML = '';
  }

  TSJ.appLabLive = { render: render, bind: bind, currentParams: currentParams, reset: reset };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/studio-storage.js —— 模型工坊实验记录（v3.6）
 * 加载顺序：… app/lab-storage → app/studio-storage → app/studio.js
 * 挂载点：window.TSJ.appStudioStorage
 *
 * 与 lab-storage 同构：先完整校验再入列；写入失败不动旧数据；上限 30 条按时间淘汰。
 * 记录保存「代码快照 + 拆分协议 + val/test 指标与基线对比」，保证可复现与可复盘。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var KEY = core.STORE.studioExp;
  var MAX = 30;

  function isFiniteNumber(v) { return typeof v === 'number' && isFinite(v); }

  /** 指标对象白名单归一化：只接受 mse/mae/smape 三个键的有限数。 */
  function normMetrics(m) {
    var out = {};
    var ok = false;
    ['mse', 'mae', 'smape'].forEach(function (k) {
      if (m && isFiniteNumber(m[k])) { out[k] = m[k]; ok = true; }
    });
    return ok ? out : null;
  }

  /** 基线对比表归一化：{ name: {mse,mae,smape} }，只保留合法项。 */
  function normBaselines(b) {
    var out = {};
    if (!b || typeof b !== 'object') return out;
    Object.keys(b).forEach(function (name) {
      var m = normMetrics(b[name]);
      if (m) out[String(name).slice(0, 40)] = m;
    });
    return out;
  }

  function normalizeRecord(r) {
    if (!r || typeof r !== 'object') return null;
    if (r.schema !== 1) return null;
    if (r.kind !== 'val' && r.kind !== 'final') return null;
    if (!r.datasetId || typeof r.datasetId !== 'string') return null;
    if (typeof r.codeHash !== 'string' || !r.codeHash) return null;
    if (!Array.isArray(r.split)) return null;
    if (r.split.length !== 3) return null;
    if (!r.split.every(function (n) { return typeof n === 'number' && n > 0; })) return null;
    var valM = normMetrics(r.valMetrics);
    var testM = normMetrics(r.testMetrics);
    if (r.kind === 'val' && !valM) return null;
    if (r.kind === 'final' && !testM) return null;   // final 只强制 test；val 对比列由展示层按代码哈希回查
    return {
      schema: 1,
      id: typeof r.id === 'string' && r.id ? r.id : 'exp-' + (r.at || 0),
      at: isFiniteNumber(r.at) ? r.at : 0,
      kind: r.kind,
      datasetId: r.datasetId,
      season: isFiniteNumber(r.season) ? r.season : 1,
      split: r.split.slice(),
      codeHash: r.codeHash,
      code: typeof r.code === 'string' ? r.code.slice(0, 20 * 1024) : '',
      valMetrics: valM || {},
      testMetrics: testM || {},
      baselinesVal: normBaselines(r.baselinesVal),
      baselinesTest: normBaselines(r.baselinesTest),
      testRuns: typeof r.testRuns === 'number' && r.testRuns > 0 ? Math.min(99, Math.floor(r.testRuns)) : 1
    };
  }

  function list() {
    var raw = core.readJSON(KEY, [], function (v) { return Array.isArray(v); });
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var rec = normalizeRecord(raw[i]);
      if (rec) out.push(rec);
    }
    out.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
    return out;
  }

  function save(record) {
    var rec = normalizeRecord(record);
    if (!rec) return { ok: false, error: '记录不合法，未保存' };
    var arr = list();
    arr.unshift(rec);
    while (arr.length > MAX) arr.pop();
    core.writeJSON(KEY, arr);
    return { ok: true, count: arr.length };
  }

  /** 同一代码哈希的最终评测次数（诚实性提示用）。 */
  function testRunCount(codeHash, datasetId) {
    var n = 0;
    var arr = list();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].kind === 'final' && arr[i].codeHash === codeHash && arr[i].datasetId === datasetId) n++;
    }
    return n;
  }

  function clear() { core.writeJSON(KEY, []); }

  function exportJSON(record) {
    var rec = normalizeRecord(record);
    if (!rec) return null;
    return JSON.stringify({ app: 'tsoj-studio', schema: 1, exportedAt: Date.now(), record: rec }, null, 2);
  }

  function importJSON(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { return { ok: false, error: '不是合法 JSON' }; }
    if (!data || data.app !== 'tsoj-studio') return { ok: false, error: '不是 TSOJ 模型工坊实验文件' };
    if (data.schema !== 1) return { ok: false, error: 'schema 不支持：' + data.schema };
    var rec = normalizeRecord(data.record);
    if (!rec) return { ok: false, error: '记录字段不完整' };
    var res = save(rec);
    if (!res.ok) return { ok: false, error: res.error };
    return { ok: true, record: rec, count: res.count };
  }

  TSJ.appStudioStorage = {
    MAX: MAX,
    list: list,
    save: save,
    clear: clear,
    testRunCount: testRunCount,
    exportJSON: exportJSON,
    importJSON: importJSON,
    normalizeRecord: normalizeRecord
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/studio-report.js —— 模型工坊实验报告绘制（v3.6）
 * 加载顺序：… app/studio-storage → app/studio-report → app/studio.js
 * 挂载点：window.TSJ.appStudioReport
 *
 * 纯绘制层：指标对比表（val 列自动回查同代码哈希的验证记录）+ 预测对比图
 * （复用 v3 图表内核 forecast 渲染器，train/val/test 分界线由 splits 标出）。
 * 图表实例通过 opts.setChart 交还调用方管理（路由销毁 / 换图 destroy）。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var esc = core.esc;

  function fmt(v) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2) : '—'; }

  function bestOf(baselines) {
    var best = null;
    var keys = Object.keys(baselines || {});
    for (var i = 0; i < keys.length; i++) {
      var v = baselines[keys[i]] && baselines[keys[i]].mse;
      if (typeof v === 'number' && isFinite(v) && (best === null || v < best)) best = v;
    }
    return best;
  }

  /**
   * 绘制实验报告。
   * @param {Object} view { rec, actual, pred, baseline, sp, historyLen, d }
   * @param {Object} opts { scope, setChart(chart) }
   */
  function paint(view, opts) {
    var report = global.document.getElementById('studioReport');
    if (!report) return;
    var rec = view.rec;
    var d = view.d;
    var isFinal = rec.kind === 'final';

    // 最终评测的 val 对比列：回查同一份代码的最近验证记录（没有就显示 —）
    var valRec = null;
    if (isFinal) {
      var all = TSJ.appStudioStorage.list();
      for (var k = 0; k < all.length; k++) {
        if (all[k].kind === 'val' && all[k].codeHash === rec.codeHash) { valRec = all[k]; break; }
      }
    }
    var mVal = isFinal ? (valRec ? valRec.valMetrics.mse : null) : rec.valMetrics.mse;
    var baseVal = isFinal ? (valRec ? bestOf(valRec.baselinesVal) : null) : bestOf(rec.baselinesVal);
    var mTest = isFinal ? rec.testMetrics.mse : null;
    var baseTest = isFinal ? bestOf(rec.baselinesTest) : null;

    var rows = '<tr><td>MSE</td>' +
      '<td class="num">' + fmt(mVal) + '</td><td class="num">' + fmt(baseVal) + '</td>' +
      (isFinal ? '<td class="num">' + fmt(mTest) + '</td><td class="num">' + fmt(baseTest) + '</td>' : '') + '</tr>';

    report.innerHTML = [
      '<div class="studio-report-head"><span class="ds-badge ' + (isFinal ? 'ds-badge-ok' : '') + '">' +
      (isFinal ? '🏁 最终评测 · train+val 拟合 → test 打分' : '🔁 验证集评估 · train 拟合 → val 打分') + '</span>' +
      '<span class="ds-badge">' + esc(d.name) + '</span>' +
      '<span class="ds-badge">代码 ' + esc(rec.codeHash) + '</span></div>',
      '<div class="ds-table-wrap"><table class="ds-table ds-table-hover"><thead><tr><th>MSE</th>' +
      '<th class="num">你的（val）</th><th class="num">最优基线（val）</th>' +
      (isFinal ? '<th class="num">你的（test）</th><th class="num">最优基线（test）</th>' : '') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>',
      isFinal && rec.testRuns > 1
        ? '<p class="md-note"><span>⚠</span><span>这份代码已对 test 评测 ' + rec.testRuns + ' 次——继续按 test 调参会让它变成另一个验证集。</span></p>'
        : '<p class="ds-card-sub">比值 = 你的 MSE ÷ 最优基线 MSE，&lt;1 表示跑赢了基线；模型选择只允许看 val。</p>',
      '<div class="chart-v2"><div class="chart-v2-head"><h3>预测对比</h3>' +
      '<div class="chart-v2-legend"><span><i style="border-color:var(--v3-chart-history)"></i>历史</span>' +
      '<span><i style="border-color:var(--v3-chart-actual)"></i>' + (isFinal ? 'test 真值' : 'val 真值') + '</span>' +
      '<span><i style="border-color:var(--v3-chart-pred);border-top-style:dashed"></i>你的模型</span>' +
      '<span><i style="border-color:var(--v3-chart-baseline);border-top-style:dotted"></i>移动平均</span></div></div>',
      '<div class="chart-v2-canvas-wrap"><canvas id="studioCanvas"></canvas></div>',
      '<p class="chart-v2-summary" id="studioChartSummary"></p></div>'
    ].join('\n');

    var values = d.values;
    var start = view.historyLen;
    var n = values.length;
    function pad(arr) {
      var out = new Array(n).fill(null);
      for (var i = 0; i < arr.length && start + i < n; i++) out[start + i] = arr[i];
      return out;
    }
    var model = {
      n: n,
      history: values.slice(),
      actual: pad(view.actual),
      prediction: pad(view.pred),
      baseline: pad(view.baseline),
      splits: isFinal
        ? [{ index: rec.split[0], role: 'val', label: '验证起点' }, { index: rec.split[0] + rec.split[1], role: 'test', label: '测试起点' }]
        : [{ index: rec.split[0], role: 'test', label: '验证起点' }],
      maxPoints: 1200
    };
    var chart = TSJ.charts.create(global.document.getElementById('studioCanvas'), {
      kind: 'forecast', scope: opts.scope, height: 280, unit: d.unit,
      ariaLabel: '模型工坊预测对比图', onInspect: function () {}
    });
    chart.update(model);
    var sm = global.document.getElementById('studioChartSummary');
    if (sm) sm.textContent = chart.summary() || '';
    if (typeof opts.setChart === 'function') opts.setChart(chart);
  }

  /**
   * 生成自包含分享卡 HTML（图表 canvas 转内嵌 PNG，打开即看、无任何外链）。
   * @param {Object} view 与 paint 同构的 view 对象
   * @returns {string} 完整 HTML 文档文本（调用方负责触发下载）
   */
  function buildShareCard(view) {
    var rec = view.rec;
    var d = view.d;
    var isFinal = rec.kind === 'final';
    var canvas = global.document.getElementById('studioCanvas');
    var imgData = '';
    try { imgData = canvas ? canvas.toDataURL('image/png') : ''; } catch (e) { imgData = ''; }
    var fmtCard = function (v) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2) : '—'; };
    var mVal = isFinal ? fmtCard(rec.testMetrics.mse) : fmtCard(rec.valMetrics.mse);
    var rows = [
      ['数据集', esc(d.name)],
      ['阶段', isFinal ? '🏁 最终评测（test）' : '🔁 验证集评估（val）'],
      ['拆分', 'train ' + rec.split[0] + ' / val ' + rec.split[1] + ' / test ' + rec.split[2]],
      ['MSE', mVal],
      ['代码指纹', esc(rec.codeHash)],
      ['test 评测次数', isFinal ? String(rec.testRuns) : '—']
    ].map(function (r) {
      return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>';
    }).join('');
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>TSOJ 模型工坊实验卡 ' + esc(rec.codeHash) + '</title><style>' +
      'body{font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;' +
      'background:#0d1117;color:#e6edf3;margin:0;padding:28px;display:flex;justify-content:center}' +
      '.tsc-card{max-width:680px;width:100%;background:#131a22;border:1px solid #1f2833;border-radius:14px;padding:26px}' +
      'h1{font-size:18px;margin:0 0 4px}.tsc-sub{color:#8b98a9;font-size:12.5px;margin:0 0 18px}' +
      'img{width:100%;border:1px solid #1f2833;border-radius:10px;background:#0d1117}' +
      'table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}' +
      'th{color:#8b98a9;text-align:left;padding:7px 10px;border-bottom:1px solid #1f2833;white-space:nowrap}' +
      'td{padding:7px 10px;border-bottom:1px solid #1f2833;font-family:ui-monospace,Consolas,monospace}' +
      '.tsc-foot{color:#5c6874;font-size:11.5px;margin-top:16px;text-align:center}' +
      '</style></head><body><div class="tsc-card">' +
      '<h1>时序竞技场 TSOJ · 模型工坊实验卡</h1>' +
      '<p class="tsc-sub">纯前端沙箱内完成 · 数据与代码只存在本地浏览器</p>' +
      (imgData ? '<img src="' + imgData + '" alt="预测对比图">' : '') +
      '<table>' + rows + '</table>' +
      '<div class="tsc-foot">由 时序竞技场 TSOJ 生成 · ' + new Date(rec.at).toISOString().slice(0, 10) + '</div>' +
      '</div></body></html>';
  }

  TSJ.appStudioReport = { paint: paint, buildShareCard: buildShareCard };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/studio-csv.js —— 模型工坊：上传自己的 CSV 数据（v3.7）
 * 加载顺序：… app/studio-report → app/studio-csv → app/studio.js　挂载点：window.TSJ.appStudioCsv
 *
 * 支持形态（自动嗅探，全部只读本地文件，FileReader，零依赖）：
 *   - 单列数值：每行一个数（可带表头，自动跳过非数值行）
 *   - 两列「时间,数值」或「数值,时间」：时间列被忽略，取数值列
 *   - 逗号/分号/制表符分隔；分号或制表符分隔时支持逗号小数（1,5 → 1.5）
 *     —— 纯逗号分隔的文件里逗号一律当分隔符，避免「1,5」被误读成两列
 * 校验：至少 72 个有效数值点（否则 train 装不下）；季节周期自动估（自相关最高滞后的约数），
 *       也允许用户在工坊里手动改（返回值里的 season 只是初始建议）。
 * 持久化：tsoj:studioCsv:v1 存最近一份（原始数值 + 名称），刷新不丢；导出/分享不含他人数据。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var KEY = core.STORE.studioCsv;
  var MIN_POINTS = 72;
  var MAX_POINTS = 5000;

  function isFiniteNumber(v) { return typeof v === 'number' && isFinite(v); }

  /** 把一个单元格文本解析成数值；解析不了返回 null。 */
  function parseCell(tok) {
    var s = String(tok == null ? '' : tok).trim().replace(/^"|"$/g, '');
    if (!s) return null;
    // 逗号小数：仅当整体形如 123,45 且不含分隔歧义时尝试
    if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
    var n = Number(s);
    return /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s) && isFinite(n) ? n : null;
  }

  /** 嗅探分隔符：分号 / 制表符优先（它们不可能是小数分隔符），都没有才用逗号。 */
  function sniffSep(line) {
    if (line.indexOf(';') >= 0) return ';';
    if (line.indexOf('\t') >= 0) return '\t';
    return ',';
  }

  /**
   * 解析 CSV 文本 → { ok, values, name?, warnings[] }。
   * @param {string} text 原始文本
   * @param {string} [fileName] 文件名（用作数据集名）
   */
  function parse(text, fileName) {
    var warnings = [];
    var lines = String(text || '').split(/\r\n|\r|\n/);
    // 去掉首尾空行
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return { ok: false, error: '文件是空的。', warnings: warnings };

    var sep = sniffSep(lines[0]);
    var headerSkipped = false;
    var colIndex = -1;      // -1 = 未定（单列或首行嗅探）
    var values = [];
    var skipped = 0;

    for (var i = 0; i < lines.length; i++) {
      var toks = lines[i].split(sep);
      // 首个非空行若是纯表头（无任何可解析数值），跳过并尝试定位数值列
      if (colIndex < 0) {
        var numericAt = [];
        for (var c = 0; c < toks.length; c++) {
          if (parseCell(toks[c]) !== null) numericAt.push(c);
        }
        if (numericAt.length === 0) {
          if (!headerSkipped) { headerSkipped = true; continue; }   // 表头行
          continue;                                                // 空行/杂行
        }
        // 数值列选择：两列时把「单调递增」的那列当时间索引丢掉；都不单调则约定时间在前、取最后一列
        if (numericAt.length >= 2) {
          var first = numericAt[0], last = numericAt[numericAt.length - 1];
          if (numericAt.length === 2) {
            var monoFirst = isMonotonicColumn(lines, i, sep, first);
            var monoLast = isMonotonicColumn(lines, i, sep, last);
            if (monoFirst && !monoLast) colIndex = last;
            else if (monoLast && !monoFirst) colIndex = first;
            else colIndex = last;
          } else {
            colIndex = last;
            warnings.push('检测到 ' + numericAt.length + ' 个数值列，已取最后一列（其余列被忽略）。');
          }
        } else {
          colIndex = numericAt[0];
        }
      }
      var v = parseCell(toks[colIndex]);
      if (v === null) { skipped++; continue; }
      values.push(v);
      if (values.length >= MAX_POINTS) { warnings.push('已截取前 ' + MAX_POINTS + ' 个点（文件更长）。'); break; }
    }

    if (values.length < MIN_POINTS) {
      return {
        ok: false,
        error: '有效数值只有 ' + values.length + ' 个（需要至少 ' + MIN_POINTS +
          ' 点才能装下 train/val/test 三段）。',
        warnings: warnings
      };
    }
    if (skipped > 0) warnings.push('跳过了 ' + skipped + ' 行无法解析的内容。');
    return {
      ok: true,
      values: values,
      name: String(fileName || '我的数据').replace(/\.[^.]+$/, '').slice(0, 24) || '我的数据',
      warnings: warnings,
      season: guessSeason(values)
    };
  }

  /**
   * 某列是否「像时间索引」：从 start 行起采样最多 50 个有效数值，
   * 要求非递减且至少 3 个点（避免把两行数据误判成时间列）。
   */
  function isMonotonicColumn(lines, start, sep, col) {
    var prev = null, seen = 0;
    for (var k = start; k < lines.length && seen < 50; k++) {
      var v = parseCell(lines[k].split(sep)[col]);
      if (v === null) continue;
      if (prev !== null && v < prev) return false;
      prev = v;
      seen++;
    }
    return seen >= 3;
  }

  /**
   * 粗估季节周期：一阶差分去掉趋势后，在 7/12/24/52/365 这些常见周期里
   * 取正自相关最高者；最高相关 < 0.25 时返回 1（不假设季节）。
   * 不用「全滞后绝对值最大」——半周期（如 24 的 12）反相相关也是 1，
   * 会让 24 小时数据被误判成 12。
   */
  function guessSeason(values) {
    var n = Math.min(values.length, 1500);
    var d = [];
    for (var i = 1; i < n; i++) d.push(values[i] - values[i - 1]);
    n = d.length;
    if (n < 30) return 1;
    var mu = 0;
    for (i = 0; i < n; i++) mu += d[i];
    mu /= n;
    var g0 = 0;
    for (i = 0; i < n; i++) g0 += Math.pow(d[i] - mu, 2);
    if (!(g0 > 1e-12)) return 1;   // 差分近常数 → 纯趋势，没有可识别周期
    var common = [7, 12, 24, 52, 365];
    var best = 1, bestR = 0;
    for (var c = 0; c < common.length; c++) {
      var lag = common[c];
      if (lag > Math.floor(n / 2)) continue;   // 至少两个完整周期才可信
      var acc = 0, cnt = 0;
      for (i = 0; i + lag < n; i++) { acc += (d[i] - mu) * (d[i + lag] - mu); cnt++; }
      var r = (acc / cnt) / (g0 / n);   // 按对数归一，跨 lag 可比
      if (r > bestR) { bestR = r; best = common[c]; }
    }
    return bestR >= 0.25 ? best : 1;
  }

  /** 注册为 TSJ.datasets 里的临时数据集（id 固定 'my-csv'，重复上传覆盖）。 */
  function register(parsed, seasonOverride) {
    if (!parsed || !parsed.ok) return null;
    var season = isFiniteNumber(seasonOverride) && seasonOverride > 1 ? Math.round(seasonOverride) : (parsed.season || 1);
    var freq = season === 365 ? 'D' : season === 52 ? 'W' : season === 12 ? 'M' : season === 24 ? 'H' : season === 7 ? 'D' : 'D';
    var ds = {
      id: 'my-csv',
      name: parsed.name + '（上传）',
      unit: '',
      freq: freq,
      season: season,
      desc: '用户上传的 CSV 数据（本地保存，仅当前浏览器可见）',
      values: parsed.values
    };
    var list = TSJ.datasets || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === 'my-csv') { list[i] = ds; persist(); return ds; }
    }
    list.push(ds);
    TSJ.datasets = list;
    persist();
    return ds;
  }

  /** 读文件并解析+注册。done({ok, ds?, error?, warnings})。 */
  function upload(file, seasonOverride, done) {
    var cb = typeof done === 'function' ? done : function () {};
    if (!file) { cb({ ok: false, error: '没有选择文件。' }); return; }
    if (file.size > 2 * 1024 * 1024) { cb({ ok: false, error: '文件超过 2MB（限 5000 点以内）。' }); return; }
    var reader = new global.FileReader();
    reader.onerror = function () { cb({ ok: false, error: '读取文件失败。' }); };
    reader.onload = function () {
      var parsed = parse(String(reader.result || ''), file.name);
      if (!parsed.ok) { cb({ ok: false, error: parsed.error, warnings: parsed.warnings }); return; }
      var ds = register(parsed, seasonOverride);
      cb({ ok: true, ds: ds, warnings: parsed.warnings });
    };
    reader.readAsText(file, 'utf-8');
  }

  /** 启动时恢复最近上传（存在则注册回 TSJ.datasets）。 */
  function restore() {
    var saved = core.readJSON(KEY, null, function (v) {
      return v && typeof v === 'object' && Array.isArray(v.values);
    });
    if (!saved || !saved.values || saved.values.length < MIN_POINTS) return null;
    return register({ ok: true, values: saved.values, name: saved.name || '我的数据', season: saved.season || 1 }, saved.season);
  }

  function persist() {
    var ds = null;
    for (var i = 0; i < (TSJ.datasets || []).length; i++) {
      if (TSJ.datasets[i].id === 'my-csv') ds = TSJ.datasets[i];
    }
    if (!ds) return;
    core.writeJSON(KEY, { values: ds.values, name: ds.name, season: ds.season });
  }

  function remove() {
    TSJ.datasets = (TSJ.datasets || []).filter(function (d) { return d.id !== 'my-csv'; });
    try { global.localStorage.removeItem(KEY); } catch (e) { /* 忽略 */ }
  }

  /**
   * 工坊页装配：启动恢复上次 CSV + 重建数据集下拉 + 绑定上传按钮。
   * 由 app/studio.js 的 render 调用一次（DOM 就绪后）。
   * @param {Object} hooks { onDatasetChanged: Function } 上传成功后回调（重画拆分等）
   */
  function setupPanel(hooks) {
    var doc = global.document;
    function rebuildOptions(selectId) {
      var sel = doc.getElementById('studioDataset');
      if (!sel) return;
      var keep = selectId || sel.value;
      sel.innerHTML = (TSJ.datasets || []).map(function (d) {
        return '<option value="' + d.id + '">' + core.esc(d.name) + '（' + d.values.length + ' 点 · ' + d.freq + '）</option>';
      }).join('');
      sel.value = keep;
    }
    // 恢复上次上传
    var ds = restore();
    if (ds) {
      rebuildOptions(ds.id);
      var hint = doc.getElementById('studioCsvHint');
      if (hint) hint.textContent = '已恢复上次上传：' + ds.name + '（' + ds.values.length + ' 点）';
    }
    // 绑定上传
    var input = doc.getElementById('studioCsvFile');
    if (input) {
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        input.value = '';   // 允许重复选同一文件
        if (!f) return;
        upload(f, null, function (r) {
          var toast = TSJ.appA11y ? TSJ.appA11y.toast : function () {};
          if (!r.ok) { toast('CSV 导入失败：' + r.error, 'err'); return; }
          rebuildOptions('my-csv');
          var h = doc.getElementById('studioCsvHint');
          if (h) h.textContent = r.ds.name + '（' + r.ds.values.length + ' 点 · 季节 ' + r.ds.season + '）';
          (r.warnings || []).forEach(function (w) { toast(w, 'warn'); });
          toast('已导入 ' + r.ds.values.length + ' 个点，季节周期估为 ' + r.ds.season, 'ok');
          if (hooks && typeof hooks.onDatasetChanged === 'function') hooks.onDatasetChanged();
        });
      });
    }
    return { rebuildOptions: rebuildOptions };
  }

  TSJ.appStudioCsv = {
    setupPanel: setupPanel,
    MIN_POINTS: MIN_POINTS,
    parse: parse,
    guessSeason: guessSeason,
    register: register,
    upload: upload,
    restore: restore,
    remove: remove
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/studio.js —— 模型工坊 #/studio（v3.6）
 * 加载顺序：… app/studio-storage → app/studio.js → app/cmdk → app.js　挂载点：window.TSJ.appStudio
 *
 * 完整实验流程：自己写 predict（训练逻辑写在函数内，只允许用 history）
 *   ① 验证集评估：fit 在 train、打分在 val，可反复迭代；
 *   ② 最终评测：train+val 重新拟合、在 test 上打分——每代代码只评一次，次数如实记录。
 * 沙箱与判题完全同源（judge.evaluate + Worker 超时 + 防泄漏拆分），零额外依赖。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var esc = core.esc;
  var doc = global.document;
  var a11y = TSJ.appA11y;
  var storage = TSJ.appStudioStorage;

  function $(id) { return doc.getElementById(id); }

  var BASELINES = ['naive', 'seasonal_naive', 'mean', 'moving_average', 'linear_trend'];
  var METRIC = 'mse';

  var STARTER = [
    'function predict(history, horizon, ctx) {',
    '  // 你的模型：在 history 上「训练」，再预测 horizon 步。',
    '  // 示例：SES + 网格搜索 α（只用 history 内部做一步回测选参，绝不碰 val/test）',
    '  var best = { a: 0.3, err: Infinity };',
    '  for (var a = 0.05; a <= 0.95; a += 0.05) {',
    '    var err = 0, level = history[0];',
    '    for (var i = 1; i < history.length - 1; i++) {',
    '      var oneStep = level;                    // 用 i 之前的状态预测 i',
    '      level = a * history[i] + (1 - a) * level;',
    '      err += Math.pow(history[i + 1] - oneStep, 2);',
    '    }',
    '    if (err < best.err) best = { a: a, err: err };',
    '  }',
    '  var level = history[0];                     // 用选好的 α 在全部 history 上重新平滑',
    '  for (var j = 1; j < history.length; j++) level = best.a * history[j] + (1 - best.a) * level;',
    '  var out = [];',
    '  for (var h = 0; h < horizon; h++) out.push(level);',
    '  return out;',
    '}'
  ].join('\n');

  /** 拆分协议：test = val = clamp(15%, 12, 48)，train 为剩余；train 不足 24 点时报错。 */
  function splitOf(n) {
    var testLen = Math.max(12, Math.min(48, Math.round(n * 0.15)));
    var trainLen = n - testLen * 2;
    if (trainLen < 24) return null;
    return { trainLen: trainLen, valLen: testLen, testLen: testLen };
  }

  function hashOf(code) { return core.fnv1a(code).slice(0, 8); }

  /** 用合成 problem/dataset 走 judge.evaluate：沙箱、超时、基线全家桶免费获得。 */
  function synthAndRun(values, horizon, code, session) {
    var ds = {
      id: 'studio', name: '模型工坊', unit: '', freq: ctx0().freq, season: ctx0().season, desc: '', values: values
    };
    var problem = {
      id: 'studio', index: 0, title: '模型工坊', difficulty: '入门', tags: [],
      points: 100, passScore: 60, dataset: 'studio', mode: 'holdout',
      horizon: horizon, metric: METRIC, baselines: BASELINES, threshold: 0.95
    };
    return TSJ.judge.evaluate({ problem: problem, dataset: ds, code: code, session: session });
    /** 数据集元信息（频率/季节来自所选数据集）。 */
    function ctx0() {
      var d = TSJ.findDataset(stateDsId());
      return { freq: d ? d.freq : 'M', season: d ? d.season : 12 };
    }
  }

  function stateDsId() { return doc.getElementById('studioDataset') ? doc.getElementById('studioDataset').value : 'airline'; }

  function findDataset(id) {
    var list = TSJ.datasets || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /* ---------- 渲染 ---------- */
  function render(scope) {
    var ctx = { code: loadDraft(), result: null, phase: null, busy: false, chart: null };
    var ds = findDataset('airline');

    function cleanup() {
      ctx.busy = false;
      if (ctx.chart && ctx.chart.destroy) ctx.chart.destroy();
      ctx.chart = null;
    }
    if (scope && scope.own) scope.own({ destroy: cleanup });

    var host = doc.getElementById('view');
    host.innerHTML = [
      '<div class="wk-hero wk-hero-slim"><div class="wk-hero-main">',
      '  <div class="wk-kicker">模型工坊</div>',
      '  <h1>自己搓一个模型，跑完完整实验流程</h1>',
      '  <p>训练逻辑写在 predict 里（只能用 history）——验证集上随便迭代，最终评测一次定论。沙箱、超时、防泄漏与判题完全同源。</p>',
      '</div></div>',
      '<div class="problem-layout" id="studioLayout">',
      '<section class="pane pane-left">',
      '  <div class="ds-card"><h2 class="ds-card-title">实验配置</h2>',
      '    <label class="ds-field"><span>数据集</span><select id="studioDataset">' +
      (TSJ.datasets || []).map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (d.id === 'airline' ? ' selected' : '') + '>' +
          esc(d.name) + '（' + d.values.length + ' 点 · ' + esc(d.freq) + '）</option>';
      }).join('') + '</select></label>',
      '    <div class="studio-csv-row">',
      '      <label class="ds-btn ds-btn-sm studio-csv-btn"><input type="file" id="studioCsvFile" accept=".csv,.txt,.tsv" style="display:none">📂 上传自己的 CSV</label>',
      '      <span class="ds-card-sub" id="studioCsvHint">单列数值或「时间,数值」两列；≥72 点</span>',
      '    </div>',
      '    <div class="studio-splits" id="studioSplits"></div>',
      '  </div>',
      '  <div class="editor-toolbar"><div class="tb-left"><span class="file-chip">my-model.js</span>' +
      '    <span class="tb-hint">Ctrl/⌘+Enter 运行</span></div>',
      '    <div class="tb-right"><button type="button" class="btn btn-ghost" id="studioTemplate">载入示例模型</button>' +
      '    <button type="button" class="btn" id="studioRunVal">① 验证集评估</button>' +
      '    <button type="button" class="btn btn-primary" id="studioRunFinal">② 最终评测</button></div></div>',
      '  <div class="editor-host" id="studioEditorHost"></div>',
      '  <p class="ed-help" id="studioEdHelp">代码出错时会在这里说明行号与原因。</p>',
      '</section>',
      '<section class="pane pane-right">',
      '  <div class="ds-card"><h2 class="ds-card-title">实验报告</h2><div id="studioReport">' +
      '    <div class="ds-empty"><strong>还没有运行</strong><span>先「① 验证集评估」迭代模型，满意后「② 最终评测」。</span></div></div></div>',
      '  <div class="ds-card"><h2 class="ds-card-title">实验记录</h2>' +
      '    <div class="lab-status"><span id="studioExpCount"></span>' +
      '    <button class="ds-btn ds-btn-sm" id="studioShare">分享卡</button>' +
    '    <button class="ds-btn ds-btn-sm" id="studioExport">导出记录</button>' +
      '    <button class="ds-btn ds-btn-sm btn-danger" id="studioClear">清空记录</button></div>',
      '    <div id="studioRecords"></div></div>',
      '</section>',
      '</div>'
    ].join('\n');

    store.state.editor = TSJ.createEditor($('studioEditorHost'), {
      value: ctx.code,
      fontSize: store.state.edFont,
      errorHelpId: 'studioEdHelp',
      onChange: function (val) { ctx.code = val; core.writeJSON(core.STORE.studioDraft, val); },
      onRun: function () { runPhase('val'); },
      onSave: function () { core.writeJSON(core.STORE.studioDraft, ctx.code); a11y.toast('草稿已保存', 'ok'); }
    });

    TSJ.appStudioCsv.setupPanel({ onDatasetChanged: paintSplits });
    paintSplits();
    paintRecords();

    $('studioDataset').addEventListener('change', paintSplits);
    $('studioTemplate').addEventListener('click', function () {
      store.state.editor.setValue(STARTER);
      ctx.code = STARTER;
      core.writeJSON(core.STORE.studioDraft, STARTER);
      a11y.toast('已载入示例模型（SES + 网格搜索 α）', 'ok');
    });
    $('studioRunVal').addEventListener('click', function () { runPhase('val'); });
    $('studioRunFinal').addEventListener('click', function () { runPhase('final'); });
    $('studioShare').addEventListener('click', function () {
      if (!ctx.result) { TSJ.appA11y.toast('还没有可分享的实验', 'err'); return; }
      var html = TSJ.appStudioReport.buildShareCard(ctx.lastView || { rec: ctx.result, d: findDataset(ctx.result.datasetId) });
      var blob = new global.Blob([html], { type: 'text/html' });
      var a2 = doc.createElement('a');
      a2.href = global.URL.createObjectURL(blob);
      a2.download = 'tsoj-studio-card-' + ctx.result.codeHash + '-' + ctx.result.kind + '.html';
      a2.click();
      global.URL.revokeObjectURL(a2.href);
    });
    $('studioExport').addEventListener('click', function () {
      if (!ctx.result) { a11y.toast('还没有可导出的实验', 'err'); return; }
      var text = storage.exportJSON(ctx.result);
      var blob = new global.Blob([text], { type: 'application/json' });
      var a = doc.createElement('a');
      a.href = global.URL.createObjectURL(blob);
      a.download = 'tsoj-studio-' + ctx.result.codeHash + '-' + ctx.result.kind + '.json';
      a.click();
      global.URL.revokeObjectURL(a.href);
    });
    $('studioClear').addEventListener('click', function () { storage.clear(); paintRecords(); a11y.toast('已清空实验记录', 'ok'); });

    function paintSplits() {
      var d = findDataset($('studioDataset').value);
      var box = $('studioSplits');
      var sp = d ? splitOf(d.values.length) : null;
      if (!box) return;
      if (!d || !sp) { box.innerHTML = '<p class="md-note"><span>⚠</span><span>该数据集太短，装不下 train/val/test 三段。</span></p>'; return; }
      box.innerHTML = '<div class="studio-split-row"><span>train ' + sp.trainLen + '</span>' +
        '<span class="studio-split-val">val ' + sp.valLen + '</span>' +
        '<span class="studio-split-test">test ' + sp.testLen + '</span></div>' +
        '<p class="ds-card-sub">训练只看 train；验证集用于迭代；test 只在最终评测时解密。</p>';
    }

    function paintRecords() {
      var list = storage.list();
      var el = $('studioExpCount');
      if (el) el.textContent = '本地 ' + list.length + ' 条（上限 ' + storage.MAX + '）';
      var box = $('studioRecords');
      if (!box) return;
      box.innerHTML = list.length ? '<div class="lab-history">' + list.map(function (r) {
        return '<div class="lab-history-item"><span>' + (r.kind === 'final' ? '🏁' : '🔁') + ' ' +
          esc(r.datasetId) + ' · ' + esc(r.kind === 'final' ? '最终' : '验证') + ' · MSE ' +
          (r.kind === 'final' ? fmt(r.testMetrics.mse) : fmt(r.valMetrics.mse)) + ' · ' + esc(r.codeHash) + '</span>' +
          '<span><button data-code="' + esc(r.codeHash) + '">载入代码</button></span></div>';
      }).join('') + '</div>' : '<div class="ds-empty"><strong>还没有实验记录</strong><span>每代代码的 val/test 成绩都会留档。</span></div>';
      var btns = core.$$('[data-code]', box);
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          var h = this.getAttribute('data-code');
          for (var j = 0; j < list.length; j++) {
            if (list[j].codeHash === h && list[j].code) {
              store.state.editor.setValue(list[j].code);
              ctx.code = list[j].code;
              core.writeJSON(core.STORE.studioDraft, ctx.code);
              a11y.toast('已载入代码快照 ' + h, 'ok');
              return;
            }
          }
        });
      }
    }

    function fmt(v) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(2) : '—'; }

    /** 两阶段评测：val 在 train 上拟合、val 上打分；final 在 train+val 上拟合、test 上打分。 */
    function runPhase(kind) {
      if (ctx.busy) return;
      var d = findDataset($('studioDataset').value);
      var sp = d ? splitOf(d.values.length) : null;
      if (!sp) { a11y.toast('数据集太短，装不下三段拆分', 'err'); return; }
      var code = store.state.editor.getValue();
      ctx.code = code;
      core.writeJSON(core.STORE.studioDraft, code);

      var values, horizon;
      if (kind === 'val') {
        values = d.values.slice(0, sp.trainLen + sp.valLen);
        horizon = sp.valLen;
      } else {
        values = d.values.slice();
        horizon = sp.testLen;
      }
      var historyLen = values.length - horizon;
      var history = values.slice(0, historyLen);
      var actual = values.slice(historyLen);

      var token = ++store.state.judgeToken;
      var session = {};
      store.state.session = session;
      ctx.busy = true;
      setButtons(true);
      var report = $('studioReport');
      if (report) report.innerHTML = '<div class="notice">正在运行（' + (kind === 'val' ? '验证集' : '最终评测') + '）…</div>';

      synthAndRun(values, horizon, code, session).then(function (res) {
        if (token !== store.state.judgeToken) return;   // 路由切换 / 新一轮：整段丢弃
        ctx.busy = false;
        setButtons(false);
        if (res.refused || res.dataError || res.aborted) {
          if (report) report.innerHTML = '<div class="notice">' + esc((res && res.reason) || (res && res.message) || '无法运行。') + '</div>';
          return;
        }
        if (res.verdict === 'RE' || res.verdict === 'TLE') {
          var errCase = (res.cases && res.cases[0]) || {};
          if (report) report.innerHTML = '<div class="err-box">' + esc(errCase.error || res.message || '运行失败') +
            '<div class="err-meta">位置：' + (errCase.line ? '第 ' + errCase.line + ' 行' : '行号未知') + '</div></div>';
          if (errCase.line && store.state.editor) store.state.editor.markError(errCase.line);
          return;
        }
        var pred = (res.cases[0] && res.cases[0].predictions) || [];
        var baseline = TSJ.judge.baselines.moving_average(history.slice(), horizon, { season: d.season, freq: d.freq, datasetId: d.id, index: 0 });
        var rec = {
          schema: 1, id: String(Date.now()), at: Date.now(), kind: kind,
          datasetId: d.id, season: d.season, split: [sp.trainLen, sp.valLen, sp.testLen],
          codeHash: hashOf(code), code: code,
          valMetrics: kind === 'val' ? { mse: TSJ.judge.metrics.mse(actual, pred) } : {},
          testMetrics: kind === 'final' ? { mse: TSJ.judge.metrics.mse(actual, pred) } : {},
          baselinesVal: kind === 'val' ? (res.cases[0] && res.cases[0].allBaselines) || {} : {},
          baselinesTest: kind === 'final' ? (res.cases[0] && res.cases[0].allBaselines) || {} : {}
        };
        if (kind === 'final') rec.testRuns = storage.testRunCount(rec.codeHash, d.id) + 1;
        storage.save(rec);
        if (TSJ.appAchievements) TSJ.appAchievements.onStudioRun(rec);
        ctx.result = rec;
        ctx.lastView = { rec: rec, actual: actual, pred: pred, baseline: baseline, res: res, sp: sp, historyLen: historyLen, d: d };
        paintReport(ctx.lastView);
        paintRecords();
        if (kind === 'final') {
          a11y.toast('最终评测完成 · 该代码 testRuns=' + rec.testRuns, rec.testRuns > 1 ? 'warn' : 'ok');
        } else {
          a11y.toast('验证集评估完成，可继续迭代', 'ok');
        }
      }).catch(function (err) {
        ctx.busy = false;
        setButtons(false);
        if (report) report.innerHTML = '<div class="notice">运行异常：' + esc((err && err.message) || String(err)) + '</div>';
      });
    }

    /** 报告绘制委托给 app/studio-report.js（表格 + 预测图 + val/test 分界线）。 */
    function paintReport(view) {
      TSJ.appStudioReport.paint(view, {
        scope: scope,
        setChart: function (c) { ctx.chart = c; }
      });
    }

    function setButtons(busy) {
      var a = $('studioRunVal');
      var b = $('studioRunFinal');
      if (a) a.disabled = !!busy;
      if (b) b.disabled = !!busy;
    }

    function loadDraft() {
      return core.readJSON(core.STORE.studioDraft, STARTER, function (v) { return typeof v === 'string' && v; });
    }

    a11y.setTitle('模型工坊 · TSOJ');
  }

  TSJ.appStudio = { render: render };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/achievements.js —— 成就徽章系统（v3.7）
 * 加载顺序：… app/studio.js → app/achievements → app/cmdk → app.js
 * 挂载点：window.TSJ.appAchievements
 *
 * 设计原则（轻量、诚实、零后端）：
 *   - 只从「已发生的事件」推导（判题落盘、工坊运行落档），不做任何轮询；
 *   - 解锁即 toast + 落盘（tsoj:achievements:v1），工作台与命令面板可见；
 *   - 成就定义与判定函数集中在此文件，新增成就只改一处。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var KEY = core.STORE.achievements;

  /* ---------- 成就注册表 ---------- */
  var DEFS = [
    { id: 'first-ac', icon: '🥇', name: '第一个 AC', desc: '通过任意一道题。每个预测旅程都从这里开始。' },
    { id: 'streak-3', icon: '🔥', name: '三连胜', desc: '按题号连续通过 3 道题。' },
    { id: 'all-easy', icon: '🌱', name: '入门毕业', desc: '通过全部「入门」难度的题。' },
    { id: 'studio-beats-base', icon: '🛠️', name: '工坊开张', desc: '在模型工坊里让你的模型在验证集上跑赢最优基线。' },
    { id: 'honest-researcher', icon: '🧭', name: '诚实研究者', desc: '工坊最终评测：同一份代码对 test 只评了一次就定稿。' },
    { id: 'glossary-reader', icon: '📖', name: '词典编纂者', desc: '在术语表里累计搜索/查阅 20 次。' },
    { id: 'method-explorer', icon: '🗺️', name: '方法旅行家', desc: '查看过 15 个不同的方法详情页。' },
    { id: 'half-score', icon: '💎', name: '半分神话', desc: '任意一题拿到误差比 ≤ 0.5 的满分。' }
  ];

  var unlocked = null;   // { [id]: at }
  var seenMethods = null; // 方法详情浏览记录
  var glossaryLooks = 0;

  /* ---------- 存储 ---------- */
  function load() {
    if (unlocked) return;
    unlocked = core.readJSON(KEY, {}, function (v) {
      return v && typeof v === 'object' && !Array.isArray(v);
    });
    var meta = core.readJSON(core.STORE.achMeta, { methods: [], looks: 0 }, function (v) {
      return v && typeof v === 'object' && !Array.isArray(v);
    });
    seenMethods = Array.isArray(meta.methods) ? meta.methods.slice(0, 60) : [];
    glossaryLooks = typeof meta.looks === 'number' && meta.looks > 0 ? Math.min(9999, Math.floor(meta.looks)) : 0;
  }

  function persistMeta() {
    core.writeJSON(core.STORE.achMeta, { methods: seenMethods, looks: glossaryLooks });
  }

  /* ---------- 解锁 ---------- */
  /** 解锁成就：toast + 落盘（重复解锁幂等）。 */
  function unlock(id) {
    load();
    if (unlocked[id]) return;
    var def = null;
    for (var i = 0; i < DEFS.length; i++) if (DEFS[i].id === id) def = DEFS[i];
    if (!def) return;
    unlocked[id] = Date.now();
    core.writeJSON(KEY, unlocked);
    if (TSJ.appA11y) TSJ.appA11y.toast('🏆 成就解锁：' + def.name + ' — ' + def.desc, 'ok');
  }

  /* ---------- 事件入口（由 app 层在恰当时机调用） ---------- */

  /** 判题落盘后：检查首 AC / 连胜 / 入门毕业 / 半分神话。 */
  function onJudgeResult(problem, result, allProgress) {
    load();
    if (!result) return;
    if (result.passed) {
      unlock('first-ac');
      // 半分神话：整题满分（误差比 ≤ 0.5 → 100 分），不是某个测试点满分
      if (result.score === 100) unlock('half-score');
      // 连胜：按题号检查连续通过（宽松定义：已通过的题里存在连续 3 个 index）
      var passedIdx = [];
      var probs = TSJ.problems || [];
      for (var i = 0; i < probs.length; i++) {
        var rec = allProgress[probs[i].id];
        if (rec && rec.passed) passedIdx.push(probs[i].index);
      }
      passedIdx.sort(function (a, b) { return a - b; });
      var run = 1;
      for (i = 1; i < passedIdx.length; i++) {
        run = passedIdx[i] === passedIdx[i - 1] + 1 ? run + 1 : 1;
        if (run >= 3) { unlock('streak-3'); break; }
      }
      // 入门毕业
      var easyAll = true;
      for (i = 0; i < probs.length; i++) {
        if (probs[i].difficulty === '入门') {
          var r2 = allProgress[probs[i].id];
          if (!r2 || !r2.passed) { easyAll = false; break; }
        }
      }
      if (easyAll) unlock('all-easy');
    }
  }

  /** 工坊运行落档后：kind='val' 检查跑赢基线；kind='final' 检查诚实研究者。 */
  function onStudioRun(record) {
    load();
    if (!record) return;
    function bestOf(b) {
      var best = null;
      Object.keys(b || {}).forEach(function (k) {
        var v = b[k] && b[k].mse;
        if (typeof v === 'number' && isFinite(v) && (best === null || v < best)) best = v;
      });
      return best;
    }
    if (record.kind === 'val') {
      var mine = record.valMetrics && record.valMetrics.mse;
      var base = bestOf(record.baselinesVal);
      if (typeof mine === 'number' && typeof base === 'number' && mine < base) unlock('studio-beats-base');
    }
    if (record.kind === 'final' && record.testRuns === 1) unlock('honest-researcher');
  }

  /** 方法详情页浏览（method-detail 渲染时调用）。 */
  function onMethodView(id) {
    load();
    if (seenMethods.indexOf(id) < 0) {
      seenMethods.push(id);
      if (seenMethods.length > 60) seenMethods.shift();
      persistMeta();
    }
    var count = 0;
    for (var i = 0; i < seenMethods.length; i++) {
      if (TSJ.methodsById && TSJ.methodsById(seenMethods[i])) count++;
    }
    if (count >= 15) unlock('method-explorer');
  }

  /** 术语表查阅（glossary 渲染/搜索时调用，一次路由进入算一次）。 */
  function onGlossaryLook() {
    load();
    glossaryLooks++;
    persistMeta();
    if (glossaryLooks >= 20) unlock('glossary-reader');
  }

  /* ---------- 查询 ---------- */
  /** 全部成就状态（供工作台/命令面板渲染）。 */
  function status() {
    load();
    return DEFS.map(function (d) {
      return { id: d.id, icon: d.icon, name: d.name, desc: d.desc, at: unlocked[d.id] || null };
    });
  }

  function count() {
    load();
    var n = 0;
    Object.keys(unlocked).forEach(function (k) { if (unlocked[k]) n++; });
    return n;
  }

  TSJ.appAchievements = {
    DEFS: DEFS,
    onJudgeResult: onJudgeResult,
    onStudioRun: onStudioRun,
    onMethodView: onMethodView,
    onGlossaryLook: onGlossaryLook,
    status: status,
    count: count
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * assets/js/app/dashboard.js —— 工作台 #/
 *
 * 只汇总本机真实数据：学习进度、做题进度、最近提交、最近实验。
 * 不显示营销大屏，也不把本地统计说成在线排行。
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});
  var core = TSJ.appCore;
  var store = TSJ.appStore;
  var esc = core.esc;

  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function readProgress() {
    return core.readJSON(core.STORE.courseProgress, {}, function (v) {
      return v && typeof v === 'object' && !Array.isArray(v);
    });
  }

  function doneCount(p) {
    var n = 0;
    for (var i = 0; i < TSJ.courses.length; i++) {
      if (p && p[TSJ.courses[i].id] && p[TSJ.courses[i].id].done) n++;
    }
    return n;
  }

  function nextLesson() {
    var prog = readProgress();
    var sorted = TSJ.courses.slice().sort(function (a, b) { return a.index - b.index; });
    for (var i = 0; i < sorted.length; i++) {
      if (!(prog[sorted[i].id] && prog[sorted[i].id].done)) return sorted[i];

  }

  function recentSubmissions(n) {
