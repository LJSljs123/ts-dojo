<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  CSP：在浏览器网络层再加一道闸，与 judge.js 的 Worker 沙箱互补。
    default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:
                         默认放行同源资源（不用 'none'：页面可能被嵌到预览面板/iframe 里，
                         过于严格的 default-src 在部分 webview 中会把自身脚本一起拦掉 → 白屏）
    script-src  同源 + 内联 + new Function（判题必需）+ Blob Worker；不含远程 http(s)
    style-src   同源 + 内联 style（结果条/进度条宽度是内联的）
    img-src     同源 + data: + blob:
    connect-src 'none'   ★ 真正的安全关键：fetch / XHR / WebSocket / sendBeacon 全部禁止，
                         即使 JS 层出现未知逃逸，请求也发不出去
    worker-src  同源 + blob:   判题 Worker 由 Blob URL 创建
  说明：预览服务器可能额外下发自己的 CSP 响应头，多条策略会**同时生效取交集**，
  所以这里不再使用 default-src 'none'（交集后容易把自身资源也拦掉）。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self' blob:; font-src 'self' data:">
<title>时序竞技场 TSOJ · 时间序列预测在线判题</title>
<meta name="description" content="时序竞技场 TSOJ：写 predict 函数、提交、打败统计基线得分并解锁题解的纯前端时间序列预测判题平台。">
<style>
/* =========================================================================
   时序竞技场 TSOJ —— 暗色主题样式表
   设计原则：深色底 + 单一青绿强调色，层次靠明度与细边框，不使用花哨渐变。
   ========================================================================= */

:root {
  --bg:        #0b0f14;
  --bg-2:      #0f151c;
  --panel:     #131a22;
  --panel-2:   #0e141a;
  --panel-3:   #182029;
  --line:      #222c37;
  --line-2:    #2e3b4a;
  --text:      #dce4ed;
  --text-dim:  #a5b2c1;
  --muted:     #7a8798;
  --accent:    #2dd4bf;
  --accent-2:  #1fb8a6;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --indigo:    #8b9cff;
  --ok:        #34d399;
  --warn:      #f5b942;
  --err:       #f87171;
  --purple:    #c084fc;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
          "Courier New", monospace;

  --topbar-h: 56px;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.62;
  padding-top: var(--topbar-h);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: none; color: #5eead4; }

button { font-family: inherit; font-size: inherit; }

code, pre, kbd { font-family: var(--mono); }

::selection { background: rgba(45, 212, 191, 0.25); }

/* 统一焦点样式：键盘可达性 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.hidden { display: none !important; }

/* =========================================================================
   顶部栏
   ========================================================================= */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 0 20px;
  background: rgba(11, 15, 20, 0.94);
  border-bottom: 1px solid var(--line);
  z-index: 60;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--accent);
  flex: 0 0 auto;
}
.brand-text {
  color: var(--text);
  font-size: 15px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.brand-text b {
  color: var(--accent);
  font-family: var(--mono);
  letter-spacing: 0.06em;
  margin-left: 2px;
}

.nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1 1 auto;
}
.nav a {
  color: var(--text-dim);
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 13.5px;
  white-space: nowrap;
  transition: background 0.14s ease, color 0.14s ease;
}
.nav a:hover { background: var(--panel-3); color: var(--text); }
.nav a.on { color: var(--accent); background: var(--accent-soft); }

.topbar-right { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }

.score-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 4px 12px 4px 4px;
  font-size: 12.5px;
}
.score-chip .lv {
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 999px;
  padding: 2px 9px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
}
.score-chip .pts { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }

/* =========================================================================
   通用页面骨架
   ========================================================================= */
.view { min-height: calc(100vh - var(--topbar-h)); }

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 30px 22px 70px;
}

.page-head { margin-bottom: 20px; }
.page-head h1 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.page-head .sub { margin: 0; color: var(--muted); font-size: 13px; }

.section-title {
  margin: 30px 0 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

/* =========================================================================
   难度徽章 / 标签 / 状态
   ========================================================================= */
.badge {
  display: inline-block;
  padding: 1px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  line-height: 19px;
  font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}
.diff-ru   { color: #4ade80; background: rgba(74, 222, 128, 0.10); border-color: rgba(74, 222, 128, 0.28); }
.diff-pu   { color: #60a5fa; background: rgba(96, 165, 250, 0.10); border-color: rgba(96, 165, 250, 0.28); }
.diff-ti   { color: #fbbf24; background: rgba(251, 191, 36, 0.10); border-color: rgba(251, 191, 36, 0.28); }
.diff-ch   { color: #f87171; background: rgba(248, 113, 113, 0.10); border-color: rgba(248, 113, 113, 0.30); }

.tag {
  display: inline-block;
  padding: 1px 7px;
  margin: 0 4px 2px 0;
  border-radius: 5px;
  background: var(--panel-3);
  border: 1px solid var(--line);
  color: var(--text-dim);
  font-size: 11px;
  white-space: nowrap;
}

.status-ok  { color: var(--ok); font-weight: 600; }
.status-no  { color: #46525f; }

/* =========================================================================
   筛选 chip
   ========================================================================= */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 5px 14px;
  cursor: pointer;
  font-size: 12.5px;
  transition: all 0.14s ease;
}
.chip:hover { border-color: var(--line-2); color: var(--text); }
.chip-on {
  background: var(--accent-soft);
  border-color: rgba(45, 212, 191, 0.45);
  color: var(--accent);
}

/* =========================================================================
   表格
   ========================================================================= */
.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--panel);
}
table.ptable {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13.5px;
}
table.ptable th {
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.05em;
  color: var(--muted);
  background: var(--panel-2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.ptable td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table.ptable tbody tr:last-child td { border-bottom: 0; }
table.ptable tbody tr.prow { cursor: pointer; transition: background 0.12s ease; }
table.ptable tbody tr.prow:hover { background: var(--panel-3); }
table.ptable tbody tr.prow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.ptable .num { text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
table.ptable .idx { font-family: var(--mono); color: var(--muted); font-size: 12.5px; }
.p-title { color: var(--text); font-weight: 500; }
.p-title:hover { color: var(--accent); }

/* =========================================================================
   题目页：左右分栏
   ========================================================================= */
.problem-layout {
  display: grid;
  grid-template-columns: var(--split, 46%) 7px minmax(0, 1fr);
  height: calc(100vh - var(--topbar-h));
}

.splitter {
  cursor: col-resize;
  background: var(--line);
  border-left: 1px solid var(--bg);
  border-right: 1px solid var(--bg);
  transition: background 0.14s ease;
}
.splitter:hover, body.dragging .splitter { background: var(--accent-2); }
body.dragging { user-select: none; cursor: col-resize; }

.pane { min-width: 0; min-height: 0; }
.pane-left { overflow-y: auto; padding: 20px 22px 60px; }
.pane-right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-2);
  border-left: 1px solid var(--line);
}

/* 题头 */
.problem-head { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 16px; }
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--accent); }
.problem-head h1 { margin: 0 0 10px; font-size: 19px; font-weight: 600; line-height: 1.4; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.meta-row .sep { color: var(--line-2); }
.meta-item { font-size: 12px; color: var(--muted); font-family: var(--mono); }

/* =========================================================================
   Markdown 渲染
   ========================================================================= */
.md { font-size: 13.5px; color: var(--text-dim); }
.md .md-h {
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  margin: 22px 0 8px;
  padding-left: 9px;
  border-left: 2px solid var(--accent-2);
  line-height: 1.4;
}
.md .md-p { margin: 0 0 10px; }
.md .md-list { margin: 0 0 12px; padding-left: 20px; }
.md .md-list li { margin: 3px 0; }
.md .md-code {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
  overflow-x: auto;
  font-size: 12.5px;
  line-height: 1.65;
  color: #c8d4e0;
  margin: 0 0 12px;
}
.md .md-inline {
  background: var(--panel-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
  font-size: 12.3px;
  color: #9ee9dc;
  white-space: nowrap;
}
.md strong { color: var(--text); font-weight: 600; }
.md em { color: var(--text-dim); }
.md .md-hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md .md-quote {
  margin: 0 0 12px;
  padding: 8px 12px;
  border-left: 2px solid var(--line-2);
  background: var(--panel-2);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* 图表卡片 */
.chart-card {
  margin: 18px 0 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 12px 12px 8px;
}
.chart-card .chart-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  letter-spacing: 0.03em;
}
.chart-canvas { display: block; width: 100%; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 4px 2px 2px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.legend-dot { width: 14px; height: 0; border-top-width: 2px; border-top-style: solid; display: inline-block; }
.legend-dot.dash { border-top-style: dashed; }

/* 提示折叠 */
.hints {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}
.hints > summary {
  cursor: pointer;
  padding: 11px 14px;
  font-size: 13px;
  color: var(--text-dim);
  list-style: none;
  user-select: none;
}
.hints > summary::-webkit-details-marker { display: none; }
.hints > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 8px;
  color: var(--accent-2);
  transition: transform 0.15s ease;
}
.hints[open] > summary::before { transform: rotate(90deg); }
.hints > summary:hover { color: var(--text); }
.hints .hints-body { padding: 0 14px 14px 30px; }
.hints ol { margin: 0; padding-left: 16px; color: var(--text-dim); font-size: 13px; }
.hints li { margin: 5px 0; }

/* =========================================================================
   编辑器工具栏 / 按钮
   ========================================================================= */
.editor-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.file-chip {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 5px;
  padding: 2px 8px;
  white-space: nowrap;
}
.tb-hint { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.tb-right { display: flex; align-items: center; gap: 8px; }

.btn {
  border: 1px solid var(--line-2);
  background: var(--panel-3);
  color: var(--text-dim);
  border-radius: 7px;
  padding: 6px 13px;
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.14s ease;
}
.btn:hover:not(:disabled) { border-color: #3d4d5f; color: var(--text); background: #1e2732; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn-primary {
  background: var(--accent-2);
  border-color: var(--accent-2);
  color: #06211d;
  font-weight: 600;
}
.btn-primary:hover:not(:disabled) { background: #29c9b6; border-color: #29c9b6; color: #06211d; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* =========================================================================
   自研编辑器
   ========================================================================= */
.editor-host {
  flex: 1 1 auto;
  min-height: 180px;
  margin: 12px 14px;
  display: flex;
}

.tsj-editor {
  --ed-font: 13px;
  --ed-line: 20px;
  position: relative;
  display: flex;
  width: 100%;
  height: 100%;
  min-height: 0;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  font-family: var(--mono);
}
.tsj-editor:focus-within { border-color: rgba(45, 212, 191, 0.5); }

.ed-gutter {
  flex: 0 0 auto;
  width: 46px;
  overflow: hidden;
  background: #0b1116;
  border-right: 1px solid var(--line);
  position: relative;
}
.ed-gutter-inner { padding: 10px 0; will-change: transform; }
.ed-ln {
  height: var(--ed-line);
  line-height: var(--ed-line);
  font-size: 11.5px;
  color: #3f4b58;
  text-align: right;
  padding-right: 9px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  transition: color 0.12s ease;
}
.ed-ln.cur { color: var(--accent); }
.ed-ln.ed-ln-err { color: var(--err); font-weight: 700; }
.ed-ln.ed-ln-err::before {
  content: "●";
  font-size: 7px;
  margin-right: 4px;
  vertical-align: 2px;
}

.ed-body { position: relative; flex: 1 1 auto; min-width: 0; }

.ed-highlight,
.ed-input {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 10px 12px;
  border: 0;
  font-family: var(--mono);
  font-size: var(--ed-font);
  line-height: var(--ed-line);
  letter-spacing: 0;
  tab-size: 2;
  -moz-tab-size: 2;
  white-space: pre;
  overflow-wrap: normal;
  word-break: normal;
}
.ed-highlight {
  overflow: hidden;
  color: #c9d5e1;
  pointer-events: none;
  z-index: 1;
}
.ed-highlight code { font: inherit; }
.ed-input {
  overflow: auto;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--accent);
  outline: none;
  z-index: 2;
  white-space: pre;
  overflow-x: auto;
}
.ed-input::selection { background: rgba(45, 212, 191, 0.26); color: transparent; }

/* 语法高亮配色 */
.tok-com { color: #5a6a7a; font-style: italic; }
.tok-str { color: #a5e8a0; }
.tok-num { color: #f0b072; }
.tok-kw  { color: #8b9cff; }
.tok-bi  { color: #4fd1c5; }

/* =========================================================================
   判题结果面板
   ========================================================================= */
.result-panel {
  flex: 0 0 auto;
  max-height: 47%;
  overflow-y: auto;
  border-top: 1px solid var(--line);
  padding: 14px;
  background: var(--bg-2);
}
.result-empty {
  color: var(--muted);
  font-size: 12.5px;
  text-align: center;
  padding: 22px 10px;
  line-height: 1.9;
}
.result-empty code {
  background: var(--panel-3);
  border-radius: 4px;
  padding: 1px 5px;
  color: #9ee9dc;
  font-size: 11.5px;
}

.result-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }

.ring-wrap { position: relative; width: 74px; height: 74px; flex: 0 0 auto; }
.ring { width: 74px; height: 74px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #1c2632; stroke-width: 6; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
.ring-fg.warn { stroke: var(--warn); }
.ring-fg.bad  { stroke: var(--err); }
.ring-label {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
}
.ring-label b { font-size: 17px; color: var(--text); line-height: 1.1; }
.ring-label span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.08em; }

.result-summary { min-width: 0; }
.verdict { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.verdict-ac  { color: var(--ok); }
.verdict-wa  { color: var(--warn); }
.verdict-re  { color: var(--err); }
.verdict-tle { color: var(--purple); }
.result-sub { font-size: 12px; color: var(--muted); }
.result-sub.dim { color: #5d6a78; font-size: 11.5px; }

.cases { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.case {
  display: grid;
  grid-template-columns: 42px 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 6px 9px;
  border-radius: 7px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 12px;
}
.case .verdict-mini {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: center;
  border-radius: 4px;
  padding: 1px 0;
}
.vm-ac  { color: var(--ok);   background: rgba(52, 211, 153, 0.12); }
.vm-wa  { color: var(--warn); background: rgba(245, 185, 66, 0.12); }
.vm-re  { color: var(--err);  background: rgba(248, 113, 113, 0.12); }
.vm-tle { color: var(--purple); background: rgba(192, 132, 252, 0.12); }
.case .case-idx { color: var(--muted); font-size: 11.5px; }

<script>
/**
 * datasets.js —— 教学用合成时间序列数据集
 *
 * 全部序列由「固定种子的确定性伪随机数发生器（mulberry32）」在运行时生成：
 *  - 同一份代码在任何机器、任何时间、任何浏览器上生成的数字完全一致（可复现）；
 *  - 不硬编码几百个数字，文件体积小，便于审阅；
 *  - 形态尽量贴近真实数据：趋势、季节、异方差、异常点、水平漂移、振幅调制等。
 *
 * 每条数据集结构：
 *   { id, name, unit, freq, season, desc, values: number[] }
 *
 * 挂载点：window.TSJ.datasets（数组），并提供 TSJ.findDataset(id)
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});

  /* ------------------------------------------------------------------ *
   * 1. 确定性伪随机
   * ------------------------------------------------------------------ */

  /**
   * mulberry32：32 位状态的快速确定性 PRNG，周期 2^32。
   * @param {number} seed 任意整数种子
   * @returns {function(): number} 返回 [0,1) 均匀分布
   */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function next() {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /**
   * 包装成一个带常用分布的随机源。
   * @param {number} seed 种子
   * @returns {{next: Function, uniform: Function, normal: Function}}
   */
  function makeRng(seed) {
    var next = mulberry32(seed);
    var spare = null;
    return {
      next: next,
      uniform: function (a, b) { return a + (b - a) * next(); },
      /** Box-Muller 标准正态（缓存另一半样本） */
      normal: function () {
        if (spare !== null) {
          var cached = spare;
          spare = null;
          return cached;
        }
        var u = 0, v = 0, r = 0;
        do {
          u = next() * 2 - 1;
          v = next() * 2 - 1;
          r = u * u + v * v;
        } while (r === 0 || r >= 1);
        var f = Math.sqrt(-2 * Math.log(r) / r);
        spare = v * f;
        return u * f;
      }
    };
  }

  /**
   * 保留指定小数位。
   * @param {number} x 数值
   * @param {number} digits 小数位
   * @returns {number}
   */
  function round(x, digits) {
    var p = Math.pow(10, digits);
    return Math.round(x * p) / p;
  }

  /**
   * 统一把数组四舍五入到 1 位小数。
   * @param {number[]} arr 原始数组
   * @returns {number[]}
   */
  function roundAll(arr) {
    var out = new Array(arr.length);
    for (var i = 0; i < arr.length; i++) out[i] = round(arr[i], 1);
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 2. 各数据集生成器
   * ------------------------------------------------------------------ */

  /**
   * airline：144 点月度航空客运量。
   * 形态：线性增长趋势 + 12 个月乘法季节（振幅随水平增长）+ 逐渐增大的噪声 + 3 个异常月。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildAirline(rng) {
    var values = [];
    var n = 144;
    for (var t = 0; t < n; t++) {
      var m = t % 12;
      // 季节形状：夏高冬低，略带二次谐波，避免纯正弦
      var shape = 1 +
        0.155 * Math.sin(2 * Math.PI * (m - 2.5) / 12) +
        0.045 * Math.cos(4 * Math.PI * m / 12);
      var level = 108 + 1.18 * t;
      var amp = 1 + 0.10 * t / n;             // 乘法季节：振幅随水平增长
      var factor = 1 + (shape - 1) * amp;
      var noise = rng.normal() * (2.1 + 0.014 * t);  // 异方差：噪声随时间放大
      values.push(level * factor + noise);
    }
    // 偶发异常点（罢工、节假日冲击）
    values[31] += 26;
    values[32] += 11;
    values[95] -= 30;
    return roundAll(values);
  }

  /**
   * electricity：720 点（30 天 × 24 小时）小时级用电负荷。
   * 形态：24 周期强季节 + 周末效应 + 缓慢上漂 + 随机尖峰。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildElectricity(rng) {
    var values = [];
    var n = 720;
    for (var t = 0; t < n; t++) {
      var h = t % 24;
      var day = Math.floor(t / 24);
      var dow = day % 7;
      var daily = 1 +
        0.22 * Math.sin(2 * Math.PI * (h - 8.5) / 24) +
        0.13 * Math.sin(4 * Math.PI * (h - 6.5) / 24);
      var weekend = (dow === 5 || dow === 6) ? 0.87 : 1;
      var drift = 1 + 0.00042 * t;            // 30 天累计约 +30%
      var base = 320 * drift * daily * weekend;
      var noise = rng.normal() * (7 + 0.012 * base);
      var spike = rng.next() < 0.012 ? rng.uniform(60, 140) : 0;
      values.push(base + noise + spike);
    }
    return roundAll(values);
  }

  /**
   * temperature：730 点（2 年）日级气温。
   * 形态：365 天年周期 + 白噪声 + 一次热浪与一次寒潮。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildTemperature(rng) {
    var values = [];
    var n = 730;
    for (var t = 0; t < n; t++) {
      var annual = 13.5 + 11.5 * Math.sin(2 * Math.PI * (t - 105) / 365) + 0.004 * t;
      var noise = rng.normal() * 2.4;
      values.push(annual + noise);
    }
    // 热浪 / 寒潮（连续多天的系统性偏移）
    for (var i = 205; i <= 209; i++) values[i] += 3.6 + (i - 205) * 0.5;
    for (var j = 545; j <= 548; j++) values[j] -= 4.2;
    return roundAll(values);
  }

  /**
   * traffic：336 点（2 周 × 24 小时）小时级车流量。
   * 形态：双周期（24 与 168）+ 周末低谷 + 随机拥堵尖峰。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildTraffic(rng) {
    var values = [];
    var n = 336;
    for (var t = 0; t < n; t++) {
      var h = t % 24;
      var day = Math.floor(t / 24);
      var dow = day % 7;                       // 0..6，5/6 视为周末
      var base = 1150 +
        620 * Math.sin(2 * Math.PI * (h - 8.5) / 24) +
        250 * Math.sin(4 * Math.PI * (h - 6) / 24);
      var wk = (dow === 5 || dow === 6) ? 0.74 : (dow === 4 ? 1.06 : 1);
      var noise = rng.normal() * 52;
      var spike = rng.next() < 0.01 ? rng.uniform(150, 320) : 0;
      values.push(base * wk + noise + spike);
    }
    return roundAll(values);
  }

  /**
   * retail：156 点（3 年）周级零售额。
   * 形态：线性趋势 + 52 周季节 + 周期性促销 + 随机促销尖峰。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildRetail(rng) {
    var values = [];
    var n = 156;
    for (var t = 0; t < n; t++) {
      var level = 235 + 2.6 * t;
      var seas = 1 +
        0.17 * Math.sin(2 * Math.PI * (t - 4) / 52) +
        0.08 * Math.sin(4 * Math.PI * (t - 2) / 52);
      var promo = (t % 13 === 0) ? 1.22 : 1;   // 固定节奏的促销
      if (rng.next() < 0.05) promo *= 1.15;    // 随机促销
      var noise = rng.normal() * (7 + 0.02 * level);
      values.push(level * seas * promo + noise);
    }
    return roundAll(values);
  }

  /**
   * sunspot：300 点年级太阳黑子相对数。
   * 形态：约 11 年准周期（周期本身缓慢变化）+ 振幅调制（大小年）+ 非对称波形。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildSunspot(rng) {
    var values = [];
    var n = 300;
    var phase = 0.4;
    for (var t = 0; t < n; t++) {
      var amp = 62 + 42 * Math.sin(2 * Math.PI * t / 96 + 0.8);  // 20..104
      var shape = Math.pow(0.5 * (1 - Math.cos(phase)), 1.7);    // 上升快、下降慢
      var v = amp * shape + rng.normal() * 5.5;
      values.push(Math.max(0, v));
      // 周期长度本身在 11 年附近摆动
      phase += (2 * Math.PI / 11.2) * (1 + 0.13 * Math.sin(2 * Math.PI * t / 74));
    }
    return roundAll(values);
  }

  /**
   * demand_shift：200 点日需求。
   * 形态：t=110 处发生水平漂移（level shift），之后叠加缓慢增长；含弱周周期与异常尖峰。
   * 用途：考察「对突变快速适应」与「对异常点鲁棒」。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildDemandShift(rng) {
    var values = [];
    var n = 200;
    for (var t = 0; t < n; t++) {
      var level;
      if (t < 105) {
        level = 500;
      } else if (t < 110) {
        level = 500 + (t - 105) * 24;          // 5 点过渡，避免不真实的垂直跳变
      } else {
        level = 620 + 0.45 * (t - 110);
      }
      var seas = 1 + 0.055 * Math.sin(2 * Math.PI * t / 7);
      var noise = rng.normal() * 17;
      var spike = rng.next() < 0.02 ? rng.uniform(45, 90) : 0;
      values.push(level * seas + noise + spike);
    }
    return roundAll(values);
  }

  /**
   * gmv：160 点日级成交额。
   * 形态：加速增长（二次项）+ 弱周周期 + 随水平放大的噪声 + 大促尖峰。
   * 用途：固定斜率直线外推会有系统偏差，自适应趋势（Holt）能跟上。
   * @param {Object} rng 随机源
   * @returns {number[]}
   */
  function buildGmv(rng) {
    var values = [];
    var n = 160;
    for (var t = 0; t < n; t++) {
      var level = 780 + 4.0 * t + 0.022 * t * t;
      var seas = 1 + 0.045 * Math.sin(2 * Math.PI * (t - 1) / 7);
      var noise = rng.normal() * (18 + 0.02 * level);
      var spike = rng.next() < 0.03 ? rng.uniform(80, 220) : 0;
      values.push(level * seas + noise + spike);
    }
    return roundAll(values);
  }

  /* ------------------------------------------------------------------ *
   * 3. 数据集清单
   * ------------------------------------------------------------------ */

  var DEFINITIONS = [
    {
      id: 'airline',
      name: '航空客运量（月度）',
      unit: '千人',
      freq: 'M',
      season: 12,
      seed: 20240117,
      build: buildAirline,
      desc: '144 个月的国际航空客运量：线性增长趋势 + 12 个月乘法季节（振幅随水平增长）+ 逐渐增大的噪声，并含 3 个异常月。'
    },
    {
      id: 'electricity',
      name: '用电负荷（小时级）',
      unit: 'MW',
      freq: 'H',
      season: 24,
      seed: 771013,
      build: buildElectricity,
      desc: '720 点（30 天 × 24 小时）区域用电负荷：24 小时强周期 + 周末下降 + 缓慢上漂 + 随机尖峰。'
    },
    {
      id: 'temperature',
      name: '日均气温（日级）',
      unit: '℃',
      freq: 'D',
      season: 365,
      seed: 31415926,
      build: buildTemperature,
      desc: '730 点（2 年）日均气温：365 天年周期 + 白噪声 + 一次热浪与一次寒潮。'
    },
    {
      id: 'traffic',
      name: '道路车流量（小时级）',
      unit: '辆/时',
      freq: 'H',
      season: 24,
      seed: 60606,
      build: buildTraffic,
      desc: '336 点（2 周 × 24 小时）车流量：双周期（24 与 168）+ 周末低谷 + 偶发拥堵尖峰。'
    },
    {
      id: 'retail',
      name: '零售额（周级）',
      unit: '万元',
      freq: 'W',
      season: 52,
      seed: 888888,
      build: buildRetail,
      desc: '156 点（3 年）周零售额：线性趋势（每周约 +2.6 万元）+ 52 周季节 + 固定节奏与随机促销尖峰。'
    },
    {
      id: 'sunspot',
      name: '太阳黑子相对数（年级）',
      unit: '个',
      freq: 'Y',
      season: 11,
      seed: 1610,
      build: buildSunspot,
      desc: '300 点年级太阳黑子相对数：约 11 年准周期（周期自身缓慢变化）+ 振幅调制 + 非对称波形。'
    },
    {
      id: 'demand_shift',
      name: '日需求（含水平漂移）',
      unit: '件',
      freq: 'D',
      season: 7,
      seed: 424242,
      build: buildDemandShift,
      desc: '200 点日需求：第 110 点附近发生水平漂移（+24%），之后缓慢增长；含弱周周期与异常尖峰。'
    },
    {
      id: 'gmv',
      name: '成交额 GMV（日级）',
      unit: '万元',
      freq: 'D',
      season: 7,
      seed: 909090,
      build: buildGmv,
      desc: '160 点日成交额：加速增长（二次趋势）+ 弱周周期 + 随水平放大的噪声 + 大促尖峰。'
    }
  ];

  var datasets = DEFINITIONS.map(function (def) {
    var rng = makeRng(def.seed);
    var values = def.build(rng);
    return {
      id: def.id,
      name: def.name,
      unit: def.unit,
      freq: def.freq,
      season: def.season,
      desc: def.desc,
      values: values
    };
  });

  /** id → dataset 映射，便于 O(1) 查找 */
  var byId = {};
  for (var i = 0; i < datasets.length; i++) byId[datasets[i].id] = datasets[i];

  /**
   * 按 id 查找数据集。
   * @param {string} id 数据集 id
   * @returns {Object|null}
   */
  function findDataset(id) {
    return byId[id] || null;
  }

  TSJ.datasets = datasets;
  TSJ.findDataset = findDataset;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = datasets;
    module.exports.findDataset = findDataset;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/**
 * problems.js —— 题库定义
 *
 * 每题结构：
 *   { id, index, title, difficulty, tags, points, passScore, dataset, mode,
 *     horizon, originStep, windows, metric, baselines, threshold,
 *     statement, inputSpec, outputSpec, hints, solution, starter, passRate }
 *
 * 学习路径（由易到难）：
 *   P1 朴素预测 → P2 移动平均 → P3 季节朴素 → P4 SES → P5 Holt
 *   → P6 Holt-Winters → P7 直接多步 → P8 突变鲁棒 → P9 滚动回测挑战
 *
 * 参考解（solution）以真实函数书写，再用 toString() 转成字符串，
 * 这样参考解本身会被 node --check 与自测脚本覆盖，不会出现「字符串里的语法错误」。
 *
 * 挂载点：window.TSJ.problems
 */
(function (global) {
  'use strict';

  var TSJ = global.TSJ || (global.TSJ = {});

  /* ================================================================== *
   * 0. 参考解函数（全部自包含，不引用外部变量）
   * ================================================================== */

  /**
   * P1 朴素法：最后一个观测值重复 horizon 次。
   */
  function solNaive(history, horizon, ctx) {
    var last = history[history.length - 1];
    var out = [];
    for (var i = 0; i < horizon; i++) out.push(last);
    return out;
  }

  /**
   * P1 参考解：朴素法 + 漂移修正（random walk with drift）。
   *
   * 纯朴素法在趋势序列上会系统性低估，误差比恰好 = 1.0（打平基线只能拿 57 分）。
   * 补一个「每步漂移」就能过线：用「最近一个周期的均值」与「上一个周期的均值」之差
   * 估出每步平均抬升量，再按 h 线性外推。
   */
  function solNaiveDrift(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var last = history[n - 1];

    // 每步漂移 = (最近一个周期均值 - 上一个周期均值) / m
    var drift = 0;
    if (n >= 2 * m) {
      var cur = 0;
      var prev = 0;
      for (var i = 0; i < m; i++) {
        cur += history[n - m + i];
        prev += history[n - 2 * m + i];
      }
      drift = (cur - prev) / (m * m);
    }

    var out = [];
    for (var h = 1; h <= horizon; h++) out.push(last + drift * h);
    return out;
  }

  /**
   * P2 相位移动平均：
   * 移动平均的窗口必须与周期对齐 —— 对每个「相位」（同一小时 / 同一月份）分别做跨周期平均，
   * 这样既消掉噪声，又保留完整的季节形状；最后用「本周期均值 - 上周期均值」补回漂移。
   */
  function solMovingAverage(history, horizon, ctx) {
    var n = history.length;
    var m = ctx.season > 1 ? ctx.season : 12;
    var blocks = Math.min(Math.floor(n / m), 14);
    var j;

    if (blocks < 1) {
      // 历史不足一个周期：退化为朴素法（自包含）
      var fb = [];
      var lastVal = history[n - 1];
      for (j = 0; j < horizon; j++) fb.push(lastVal);
      return fb;
    }

    // 1) 按相位做移动平均（窗口 = 最近 blocks 个周期的同相位样本）
    var prof = [];

    var sy = 0;

      var b = 0;

    var sy = 0;
    var sxx = 0;

    var season = [];

    for (var h = 1; h <= horizon; h++) {
      out.push(level + h * trend + season[(n + h - 1) % m]);
    }
    return out;
  }

  }

  /**
   * 取数组均值（空数组返回 NaN）。
   * @param {number[]} arr
   * @returns {number}
   */
  function meanOf(arr) {
    if (!arr || arr.length === 0) return NaN;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  /* ================================================================== *
   * 1. 指标
   * ================================================================== */

  /**
   * 各指标函数签名统一为 fn(actual, predicted) => number（越小越好）。
   * 长度不一致时按较短长度截断计算；空数组返回 NaN。
   */
  var metrics = {
    /** 均方误差 */
    mse: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) {
        var d = actual[i] - predicted[i];
        s += d * d;
      }
      return s / n;
    },

    /** 均方根误差 */
    rmse: function (actual, predicted) {
      var m = metrics.mse(actual, predicted);
      return isFinite(m) ? Math.sqrt(m) : NaN;
    },

    /** 平均绝对误差 */
    mae: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) s += Math.abs(actual[i] - predicted[i]);
      return s / n;
    },

    /**
     * 平均绝对百分比误差（%）。
     * 对 0 值保护：|actual| < EPS（1e-12）的样本**跳过**，且不计入分母；
     * 若全部样本都被跳过则返回 0（而不是 NaN）。
     */
    mape: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0, cnt = 0;
      for (var i = 0; i < n; i++) {
        var a = actual[i];
        if (Math.abs(a) < EPS) continue;
        s += Math.abs((a - predicted[i]) / a);
        cnt++;
      }
      if (cnt === 0) return 0;
      return (s / cnt) * 100;
    },

    /**
     * 对称平均绝对百分比误差（%）。
     * 分母 |a| + |p| < EPS（1e-12）的样本**跳过**：贡献 0 误差，
     * 但**仍计入 n**（即按「该点误差为 0」处理），与 mape 的「跳过且不计入分母」口径不同。
     */
    smape: function (actual, predicted) {
      var n = Math.min(actual.length, predicted.length);
      if (n === 0) return NaN;
      var s = 0;
      for (var i = 0; i < n; i++) {
        var a = actual[i];
        var p = predicted[i];
        var denom = Math.abs(a) + Math.abs(p);
        if (denom < EPS) continue;
        s += (2 * Math.abs(a - p)) / denom;
      }
      return (s / n) * 100;
    }
  };

  /** 指标中文名，UI 展示用 */
  var metricLabels = {
    mse: 'MSE',
    rmse: 'RMSE',
    mae: 'MAE',
    mape: 'MAPE(%)',
    smape: 'sMAPE(%)'
  };

  /* ================================================================== *
   * 2. 统计基线
   * ================================================================== */

  /**
   * 各基线签名统一为 fn(history, horizon, ctx) => number[horizon]。
   * ctx = { freq, season, datasetId, index }
   */
  var baselines = {
    /** 朴素法：把最后一个观测值重复 horizon 次 */
    naive: function (history, horizon) {
      var last = history[history.length - 1];
      var out = new Array(horizon);
      for (var i = 0; i < horizon; i++) out[i] = last;
      return out;
    },

    /** 季节朴素法：重复上一个完整季节 */
    seasonal_naive: function (history, horizon, ctx) {
      var n = history.length;
      var m = (ctx && ctx.season > 1) ? ctx.season : 12;
      var out = new Array(horizon);
      if (m >= n) {
        // 历史长度不足一个季节，退化为朴素法
        return baselines.naive(history, horizon);
      }
      for (var h = 0; h < horizon; h++) {
        var idx = n - m + (h % m);
        out[h] = history[clamp(idx, 0, n - 1)];
      }
      return out;
    },

    /** 历史均值 */
    mean: function (history, horizon) {
      var avg = meanOf(history);
      var out = new Array(horizon);
      for (var i = 0; i < horizon; i++) out[i] = avg;
      return out;
    },

    /** 全局最小二乘直线外推 */
    linear_trend: function (history, horizon) {
      var n = history.length;
      var out = new Array(horizon);
      if (n < 2) return baselines.naive(history, horizon);
      var sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (var i = 0; i < n; i++) {
        sx += i;
        sy += history[i];
        sxx += i * i;
        sxy += i * history[i];
      }
      var denom = n * sxx - sx * sx;
      var slope = Math.abs(denom) < EPS ? 0 : (n * sxy - sx * sy) / denom;
      var intercept = (sy - slope * sx) / n;
      for (var h = 1; h <= horizon; h++) out[h - 1] = intercept + slope * (n - 1 + h);
      return out;
    },

    /** 移动平均（窗口 = 季节长度，退化为 6） */
    moving_average: function (history, horizon, ctx) {
      var n = history.length;
      var want = (ctx && ctx.season > 1) ? ctx.season : 6;
      var k = Math.max(2, Math.min(want, n));
      var sum = 0;
      for (var i = n - k; i < n; i++) sum += history[i];
      var avg = sum / k;
      var out = new Array(horizon);
      for (var h = 0; h < horizon; h++) out[h] = avg;
      return out;
    }
  };

  /** 基线中文名，UI 展示用 */
  var baselineLabels = {
    naive: '朴素法 naive',
    seasonal_naive: '季节朴素 seasonal_naive',
    mean: '历史均值 mean',
    linear_trend: '线性趋势 linear_trend',
    moving_average: '移动平均 moving_average'
  };

  /* ================================================================== *
   * 3. 评分公式
   * ================================================================== */

  /**
   * 由误差比映射得分。ratio = 你的误差 / 最优基线误差（越小越好）。
   *
   * 分段线性，严格单调不增：
   *   ① ratio <= 0.50             → 100 分（比最优基线好一倍，直接满分）
   *   ② 0.50 < ratio <= threshold → 从 100 线性降到 passScore（ratio = threshold 时恰好 = passScore）
   *   ③ threshold < ratio < 2.00  → 从 passScore 线性降到 0
   *   ④ ratio >= 2.00             → 0 分
   *
   * 分支优先级（重要）：① → ④ → ② → ③。
   * 「ratio >= 2 → 0 分」必须在「ratio <= threshold」之前判定，否则 threshold > 2 时
   * 会先命中 ② 而拿到 60 分以上，违反 ④。为此 threshold 被夹在 [0.51, 2]：
   *  - 下界 0.51 保证 ② 区间非退化；
   *  - 上界 2 与 ④ 自洽（threshold >= 2 时 ratio = threshold 由 ④ 判 0 分，④ 优先）。
   *
   * @param {number} ratio 误差比
   * @param {number} threshold 通过阈值（必须打败最优基线的倍数，越小越严）
   * @param {number} passScore 通过分数线
   * @returns {number} 0..100 的整数分
   */
  function scoreForRatio(ratio, threshold, passScore) {
    if (!isFinite(ratio)) return 0;
    var r = ratio < 0 ? 0 : ratio;
    var pass = clamp(Number(passScore) || 60, 1, 100);
    var FULL = 0.5;
    var ZERO = 2.0;
    var thr = clamp(Number(threshold) || 1, 0.51, ZERO);

    if (r <= FULL) return 100;
    if (r >= ZERO) return 0;            // ④ 必须先判，否则 thr > 2 时会被 ② 抢先

    if (r <= thr) {
      var t1 = (r - FULL) / (thr - FULL);
      return clamp(Math.round(100 - t1 * (100 - pass)), pass, 100);
    }

    var t2 = (r - thr) / (ZERO - thr);
    return clamp(Math.round(pass * (1 - t2)), 0, pass);
  }

  /* ================================================================== *
   * 4. 测试点构造（holdout / rolling）
   * ================================================================== */

  /**
   * 构造测试点。
   *  - holdout：训练集 = 前 len-horizon 点，测试集 = 最后 horizon 点（1 个测试点）
   *  - rolling：从 len-horizon-(windows-1)*originStep 开始，滑动 windows 个 origin，
   *             每个 origin 只用该点之前的数据训练，预测之后 horizon 步。
   *
   * @param {number[]} values 完整序列
   * @param {Object} opts { mode, horizon, originStep, windows, season, freq, datasetId }
   * @returns {Array<{history:number[], actual:number[], ctx:Object, index:number}>}
   */
  function buildTestPoints(values, opts) {
    var horizon = opts.horizon;
    var points = [];

    /**
     * 生成单个测试点。
     * @param {number} trainEnd 训练集截止下标（不含）
     * @param {number} index 测试点序号
     */
    function makePoint(trainEnd, index) {
      var ctx = {
        freq: opts.freq || 'M',
        season: opts.season || 1,
        datasetId: opts.datasetId || '',
        index: index
      };
      return {
        history: values.slice(0, trainEnd),
        actual: values.slice(trainEnd, trainEnd + horizon),
        ctx: ctx,
        index: index
      };
    }

    if (opts.mode === 'rolling') {
      var windows = Math.max(1, opts.windows || 1);
      var step = Math.max(1, opts.originStep || horizon);
      var start = values.length - horizon - (windows - 1) * step;
      for (var w = 0; w < windows; w++) {
        var trainEnd = start + w * step;
        if (trainEnd < 4) continue;              // 训练集过短则跳过
        points.push(makePoint(trainEnd, w));
      }
      if (points.length === 0) points.push(makePoint(values.length - horizon, 0));
      return points;
    }

    points.push(makePoint(values.length - horizon, 0));
    return points;
  }

  /* ================================================================== *
   * 5. 单测试点评分
   * ================================================================== */

  /**
   * 对单个测试点评分。
   * @param {Object} point 测试点
   * @param {Object} run 执行结果 { status:'ok'|'error'|'timeout', value, error, line }
   * @param {Object} opts 判题参数
   * @returns {Object} 测试点结果
   */
  function scoreCase(point, run, opts) {
    var metricFn = metrics[opts.metric] || metrics.mse;

    if (!run || run.status !== 'ok') {
      var isTimeout = run && run.status === 'timeout';
      return {
        index: point.index,
        verdict: isTimeout ? 'TLE' : 'RE',
        score: 0,
        yourMetric: NaN,
        bestBaseline: NaN,
        baselineName: '',
        allBaselines: {},
        error: (run && run.error) || '执行失败',
        line: (run && run.line) || null,
        actual: point.actual,
        predictions: null
      };
    }

    var pred = run.value;
    var yourMetric = metricFn(point.actual, pred);

    // 各基线
    var all = {};
    var bestName = '';
    var bestVal = Infinity;
    for (var i = 0; i < opts.baselines.length; i++) {
      var name = opts.baselines[i];
      var fn = baselines[name];
      if (typeof fn !== 'function') continue;
      var bv = metricFn(point.actual, fn(point.history, opts.horizon, point.ctx));
      all[name] = bv;
      if (isFinite(bv) && bv < bestVal) {
        bestVal = bv;
        bestName = name;
      }
    }

    if (!isFinite(yourMetric)) {
      return {
        index: point.index,
        verdict: 'RE',
        score: 0,
        yourMetric: NaN,
        bestBaseline: bestVal,
        baselineName: bestName,
        allBaselines: all,
        error: '你的预测无法计算指标（可能含非法值）',
        line: null,
        actual: point.actual,
        predictions: pred
      };
    }

    // 误差比：最优基线为 0（完美）时做特殊处理
    var ratio;
    if (!isFinite(bestVal)) {
      ratio = 1;
    } else if (bestVal < EPS) {
      ratio = yourMetric < EPS ? 0 : Infinity;
    } else {
      ratio = yourMetric / bestVal;
    }

    var score = scoreForRatio(ratio, opts.threshold, opts.passScore);

    return {
      index: point.index,
      verdict: score >= opts.passScore ? 'AC' : 'WA',
      score: score,
      yourMetric: yourMetric,
      bestBaseline: bestVal,
      baselineName: bestName,
      allBaselines: all,
      ratio: ratio,
      error: null,
      line: null,
      actual: point.actual,
      predictions: pred
    };
  }

  /* ================================================================== *
   * 6. 用户代码执行：同线程（可信代码 / 无 Worker 降级）
   * ================================================================== */

  /**
   * 从错误堆栈里取出「引擎报告的原始行号」。
   * @param {Error} err 错误对象
   * @returns {number|null}
   */
  function rawLineOf(err) {
    var stack = String((err && err.stack) || '');
    var m = /<anonymous>:(\d+):(\d+)/.exec(stack);
    if (m) return parseInt(m[1], 10);
    m = /:(\d+):(\d+)/.exec(stack);
    if (m) {
      var line = parseInt(m[1], 10);
      if (line > 0) return line;
    }
    return null;
  }

  /**
   * 探测「函数体第 1 行」在堆栈里被报告成第几行。
   * 不同引擎对 new Function 生成代码的包裹方式不同（V8 是 3 行头部，SpiderMonkey 是 1 行），
   * 因此用一段已知在第 1 行抛错的探针代码实测，得到偏移量。
   * @returns {number} 偏移量（用户行号 = 原始行号 - 偏移）
   */
  var LINE_OFFSET = (function detectOffset() {
    try {
      /* eslint-disable no-new-func */
      var probe = new Function('', 'throw new Error("probe");');
      probe();
    } catch (e) {
      var reported = rawLineOf(e);
      if (reported && reported > 1) return reported - 1;
    }
    return 0;
  })();

  /**
   * 把引擎行号映射回用户代码行号。
   * @param {Error} err 错误对象
   * @returns {number|null} 用户代码行号（1 基）
   */
  function parseLine(err) {
    var raw = rawLineOf(err);
    if (raw === null) return null;
    var line = raw - LINE_OFFSET;
    return line > 0 ? line : null;
  }

  /**
   * 校验 predict 的返回值。
   * @param {*} out 用户返回值
   * @param {number} horizon 期望长度
   * @returns {{value?: number[], error?: string}}
   */
  function validateOutput(out, horizon) {
    if (out === null || out === undefined) {
      return { error: 'predict 返回了 ' + String(out) + '，应返回长度为 ' + horizon + ' 的数组' };
    }
    var len = out.length;
    if (typeof len !== 'number' || len !== horizon) {
      return { error: '返回数组长度必须为 ' + horizon + '，实际为 ' + String(len) };
    }
    var arr = new Array(horizon);
    for (var i = 0; i < horizon; i++) {
      var v = out[i];
      if (typeof v !== 'number' || !isFinite(v)) {
        return { error: '第 ' + (i + 1) + ' 个预测值不是有限数值（NaN / Infinity / 非数字）' };
      }
      arr[i] = v;
    }
    return { value: arr };
  }

  /**
   * 把用户代码编译成可调用函数。
   * @param {string} code 用户代码
   * @returns {{fn?: Function, error?: string, line?: number|null}}
   */
  function compile(code) {
    try {
      /* eslint-disable no-new-func */
      var fn = new Function(
        'history',
        'horizon',
        'ctx',
        String(code) + '\n;return predict(history, horizon, ctx);'
      );
      return { fn: fn };
    } catch (err) {
      // 语法错误时堆栈指向 worker 自身，无法映射到用户行号，故 line 置空
      return {
        error: '语法错误：' + ((err && err.message) || String(err)),
        line: null
      };
    }
  }

  /**
   * 同线程执行全部测试点（不使用 Worker）。
   * 仅用于：① 可信代码（参考解 / 排行榜）；② 环境禁用 Worker 时的降级。
   * @param {string} code 用户代码
   * @param {Array} jobs [{history, horizon, ctx}]
   * @returns {{results: Array, timedOut: boolean, degraded?: boolean}}
   */
  function runInProcess(code, jobs) {
    var compiled = compile(code);
    var results = [];

    if (compiled.error) {
      for (var k = 0; k < jobs.length; k++) {
        results.push({ status: 'error', error: compiled.error, line: compiled.line });
      }
      return { results: results, timedOut: false };
    }

    for (var i = 0; i < jobs.length; i++) {
      var job = jobs[i];
      try {
        var out = compiled.fn(job.history.slice(), job.horizon, job.ctx);
        var checked = validateOutput(out, job.horizon);
        if (checked.error) {
          results.push({ status: 'error', error: checked.error, line: null });
        } else {
          results.push({ status: 'ok', value: checked.value });
        }
      } catch (err) {
        results.push({
          status: 'error',
          error: (err && err.message) || String(err),
          line: parseLine(err)
        });
      }
    }
    return { results: results, timedOut: false };
  }

  /* ================================================================== *
   * 7. Web Worker 沙箱
   * ================================================================== */

  /**
   * Worker 源码。必须用 Blob URL 创建，因为 file:// 下无法加载独立 worker 文件。
   *
   * 沙箱策略（三层，缺一不可）：
   *   1. **能力遮蔽**：fetch / XMLHttpRequest / importScripts / WebSocket / Worker /
   *      postMessage / self / globalThis / window / document / localStorage / location ...
   *      在「全局对象 + 整条原型链」上被改写成「读取即抛错」的访问器，
   *      且 configurable:false / writable:false —— `delete` 与重新赋值都不再能恢复；
   *   2. **代码执行面收窄**：全局 Function / eval 换成抛错桩，Function.prototype.constructor
   *      同样封死（否则 `(function(){}).constructor` 就能拿回真正的 Function）；
   *      setTimeout / setInterval 只接受函数参数，字符串形式直接拒绝；
   *   3. **冻结**：globalThis 与整条原型链 Object.freeze，杜绝事后往原型上挂钩子。
   *
   * 另外 index.html 的 CSP（connect-src 'none' / script-src 不含 http）在网络层再兜一层：
   * 即便 JS 层出现未知逃逸，请求也发不出去。
   *
   * 用户代码通过 new Function 执行，函数体首行即用户代码第 1 行，便于行号映射；
   * 返回值的长度与有限性在 worker 内校验，错误信息回传主线程。
   *
   * 注意：这里只做「隔离执行环境」，**不是**安全边界（同一台机器上的恶意代码仍可能通过
   * 侧信道推断信息）。README 里有明确口径。
   */
  var WORKER_SOURCE = [
    '(function () {',
    '  "use strict";',
    '  var __global = self;',
    '  var __post = __global.postMessage.bind(__global);',
    '  var __Function = Function;',
    '  var __Error = Error;',
    '  var __String = String;',
    '  var __isFinite = isFinite;',
    '  var __now = Date.now;',
    '  var __define = Object.defineProperty;',
    '  var __getProto = Object.getPrototypeOf;',
    '  var __freeze = Object.freeze;',
    '  var __hasOwn = Object.prototype.hasOwnProperty;',
    '  var __realTimeout = (typeof setTimeout === "function") ? setTimeout : null;',
    '  var __realInterval = (typeof setInterval === "function") ? setInterval : null;',
    '  function __rawLineOf(err) {',
    '    var stack = __String((err && err.stack) || "");',
    '    var m = /<anonymous>:(\\d+):(\\d+)/.exec(stack);',
    '    if (m) return parseInt(m[1], 10);',
    '    m = /:(\\d+):(\\d+)/.exec(stack);',
    '    return m ? parseInt(m[1], 10) : null;',
    '  }',
    '  // 探测「函数体第 1 行」在堆栈中的偏移（不同引擎不同）——必须在封 Function 之前完成',
    '  var __lineOffset = (function () {',
    '    try {',
    '      var p = new __Function("", "throw new Error(\\"probe\\");");',
    '      p();',
    '    } catch (e) {',
    '      var r = __rawLineOf(e);',
    '      if (r && r > 1) return r - 1;',
    '    }',
    '    return 0;',
    '  })();',
    '  /* ---------- 第 1 层：能力遮蔽（全局 + 原型链） ---------- */',
    '  var __DENY = [',
    '    "fetch", "XMLHttpRequest", "importScripts", "WebSocket", "EventSource",',
    '    "Worker", "SharedWorker", "postMessage", "close", "self", "globalThis",',
    '    "window", "document", "localStorage", "sessionStorage", "indexedDB",',
    '    "navigator", "location", "history", "alert", "open", "parent", "top", "frames",',
    '    "caches", "BroadcastChannel", "WebTransport", "RTCPeerConnection"',
    '  ];',
    '  function __denyGetter(name) {',
    '    return function () { throw new __Error("沙箱限制：禁止访问 " + name); };',
    '  }',
    '  var __targets = [__global];',
    '  (function () {',
    '    var proto = __getProto(__global);',
    '    var guard = 0;',
    '    while (proto && guard < 12) {',
    '      __targets.push(proto);',
    '      proto = __getProto(proto);',
    '      guard++;',
    '    }',
    '  })();',
    '  function __sealName(target, name, force) {',
    '    var own = false;',
    '    try { own = __hasOwn.call(target, name); } catch (e) { own = false; }',
    '    if (!own && !force) return;',
    '    try {',
    '      __define(target, name, {',
    '        configurable: false,',
    '        enumerable: false,',
    '        get: __denyGetter(name),',
    '        set: __denyGetter(name)',
    '      });',
    '    } catch (e) {',
    '      try { target[name] = undefined; } catch (e2) {}',
    '    }',
    '  }',
    '  for (var __t = 0; __t < __targets.length; __t++) {',
    '    for (var __d = 0; __d < __DENY.length; __d++) {',
    '      __sealName(__targets[__t], __DENY[__d], __t === 0);',
    '    }',
    '  }',
    '  /* ---------- 第 2 层：代码执行面（Function / eval / 字符串定时器） ---------- */',
    '  function __lockValue(target, name, value) {',
    '    try {',
    '      __define(target, name, {',
    '        configurable: false,',
    '        writable: false,',
    '        enumerable: false,',
    '        value: value',
    '      });',
    '    } catch (e) {',
    '      try { target[name] = value; } catch (e2) {}',
    '    }',
    '  }',
    '  function __blockedCtor() { throw new __Error("沙箱限制：禁止使用 Function 构造器"); }',
    '  function __blockedEval() { throw new __Error("沙箱限制：禁止使用 eval"); }',
    '  __lockValue(__global, "Function", __blockedCtor);',
    '  __lockValue(__global, "eval", __blockedEval);',
    '  try {',
    '    __define(__Function.prototype, "constructor", {',
    '      configurable: false,',
    '      writable: false,',
    '      enumerable: false,',
    '      value: __blockedCtor',
    '    });',
    '  } catch (e) {}',
    '  function __timerGuard(name, real) {',
    '    return function (fn, ms) {',
    '      if (typeof fn === "string") {',
    '        throw new __Error("沙箱限制：禁止以字符串形式调用 " + name);',
    '      }',
    '      if (!real) throw new __Error("沙箱限制：当前环境不支持 " + name);',
    '      var args = [fn, ms];',
    '      for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);',
    '      return real.apply(__global, args);',
    '    };',
    '  }',
    '  __lockValue(__global, "setTimeout", __timerGuard("setTimeout", __realTimeout));',
    '  __lockValue(__global, "setInterval", __timerGuard("setInterval", __realInterval));',
    '  /* ---------- 执行与回传 ---------- */',
    '  function __lineOf(err) {',
    '    var raw = __rawLineOf(err);',
    '    if (raw === null) return null;',
    '    var l = raw - __lineOffset;',
    '    return l > 0 ? l : null;',
    '  }',
    '  function __validate(out, horizon) {',
    '    if (out === null || out === undefined) {',
    '      return { error: "predict 返回了 " + __String(out) + "，应返回长度为 " + horizon + " 的数组" };',
    '    }',
    '    var len = out.length;',
    '    if (typeof len !== "number" || len !== horizon) {',
    '      return { error: "返回数组长度必须为 " + horizon + "，实际为 " + __String(len) };',
    '    }',
    '    var arr = new Array(horizon);',
    '    for (var i = 0; i < horizon; i++) {',
    '      var v = out[i];',
    '      if (typeof v !== "number" || !__isFinite(v)) {',
    '        return { error: "第 " + (i + 1) + " 个预测值不是有限数值（NaN / Infinity / 非数字）" };',
    '      }',
    '      arr[i] = v;',
    '    }',
    '    return { value: arr };',
    '  }',
    '  __global.onmessage = function (ev) {',
    '    var job = ev.data || {};',
    '    var t0 = __now();',
    '    var fn;',
    '    try {',
    '      fn = new __Function("history", "horizon", "ctx",',
    '        __String(job.code) + "\\n;return predict(history, horizon, ctx);");',
    '    } catch (syntaxErr) {',
    '      __post({',
    '        id: job.id,',
    '        status: "error",',
    '        error: "语法错误：" + ((syntaxErr && syntaxErr.message) ? syntaxErr.message : __String(syntaxErr)),',
    '        line: null',
    '      });',
    '      return;',
    '    }',
    '    try {',
    '      var out = fn(job.history, job.horizon, job.ctx);',
    '      var checked = __validate(out, job.horizon);',
    '      if (checked.error) {',
    '        __post({ id: job.id, status: "error", error: checked.error, line: null });',
    '      } else {',
    '        __post({ id: job.id, status: "ok", value: checked.value, ms: __now() - t0 });',
    '      }',
    '    } catch (err) {',
    '      __post({',
    '        id: job.id,',
    '        status: "error",',
    '        error: (err && err.message) ? err.message : __String(err),',
    '        line: __lineOf(err)',
    '      });',
    '    }',
    '  };',
    '  /* ---------- 第 3 层：冻结全局与整条原型链（必须放在 onmessage 之后） ---------- */',
    '  for (var __f = 0; __f < __targets.length; __f++) {',
    '    try { __freeze(__targets[__f]); } catch (e) {}',
    '  }',
    '})();'
  ].join('\n');

  /**
   * 当前环境能否使用 Web Worker 沙箱。
   * UI 用它决定是否允许提交（不能沙箱 = 禁止提交，避免死循环锁死界面）。
   * @returns {boolean}
   */
  function canUseSandbox() {
    try {
      return (typeof Worker !== 'undefined') &&
        (typeof Blob !== 'undefined') &&
        (typeof URL !== 'undefined') &&
        typeof URL.createObjectURL === 'function';
    } catch (e) {
      return false;
    }
  }

  /** 无沙箱时的拒绝理由（UI 直接展示给用户） */
  var SANDBOX_REFUSED_REASON =
    '当前环境无法创建 Web Worker 沙箱（可能被浏览器安全策略、隐私设置或内核版本限制）。' +
    '为避免死循环卡死页面，已拒绝在页面主线程执行你的代码：请改用最新版 Chrome / Edge 打开，' +
    '或通过 http(s) 方式访问本页面。';

  /**
   * 在 Worker 沙箱中顺序执行全部测试点。
   * 单次执行超时 perJob → 终止 worker 并判 TLE；整题超时 total → 同样判 TLE。
   *
   * 环境不支持 Worker 时**拒绝执行**（返回 refused），不再静默降级到主线程 ——
   * 降级会让 `while(true){}` 直接锁死 UI，且没有任何超时保护。
   *
   * @param {string} code 用户代码
   * @param {Array} jobs [{history, horizon, ctx}]
   * @param {Object} [limits] { perJob, total }
   * @param {Object} [session] 可选会话句柄；会被挂上 abort()，供调用方（路由切换）取消
   * @returns {Promise<{results: Array, timedOut: boolean, refused?: boolean, aborted?: boolean, reason?: string}>}
   */
  function runSandbox(code, jobs, limits, session) {
    var lim = limits || LIMITS;

    return new Promise(function (resolve) {
      var results = [];
      var index = 0;
      var worker = null;
      var url = null;
      var jobTimer = null;
      var totalTimer = null;
      var finished = false;

      /** 释放资源 */
      function cleanup() {
        if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
        if (totalTimer) { clearTimeout(totalTimer); totalTimer = null; }
        if (worker) {
          try { worker.terminate(); } catch (e) { /* ignore */ }
          worker = null;
        }
        if (url) {
          try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
          url = null;
        }
        if (session && typeof session === 'object') {
          session.abort = null;
        }
      }

      /**
       * 结束判题，把未执行的用例标记为超时。
       * @param {boolean} timedOut 是否因超时结束
       */
      function finish(timedOut) {
        if (finished) return;
        finished = true;
        for (var i = results.length; i < jobs.length; i++) {
          results.push({
            status: 'timeout',
            error: timedOut
              ? '执行超时（单次 ' + lim.perJob + 'ms / 整题 ' + lim.total + 'ms）'
              : '未执行',
            line: null
          });
        }
        cleanup();
        resolve({ results: results, timedOut: !!timedOut });
      }

      /**
       * 放弃当前会话：立即 terminate 旧 Worker，不留后台计算。
       * 结果由调用方按 token 丢弃。
       */
      function abort() {
        if (finished) return;
        finished = true;
        cleanup();
        resolve({ results: results, timedOut: false, aborted: true });
      }

      if (session && typeof session === 'object') session.abort = abort;

      /** 派发下一个测试点 */
      function next() {
        if (index >= jobs.length) { finish(false); return; }
        var job = jobs[index];
        try {
          worker.postMessage({
            id: index,
            code: code,
            // 每个测试点传独立副本：用户代码即便就地修改 history，也污染不到下一个测试点
            history: job.history.slice(),
            horizon: job.horizon,
            ctx: job.ctx
          });
        } catch (e) {
          results.push({ status: 'error', error: '无法向沙箱投递任务：' + ((e && e.message) || e), line: null });
          index++;
          next();
          return;
        }
        jobTimer = setTimeout(function () { finish(true); }, lim.perJob);
      }

      // 环境不支持 Worker：拒绝执行（不再静默降级到主线程）
      if (!canUseSandbox()) {
        cleanup();
        resolve({ results: [], timedOut: false, refused: true, reason: SANDBOX_REFUSED_REASON });
        return;
      }

      try {
        url = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'application/javascript' }));
        worker = new Worker(url);
      } catch (e) {
        cleanup();
        resolve({
          results: [],
          timedOut: false,
          refused: true,
          reason: SANDBOX_REFUSED_REASON + '（创建 Worker 失败：' + ((e && e.message) || e) + '）'
        });
        return;
      }

      worker.onmessage = function (ev) {
        var msg = ev.data || {};
        if (finished || msg.id !== index) return;
        if (jobTimer) { clearTimeout(jobTimer); jobTimer = null; }
        if (msg.status === 'ok') {
          results.push({ status: 'ok', value: msg.value, ms: msg.ms });
        } else {
          results.push({ status: 'error', error: msg.error, line: msg.line });
        }
        index++;
        next();
      };

      worker.onerror = function (ev) {
        if (finished) return;
        var text = (ev && ev.message) ? ev.message : '沙箱内部错误';
        results.push({ status: 'error', error: text, line: null });
        index++;
        if (index >= jobs.length) { finish(false); }
        else { next(); }
      };

      totalTimer = setTimeout(function () { finish(true); }, lim.total);
      next();
    });
  }

  /* ================================================================== *
   * 8. 判题主流程
   * ================================================================== */

  /**
   * 滚动回测窗口覆盖度前置校验。
   *
   * 背景：`buildTestPoints` 在 `len < horizon + windows*originStep` 时会把装不下的窗口
   * **静默丢弃**（`trainEnd < 4` 分支），于是「4 个窗口的题」可能只剩 1 个测试点，
   * 而题面仍然写着 4 个窗口 —— 判题口径与题面不一致，属于数据/配置缺陷。
   *
   * `buildTestPoints` 的语义被 60+ 条用例锁死，一行都不能改；因此把校验放在它**之前**：
   * 判题入口先算一次「窗口是否装得下」，装不下就直接给出显式错误报告，绝不静默缩水。
   *
   * @param {Object} problem 题目
   * @param {Object} dataset 数据集
   * @returns {string|null} 错误说明；null 表示通过
   */
  function coverageError(problem, dataset) {
    if (!problem || (problem.mode || 'holdout') !== 'rolling') return null;
    var horizon = Number(problem.horizon) || 0;
    var windows = Math.max(1, Number(problem.windows) || 1);
    var step = Math.max(1, Number(problem.originStep) || horizon || 1);
    var len = (dataset && dataset.values) ? dataset.values.length : 0;
    var required = horizon + windows * step;
    if (len < required) {
      return '滚动回测窗口不足：' + windows + ' 个窗口（步长 ' + step + '、预测 ' + horizon +
        ' 步）至少需要 ' + required + ' 个数据点，当前数据集「' + ((dataset && dataset.id) || '?') +
        '」只有 ' + len + ' 个。已停止判题，避免把缩水后的测试点当作成绩。';
    }
    return null;
  }

  /**
   * 构造一个「不进入评分流程」的报告骨架（数据不足 / 沙箱不可用 / 会话取消）。
   * 结构与 buildReport 的返回值保持一致，便于 UI 统一渲染。
   *
   * @param {Object} params { problem }
   * @param {string} message 说明
   * @param {Object} flags 额外标记（dataError / refused / aborted）
   * @returns {Object} 判题报告
   */
  function guardReport(params, message, flags) {
    var problem = params.problem || {};
    var metric = problem.metric || 'mse';
    var report = {
      problemId: problem.id,
      verdict: 'RE',
      passed: false,
      score: 0,
      passScore: Number(problem.passScore) || 60,
      metric: metric,
      metricLabel: metricLabels[metric] || String(metric).toUpperCase(),
      cases: [],
      message: message,
      degraded: false,
      at: Date.now()
    };
    if (flags) {
      for (var k in flags) {
        if (Object.prototype.hasOwnProperty.call(flags, k)) report[k] = flags[k];
      }
    }
    return report;
  }

  /**
   * 汇总执行结果，产出最终判题报告。
   * @param {Object} params { problem, dataset, code }
   * @param {Object} run { results, timedOut, degraded }
   * @returns {Object} 判题报告
   */
  function buildReport(params, run) {
    var problem = params.problem;
    var dataset = params.dataset;

    var opts = {
      mode: problem.mode || 'holdout',
      horizon: problem.horizon,
      originStep: problem.originStep,
      windows: problem.windows,
      metric: problem.metric || 'mse',
      baselines: (problem.baselines && problem.baselines.length) ? problem.baselines : ['naive'],
      threshold: problem.threshold,
      passScore: problem.passScore || 60,
      season: problem.season || dataset.season,
      freq: dataset.freq,
      datasetId: dataset.id
    };

    var points = buildTestPoints(dataset.values, opts);
    var cases = [];
    var sum = 0;
    var hasRe = false;
    var hasTle = false;

    for (var i = 0; i < points.length; i++) {
      var c = scoreCase(points[i], run.results[i], opts);
      if (c.verdict === 'RE') hasRe = true;
      if (c.verdict === 'TLE') hasTle = true;
      sum += c.score;
      cases.push(c);
    }

    var score = Math.round(sum / Math.max(1, cases.length));
    var allAC = cases.every(function (c) { return c.verdict === 'AC'; });
    var verdict;
    var message = '';

    if (hasTle || run.timedOut) {
      verdict = 'TLE';
      score = 0;
      message = '执行超时，请检查是否有死循环或过大的计算量。';
    } else if (hasRe) {
      verdict = 'RE';
      var firstErr = null;
      for (var j = 0; j < cases.length; j++) {
        if (cases[j].verdict === 'RE') { firstErr = cases[j]; break; }
      }
      message = firstErr ? firstErr.error : '运行时错误';
    } else if (allAC && score >= opts.passScore) {
      verdict = 'AC';
      message = '全部测试点达标，通过！';
    } else {
      verdict = 'WA';
      message = '存在未达标的测试点，误差仍然偏大。';
    }

    return {
      problemId: problem.id,
      verdict: verdict,
      passed: verdict === 'AC',
      score: score,
      passScore: opts.passScore,
      metric: opts.metric,
      metricLabel: metricLabels[opts.metric] || String(opts.metric).toUpperCase(),
      cases: cases,
      message: message,
      degraded: !!run.degraded,
      at: Date.now()
    };
  }

  /**
   * 把 problem + dataset + code 转成沙箱任务列表。
   * @param {Object} problem 题目
   * @param {Object} dataset 数据集
   * @param {string} code 用户代码
   * @returns {Array}
   */
  function buildJobs(problem, dataset, code) {
    var opts = {
      mode: problem.mode || 'holdout',
      horizon: problem.horizon,
      originStep: problem.originStep,
      windows: problem.windows,
      season: problem.season || dataset.season,
      freq: dataset.freq,
      datasetId: dataset.id
    };
    var points = buildTestPoints(dataset.values, opts);
    return points.map(function (p) {
      return { code: code, history: p.history, horizon: opts.horizon, ctx: p.ctx };
    });
  }

  /**
   * 异步判题（浏览器：Worker 沙箱）。
   *
   * 三条前置/旁路分支（都不进入评分流程）：
   *   - 数据/配置缺陷（滚动窗口装不下）→ dataError 报告；
   *   - 环境无沙箱 → refused 报告（**拒绝执行**，不降级到主线程）；
   *   - 会话被调用方取消（路由切换）→ aborted 报告（结果由调用方丢弃）。
   *
   * @param {Object} params { problem, dataset, code, limits?, session? }
   * @returns {Promise<Object>} 判题报告
   */
  function evaluate(params) {
    var bad = coverageError(params.problem, params.dataset);
    if (bad) return Promise.resolve(guardReport(params, bad, { dataError: true }));

    var jobs;
    try {
      jobs = buildJobs(params.problem, params.dataset, params.code);
    } catch (e) {
      return Promise.reject(e);
    }
    return runSandbox(params.code, jobs, params.limits, params.session).then(function (run) {
      if (run && run.aborted) {
        return guardReport(params, '判题已取消（页面已切换）。', { aborted: true });
      }
      if (run && run.refused) {
        return guardReport(params, run.reason || SANDBOX_REFUSED_REASON, { refused: true });
      }
      return buildReport(params, run);
    });
  }

  /**
   * 同步判题（同线程执行）。仅用于可信代码：参考解、排行榜虚拟选手。
   * @param {Object} params { problem, dataset, code }
   * @returns {Object} 判题报告
   */
  function evaluateSync(params) {
    var bad = coverageError(params.problem, params.dataset);
    if (bad) return guardReport(params, bad, { dataError: true });
    var jobs = buildJobs(params.problem, params.dataset, params.code);
    var run = runInProcess(params.code, jobs);
    run.degraded = true;
    return buildReport(params, run);
  }

  /* ================================================================== *
   * 9. 导出
   * ================================================================== */

  var judge = {
    metrics: metrics,
    metricLabels: metricLabels,
    baselines: baselines,
    baselineLabels: baselineLabels,
    scoreForRatio: scoreForRatio,
    buildTestPoints: buildTestPoints,
    buildJobs: buildJobs,
    runSandbox: runSandbox,
    runInProcess: runInProcess,
    evaluate: evaluate,
    evaluateSync: evaluateSync,
    canUseSandbox: canUseSandbox,
    coverageError: coverageError,
    parseLine: parseLine,
    LIMITS: LIMITS,
    SANDBOX_REFUSED_REASON: SANDBOX_REFUSED_REASON,
    WORKER_SOURCE: WORKER_SOURCE
  };

  TSJ.judge = judge;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = judge;
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/**
 * editor.js —— 自研轻量代码编辑器
 *
 * 实现方式：透明文字的 <textarea> 覆盖在 <pre><code> 高亮层之上，
 * 两层字体 / 字号 / 行高 / padding / tab-size 完全一致，滚动同步；
 * 左侧独立行号栏，通过 transform 跟随纵向滚动。
 *
 * 能力：
 *   - 语法高亮（注释 / 字符串 / 数字 / 关键字 / 内置函数），转义 HTML 防 XSS
 *   - Tab 缩进 2 空格、Shift+Tab 反缩进、Enter 自动缩进、括号自动配对
 *   - Ctrl/Cmd + Enter 触发运行；Ctrl/Cmd + S 保存草稿（不弹浏览器保存框）
 *   - 括号匹配高亮（光标处的 ()[]{} 与它的配对项同时加 .ed-match）
 *   - markError(line) 标注错误行，并同步 aria-invalid / aria-describedby 说明
 *   - 字号 12 / 13 / 14 可切换（行高与 padding 一律运行时 getComputedStyle 读取，避免双写错位）
 *   - 超过 800 行自动降级：关闭实时语法高亮，只保留行号与纯文本，保证输入不卡
