name: 功能建议
about: 提议新功能或改进
title: '[建议] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说场景与痛点，再谈方案——ROADMAP.md 里的「不做清单」请先过目
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
  - type: markdown
    attributes:
      value: |
        四条产品约束不可破：零依赖、零构建、file:// 可用、无网络请求。
        与它们冲突的提议会被关闭并注明原因。
