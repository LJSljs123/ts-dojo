name: Tests

# 纯静态零构建：Node 自带测试跑类型/内容/静态审计；
# 浏览器用例在有 Chrome 且运行时有全局 WebSocket（Node 22+）时执行，否则自动 skip，不挡合并。
# GitHub 托管的 ubuntu 镜像往往已带 Chrome，但当前 job 使用 Node 20（无全局 WebSocket），
# 此前会在拉起浏览器后抛错并留下进程，任务挂到 6 小时上限才被取消。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Asset stamp check
        run: node tools/stamp-assets.js --check

      - name: QA
        run: node --test --test-concurrency=1 tests/qa/*.test.js

      - name: Engine & storage checks
        run: |
          node tests/selftest.js
          node tests/starter-check.js
          node tests/storage-audit.js
          node tests/standalone-check.js

      - name: README numbers
        run: node tools/numbers.js
