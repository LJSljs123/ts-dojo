<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  CSP：只保留「网络封锁」这一条，不限制资源来源。
    为什么不用 default-src / script-src 白名单：
      预览面板、文档阅读器这类宿主会把 HTML 塞进 <iframe srcdoc> 渲染，
      此时文档处于「不透明源」，'self' 匹配不到任何 URL —— 连页面自己的 17 个脚本
      都会被一起拦掉，表现为整页白屏（已实测复现）。
    保留什么：
      connect-src 'none'   fetch / XHR / WebSocket / sendBeacon 全部禁止。
                           这才是防「用户代码把数据外传」的关键，且不影响资源加载。
    安全边界在哪：
      真正跑不可信代码的是 judge.js 里的 Web Worker（能力遮蔽 + 原型链冻结 + 超时终止），
      CSP 只是网络层的兜底，不是唯一防线。
-->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'">
<title>时序竞技场 TSOJ · 时间序列预测在线判题</title>
<meta name="description" content="时序竞技场 TSOJ：写 predict 函数、提交、打败统计基线得分并解锁题解的纯前端时间序列预测判题平台。">
<link rel="stylesheet" href="assets/css/style.css?v=2.1.0">

<!-- 启动自检：脚本被拦 / 加载失败 / 1.5s 内没渲染出内容 → 直接把原因显示出来，绝不留白屏 -->
<script>
(function () {
  'use strict';
  var ERRORS = [];
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function panel(title, detail) {
    var old = document.getElementById('bootFail');
    if (old) {
      var ul = document.getElementById('bootFailDetail');
      if (ul) ul.innerHTML += '<li>' + esc(detail) + '</li>';
      return;
    }
    if (!document.body) return;
    var box = document.createElement('div');
    box.id = 'bootFail';
    box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;padding:32px;background:#0d1117;color:#e6edf3;font:13px/1.8 ui-monospace,Consolas,monospace;overflow:auto');
    box.innerHTML =
      '<h2 style="margin:0 0 12px;font:600 16px/1.4 system-ui;color:#ff9b9b">' + esc(title) + '</h2>' +
      '<p style="margin:0 0 10px;color:#9aa7b6">页面没能正常启动。浏览器给出的原因：</p>' +
      '<ul id="bootFailDetail" style="margin:0 0 18px;padding-left:20px;color:#ffb4b4">' +
      '<li>' + esc(detail) + '</li></ul>' +
      '<p style="margin:0 0 6px;color:#9aa7b6">常见原因与处理：</p>' +
      '<ol style="margin:0;padding-left:20px;color:#c9d4e0">' +
      '<li>脚本被安全策略或广告拦截插件拦了 —— 换 Edge / Chrome 直接打开 index.html</li>' +
      '<li>通过 http 打开时服务器没正确返回 assets 目录 —— 检查 17 个 js 是否都是 200</li>' +
      '<li>拿到的是旧缓存 —— 按 Ctrl+F5 强制刷新</li></ol>';
    document.body.appendChild(box);
  }
  window.addEventListener('error', function (e) {
    var msg;
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      msg = '脚本无法加载：' + (e.target.src || '(未知)');
    } else {
      msg = (e && e.message) ? e.message : '未知脚本错误';
      if (e && e.lineno) msg += '（第 ' + e.lineno + ' 行）';
    }
    ERRORS.push(msg);
    panel('启动失败', msg);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    ERRORS.push('未处理的 Promise 异常：' + ((r && r.message) || r));
  });
  window.addEventListener('load', function () {
    // 脚本全被拦：load 后 TSJ 仍不存在，立刻报（不用等）
    if (typeof window.TSJ === 'undefined') {
      panel('启动失败', '脚本全部被拦截：window.TSJ 未定义（多半是 CSP 或广告拦截插件所致）');
      return;
    }
    // 否则给渲染留出时间：每 500ms 看一次，最多 8 秒
    var tries = 0;
    var timer = setInterval(function () {
      var v = document.getElementById('view');
      if (v && v.innerHTML.replace(/\s+/g, '').length > 0) { clearInterval(timer); return; }
      tries++;
      if (tries < 16) return;
      clearInterval(timer);
      panel('启动失败', '脚本已加载，但 8 秒内没有渲染出任何内容' +
        (ERRORS.length ? '：' + ERRORS[0] : '（无错误信息）'));
    }, 500);
  });
})();
</script>
</head>
<body>

<!-- ============ 视图容器 ============
