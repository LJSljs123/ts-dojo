<!--
  CSP：只保留「网络封锁」这一条，不限制资源来源。
    为什么不用 default-src / script-src 白名单：
      预览面板、文档阅读器这类宿主会把 HTML 塞进 <iframe srcdoc> 渲染，
      此时文档处于「不透明源」，'self' 匹配不到任何 URL —— 连页面自己的 40 个脚本
      都会被一起拦掉，表现为整页白屏（已实测复现）。
    保留什么：
      connect-src 'none'   fetch / XHR / WebSocket / sendBeacon 全部禁止。
                           这才是防「用户代码把数据外传」的关键，且不影响资源加载。
    安全边界在哪：
      真正跑不可信代码的是 judge.js 里的 Web Worker（能力遮蔽 + 原型链冻结 + 超时终止），
      CSP 只是网络层的兜底，不是唯一防线。
-->

<!-- 启动自检：脚本被拦 / 加载失败 / 1.5s 内没渲染出内容 → 直接把原因显示出来，绝不留白屏 -->
<script>
(function () {
  'use strict';
  var ERRORS = [];
  /** 应用是否已经渲染出内容。渲染过之后就不能再拿遮罩盖页面（见下面的 error 监听）。 */
  var booted = false;
  function appAlive() {
    var v = document.getElementById('view');
    return !!(v && v.innerHTML.replace(/\s+/g, '').length > 0);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function panel(title, detail) {
    var old = document.getElementById('bootFail');
    if (old) {
      var ul = document.getElementById('bootFailDetail');
      if (ul) ul.innerHTML += '<li>' + esc(detail) + '</li>';
      return;
    }
    if (!document.body) return;
    var box = document.createElement('div');
    box.id = 'bootFail';
    box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;padding:32px;background:#0d1117;color:#e6edf3;font:13px/1.8 ui-monospace,Consolas,monospace;overflow:auto');
    box.innerHTML =
      '<h2 style="margin:0 0 12px;font:600 16px/1.4 system-ui;color:#ff9b9b">' + esc(title) + '</h2>' +
      '<p style="margin:0 0 10px;color:#9aa7b6">页面没能正常启动。浏览器给出的原因：</p>' +
      '<ul id="bootFailDetail" style="margin:0 0 18px;padding-left:20px;color:#ffb4b4">' +
      '<li>' + esc(detail) + '</li></ul>' +
      '<p style="margin:0 0 6px;color:#9aa7b6">常见原因与处理：</p>' +
      '<ol style="margin:0;padding-left:20px;color:#c9d4e0">' +
      '<li>脚本被安全策略或广告拦截插件拦了 —— 换 Edge / Chrome 直接打开 index.html</li>' +
      '<li>通过 http 打开时服务器没正确返回 assets 目录 —— 检查 40 个 js 是否都是 200</li>' +
      '<li>拿到的是旧缓存 —— 按 Ctrl+F5 强制刷新</li></ol>' +
      '<p style="margin:18px 0 0"><button type="button" id="bootFailClose" ' +
      'style="font:inherit;padding:6px 14px;border-radius:6px;border:1px solid #3d4652;background:#1b222b;color:#c9d4e0;cursor:pointer">' +
      '关闭提示，继续尝试使用</button></p>';
    document.body.appendChild(box);
    // 必须能关掉：遮罩是 position:fixed 全屏、z-index 极高，关不掉就等于「整站点不动」
    var close = document.getElementById('bootFailClose');
    if (close) {
      close.addEventListener('click', function () {
        if (box.parentNode) box.parentNode.removeChild(box);
      });
    }
  }
  window.addEventListener('error', function (e) {
    var msg;
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      msg = '脚本无法加载：' + (e.target.src || '(未知)');
    } else {
      msg = (e && e.message) ? e.message : '未知脚本错误';
      if (e && e.lineno) msg += '（第 ' + e.lineno + ' 行）';
    }
    ERRORS.push(msg);
    // 关键：只有「还没渲染出任何内容」才算启动失败。
    // 已经渲染过之后再出错属于运行期错误，绝不能拿全屏遮罩盖住页面 ——
    // 那会把「某个按钮抛了个错」放大成「整个站点点不动」，且遮罩本身吞掉所有点击。
    if (booted || appAlive()) {
      booted = true;
      if (window.console && window.console.error) window.console.error('[TSOJ] 运行期错误：' + msg);
      return;
    }
    panel('启动失败', msg);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    ERRORS.push('未处理的 Promise 异常：' + ((r && r.message) || r));
  });
  window.addEventListener('load', function () {
    // 脚本全被拦：load 后 TSJ 仍不存在，立刻报（不用等）
    if (typeof window.TSJ === 'undefined') {
      panel('启动失败', '脚本全部被拦截：window.TSJ 未定义（多半是 CSP 或广告拦截插件所致）');
      return;
    }
    // 否则给渲染留出时间：每 500ms 看一次，最多 8 秒
    var tries = 0;
    var timer = setInterval(function () {
      var v = document.getElementById('view');
      if (v && v.innerHTML.replace(/\s+/g, '').length > 0) { booted = true; clearInterval(timer); return; }
      tries++;
      if (tries < 16) return;
      clearInterval(timer);
      if (appAlive()) { booted = true; return; }
      panel('启动失败', '脚本已加载，但 8 秒内没有渲染出任何内容' +
        (ERRORS.length ? '：' + ERRORS[0] : '（无错误信息）'));
    }, 500);
  });
})();
</script>

<!-- 脚本没跑起来时的兜底。
     必须做成 fixed 卡片：`<main>` 有 min-height:calc(100vh - 顶栏)，放在它后面的普通流内容
     会被顶到首屏之外 —— 用户看到的只是「顶栏正常、内容区全空、点哪都没反应」。
     触发场景：预览面板把 HTML 塞进 <iframe sandbox>（默认拦脚本）、浏览器禁用 JS。
     注意：这段只在脚本被禁用时渲染，不影响正常布局。 -->
<noscript>
  <div class="boot-noscript">
    <h2>这个页面需要 JavaScript，但它没有运行</h2>
    <p>内容区是空的、导航点不动，原因就在这里 —— 不是链接坏了。</p>
    <p><b>最常见的原因</b>：预览面板把页面放进了带 <code>sandbox</code> 的 iframe，默认会拦掉脚本；
    其次是浏览器或插件禁用了 JavaScript。</p>
    <p><b>怎么用</b>：把 <code>ts-dojo-standalone.html</code> 下载到本机，双击用 Edge / Chrome 打开；
    或在预览面板里选「在浏览器中打开」。</p>
  </div>
</noscript>
